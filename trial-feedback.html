<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Thanks - Think Beyond Practice</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F9F7F5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:#1F1B17}
    .card{background:#fff;border:1px solid #E8E3DD;border-radius:16px;padding:36px 32px;width:100%;max-width:460px}
    h1{font-size:19px;font-weight:700;margin-bottom:6px}
    .sub{font-size:13.5px;color:#5C5650;margin-bottom:20px;line-height:1.55}
    .echo{font-size:13px;color:#5C5650;background:#F4F1ED;border:1px solid #E8E3DD;border-radius:9px;padding:11px 13px;margin-bottom:20px;line-height:1.5}
    .echo b{color:#1F1B17;font-weight:600}
    label{display:block;font-size:14px;font-weight:600;margin-bottom:7px}
    .hint{font-size:12.5px;color:#7A736C;margin-bottom:9px;line-height:1.45}
    textarea{width:100%;min-height:110px;padding:11px 12px;border:1px solid #E8E3DD;border-radius:9px;font:inherit;font-size:14px;line-height:1.5;resize:vertical;background:#fff;color:inherit}
    textarea:focus{outline:2px solid #1D6FA4;outline-offset:-1px;border-color:#1D6FA4}
    .actions{margin-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    button{padding:11px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none;font-family:inherit}
    .save{background:#1D6FA4;color:#fff}
    .save:hover{background:#185d8c}
    .save:disabled{background:#94a3b8;cursor:not-allowed}
    .msg{margin-top:14px;font-size:13px;padding:10px 12px;border-radius:8px;display:none;line-height:1.45}
    .msg.ok{display:block;background:#e7f5ec;color:#1c6b3e}
    .msg.err{display:block;background:#fce8e8;color:#9b2c2c}
    .foot{margin-top:22px;padding-top:16px;border-top:1px solid #F0ECE7;font-size:12.5px;color:#7A736C;line-height:1.5}
    .foot a{color:#1D6FA4}
    @media (max-width:520px){.card{padding:28px 22px}}
  </style>
</head>
<body>
  <div class="card">
    <h1 id="head">Thank you.</h1>
    <p class="sub" id="sub">That one click is genuinely useful.</p>

    <div class="echo" id="echo" style="display:none"></div>

    <div id="form">
      <label for="note">Anything else? Optional.</label>
      <p class="hint">Only if you feel like it. One line is plenty, and it goes straight to Michael.</p>
      <textarea id="note" placeholder="What would have made the difference?"></textarea>
      <div class="actions">
        <button class="save" id="send" onclick="send()">Send</button>
      </div>
      <div class="msg" id="msg"></div>
    </div>

    <p class="foot">Think Beyond Practice &middot; <a href="https://thinkbeyondpractice.com/platform">Back to the platform</a></p>
  </div>

<script>
var qs = new URLSearchParams(location.search);
var TOKEN = qs.get('e') || '';
var STAGE = qs.get('s') || '';
var REASON = qs.get('r') || '';
var OK = qs.get('ok') !== '0';

var LABELS = {
  'no-time':   'you never had time to really try it',
  'notes':     'the notes were not good enough',
  'price':     'the price',
  'have-one':  'you already have a scribe you like',
  'missing':   'it was missing something you need',
  'technical': 'you hit technical trouble',
  'other':     'something else'
};

(function init(){
  if (!OK || !TOKEN) {
    // Link expired, was mangled, or the token did not verify. Do not pretend it
    // was recorded; give them the one route that still works.
    document.getElementById('head').textContent = 'That link did not work';
    document.getElementById('sub').innerHTML = 'It may have expired or been altered in transit. If you have a moment, replying to the email reaches Michael directly.';
    document.getElementById('form').style.display = 'none';
    return;
  }
  if (LABELS[REASON]) {
    document.getElementById('echo').style.display = 'block';
    document.getElementById('echo').innerHTML = 'Recorded: <b>' + LABELS[REASON] + '</b>.';
  }
})();

function send(){
  var note = document.getElementById('note').value.trim();
  var msg = document.getElementById('msg');
  var btn = document.getElementById('send');
  if (!note) { msg.className = 'msg err'; msg.textContent = 'Nothing to send yet.'; return; }
  btn.disabled = true; btn.textContent = 'Sending...';
  fetch('/.netlify/functions/trial-feedback', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ e: TOKEN, s: STAGE, note: note })
  })
  .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, d: d }; }); })
  .then(function(res){
    if (res.ok) {
      msg.className = 'msg ok';
      msg.textContent = 'Sent. Thank you, that is the part that actually helps.';
      document.getElementById('note').disabled = true;
      btn.textContent = 'Sent';
    } else {
      msg.className = 'msg err';
      msg.textContent = 'That did not save. You can reply to the email instead and it will reach Michael.';
      btn.disabled = false; btn.textContent = 'Send';
    }
  })
  .catch(function(){
    msg.className = 'msg err';
    msg.textContent = 'That did not save. You can reply to the email instead and it will reach Michael.';
    btn.disabled = false; btn.textContent = 'Send';
  });
}
</script>
</body>
</html>
