:root {

  --navy-light: #1a2d47;

  --cream: #e8e4dc;
  --cream-dim: #b0aa9e;
  --rule: rgba(42,171,184,0.12);
  --green: #34d399;
  --amber: #fbbf24;
  --white: #f5f3ef;
  --radius: 8px;
  --font-display: 'DM Serif Display', Georgia, serif;
  --font-body: 'Plus Jakarta Sans', -apple-system, sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--navy); color:var(--cream); font-family:var(--font-body); min-height:100vh; }

/* Top bar */
.top-bar { background:var(--navy-mid); border-bottom:1px solid var(--rule); padding:12px 24px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; }
.top-bar-left { display:flex; align-items:center; gap:12px; }
.top-bar-logo { width:32px; height:32px; background:rgba(42,171,184,0.15); border:1px solid var(--rule); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:16px; }
.top-bar-title { font-family:var(--font-display); color:var(--white); font-size:1.05rem; }
.top-bar-nav { display:flex; gap:20px; }
.top-bar-nav a { color:var(--cream-dim); font-size:0.82rem; text-decoration:none; font-weight:500; }
.top-bar-nav a:hover { color:var(--teal); }
.top-bar-right { display:flex; align-items:center; gap:12px; }
.join-btn { background:var(--teal); color:var(--navy); padding:8px 20px; border-radius:6px; font-size:0.82rem; font-weight:700; text-decoration:none; border:none; cursor:pointer; font-family:var(--font-body); }
.join-btn:hover { background:#35c5d3; }
.preview-badge { background:rgba(251,191,36,0.15); border:1px solid rgba(251,191,36,0.3); color:var(--amber); font-size:0.7rem; font-weight:700; padding:3px 10px; border-radius:12px; text-transform:uppercase; letter-spacing:0.5px; }

/* Layout */
.layout { display:flex; min-height:calc(100vh - 53px); }

/* Sidebar */
.sidebar { width:240px; background:var(--navy-mid); border-right:1px solid var(--rule); padding:16px 0; flex-shrink:0; overflow-y:auto; position:sticky; top:53px; height:calc(100vh - 53px); }
.sidebar-section { margin-bottom:20px; }
.sidebar-section-title { font-size:0.68rem; font-weight:700; text-transform:uppercase; letter-spacing:0.8px; color:var(--cream-dim); padding:0 16px; margin-bottom:8px; }
.sidebar-item { display:flex; align-items:center; gap:8px; padding:7px 16px; font-size:0.82rem; color:var(--cream); cursor:pointer; transition:background 0.15s; border-left:3px solid transparent; }
.sidebar-item:hover { background:rgba(42,171,184,0.06); }
.sidebar-item.active { background:rgba(42,171,184,0.1); border-left-color:var(--teal); color:var(--teal); font-weight:600; }
.sidebar-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }

/* Main content */
.main { flex:1; padding:24px 32px; max-width:860px; }
.space-header { margin-bottom:24px; }
.space-header h1 { font-family:var(--font-display); color:var(--white); font-size:1.6rem; margin-bottom:8px; }
.space-header p { font-size:0.88rem; color:var(--cream-dim); line-height:1.6; }
.space-stats { display:flex; gap:16px; margin-top:12px; }
.space-stat { font-size:0.75rem; color:var(--cream-dim); }
.space-stat strong { color:var(--teal); }

/* Post list */
.post-list { display:flex; flex-direction:column; gap:2px; }
.post-row { display:flex; align-items:center; gap:14px; padding:14px 16px; background:var(--navy-card); border:1px solid var(--rule); border-radius:6px; cursor:pointer; transition:all 0.15s; }
.post-row:hover { background:var(--navy-light); border-color:rgba(42,171,184,0.25); }
.post-icon { width:36px; height:36px; background:rgba(42,171,184,0.1); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
.post-info { flex:1; min-width:0; }
.post-title { font-size:0.88rem; font-weight:600; color:var(--cream); line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.post-meta { font-size:0.72rem; color:var(--cream-dim); margin-top:3px; }
.post-engagement { display:flex; gap:14px; flex-shrink:0; }
.post-engagement span { font-size:0.72rem; color:var(--cream-dim); display:flex; align-items:center; gap:4px; }

/* Join modal */
.modal-overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(11,17,32,0.85); z-index:200; align-items:center; justify-content:center; backdrop-filter:blur(4px); }

.modal .dismiss:hover { color:var(--cream); }

.member-bar { display:flex; align-items:center; gap:10px; padding:12px 16px; margin-bottom:16px; background:rgba(42,171,184,0.06); border:1px solid var(--rule); border-radius:6px; }

.member-avatars span:first-child { margin-left:0; }
.member-bar-text { font-size:0.8rem; color:var(--cream-dim); }
.member-bar-text strong { color:var(--cream); }

/* Pinned post */
.pinned-post { background:var(--navy-card); border:1px solid var(--rule); border-left:3px solid var(--teal); border-radius:6px; padding:16px 20px; margin-bottom:20px; }
.pinned-label { font-size:0.68rem; font-weight:700; text-transform:uppercase; color:var(--teal); letter-spacing:0.5px; margin-bottom:6px; }
.pinned-post h3 { font-size:0.95rem; font-weight:600; color:var(--white); margin-bottom:6px; }
.pinned-post p { font-size:0.82rem; color:var(--cream-dim); line-height:1.5; }

.filter-tags { display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
.filter-tag { font-size:0.72rem; padding:4px 12px; border-radius:14px; border:1px solid var(--rule); color:var(--cream-dim); cursor:default; background:transparent; }
.filter-tag.active { background:rgba(42,171,184,0.15); border-color:var(--teal); color:var(--teal); }

/* Responsive */
@media (max-width:768px) {
  .sidebar { display:none; }
  .main { padding:16px; }
  .top-bar-nav { display:none; }
}

.start-here-expanded .sh-cta { font-size:0.82rem; color:var(--teal); font-weight:600; font-style:italic; }
</style>

    startHere: {

      author: 'Michael Van Gelder',
      date: 'Jul 26, 2025',
      body: '<p>This space is for structured, thoughtful case discussions and workflow questions — not quick replies or rapid-fire advice.</p>' +
        '<p>Good clinical reasoning takes clarity, context, and sequence. If you want useful help, take the time to build that foundation here.</p>' +
        '<p><strong>Use this space when:</strong></p>' +
        '<ul>' +
        '<li>You want peer input on a real-world case, treatment plan, or workflow decision.</li>' +
        '<li>You\'re troubleshooting something complex, not looking for a one-line answer.</li>' +
        '<li>You want to share your reasoning process so others can learn from it.</li>' +
        '</ul>' +
        '<p><strong>A Note on Mentorship:</strong> This space also serves as mentorship in real time. The goal isn\'t to hand out quick answers. It\'s to strengthen how you think. Good mentorship isn\'t about telling you what to do — it\'s about teaching you how to reason.</p>' +
        '<hr>' +
        '<p><strong>How to post a case:</strong></p>' +
        '<ul>' +
        '<li>Snapshot: age, gender, key diagnoses or presenting issues</li>' +
        '<li>Timeline: what meds or interventions were tried, in what order, and when symptoms shifted</li>' +
        '<li>Current status: current meds, doses, and duration; what\'s improving or worsening</li>' +
        '<li>Core question: the clinical dilemma or next decision you want help with</li>' +
        '<li>(Optional) Your reasoning so far: what you\'re considering and why</li>' +
        '</ul>' +
        '<p>Real insight requires real data. If your post doesn\'t include sequence, doses, or duration, others can\'t meaningfully help.</p>' +
        '<p><strong>There are no quick answers here.</strong> If you want to improve as a clinician, use this space to slow down your thinking, not to speed up your responses. Clarity beats speed every time.</p>'
    },

function buildSidebar() {
  var sb = document.getElementById('sidebar');
  var html = '';
  var currentSection = '';
  var first = true;
  for (var key in SPACES) {
    var sp = SPACES[key];
    if (sp.section !== currentSection) {
      currentSection = sp.section;
      html += '<div class="sidebar-section"><div class="sidebar-section-title">' + currentSection + '</div>';
    }
    html += '<div class="sidebar-item' + (first ? ' active' : '') + '" data-space="' + key + '" onclick="selectSpace(\'' + key + '\', false)">';
    html += '<span class="sidebar-dot" style="background:' + sp.dot + '"></span>';
    html += sp.name;
    html += '</div>';
    first = false;
  }
  html += '</div>';
  sb.innerHTML = html;
}

function selectSpace(key, append) {
  var sp = SPACES[key];
  currentSpace = key;
  // Update sidebar active
  document.querySelectorAll('.sidebar-item').forEach(function(el) { el.classList.remove('active'); });
  var active = document.querySelector('[data-space="' + key + '"]');
  if (active) active.classList.add('active');

  var html = '<div class="space-header">';
  html += '<h1>' + sp.name + '</h1>';
  html += '<p>' + sp.description + '</p>';
  var totalPosts = sp.posts.length + (sp.startHere ? 1 : 0);
  html += '<div class="space-stats"><span class="space-stat"><strong>' + totalPosts + '</strong> posts</span>';
  if (sp.isPublic) html += '<span class="space-stat" style="color:var(--green)">&#x1F513; Public space</span>';
  html += '</div>';
  html += '</div>';

  // Member bar
  html += '<div class="member-bar">';
  html += '<div class="member-avatars">';
  var colors = ['#2aabb8','#e879f9','#fbbf24','#34d399','#fb923c'];
  var initials = ['MV','AE','DG','SC','GR'];
  for (var i = 0; i < 5; i++) {
    html += '<span style="background:' + colors[i] + '">' + initials[i] + '</span>';
  }
  html += '</div>';
  html += '<div class="member-bar-text"><strong>50+ members</strong> discussing clinical practice daily</div>';
  html += '</div>';

  // Filters
  if (sp.filters) {
    html += '<div class="filter-tags">';
    sp.filters.forEach(function(f, i) {
      html += '<span class="filter-tag' + (i === 0 ? ' active' : '') + '">' + f + '</span>';
    });
    html += '</div>';
  }

  // Start Here expanded post (readable)
  if (sp.startHere) {
    var sh = sp.startHere;
    html += '<div class="start-here-expanded">';
    html += '<div class="sh-label">Pinned <span>Readable in preview</span></div>';
    html += '<h3>' + sh.title + '</h3>';
    html += '<div class="sh-author">';
    html += '<div class="sh-avatar">MV</div>';

    html += '</div>';
    html += '<div class="sh-body">' + sh.body + '</div>';
    html += '</div>';
  }

  // Pinned post (old style, if no startHere)
  if (sp.pinned && !sp.startHere) {
    html += '<div class="pinned-post" onclick="showModal()">';
    html += '<div class="pinned-label">Pinned</div>';
    html += '<h3>' + sp.pinned.title + '</h3>';
    html += '<p>' + sp.pinned.desc + '</p>';
    html += '</div>';
  }

  // Post list
  html += '<div class="post-list">';
  sp.posts.forEach(function(p) {
    var icons = ['&#128203;','&#128221;','&#128214;','&#128200;','&#128161;','&#128295;','&#9878;','&#128218;'];
    var icon = icons[Math.floor(Math.random() * icons.length)];
    var clickAction = sp.isPublic ? 'window.open(\'' + sp.publicUrl + '\',\'_blank\')' : 'showModal()';
    html += '<div class="post-row" onclick="' + clickAction + '">';
    html += '<div class="post-icon">' + icon + '</div>';
    html += '<div class="post-info">';
    html += '<div class="post-title">' + p.title + '</div>';
    html += '<div class="post-meta">' + p.author + ' · ' + p.age + '</div>';
    html += '</div>';
    html += '<div class="post-engagement">';
    html += '<span>&#x2661; ' + p.likes + '</span>';
    html += '<span>&#x1F4AC; ' + p.comments + '</span>';
    html += '</div>';
    html += '</div>';
  });
  html += '</div>';

  // Thread count note
  if (sp.threadCount) {
    html += '<div style="text-align:center;padding:16px;font-size:0.78rem;color:var(--cream-dim);font-style:italic">Showing ' + sp.posts.length + ' of ' + sp.threadCount + ' threads</div>';
  }

  if (append) {
    document.getElementById('main-content').innerHTML += html;
  } else {
    document.getElementById('main-content').innerHTML = html;
  }
  // Scroll main to top
  if (!append) {
    document.getElementById('main-content').scrollTop = 0;
    window.scrollTo(0, 0);
  }
}
