    alias:[T.nm.toLowerCase()]};
}
let GLOSS_PAIRS = null, GLOSS_RE = null;
function buildGloss(){
  GLOSS_PAIRS = [];
  for(const k in GLOSSARY) for(const a of GLOSSARY[k].alias) GLOSS_PAIRS.push([a.toLowerCase(), k]);
  GLOSS_PAIRS.sort((x,y) => y[0].length - x[0].length);
  const esc_ = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  GLOSS_RE = new RegExp('(?<![\\w&])(' + GLOSS_PAIRS.map(p => esc_(p[0])).join('|') + ')(?![\\w])', 'gi');
}
function glossKey(word){
  const w = word.toLowerCase();
  for(const [a, k] of GLOSS_PAIRS) if(a === w) return k;
  return null;
}
/* escape, then mark up every glossary term inside */
function gtx(str){
  if(!GLOSS_RE) buildGloss();
  return esc(str).replace(GLOSS_RE, m => {
    const k = glossKey(m);
    return k ? `<span class="gl" data-g="${k}">${m}</span>` : m;
  });
}
const gword = (k, label) => `<span class="gl" data-g="${k}">${esc(label || GLOSSARY[k].nm)}</span>`;

/* ---------- the shared tooltip ---------- */
function showTip(el, title, body, owner, wide){
  const t = $('#tip');
  t.innerHTML = `<b class="tt">${title}</b>${body}`;
  t.classList.toggle('wide', !!wide);
  t.classList.add('on');
  V.tipOwner = owner || 'x';
  const r = el.getBoundingClientRect();
  const w = t.offsetWidth || 280;
  let left = r.left + r.width/2 - w/2;
  left = Math.min(innerWidth - w - 8, Math.max(8, left));
  let top = r.bottom + 8;
  if(top + t.offsetHeight > innerHeight - 8) top = Math.max(8, r.top - t.offsetHeight - 8);
  t.style.left = left + 'px';
  t.style.top = top + 'px';
}
function hideTip(owner){
  if(owner && V.tipOwner !== owner) return;
  $('#tip').classList.remove('on');
  V.tipOwner = null;
}
/* what a die can actually roll — the whole point of deciding to reroll one */
function dieTipHtml(k){
  const Dk = DICE[k];
  const gk = k === 'base' ? 'grit' : k;
  const blurb = GLOSSARY[gk] ? GLOSSARY[gk].tx : '';
  const faces = Dk.faces.map(f => `<div class="cdie ${Dk.cls} tipdie">${dieSvg({a:f.a||0, d:f.d||0, s:f.s||0})}</div>`).join('');
  return `<div class="tiny muted" style="margin-bottom:4px">Its six faces</div>
    <div class="facegrid">${faces}</div>
    <div class="tiny" style="margin-top:6px">${blurb}</div>`;
}
function wireGlossary(){
  const findDie = e => e.target && e.target.closest && e.target.closest('[data-dk]');
  const findCmp = e => e.target && e.target.closest && e.target.closest('[data-cmp]');
  const find = e => e.target && e.target.closest && e.target.closest('.gl[data-g]');
  const showCmp = el => {
    const it = ITEM(el.dataset.cmp);
    const html = cmpHtml(el.dataset.cmp);
    if(!html) return false;
    showTip(el, it.ic + ' ' + it.nm, html, 'gloss', true);
    return true;
  };
  document.addEventListener('mouseover', e => {
    const c = findCmp(e);
    if(c && !find(e) && !findDie(e)){ if(showCmp(c)) return; }
    const dk = findDie(e);
    if(dk && DICE[dk.dataset.dk]){
      showTip(dk, DICE[dk.dataset.dk].ic + ' ' + DICE[dk.dataset.dk].nm + ' die', dieTipHtml(dk.dataset.dk), 'gloss');
      return;
    }
    const el = find(e); if(!el) return;
    const g = GLOSSARY[el.dataset.g]; if(!g) return;
    showTip(el, g.ic + ' ' + g.nm, g.tx, 'gloss');
  });
  document.addEventListener('mouseout', e => { if(find(e) || findDie(e) || findCmp(e)) hideTip('gloss'); });
  // touch: a tap explains the term, unless it sits inside a button that does something else
  document.addEventListener('click', e => {
    const c = findCmp(e);
    if(c && !e.target.closest('button') && !find(e) && !findDie(e)){
      if(showCmp(c)){
        clearTimeout(V.tipTimer);
        V.tipTimer = setTimeout(() => hideTip('gloss'), 6000);
        return;
      }
    }
    const dk = findDie(e);
    if(dk && DICE[dk.dataset.dk] && !dk.hasAttribute('data-die')){
      showTip(dk, DICE[dk.dataset.dk].ic + ' ' + DICE[dk.dataset.dk].nm + ' die', dieTipHtml(dk.dataset.dk), 'gloss');
      clearTimeout(V.tipTimer);
      V.tipTimer = setTimeout(() => hideTip('gloss'), 6000);
      return;
    }
    const el = find(e); if(!el) return;
    if(el.closest('button')) return;
    const g = GLOSSARY[el.dataset.g]; if(!g) return;
    e.stopPropagation();
    showTip(el, g.ic + ' ' + g.nm, g.tx, 'gloss');
    clearTimeout(V.tipTimer);
    V.tipTimer = setTimeout(() => hideTip('gloss'), 5000);
  });
}
function openGlossary(back){
  const groups = {};
  for(const k in GLOSSARY){ const g = GLOSSARY[k]; (groups[g.grp] = groups[g.grp] || []).push(g); }
  modal({
    ic:'📖', h:'What Everything Means', wide:true,
    sub:'Hover any underlined word anywhere in the game to get this without opening a menu',
    b: Object.keys(groups).map(grp => `
      <h3 style="margin:14px 0 7px">${esc(grp)}</h3>
      ${groups[grp].map(g => `<div class="item" style="align-items:flex-start">
        <div class="ic">${g.ic}</div>
        <div><div class="nm">${esc(g.nm)}</div><div class="tx">${g.tx}</div></div>
      </div>`).join('')}`).join(''),
    f:[{lb:'Back', cls:'primary', fn:()=>{ closeModal(); if(back) back(); else if(S) render(); else renderTitle(); }}],
    onClose: back,
  });
}


/* =========================================================================
   SOUND
   Everything is synthesised through the Web Audio API — no files, nothing
   to load, and the game stays one HTML document. Silent until the first
   click, because browsers will not let it be otherwise.
   ========================================================================= */
const SFX = (() => {
  let ctx = null, master = null, noiseBuf = null, ready = false;
  let on = true, vol = 0.5;
  const last = {};
  try{
    const raw = localStorage.getItem('hexbound.sound');
    if(raw){ const o = JSON.parse(raw); on = o.on !== false; if(typeof o.vol === 'number') vol = o.vol; }
  }catch(e){}
  function persist(){ try{ localStorage.setItem('hexbound.sound', JSON.stringify({on, vol})); }catch(e){} }

  function init(){
    if(ready) return ready;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return false;
    try{
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = vol;
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 6;
      master.connect(comp); comp.connect(ctx.destination);
      const n = ctx.sampleRate * 1.2;
      noiseBuf = ctx.createBuffer(1, n, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for(let i=0;i<n;i++) d[i] = Math.random()*2 - 1;
      ready = true;
    }catch(e){ ctx = null; ready = false; }
    return ready;
  }
  function resume(){ try{ if(ctx && ctx.state === 'suspended') ctx.resume(); }catch(e){} }

  /* --- primitives --- */
  function tone(o){
    const t0 = ctx.currentTime + (o.at || 0);
    const osc = ctx.createOscillator();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f, t0);
    if(o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.to), t0 + (o.dur || 0.2));
    if(o.detune) osc.detune.value = o.detune;
    let node = osc;
    if(o.lp){
      const f = ctx.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = o.lp;
      osc.connect(f); node = f;
    }
    const g = ctx.createGain();
    const a = o.a != null ? o.a : 0.006, dur = o.dur || 0.2, peak = (o.g != null ? o.g : 0.3);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + dur);
    node.connect(g); g.connect(master);
    osc.start(t0); osc.stop(t0 + a + dur + 0.05);
  }
  function noise(o){
    const t0 = ctx.currentTime + (o.at || 0);
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf;
    src.playbackRate.value = o.rate || 1;
    const f = ctx.createBiquadFilter();
    f.type = o.type || 'bandpass';
    f.frequency.setValueAtTime(o.f || 1200, t0);
    if(o.to) f.frequency.exponentialRampToValueAtTime(Math.max(40, o.to), t0 + (o.dur || 0.2));
    f.Q.value = o.q != null ? o.q : 1;
    const g = ctx.createGain();
    const a = o.a != null ? o.a : 0.004, dur = o.dur || 0.2, peak = (o.g != null ? o.g : 0.25);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t0); src.stop(t0 + a + dur + 0.05);
  }
  const arp = (freqs, step, o) => freqs.forEach((f, i) => tone(Object.assign({f, at: i*step}, o)));

  /* --- the kit --- */
  const KIT = {
    click:   () => noise({f:2600, q:1.4, dur:0.035, g:0.10, type:'highpass'}),
    deny:    () => { tone({f:150, to:90, type:'square', dur:0.12, g:0.14, lp:900}); },
    open:    () => { tone({f:420, to:640, type:'triangle', dur:0.13, g:0.10}); },

    move:    () => { tone({f:150, to:80, dur:0.11, g:0.22, lp:600}); noise({f:520, to:200, dur:0.09, g:0.10, type:'lowpass'}); },
    reveal:  () => arp([880, 1320, 1760], 0.045, {type:'sine', dur:0.16, g:0.075}),
    dice:    () => { for(let i=0;i<5;i++) noise({at:i*0.042 + Math.random()*0.014, f:1300 + Math.random()*1500, q:1.1, dur:0.055, g:0.30}); },
    dawn:    () => { arp([523, 784], 0.11, {type:'sine', dur:0.5, g:0.10}); },
    dread:   () => { tone({f:58, to:40, type:'sine', dur:1.1, g:0.26, a:0.12}); noise({f:220, to:70, dur:0.9, g:0.07, type:'lowpass'}); },

    cardPlay:() => { noise({f:2400, to:700, q:0.8, dur:0.17, g:0.13}); tone({f:300, to:190, type:'triangle', dur:0.1, g:0.07}); },
    intent:  () => { noise({f:900, to:130, q:0.7, dur:0.34, g:0.14, type:'lowpass'}); tone({f:120, to:74, dur:0.3, g:0.12}); },
    surge:   () => { tone({f:1240, type:'triangle', dur:0.22, g:0.11}); tone({f:1860, type:'sine', dur:0.2, g:0.06, at:0.02}); },

    hitFoe:  () => {
      noise({f:2400, to:700, q:1.1, dur:0.09, g:0.20});
      tone({f:300, to:150, type:'square', dur:0.13, g:0.14, lp:1800});
      tone({f:196, to:120, type:'sawtooth', dur:0.16, g:0.10, lp:1200, at:0.012});
    },
    hitMe:   () => {
      tone({f:110, to:52, type:'sine', dur:0.24, g:0.32});
      noise({f:700, to:140, q:0.8, dur:0.16, g:0.16, type:'lowpass'});
    },
    block:   () => { tone({f:230, to:170, type:'triangle', dur:0.1, g:0.16, lp:900}); noise({f:1500, to:600, q:1.6, dur:0.06, g:0.09}); },
    heal:    () => arp([523, 698, 880], 0.05, {type:'sine', dur:0.3, g:0.085}),
    gold:    () => { arp([1568, 2093], 0.045, {type:'triangle', dur:0.16, g:0.075}); noise({f:4200, q:2, dur:0.05, g:0.05, type:'highpass'}); },
    burn:    () => noise({f:1800, to:500, q:0.9, dur:0.2, g:0.09}),

    levelUp: () => arp([523, 659, 784, 1046], 0.085, {type:'triangle', dur:0.42, g:0.11}),
    victory: () => { arp([523, 659, 784, 1046, 1318], 0.1, {type:'triangle', dur:0.7, g:0.12}); tone({f:131, dur:1.4, g:0.16, a:0.05, at:0.1}); },
    defeat:  () => { arp([392, 330, 262, 196], 0.16, {type:'triangle', dur:0.6, g:0.13}); tone({f:65, dur:1.6, g:0.2, a:0.08}); },
    lair:    () => {
      tone({f:70, to:32, dur:1.0, g:0.34, a:0.01});
      noise({f:500, to:90, q:0.6, dur:0.8, g:0.18, type:'lowpass'});
      arp([440, 587, 880], 0.1, {type:'sine', dur:0.6, g:0.09, at:0.18});
    },
  };

  function play(name, minGap){
    if(!on) return;
    if(!ready && !init()) return;
    resume();
    const now = Date.now();
    const gap = minGap != null ? minGap : 45;
    if(last[name] && now - last[name] < gap) return;
    last[name] = now;
    try{ KIT[name] && KIT[name](); }catch(e){}
  }
  return {
    play, init, resume,
    ensure: init,
    get ctx(){ return ctx; },
    get master(){ return master; },
    get noise(){ return noiseBuf; },
    get on(){ return on; },
    set on(v){ on = !!v; persist(); if(on){ init(); resume(); } },
    get vol(){ return vol; },
    set vol(v){ vol = Math.max(0, Math.min(1, v)); if(master) master.gain.value = vol; persist(); },
    toggle(){ this.on = !on; return on; },
  };
})();
const sfx = (n, gap) => { try{ SFX.play(n, gap); }catch(e){} };

/* =========================================================================
   MUSIC
   A generative score on the same audio graph as the sound effects. Nothing
   is recorded; it is scheduled a few notes ahead on a 16th-note grid and
   changes shape with what is happening — riding out, in a fight, or with
   the Crown's dread heavy on the region.
   ========================================================================= */
const MUS = (() => {
  let bus = null, timer = null, nextT = 0, step = 0;
  let mood = 'travel', pending = null;
  let on = true, vol = 0.45, started = false;
  try{
    const raw = localStorage.getItem('hexbound.music');
    if(raw){ const o = JSON.parse(raw); on = o.on !== false; if(typeof o.vol === 'number') vol = o.vol; }
  }catch(e){}
  function persist(){ try{ localStorage.setItem('hexbound.music', JSON.stringify({on, vol})); }catch(e){} }

  const BPM   = {travel:62, town:70, combat:96, boss:112};
  const ROOT  = {travel:45, town:48, combat:43, boss:41};        // A2 / C3 / G2 / F2
  const PENTA = [0, 3, 5, 7, 10];
  const AEOL  = [0, 2, 3, 5, 7, 8, 10];
  const mtof  = m => 440 * Math.pow(2, (m - 69) / 12);
  const R = () => Math.random();
  const dark = () => (S && S.dreadMax) ? Math.min(1, S.dread / S.dreadMax) : 0;

  function ensure(){
    if(bus) return true;
    if(!SFX.ensure()) return false;
    const ctx = SFX.ctx;
    bus = ctx.createGain();
    bus.gain.value = 0;
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 5200;
    bus.connect(lp); lp.connect(SFX.master);
    return true;
  }

  /* one voice */
  function note(m, t, o){
    o = o || {};
    const ctx = SFX.ctx;
    const osc = ctx.createOscillator();
    osc.type = o.type || 'triangle';
    osc.frequency.setValueAtTime(mtof(m), t);
    if(o.detune) osc.detune.value = o.detune;
    let node = osc;
    if(o.lp){
      const f = ctx.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.setValueAtTime(o.lp, t);
      if(o.lpTo) f.frequency.exponentialRampToValueAtTime(o.lpTo, t + (o.dur || 0.4));
      osc.connect(f); node = f;
    }
    const g = ctx.createGain();
    const a = o.a != null ? o.a : 0.02, dur = o.dur || 0.4, peak = o.g != null ? o.g : 0.12;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + dur);
    node.connect(g); g.connect(bus);
    osc.start(t); osc.stop(t + a + dur + 0.05);
  }
  function tick(t, g){                       // a soft noise pulse for the beat
    const ctx = SFX.ctx;
    const src = ctx.createBufferSource();
    src.buffer = SFX.noise;
    src.playbackRate.value = 1.6;
    const f = ctx.createBiquadFilter();
    f.type = 'highpass'; f.frequency.value = 5200;
    const gn = ctx.createGain();
    gn.gain.setValueAtTime(0.0001, t);
    gn.gain.exponentialRampToValueAtTime(g, t + 0.004);
    gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    src.connect(f); f.connect(gn); gn.connect(bus);
    src.start(t); src.stop(t + 0.08);
  }

  /* what plays on a given 16th of a four-bar phrase */
  function emit(s, t){
    const root = ROOT[mood] || 45;
    const d = dark();
    const bar = Math.floor(s / 16);

    if(mood === 'travel' || mood === 'town'){
      if(s % 16 === 0){
        note(root, t, {type:'sine', dur:2.6, g:0.30, a:0.35, lp:560});
        note(root + 12, t, {type:'triangle', dur:2.4, g:0.12, a:0.5, lp:900, detune:4});
      }
      if(s % 16 === 8){
        const third = d > 0.55 ? 3 : (bar % 2 ? 7 : 3);
        note(root + third, t, {type:'sine', dur:2.0, g:0.16, a:0.4, lp:700});
      }
      if(d > 0.35 && s % 32 === 24){        // the Crown leaning on the key
        note(root + 1, t, {type:'sine', dur:2.6, g:0.08 + d*0.12, a:0.8, lp:420});
      }
      if(s % 4 === 0 && R() < (mood === 'town' ? 0.4 : 0.3)){
        const oct = R() < 0.35 ? 24 : 12;
        note(root + oct + PENTA[Math.floor(R()*PENTA.length)], t,
             {type:'triangle', dur:0.9 + R()*0.7, g:0.10, a:0.03, lp:3400});
      }
    }
    else {                                   // combat and boss
      const drive = mood === 'boss';
      if(s % 4 === 0){
        const alt = (s / 4) % 4;
        const bn = alt === 2 ? root + 7 : (alt === 3 ? root + 5 : root);
        note(bn, t, {type:'sawtooth', dur:0.24, g:0.26, a:0.008, lp:700, lpTo:260});
      }
      if(s % 8 === 4) tick(t, 0.045);
      if(s % 4 === 2 && R() < 0.5) tick(t, 0.020);
      if(s % 2 === 0){
        const i = Math.floor(s / 2) % 8;
        const seq = drive ? [0, 3, 0, 5, 0, 3, 7, 3] : [0, 3, 5, 3, 0, 7, 5, 3];
        note(root + 12 + seq[i], t, {type:'triangle', dur:0.2, g:0.13, a:0.006, lp:2600});
      }
      if(s % 16 === 0){
        note(root - 12, t, {type:'sine', dur:2.0, g:0.28, a:0.05, lp:300});
        if(drive) note(root - 12 + 6, t, {type:'sine', dur:1.8, g:0.13, a:0.18, lp:260});
      }
      if(drive && s % 16 === 12) note(root + 24 + PENTA[Math.floor(R()*3)], t,
             {type:'square', dur:0.5, g:0.06, a:0.01, lp:2400});
    }
  }

  function pump(){
    if(!bus || !on) return;
    const ctx = SFX.ctx;
    if(document.hidden){ bus.gain.setTargetAtTime(0, ctx.currentTime, 0.2); return; }
    const spb = 60 / (BPM[mood] || 62) / 4;
    while(nextT < ctx.currentTime + 0.25){
      if(nextT < ctx.currentTime) nextT = ctx.currentTime + 0.05;
      emit(step, nextT);
      nextT += spb;
      step = (step + 1) % 64;
      if(step % 16 === 0 && pending){ mood = pending; pending = null; }   // change on the bar
    }
    bus.gain.setTargetAtTime(vol * 1.15, ctx.currentTime, 0.6);
  }

  return {
    start(){
      if(!on || started) return;
      if(!ensure()) return;
      SFX.resume();
      started = true;
      nextT = SFX.ctx.currentTime + 0.1;
      step = 0;
      timer = setInterval(pump, 25);
    },
    stop(fade){
      if(!started) return;
      started = false;
      clearInterval(timer); timer = null;
      if(bus && SFX.ctx) bus.gain.setTargetAtTime(0, SFX.ctx.currentTime, fade === false ? 0.01 : 0.4);
    },
    /* switching waits for the end of the phrase, so it never sounds cut off */
    set(m, now){
      if(m === mood && !pending) return;
      if(now){ mood = m; pending = null; step = 0; }
      else pending = m;
    },
    get mood(){ return mood; },
    get on(){ return on; },
    set on(v){
      on = !!v; persist();
      if(on){ if(S && V.screen === 'game') this.start(); }
      else this.stop();
    },
    get vol(){ return vol; },
    set vol(v){ vol = Math.max(0, Math.min(1, v)); persist(); },
    toggle(){ this.on = !on; return on; },
  };
})();

function modal(o){
  const sc = $('#scrim');
  hideTip();
  V.hover = null;
  sc.classList.remove('hidden');
  sc.innerHTML = `<div class="modal ${o.wide?'wide':''}">
    <div class="mh"><div class="ic">${o.ic||'📜'}</div><div style="flex:1"><h2>${o.h||''}</h2>${o.sub?`<div class="tiny muted">${o.sub}</div>`:''}</div>
      ${o.noClose ? '' : '<button class="btn sm ghost" id="mClose">Close</button>'}</div>
    <div class="mb">${o.b||''}</div>
    ${(o.f && o.f.length) ? `<div class="mf">${o.f.map((b,i)=>`<button class="btn ${b.cls||''}" data-f="${i}" ${b.id?`id="${b.id}"`:''} ${b.dis?'disabled':''}>${b.lb}</button>`).join('')}</div>` : ''}
  </div>`;
  if(!o.noClose) $('#mClose').onclick = () => { closeModal(); if(o.onClose) o.onClose(); save(); render(); };
  (o.f||[]).forEach((b,i) => { if(b.fn) sc.querySelector(`[data-f="${i}"]`).onclick = b.fn; });
  sc.onclick = e => { if(e.target === sc && !o.noClose){ closeModal(); if(o.onClose) o.onClose(); save(); render(); } };
}
function closeModal(){ const sc = $('#scrim'); sc.classList.add('hidden'); sc.innerHTML = ''; sc.onclick = null; }
function flash(msg){
  const el = document.createElement('div');
  el.className = 'float';
  el.style.cssText += 'left:50%;top:22%;transform:translateX(-50%);color:#e8b44a;font-size:15px;background:rgba(10,16,26,.95);padding:8px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.18)';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}
function floatText(t, col, anchorSel){
  const a = $(anchorSel);
  const r = a ? a.getBoundingClientRect() : {left:innerWidth/2-20, top:innerHeight/2, width:40};
  const el = document.createElement('div');
  el.className = 'float'; el.style.color = col;
  el.style.left = (r.left + r.width/2) + 'px'; el.style.top = (r.top + 30) + 'px';
  el.textContent = t;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}
function tipOn(el, title, body){
  el.addEventListener('mouseenter', () => showTip(el, title, body, 'x'));
  el.addEventListener('mouseleave', () => hideTip('x'));
}

const slotOf = it => it.slot === 'trinket' ? 'trinket1' : it.slot;
function equipItem(id){
  const it = ITEM(id);
  const h = S.hero;
  let slot = it.slot;
  if(slot === 'trinket'){
    slot = !h.gear.trinket1 ? 'trinket1' : (!h.gear.trinket2 ? 'trinket2' : (V.trinketSlot || 'trinket1'));
  }
  const old = h.gear[slot];
  h.gear[slot] = id;
  S.bag.splice(S.bag.indexOf(id), 1);

function unequip(slot){

  if(!h.gear[slot]) return;
  S.bag.push(h.gear[slot]);
  h.gear[slot] = null;
  S.hero.hp = Math.min(S.hero.hp, D().maxHp);
  openInventory(); save(); render();
}

/* =========================================================================
   GEAR COMPARISON
   Hovering a piece of gear works out what your character sheet would
   actually look like wearing it. It runs the real derived-stat function
   with the item swapped in, so dice, reforges and surges are all counted —
   not a hand-written guess at what each item does.
   ========================================================================= */
const CMPROWS = [
  ['atk',    '⚔ Attack'],        ['arm',    '🛡 Armor'],
  ['ward',   '🧿 Prevented/round'],['maxHp',  '❤️ Max health'],
  ['rrTotal','🎲 Rerolls/round'], ['maxEn',  '⚡ Max energy'],
  ['mig',    '💪 Might'],         ['agi',    '🌀 Agility'],
  ['wit',    '📖 Wits'],          ['spi',    '✨ Spirit'],
  ['move',   '🧭 Travel dice'],   ['scout',  '🔭 Reveal rings'],
  ['test',   '📜 Skill tests'],   ['regen',  '⚕️ Healing at dawn'],
  ['gold',   '🪙 Gold found'],    ['haggle', '🏷️ Shop discount'],
  ['zeal',   '🔥 Attack when hurt'],
];
const PCT = {gold:1, haggle:1};

function defaultSlotFor(it){
  const g = S.hero.gear;
  if(it.slot !== 'trinket') return it.slot;
  if(!g.trinket1) return 'trinket1';
  if(!g.trinket2) return 'trinket2';
  return 'trinket1';
}
/* derived stats as they would be with `id` worn in `slot` */
function statsWearing(id, slot){
  const h = S.hero;
  const saved = Object.assign({}, h.gear);
  h.gear[slot] = id;
  let after;
  try{ after = D(); }
  finally{ h.gear = saved; }
  return after;
}
function poolDiff(before, after){
  const count = pool => pool.reduce((m, k) => (m[k] = (m[k]||0)+1, m), {});
  const a = count(before.pool), b = count(after.pool);
  const out = [];
  for(const k of new Set(Object.keys(a).concat(Object.keys(b)))){
    const d = (b[k]||0) - (a[k]||0);
    if(d) out.push(`<span style="color:${d>0?'var(--green)':'var(--red)'}">${d>0?'+':''}${d} ${DICE[k].nm}</span>`);
  }
  return out;
}
function cmpHtml(id){
  const it = ITEM(id);
  if(!it || it.slot === 'use') return null;
  const slot = defaultSlotFor(it);
  const replaced = S.hero.gear[slot] && ITEM(S.hero.gear[slot]);
  if(replaced && replaced.id === it.id) return null;      // already wearing this one
  const before = D(), after = statsWearing(id, slot);

  const rows = [];
  for(const [k, label] of CMPROWS){
    const d = (after[k] || 0) - (before[k] || 0);
    if(!d) continue;
    const good = d > 0;
    rows.push(`<div class="cmprow"><span>${label}</span>
      <b style="color:${good ? 'var(--green)' : 'var(--red)'}">${good ? '+' : ''}${d}${PCT[k] ? '%' : ''}</b></div>`);
  }
  const dice = poolDiff(before, after);
  if(dice.length) rows.push(`<div class="cmprow"><span>🎲 Dice pool</span><b>${dice.join(', ')}</b></div>`);

  const gained = after.surge.filter(x => !before.surge.includes(x));
  const lost   = before.surge.filter(x => !after.surge.includes(x));
  if(gained.length || lost.length){
    const bits = gained.map(x => `<span style="color:var(--green)">+${SURGES[x].nm}</span>`)
      .concat(lost.map(x => `<span style="color:var(--red)">−${SURGES[x].nm}</span>`));
    rows.push(`<div class="cmprow"><span>✦ Surge options</span><b>${bits.join(', ')}</b></div>`);
  }

  const slotLabel = slot === 'trinket1' ? 'Trinket I' : slot === 'trinket2' ? 'Trinket II' : SLOTNM[slot];
  const head = replaced
    ? `<div class="cmphead">Replaces <b>${replaced.ic} ${esc(replaced.nm)}</b> in ${slotLabel}</div>`
    : `<div class="cmphead">Goes into your empty ${slotLabel}</div>`;
  const both = it.slot === 'trinket' && S.hero.gear.trinket1 && S.hero.gear.trinket2;
  const alt = both ? `<div class="mini faint" style="margin-top:6px">You will be asked which trinket to swap — this compares against ${esc(ITEM(S.hero.gear.trinket1).nm)}.</div>` : '';

  return head + (rows.length
      ? `<div class="cmpgrid">${rows.join('')}</div>`
      : `<div class="tiny muted" style="margin-top:4px">No change to any of your numbers.</div>`) + alt;
}

function itemCard(it, right, cmp){
  return `<div class="item${cmp && it.slot !== 'use' ? ' cmpable' : ''}"${cmp && it.slot !== 'use' ? ` data-cmp="${it.id}"` : ''}>
    <div class="ic">${it.ic}</div>
    <div style="flex:1;min-width:0">
      <div class="nm" style="color:${RANKCOL[it.rank||1]}">${esc(it.nm)}</div>
      <div class="tx">${gtx(it.tx)}</div>
      <div class="mini faint">${gword('quality', RANKNM[it.rank||1])} · ${gtx(SLOTNM[it.slot])}${it.cost?` · worth ${Math.round(it.cost*0.45)}g`:''}</div>
    </div>
    ${right||''}
  </div>`;
}
function openInventory(){
  const h = S.hero;
  const slots = ['weapon','offhand','armor','trinket1','trinket2'];
  const gearHtml = slots.map(s => {
    const it = h.gear[s] && ITEM(h.gear[s]);

    return itemCard(it, `<button class="btn sm ghost" data-unq="${s}">Remove</button>`);

  const use = bag.map((it,i) => it.slot === 'use' ? itemCard(it, `<div class="col" style="gap:4px">

        <div><h3 style="margin-bottom:7px">${h.ic} ${esc(h.nm)} is wearing</h3>${gearHtml}

  $$('#scrim [data-eq]').forEach(b => b.onclick = () => {

      modal({ic:it.ic, h:'Which trinket slot?', b:`<p class="muted">Both slots are full. One has to go back in the pack.</p>`,
        f:[
          {lb:`I: ${ITEM(h.gear.trinket1).nm}`, fn:()=>{ V.trinketSlot='trinket1'; equipItem(it.id); }},
          {lb:`II: ${ITEM(h.gear.trinket2).nm}`, fn:()=>{ V.trinketSlot='trinket2'; equipItem(it.id); }},

    const it = bag[+b.dataset.sell];

    S.bag.splice(S.bag.indexOf(it.id), 1);

    log(`Sold ${it.nm} for ${price}g.`, 'y');

}

function useItem(id, inCombat){
  const it = ITEM(id);
  let h = S.hero;
  const C = V.combat;
  /* In a fight the pack is only open to a hero who chose Defend & Use Item,
     and to one thing each. Out of a fight anyone may use anything. */
  let defender = null;
  if(C && !C.done){
    defender = canUseItemNow();
    if(!defender){ flash('Nobody defended this round. The pack stays shut.'); return; }
    h = defender;
  }
  const d = D(h);
  const consume = () => { const i = S.bag.indexOf(id); if(i >= 0) S.bag.splice(i,1); };
  const combatOnly = ['fury','stone','sharp','stagger','rrs','bomb'];
  if(combatOnly.includes(it.use) && (!C || C.done)){ flash('Only useful in a fight.'); return; }
  if(defender) C.itemUsed[defender.id] = 1;
  switch(it.use){
    case 'heal8': healHero(8, it.nm, h); break;
    case 'heal16': healHero(16, it.nm, h); break;
    case 'heal30': healHero(30, it.nm, h); break;
    case 'energy3': h.en = clamp(h.en + 3, 0, d.maxEn); log('+3 energy.', 'b'); break;
    case 'rations': healHero(5, it.nm, h); h.en = clamp(h.en + 2, 0, d.maxEn); break;
    case 'wine': healHero(10, it.nm, h); h.en = d.maxEn; break;
    case 'cure': if(C){ C.me.burn = 0; C.me.poison = 0; } healHero(4, it.nm, h); break;
    case 'fury': C.me.fury += 5; cLog('Fury oil. +5 attack this round.', 'y'); break;
    case 'sharp': C.me.sharp = (C.me.sharp||0); C.me.fury += 0; C.sharp = (C.sharp||0) + 2; cLog('Edge honed. +2 attack for the fight.', 'y'); break;
    case 'stone': C.me.stone = 1; cLog('Your skin goes hard as flint.', 'y'); break;
    case 'stagger': staggerFoe(C, it.nm); break;
    case 'rrs': C.rrLeft += 3; cLog('+3 rerolls.', 'y'); break;
    case 'bomb': dealToFoe(14, 'the bomb', true); break;
    case 'flee': if(C && !C.opts.boss){ V.combat = null; closeModal(); log('You vanish into the smoke.', 'y'); consume(); save(); render(); return; } flash('Not from this one.'); return;
    case 'reveal': { const n = reveal(S.pos, 3); log(`${plural(n,'hex')} revealed.`, 'b'); break; }
    case 'boat': { V.boat = true; flash('You may cross one water hex this turn.'); break; }
    default: break;
  }
  consume();
  save();
  if(C) renderCombat(); else { if(!$('#scrim').classList.contains('hidden')) openInventory(); render(); }
}

/* =========================================================================
   REWARD CARDS
   Drawn for the things worth drawing for: a broken lair, a bounty brought in.
   The tier of what you killed sets how deep in the deck you are allowed to
   reach, so a lair pays better than a bounty and the Crown pays best.
   ========================================================================= */
const REWARD_CARDS = [
  {id:'rc1', nm:'Purse and Plunder', ic:'🪙', tier:1, w:4, tx:'Coin, counted out where you can see it.',
   give:t => { const g = gainGold(ri(40, 70) * t); return `${g} gold.`; }},
  {id:'rc2', nm:'Salvage',           ic:'📦', tier:1, w:4, tx:'Something serviceable, pulled out of the mess.',
   give:t => { const it = rollItem(clamp(t + 1, 1, 4)); giveItem(it.id); return `${it.ic} ${it.nm}.`; }},
  {id:'rc3', nm:'Hard-Won',          ic:'▸', tier:1, w:4, tx:'You came out of that knowing something you did not.',
   give:() => { const h = S.hero; h.ticks++; return `A tick for ${h.nm}.`; }},
  {id:'rc4', nm:'All Of You',        ic:'✨', tier:2, w:3, tx:'Everyone who walked out of it walked out better.',
   give:() => { party().forEach(h => h.ticks++); return `A tick each — ${plural(party().length,'tick')}.`; }},
  {id:'rc5', nm:'The Good Stuff',    ic:'💠', tier:2, w:2, tx:'Whatever it was keeping for itself.',
   give:t => { const it = rollItem(clamp(t + 2, 2, 4)); giveItem(it.id); return `${it.ic} ${it.nm}.`; }},
  {id:'rc6', nm:'Field Promotion',   ic:'⭐', tier:2, w:2, tx:'Two ticks, and nobody arguing about where they go.',
   give:() => { S.hero.ticks += 2; return `Two ticks for ${S.hero.nm}.`; }},
  {id:'rc7', nm:'Something Ancient', ic:'👑', tier:3, w:2, tx:'It had been holding this a very long time.',
   give:() => { relicChoice(); return 'A relic out of the hoard.'; }},
  {id:'rc8', nm:'The Whole Lesson',  ic:'📜', tier:3, w:1, tx:'Every one of you takes two things away from it.',
   give:() => { party().forEach(h => h.ticks += 2); return `Two ticks each — ${plural(party().length*2,'tick')}.`; }},
];
function drawReward(tier, after){
  tier = clamp(tier || 1, 1, 3);
  const pool = REWARD_CARDS.filter(c => c.tier <= tier);
  const bag = []; pool.forEach(c => { for(let i=0;i<c.w;i++) bag.push(c); });
  const card = bag[Math.floor(rnd() * bag.length)];
  const done = () => { save(); render(); if(after) after(); };
  sfx('gold', 0);
  modal({
    ic:'🎁', h:'Reward Card', noClose:true,
    sub: tier >= 3 ? 'Drawn deep' : tier === 2 ? 'A lair broken' : 'A job finished',
    b:`<div class="solocard"><div class="acard pick" style="--accent:var(--gold)">
        ${cardWatermark()}
        <div class="ahd"><span class="aic">${card.ic}</span><span class="anm">${esc(card.nm)}</span></div>
        <div class="ahalf top"><span class="lbl">Reward</span><span class="atx">${gtx(card.tx)}</span></div>
       </div></div>`,
    f:[{lb:'Take it', cls:'primary', fn:()=>{
      closeModal();
      const got = card.give(tier);
      log(`Reward card — ${card.nm}: ${got}`, 'y');
      if(card.id === 'rc7'){ save(); return; }          // relicChoice put its own modal up
      modal({ic:card.ic, h:esc(card.nm), b:`<p>${gtx(card.tx)}</p><div class="sep"></div><p><b style="color:var(--gold)">${esc(got)}</b></p>`,
        f:[{lb:'Continue', cls:'primary', fn:()=>{ closeModal(); done(); }}], noClose:true});
    }}],
  });
}

function relicChoice(after){
  const held = new Set(S.bag.concat(...party().map(h => Object.values(h.gear))));
  let pool = RELICS().filter(r => !held.has(r.id));
  if(pool.length < 2) pool = RELICS();
  const two = shuffle(pool).slice(0,2);
  modal({ic:'💠', h:'The Hoard', noClose:true,
    b:`<p class="muted">Whatever it was hoarding is yours now. You can carry one of these out.</p><div class="sep"></div>` +
      two.map((r,i) => `<button class="choice" data-rel="${i}"><b>${r.ic} ${esc(r.nm)}</b><div class="sub">${esc(r.tx)}</div>
        <div class="mini faint" style="margin-top:3px">Relic · ${SLOTNM[r.slot]}</div></button>`).join(''),
    f:[]});
  $$('#scrim [data-rel]').forEach(b => b.onclick = () => {
    giveItem(two[+b.dataset.rel].id);
    closeModal(); save(); render();
    if(after) setTimeout(after, T(200));
  });
}

function townRank(m){ return m.feat === 'city' ? 3 : m.feat === 'town' ? 2 : 1; }
function stockFor(m){
  const k = key(m.q,m.r);
  const bucket = Math.floor(S.day / 4);
  const id = k + ':' + bucket;
  if(S.shops[id]) return S.shops[id];
  const rank = townRank(m);
  const n = rank === 3 ? 10 : rank === 2 ? 7 : 5;
  const pool = ITEMS.filter(i => !i.relic && i.tier <= rank + (rank === 3 ? 1 : 0));
  const stock = [];
  const seen = new Set();
  for(let i=0;i<40 && stock.length < n;i++){
    const it = pick(pool);
    if(seen.has(it.id) && it.slot !== 'use') continue;
    seen.add(it.id);
    stock.push(it.id);
  }
  S.shops[id] = stock;
  return stock;
}
function priceOf(it){
  const d = D();
  return Math.max(4, Math.round(it.cost * (1 - PARTY().haggle/100)));
}

function openShop(o){
  const stock = o.stock || (function(){
    const pool = ITEMS.filter(i => !i.relic && i.tier <= (o.tier||2));
    return shuffle(pool).slice(0,6).map(i => i.id);
  })();
  const body = stock.length ? stock.map((id,i) => {
    const it = ITEM(id); if(!it) return '';
    const p = Math.round(priceOf(it) * (o.mark || 1));
    return itemCard(it, `<div class="col" style="gap:4px;align-items:flex-end">
      <div class="tiny" style="color:var(--gold);font-weight:700">${p}g</div>
      <button class="btn sm ${S.gold >= p ? 'primary' : ''}" data-buy="${i}" ${S.gold < p ? 'disabled' : ''}>Buy</button></div>`, true);
  }).join('') : '<div class="tiny faint">Sold out.</div>';
  modal({
    ic:'🏪', h:o.nm || 'Market', wide:true, sub:`${S.gold} gold`,
    b:body,
    f:[{lb:'Sell instead', fn:()=>openSell(()=>openShop(o))}, {lb:'Done', cls:'primary', fn:()=>{ closeModal(); if(o.back) o.back(); else { save(); render(); } }}],
  });
  $$('#scrim [data-buy]').forEach(b => b.onclick = () => {
    const i = +b.dataset.buy;
    const it = ITEM(stock[i]);
    const p = Math.round(priceOf(it) * (o.mark || 1));
    if(S.gold < p) return;
    S.gold -= p;
    S.bag.push(it.id);
    stock.splice(i,1);
    log(`Bought ${it.nm} for ${p}g.`, 'y');
    save(); openShop(o);
  });
}
function openSell(back){
  const bag = S.bag.map(id => ITEM(id)).filter(Boolean);

/* what the next rank on a track costs to buy outright */
function tickPrice(h, id){
  const R = rankOf(h, id);
  const t = TRACK(id);
  const base = 60 + R * 55;
  const mult = t.mastery ? 1.4 : (t.grp === 'Skills' ? 0.8 : 1);
  return Math.max(30, Math.round(base * mult * (1 - PARTY().haggle / 100)));
}
function openHall(m){
  const h = S.hero;
  const back = () => openTown(m);
  const rows = BOARD.map(t => {
    const R = rankOf(h, t.id), full = R >= MAXRANK, cost = tickPrice(h, t.id);
    const ms = t.mastery ? MST(h, t.mastery === 1 ? 'm1' : 'm2') : null;
    const can = !full && S.gold >= cost;
    return `<button class="choice" ${can ? `data-buytick="${t.id}"` : 'disabled'}>
      <b>${ms ? ms.ic : t.ic} ${esc(ms ? ms.nm : t.nm)} — rank ${R} → ${full ? 'maxed' : R + 1}</b>
      <div class="sub">${gtx(ms ? ms.tx(R + 1) : t.tx)}</div>
      <div class="mini faint" style="margin-top:3px">${full ? 'Nothing left to teach.' : `${cost}g${S.gold < cost ? ' — you are short' : ''}`}</div>
    </button>`;
  }).join('');
  modal({
    ic:'⬢', h:'Training Hall', wide:true,
    sub:`${h.ic} ${h.nm} · ${S.gold} gold${h.ticks ? ' · ' + plural(h.ticks,'tick') + ' already in hand' : ''}`,
    b:`<p class="muted tiny">${gtx('They will sell you a rank on any track. Someone else in the party trains separately — switch on the character card.')}</p>
       <div class="sep"></div>${rows}`,
    f:[{lb:'Back', cls:'primary', fn:()=>{ closeModal(); back(); }}],

  $$('#scrim [data-buytick]').forEach(b => b.onclick = () => {

}

/* =========================================================================
   DIE FACES
   Drawn as inline SVG rather than emoji, so a face reads as a face: blades
   for attack, shields for defence, a star for a surge.
   ========================================================================= */
const SYM = {
  blade:'M6 0.2 L7.25 2.5 L7.25 6.9 L4.75 6.9 L4.75 2.5 Z M1.4 6.9 H10.6 V8.35 H1.4 Z M5.15 8.35 H6.85 V10.5 H5.15 Z M6 9.9 A1.15 1.15 0 1 1 5.99 9.9 Z',
  shield:'M6 0.4 L11.2 2.5 V6.6 C11.2 9.3 9 11.1 6 11.9 C3 11.1 0.8 9.3 0.8 6.6 V2.5 Z',
  star:'M6 0 L7.5 4.5 L12 6 L7.5 7.5 L6 12 L4.5 7.5 L0 6 L4.5 4.5 Z',
};
const SYMPOS = {
  1:[[20,20]],
  2:[[12.5,20],[27.5,20]],
  3:[[20,12.5],[12,27],[28,27]],
  4:[[12.5,12.5],[27.5,12.5],[12.5,27.5],[27.5,27.5]],
};
function symPath(d, cx, cy, size, fill, op){
  const k = size / 12;
  return `<path d="${d}" transform="translate(${(cx - size/2).toFixed(2)} ${(cy - size/2).toFixed(2)}) scale(${k.toFixed(3)})" fill="${fill}"${op?` opacity="${op}"`:''}/>`;
}
function dieSvg(die){
  const marks = [];
  for(let i=0;i<Math.min(die.a,4);i++) marks.push('blade');
  for(let i=0;i<Math.min(die.d,4);i++) marks.push('shield');
  const shown = marks.slice(0,4);
  const pos = SYMPOS[shown.length] || [];
  const size = shown.length >= 3 ? 12.5 : shown.length === 2 ? 15 : 18;
  let body = '';
  if(!shown.length && !die.s){
    body = `<rect x="14" y="19" width="12" height="2.4" rx="1.2" fill="rgba(148,163,184,.45)"/>`;
  }
  shown.forEach((m, i) => {
    const [cx, cy] = pos[i];
    const fill = m === 'blade' ? '#ff9b99' : '#7fe6b6';
    body += symPath(SYM[m], cx + 0.6, cy + 0.8, size, 'rgba(0,0,0,.45)');   // drop shadow
    body += symPath(SYM[m], cx, cy, size, fill);
  });
  for(let i = 0; i < Math.min(die.s, 2); i++){
    const bx = 32.5 - i * 10;
    body += `<circle cx="${bx}" cy="7.5" r="6.6" fill="rgba(10,16,26,.88)" stroke="rgba(232,180,74,.55)" stroke-width="1"/>`;
    body += symPath(SYM.star, bx, 7.5, 8.6, '#e8b44a');
  }
  return `<svg class="dieface" viewBox="0 0 40 40" aria-hidden="true">${body}</svg>`;
}

/* =========================================================================
   TRAVEL DIE FACES
   Each face shows the actual ground it lets you walk onto, painted from the
   same tile sprites the map uses.
   ========================================================================= */
function paintTravelDice(){
  $$('[data-tface]').forEach(cvs => {
    const f = cvs.dataset.tface;
    const px = 30, dpr = window.devicePixelRatio || 1;
    cvs.width = px * dpr; cvs.height = px * dpr;
    const x = cvs.getContext('2d');
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
    x.clearRect(0, 0, px, px);
    if(f === 'wild'){
      const g = x.createLinearGradient(0, 0, 0, px);
      g.addColorStop(0, '#3b2f5c'); g.addColorStop(1, '#221b38');
      hexOn(x, px/2, px/2, px*0.46); x.fillStyle = g; x.fill();
      x.strokeStyle = 'rgba(167,139,250,.8)'; x.lineWidth = 1.2; x.stroke();
      x.font = '700 15px system-ui, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
      x.fillStyle = '#d6c8ff'; x.fillText('✦', px/2, px/2 + 1);
      return;
    }
    const s = px * 0.46;
    const sprite = tileFor(f, 0, s);
    const tsize = s*2 + 6/(window.devicePixelRatio||1);
    x.drawImage(sprite, px/2 - tsize/2, px/2 - tsize/2, tsize, tsize);
    hexOn(x, px/2, px/2, s);
    x.strokeStyle = 'rgba(0,0,0,.5)'; x.lineWidth = 1.2; x.stroke();
  });
}

/* =========================================================================
   COMBAT FLOURISHES
   ========================================================================= */
/* Effects are queued rather than appended on the spot: strike() re-renders the
   whole combat modal after it resolves, which would wipe anything already in
   the DOM. renderCombat flushes the queue onto the fresh markup. */
function fx(sel, cls, ms){
  (V.fxq = V.fxq || []).push({sel, cls, ms});
  clearTimeout(V.fxTimer);
  V.fxTimer = setTimeout(flushFx, 0);
}
function flushFx(){
  const q = V.fxq || [];
  V.fxq = [];
  for(const {sel, cls, ms} of q){
    const el = $(sel);
    if(!el) continue;
    const d = document.createElement('div');
    d.className = cls;
    el.appendChild(d);
    setTimeout(() => d.remove(), ms);
  }
}
/* the two cards you just committed peel off the hand and fly to the discard */
function dieAvg(k){
  if(DIEAVG[k]) return DIEAVG[k];
  const f = DICE[k].faces;
  return DIEAVG[k] = {
    a: f.reduce((s,x) => s + (x.a||0), 0) / 6,
    d: f.reduce((s,x) => s + (x.d||0), 0) / 6,
    s: f.reduce((s,x) => s + (x.s||0), 0) / 6,
  };
}
function poolAvg(pool){
  return pool.reduce((m, k) => { const v = dieAvg(k); m.a += v.a; m.d += v.d; m.s += v.s; return m; },
                     {a:0, d:0, s:0});
}
function dieFaceHtml(die, cls, idx){
  const blank = !die.a && !die.d && !die.s;
  const title = [die.a ? `${die.a} attack` : '', die.d ? `${die.d} shield${die.d>1?'s':''}` : '',
                 die.s ? `${die.s} surge${die.s>1?'s':''}` : ''].filter(Boolean).join(', ') || 'blank face';
  // whose die this is matters for shields, so say so and mark the front rank's
  const owner = die.hid ? party().find(m => m.id === die.hid) : null;
  const lead = leadHero();
  const back = owner && lead && owner !== lead;
  const who = owner ? ` — ${owner.nm}${back ? ', covering from behind (shields count half)' : ', in the front rank'}` : '';
  return `<div class="cdie ${DICE[die.k].cls} ${die.mark?'rr':''} ${blank?'blank':''} ${die.fresh?'roll':''} ${back?'back':''}"
    ${idx!=null?`data-die="${idx}"`:''} data-dk="${die.k}" title="${DICE[die.k].nm} die — ${title}${who}"
    >${owner && party().length > 1 ? `<span class="downer">${owner.ic}</span>` : ''}${dieSvg(die)}</div>`;
}
function statusChips(o){
  const out = [];
  if(o.burn) out.push(`<span class="status gl" data-g="burn" style="color:#fb923c">🔥 burning ${o.burn}</span>`);
  if(o.poison || o.psn) out.push(`<span class="status gl" data-g="venom" style="color:#a3e635">🧪 venom ${o.poison||o.psn}</span>`);
  if(o.stun) out.push(`<span class="status gl" data-g="stagger" style="color:#e8b44a">💫 staggered</span>`);
  if(o.stunBrace && !o.stun) out.push(`<span class="status gl" data-g="braced" style="color:#8aa0bd">🧱 braced ${o.stunBrace}</span>`);
  if(o.hexed) out.push(`<span class="status gl" data-g="hexed" style="color:#a78bfa">🔯 hexed</span>`);
  if(o.stone) out.push(`<span class="status gl" data-g="stone" style="color:#38bdf8">🪨 stoneskin</span>`);
  if(o.curseNow) out.push(`<span class="status gl" data-g="sap" style="color:#f472b6">🩶 hitting ${o.curseNow} softer</span>`);
  return out.join('');
}
function intentHtml(){
  const C = V.combat, it = C.intent;
  if(!it) return '';
  const bits = [];
  if(it.atk) bits.push(`<b class="gl" data-g="attack" style="color:#ff9b99">⚔ +${it.atk}</b>`);
  if(it.sh) bits.push(`<b class="gl" data-g="shields" style="color:#7fe6b6">🛡 +${it.sh}</b>`);
  if(it.heal) bits.push(`<b style="color:#7fe6b6">✚ heals ${it.heal}</b>`);
  if(it.pierce) bits.push(`<span class="gl" data-g="pierce" style="color:var(--gold)">pierce</span>`);
  if(it.stun) bits.push(`<span class="gl" data-g="knockdown" style="color:var(--gold)">knockdown</span>`);
  if(it.leech) bits.push(`<span class="gl" data-g="leech" style="color:var(--gold)">feeds</span>`);
  if(it.psn) bits.push(`<span class="gl" data-g="venom" style="color:var(--lime)">venom</span>`);
  if(it.burn) bits.push(`<span class="gl" data-g="burn" style="color:var(--orange)">burn</span>`);
  if(it.curse) bits.push(`<span class="gl" data-g="sap" style="color:var(--pink)">saps you</span>`);
  const a = foeArt();
  return `<div class="intent ${V.combat.intentFresh ? 'reveal' : ''}" style="--foe:${a.col}">
    ${intentWatermark()}
    <div class="spread"><div class="tiny muted"><span class="gl" data-g="intent">Its intent this round</span></div>
      <span class="initb gl" data-g="initiative">${it.init}</span></div>
    <div class="inm">${esc(it.nm)}</div>
    <div class="row wr tiny" style="gap:9px;margin-top:3px">${bits.join('')}</div>
  </div>`;
}
function renderCombat(){
  const C = V.combat;
  if(!C || C.paid) return;
  const d = D();
  const h = S.hero;
  const cards = C.phase === 'acts';      // "cards" kept as the name for the choosing phase
  const it = C.intent || {};

  // previewed numbers (dice phase only)
  const mb = C.mb || blankBuff();
  const mine = cards ? 0 : myAttack();
  const fsh = (C.pend.pierce || mb.pierce) ? 0 : foeShields();
  const toFoe = cards ? 0 : Math.max(0, mine - fsh - (mb.noArm ? 0 : Math.max(0, (C.foe.arm||0) - mb.armCut)));
  const fatk = cards ? 0 : foeAttackVal();
  const msh = (C.foe.crush || it.pierce) ? 0 : myShields();
  const toMe = cards ? 0 : Math.max(0, fatk - msh - leadArmor() - myWard());
  const surges = cards ? 0 : mySurges();
  const usables = S.bag.map(id => ITEM(id)).filter(i => i && i.slot === 'use');
  const meFirst = mb.first ? true : (C.myInit || 99) <= (it.init || 99);

  const body = `
    <div class="duel">
      <div class="fighter me" id="meCard">
        <div class="nm">${party().length > 1 ? '⚔️ The party' : h.ic + ' ' + esc(h.nm)}</div>
        <div class="proster">${party().map((m, i) => {
          const md = D(m), down = isDown(m), isLead = leadHero() === m;
          const chosen = C.acts[m.id] ? actFor(m, C.acts[m.id]) : null;
          const ready = down || !!chosen;
          return `<div class="pmem ${down?'down':''} ${chosen?'viewing':''} ${isLead?'lead':''}">
            <div class="row" style="gap:6px">
              <span style="font-size:15px">${m.ic}</span>
              <b class="tiny" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(m.nm.split(' ')[0])}</b>
              ${isLead ? '<span class="frontpip" title="In the front rank — takes the hits">&#9700;</span>' : ''}
              ${cards && !down ? `<span class="tiny ${ready?'':'faint'}" style="color:${ready?'var(--green)':''}">${chosen ? chosen.ic : '—'}</span>` : ''}
            </div>
            <div class="hpbar" style="height:7px;margin:4px 0 2px"><i style="width:${clamp(m.hp/md.maxHp*100,0,100)}%"></i></div>
            <div class="mini faint">${down ? 'down' : m.hp + '/' + md.maxHp}</div>
          </div>`;
        }).join('')}</div>
        <div>${statusChips(C.me)}</div>
        ${cards ? `<div class="tiny muted" style="margin-top:8px">
            <span class="gl" data-g="front">Front rank</span>: <b style="color:var(--ink)">${esc((leadHero()||h).nm)}</b> &mdash; its blows land on them, and only their guard stops it whole.
            <button class="btn sm ghost" id="cLead" style="margin-left:6px">Swap front</button></div>`
          : `<div class="tray" style="margin-top:9px">${C.myDice.length ? C.myDice.map((x,i)=>dieFaceHtml(x,'',i)).join('') : '<span class="tiny faint">No dice &mdash; the round went on recovering.</span>'}</div>
            <div class="tot">
              <span class="gl" data-g="attack">&#9876; Attack <b>${mine}</b></span>
              <span class="gl" data-g="shields">&#128737; Shields <b>${msh + leadArmor() + myWard()}</b></span>
              <span class="gl" data-g="surge" style="color:var(--gold)">&#10022; Surges <b>${surges}</b></span>
              <span class="${meFirst?'':'faint'}" style="color:${meFirst?'var(--green)':''}">${meFirst ? 'you swing first' : 'it swings first'}</span>
            </div>`}
      </div>
      <div class="fighter foe" id="foeCard" style="--foe:${foeArt().col}">
        ${foeWatermark()}
        <div class="nm">${C.foe.ic} ${esc(C.foe.nm)} <span class="pill t${clamp(C.foe.tier,1,4)}" style="margin-left:auto">T${C.foe.tier}</span></div>
        <div class="hpbar"><i style="width:${clamp(C.foe.hp/C.foe.maxHp*100,0,100)}%"></i></div>
        <div class="spread tiny"><span class="muted">${Math.max(0,C.foe.hp)} / ${C.foe.maxHp} HP</span><span class="muted">Armor ${C.foe.arm}</span></div>
        <div>${statusChips(C.foe)}</div>
        ${C.foe.trait && TRAITS[C.foe.trait] ? `<div class="traitbar" style="--tc:${TRAITS[C.foe.trait].col}">
          <div class="row" style="gap:6px"><span>${TRAITS[C.foe.trait].ic}</span>
            <b>${esc(TRAITS[C.foe.trait].nm)}</b>
            ${C.foe.trait === 'phasing' ? `<span class="pill" style="margin-left:auto">${C.round % 2 === 1 ? 'phased now' : 'solid this round'}</span>` : ''}</div>
          <div class="tiny" style="margin-top:3px">${TRAITS[C.foe.trait].tx}</div>
          <div class="mini" style="margin-top:4px;color:var(--tc)">${esc(TRAITS[C.foe.trait].hint)}</div>
        </div>` : ''}
        ${intentHtml()}
        ${cards ? '' : `<div class="tray" style="margin-top:9px">${C.foeDice.map(x=>dieFaceHtml(x)).join('')}</div>
          <div class="tot">
            <span class="gl" data-g="attack">⚔ Attack <b>${fatk}</b></span>
            <span class="gl" data-g="shields">🛡 Shields <b>${foeShields() + C.foe.arm}</b></span>
          </div>`}
      </div>
    </div>

    ${cards ? `
      <div class="card" style="margin-top:11px">
        <div class="spread">
          <div class="tiny"><b>${gtx('One action each, off your own card.')}</b>
            <span class="muted">${gtx('The lowest initiative anybody plays is the party\'s, and lower swings first.')}</span></div>
          <span class="sb gl" data-g="initiative">Initiative <b>${(function(){
            let lo = 99; conscious().forEach(m => { const f = C.acts[m.id] && actFor(m, C.acts[m.id]); if(f) lo = Math.min(lo, f.init); });
            return lo === 99 ? '—' : lo; })()}</b> vs <b>${it.init}</b></span>
        </div>
      </div>
      <div class="actgrid">
        ${conscious().map(m => {
          const chosen = C.acts[m.id];
          return `<div class="actcol">
            <div class="acthd"><span>${m.ic}</span><b class="tiny">${esc(m.nm)}</b>
              <span class="mini faint" style="margin-left:auto">&#9889;${m.en}/${D(m).maxEn}</span></div>
            ${ACTIONS.map(A => {
              const f = actFor(m, A.id);
              if(!f) return '';
              const on = chosen === A.id;
              const ok = canTake(m, A.id);
              return `<button class="acttile ${on?'on':''} ${ok?'':'no'}" data-act="${m.id}:${A.id}" ${ok?'':'disabled'}>
                <div class="row" style="gap:6px">
                  <span class="aticon">${f.ic}</span>
                  <b class="tiny" style="flex:1;min-width:0">${esc(f.nm)}</b>
                  ${f.cost ? `<span class="mini" style="color:var(--gold)">&#9889;${f.cost}</span>` : ''}
                  <span class="initb sm">${f.init}</span>
                </div>
                <div class="mini muted attx">${f.locked ? 'Locked — one tick opens it.' : gtx(f.tx)}</div>
                ${A.track ? `<div class="pips tiny">${Array.from({length:MAXRANK},(_,k)=>
                    `<i class="pip ${k < rankOf(m, A.track) ? 'on':''}"></i>`).join('')}</div>` : ''}
              </button>`;
            }).join('')}
          </div>`;
        }).join('')}
      </div>
    ` : `
      ${C.shown && C.shown.length ? `<div class="played">
        ${C.shown.map(x => `<div class="pl"><span class="lbl">${x.who.ic} ${esc(x.who.nm.split(' ')[0])}</span>
          <b>${x.ic} ${esc(x.nm)}</b>${x.cost ? ` <span class="mini" style="color:var(--gold)">&#9889;${x.cost}</span>` : ''}

      </div>` : ''}
      <div class="card" style="margin-top:11px">
        <div class="spread">
          <div class="tiny"><b style="color:var(--green)">You deal ${toFoe}</b> · <b style="color:#ff9b99">you take ${toMe}</b></div>
          <div class="row">
            <span class="tiny muted">Rerolls ${C.rrLeft}</span>
            <button class="btn sm ${C.myDice.some(x=>x.mark) ? 'primary' : ''}" id="cRR" ${C.rrLeft <= 0 || !C.myDice.some(x=>x.mark) ? 'disabled' : ''}>🎲 Reroll ${C.myDice.filter(x=>x.mark).length || 'marked'}</button>
          </div>
        </div>
        <div class="mini faint" style="margin-top:4px">${gtx('Click your own dice to mark them (dashed outline), then hit Reroll. Spend surges, then strike.')}</div>
      </div>

      ${surges > 0 ? `<div style="margin-top:10px">
        <div class="tiny muted" style="margin-bottom:5px">Spend surges (${surges} available)</div>
        ${surgeOptions().map(s => {
          const so = SURGES[s];
          const can = surges >= so.cost;
          return `<div class="surge-opt ${can?'can':''}" ${can?`data-surge="${s}"`:''} style="${can?'cursor:pointer':'opacity:.4'}">
            <div><b>${gtx(so.nm)}</b> <span class="muted">${gtx(so.tx)}</span></div>
            <div style="color:var(--gold);font-weight:700">${'✦'.repeat(so.cost)}</div></div>`;
        }).join('')}
      </div>` : ''}

      ${(function(){
        if(!usables.length) return '';
        const who = canUseItemNow();
        return `<div style="margin-top:10px">
          <div class="tiny muted" style="margin-bottom:5px">Pack &mdash; ${who
            ? `${who.ic} ${esc(who.nm)} defended, so they may use one thing`
            : 'nobody defended this round, so the pack stays shut'}</div>
          <div class="row wr">${usables.map(i => `<button class="btn sm" data-uitem="${i.id}" ${who?'':'disabled'}>${i.ic} ${esc(i.nm)}</button>`).join('')}</div>
        </div>`;
      })()}
    `}

    <div class="log" style="height:${cards ? 78 : 96}px;margin-top:11px">${C.hist.slice(-16).map(l => {
      const m = /^§(\w+)§/.exec(l); const cls = m?m[1]:''; const t = m?l.slice(m[0].length):l;
      return `<div class="${cls}">${esc(t)}</div>`;
    }).join('')}</div>`;

  modal({
    ic: C.foe.ic, h: C.foe.nm, wide:true, noClose:true,
    sub:`Round ${C.round}${C.opts.boss ? ' · no retreat' : ''}${C.foe.trait && TRAITS[C.foe.trait] ? ' · ' + TRAITS[C.foe.trait].ic + ' ' + esc(TRAITS[C.foe.trait].nm) : ''}${MSPEC[C.foe.spec] ? ' · ' + gtx(MSPEC[C.foe.spec].nm + ': ' + MSPEC[C.foe.spec].tx) : ''}`,
    b: body,
    f: cards
      ? [ {lb:'📖 Terms', cls:'ghost', fn:()=>openGlossary(renderCombat)},
          ...(C.opts.boss ? [] : [{lb:'🏃 Break away', cls:'ghost', fn:tryFlee}]),
          {lb: pendingHeroes().length ? `▶️ ${pendingHeroes().length} still to choose` : '▶️ Commit',
           cls:'primary', fn:commitActions, dis: pendingHeroes().length > 0} ]
      : [ {lb:'📖 Terms', cls:'ghost', fn:()=>openGlossary(renderCombat)},
          ...(C.opts.boss ? [] : [{lb:'🏃 Break away', cls:'ghost', fn:tryFlee}]),
          {lb:'⚔️ Strike', cls:'primary', fn:strike, dis: C.phase !== 'dice' || C.done} ],
  });

  $$('#scrim [data-act]').forEach(el => el.onclick = () => {
    const [hid, aid] = el.dataset.act.split(':');
    pickAction(hid, aid);
  });
  const lb = $('#cLead');
  if(lb) lb.onclick = () => {
    const up = party().map((m,i)=>i).filter(i => !isDown(party()[i]));
    if(up.length < 2) return;
    S.lead = up[(up.indexOf(S.lead) + 1) % up.length];
    cLog(`${party()[S.lead].nm} takes the front rank.`, 'y');
    renderCombat();
  };
  const rrBtn = $('#cRR'); if(rrBtn) rrBtn.onclick = doReroll;
  $$('#scrim [data-die]').forEach(el => el.onclick = () => {
    const i = +el.dataset.die;
    const marked = C.myDice.filter(x=>x.mark).length;
    if(!C.myDice[i].mark && marked >= C.rrLeft){ flash('No rerolls left for that many.'); return; }
    C.myDice[i].mark = !C.myDice[i].mark;
    renderCombat();
  });
  $$('#scrim [data-surge]').forEach(el => el.onclick = () => spendSurge(el.dataset.surge));
  $$('#scrim [data-uitem]').forEach(el => el.onclick = () => useItem(el.dataset.uitem, true));
  C.myDice.forEach(x => x.fresh = false);
  C.intentFresh = false;
  flushFx();
}

function makeCamp(){
  party().forEach(h => {
    const hd = D(h);

    h.en = clamp(h.en + hd.enRegen, 0, hd.maxEn);

  log('You make camp and keep the fire small.');
  endDay();

function openCodex(){
  modal({ic:'📖', h:'How Hexbound Works', wide:true, b:`
    <div class="grid2">
      <div>
        <div class="card"><h3>The day</h3><div class="tiny muted">
          Each dawn you roll travel dice. Spend one whose face matches the ground you are moving onto: 🌾 plains, 🌲 forest, ⛰️ hills, 🏔️ mountain, 🪱 marsh. A ✦ wild face goes anywhere. Roads take any face. Mountains cost two dice. Marsh ends your travel when you enter it. Water needs a boat.
          <br><br>Out of dice, or done for the day? End the day. Dread rises by 1.</div></div>
        <div class="card" style="margin-top:10px"><h3>Exploring</h3><div class="tiny muted">
          Every hex holds something the first time: a fight, an event with real choices, a settlement, a landmark, or quiet ground. Landmarks are one-shot and worth going out of your way for.</div></div>
        <div class="card" style="margin-top:10px"><h3>Skill tests</h3><div class="tiny muted">
          Roll 2d6, add the stat, beat the number. You may spend energy to push, +1 each, up to 3. Double sixes always succeed.</div></div>
      </div>
      <div>
        <div class="card"><h3>Combat</h3><div class="tiny muted">
          Every round the enemy <b style="color:var(--ink)">reveals its intent first</b>. Then <b style="color:var(--ink)">every hero still standing picks one action</b> off the four printed on their own card: <b style="color:var(--ink)">Attack</b>, <b style="color:var(--ink)">Defend &amp; Use Item</b>, their <b style="color:var(--ink)">First Mastery</b> or their <b style="color:var(--ink)">Second Mastery</b>. The rank on that track is what the action is worth. The round commits once nobody is still choosing.
          <br><br>Only the heroes whose action puts them in the swing <b style="color:var(--ink)">roll dice</b>. Three heroes all attacking is a big pool and no guard; two attacking while one defends is the usual shape of it. A round where everybody guards deals nothing at all, and sometimes that is correct.
          <br><br>The <b style="color:var(--ink)">lowest initiative anybody played</b> is the party's, and the lower number swings first — kill it before it acts and it never acts. Defend is fast, a Second Mastery is slow, and every rank of Navigate takes a point off whatever you picked.
          <br><br>Then the dice roll as the <b style="color:var(--ink)">modifier</b> on top. Faces show ⚔ attack, 🛡 shields, ✦ surges. Mark dice and reroll them, spend surges, then strike.
          <br><br>Damage dealt = ranks + dice + gear − their shields − their armor.</div></div>
        <div class="card" style="margin-top:10px"><h3>Somebody has to stand in front</h3><div class="tiny muted">
          The party attacks as one, but it does not take damage as one. Everything that comes back lands on the hero in the <b style="color:var(--ink)">front rank</b>, and only <b style="color:var(--ink)">their</b> armor and warding reduce it.
          <br><br>Shields work the same way. The front rank's own guard — their Defend and their own dice — stops the blow in full; anyone else defending is covering from behind and theirs counts <b style="color:var(--ink)">half</b>. So the hero about to be hit is usually the one who should be defending, and the swap button is a real decision.
          <br><br>A hero at 0 HP is <b style="color:var(--ink)">down</b>, not dead: they play nothing and the next hero steps up. The run ends only when the last one falls. Camping, an inn or the surgeon puts them back on their feet.</div></div>
        <div class="card" style="margin-top:10px"><h3>Not every fight is a damage race</h3><div class="tiny muted">
          Many things out here carry a <b style="color:var(--ink)">trait</b>, stated on its card when you meet it, and a bigger attack will not answer it. Something Warded ignores your dice entirely and only feels the attack printed on your card. A Swarm does not care about totals at all, only how many of your dice showed anything. Regrowth heals 8 a round unless it is burning. An Entrenched thing sits behind Armor 8 until you stagger it open. A Feeder eats the surges you did not spend. Brittle things take double whenever you swing first.
          <br><br>Which is the point of burning, staggering, spending surges, going first and carrying odd dice at all. Read the trait before you plan the round.</div></div>
        <div class="card" style="margin-top:10px"><h3>Energy is the thing you run out of</h3><div class="tiny muted">
          A First Mastery is free and you may take it every round. A <b style="color:var(--ink)">Second Mastery costs Energy</b>, and Energy only comes back at dawn, in camp, or out of a bottle. So the real question in a long day is how many big moves you can still afford, not how many rounds you can last.
          <br><br>The pack is shut mid-fight unless somebody takes <b style="color:var(--ink)">Defend &amp; Use Item</b>, and then it is one thing for that hero. A potion is a decision about the round, not a free extra.</div></div>
        <div class="card" style="margin-top:10px"><h3>The rank board</h3><div class="tiny muted">
          Every hero's card carries <b style="color:var(--ink)">nine tracks</b> — Attack, Guard, their two Masteries, Health, Energy, Navigate, Explore and Survival — and each holds eight ranks. A <b style="color:var(--ink)">tick</b> buys a rank, and a tick is the only progression currency there is. Gear stacks on top of whatever the board gives you.
          <br><br>Ticks come from three places. A level hands you a <b style="color:var(--ink)">level card</b>: some give a tick to place wherever you like, and some give you two or three for letting the card choose the track. Breaking a lair or bringing in a bounty draws a <b style="color:var(--ink)">reward card</b> — gold, salvage, a relic, or ticks for the whole party. And any town of decent size has a <b style="color:var(--ink)">training hall</b> that will simply sell you one, dearer every rank.</div></div>
        <div class="card" style="margin-top:10px"><h3>Masteries</h3><div class="tiny muted">
          Two of a hero's four actions are theirs alone. The <b style="color:var(--ink)">First Mastery</b> is free and you may take it every round; ranks make it stronger. The <b style="color:var(--ink)">Second Mastery</b> starts <b style="color:var(--ink)">locked</b> — one tick opens it — costs Energy, and is the biggest thing that hero can do. At rank 4 it costs one less.
          <br><br>Some masteries put their hero in the swing and some do not, and that is the real texture of a round: the Runecarver's Second Reading hands the whole party rerolls, the Priest's Dawnsong heals and returns energy, the Reaver's Slip Behind cuts straight through armor. Read all four before you pick.</div></div>
        <div class="card" style="margin-top:10px"><h3>Levelling</h3><div class="tiny muted">
          XP is shared: everyone gains it, so the party levels together, to 10. Every level hands that hero the next reward printed on <b style="color:var(--ink)">their own</b> level track, plus a level card to draw. Odd levels give a draft of three talents; even levels give a spare tick. Nothing is random about the printed track — it is the same every run, so you can plan around it. The level cards are the part that is not.
          <br><br>Gold and the pack belong to the party. Gear does not: each hero wears their own, so check the character card before you equip.</div></div>
        <div class="card" style="margin-top:10px"><h3>Winning</h3><div class="tiny muted">
          Three lairs. Break each one for a seal, and dread falls by 4. With all three, the Obsidian Gate opens and you can finish the Sable Crown on your terms. Let dread hit ${(S&&S.dreadMax)||30} and it finishes you on its.</div></div>
      </div>
    </div>`,
    f:[{lb:'🔤 Every term explained', fn:()=>{ closeModal(); openGlossary(); }},
       {lb:'Back', cls:'primary', fn:()=>{closeModal(); if(S) render(); else renderTitle();}}]});
}

function wireCanvas(){
  let down = null, moved = false;
  const pos = e => ({x: (e.touches ? e.touches[0].clientX : e.clientX), y: (e.touches ? e.touches[0].clientY : e.clientY)});
  const start = e => { if(modalOpen()) return; const p = pos(e); down = {x:p.x, y:p.y, cx:V.cam.x, cy:V.cam.y}; moved = false; cv.classList.add('drag'); };
  const move = e => {
    const p = pos(e);
    if(down){
      const dx = p.x - down.x, dy = p.y - down.y;
      if(Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
      V.cam.x = down.cx - dx; V.cam.y = down.cy - dy;
      drawMap();
    } else if(!e.touches){
      if(modalOpen()){ if(V.hover){ V.hover = null; drawMap(); } hideTip('map'); return; }
      const h = canvasHex(e);
      const k = key(h.q,h.r);
      if(S.map[k]){ if(!V.hover || V.hover.q !== h.q || V.hover.r !== h.r){ V.hover = h; drawMap(); showHexTip(e, S.map[k]); } }
      else if(V.hover){ V.hover = null; drawMap(); hideTip('map'); }
    }
  };
  const end = e => {
    cv.classList.remove('drag');
    if(down && !moved){
      const ev = e.changedTouches ? {clientX:e.changedTouches[0].clientX, clientY:e.changedTouches[0].clientY} : e;
      V.lastClick = {x: ev.clientX, y: ev.clientY};
      const h = canvasHex(ev);
      onHexClick(h);
    }
    down = null;
  };
  cv.addEventListener('mousedown', start);
  window.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  cv.addEventListener('mouseleave', () => { V.hover = null; hideTip('map'); drawMap(); });
  cv.addEventListener('touchstart', start, {passive:true});
  cv.addEventListener('touchmove', move, {passive:true});
  cv.addEventListener('touchend', end);
  cv.addEventListener('wheel', e => { e.preventDefault(); V.zoom = clamp(V.zoom * (e.deltaY > 0 ? 0.92 : 1.08), 0.55, 1.9); drawMap(); }, {passive:false});
  $('#zIn').onclick = () => { V.zoom = clamp(V.zoom * 1.15, 0.55, 1.9); centreOnHero(); drawMap(); };
  $('#zOut').onclick = () => { V.zoom = clamp(V.zoom / 1.15, 0.55, 1.9); centreOnHero(); drawMap(); };
  $('#zHome').onclick = () => { centreOnHero(); drawMap(); };
  window.addEventListener('resize', () => { sizeCanvas(); centreOnHero(); drawMap(); });
}
function onHexClick(h){
  const k = key(h.q,h.r);
  const m = S.map[k];
  if(!m) return;
  if(h.q === S.pos.q && h.r === S.pos.r){ exploreHere(); return; }
  if(hexDist(h, S.pos) === 1){ tryMove(h.q, h.r); return; }
  V.sel = h; drawMap();
  if(m.revealed) pinHexTip(m, (V.lastClick||{}).x || innerWidth/2, (V.lastClick||{}).y || 200);
  else flash('Unmapped country. Get closer.');
}
function hexTipHtml(m){
  const F = m.feat && FEATS[m.feat];
  const T = TERRA[m.t];
  const di = diceForMove(m);
  const dist = hexDist(m, S.pos);
  const adj = dist === 1, here = dist === 0;
  const title = F ? F.ic + ' ' + (m.feat === 'city' ? 'Kestrel Hold' : F.nm) : T.ic + ' ' + T.nm;

  let cost;
  if(m.t === 'water') cost = 'Water. Impassable without a Skin Coracle.';
  else if(m.t === 'mountain') cost = 'Mountain: <b>two</b> travel dice, one of them showing a mountain or a wild face.';
  else if(m.t === 'marsh') cost = 'Marsh: one marsh die, and entering it <b>ends your travel for the day</b>.';
  else cost = `One travel die showing ${T.nm.toLowerCase()}, or a wild face.`;
  if(m.road) cost += ' It sits on a road, so any face will do coming from another road hex.';

  let what;
  if(F && F.kind === 'town') what = F.tx + ' Market, inn, bounty board, and a free rumour marking your nearest lair.';
  else if(F && F.kind === 'lair') what = m.cleared ? 'Broken already. The seal is yours.' : F.tx + ' Breaking it is worth a seal, a relic, and 4 off the dread track.';
  else if(F && F.kind === 'gate') what = S.seals >= 3 ? 'Open. The Sable Crown is through there.' : F.tx + ` Sealed until you hold all three seals, and you have ${S.seals}.`;
  else if(F && F.kind === 'site') what = m.used ? F.tx + ' Already picked over.' : F.tx + ' A landmark fires once, and is usually worth the detour.';
  else if(!m.explored) what = 'Unsearched. Every hex gives up something the first time: a fight, an event with real choices, or quiet ground.';
  else what = 'Searched already. Nothing left here worth the daylight.';

  return `<b class="tt">${title}</b>
    <div class="tiny muted" style="margin-bottom:4px">Tier ${m.tier}${m.road ? ' &middot; road' : ''}${m.explored ? ' &middot; explored' : ''} &middot; ${here ? 'you are here' : plural(dist,'hex') + ' off'}</div>
    <div class="tiny">${what}</div>
    ${m.threat ? '<div class="tiny" style="color:#ff9b99;margin-top:4px">Something is hunting here. Walking on gets you ambushed.</div>' : ''}
    ${here ? '' : `<div class="tiny" style="margin-top:5px;color:${adj ? (di ? 'var(--green)' : 'var(--red)') : 'var(--ink-dim)'}">
      ${adj ? (di ? (di.length ? `You can reach it: costs ${plural(di.length,'travel die')}.` : 'Free along the road.') : 'No die of yours fits. ' + cost) : cost}</div>`}
    <div class="tiny faint" style="margin-top:4px">Tier ${m.tier}: encounters here draw from rank ${m.tier} of the deck, and dread pushes every tier upward.</div>`;
}
function placeTip(t, x, y){
  t.style.left = Math.min(innerWidth - 296, Math.max(8, x)) + 'px';
  const below = y + 16;
  t.style.top = (below + t.offsetHeight > innerHeight - 8 ? Math.max(8, y - t.offsetHeight - 12) : below) + 'px';
}
function showHexTip(e, m){
  if(!m.revealed || modalOpen()) return;
  const t = $('#tip');
  t.innerHTML = hexTipHtml(m);
  t.classList.add('on');
  V.tipOwner = 'map';
  placeTip(t, e.clientX + 14, e.clientY);
}
/* tapping a hex out of reach pins the same card for a few seconds, so this
   works on a phone, where there is no hover at all */
function pinHexTip(m, x, y){
  if(!m || !m.revealed) return;
  const t = $('#tip');
  t.innerHTML = hexTipHtml(m);
  t.classList.add('on');
  V.tipOwner = 'map';
  placeTip(t, x - 140, y);
  clearTimeout(V.tipTimer);
  V.tipTimer = setTimeout(() => hideTip('map'), 5200);
}

/* =========================================================================
   BOOT
   ========================================================================= */
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ const sc = $('#scrim'); if(!sc.classList.contains('hidden') && sc.querySelector('#mClose')) sc.querySelector('#mClose').click(); return; }
  if(V.screen !== 'game' || !S) return;
  if(!$('#scrim').classList.contains('hidden')) return;
  const k = e.key.toLowerCase();
  if(k === 'e') exploreHere();
  if(k === 'c') openCard();
  if(k === 'i') openInventory();
  if(k === 'n') endDay();
  if(k === '?') openCodex();
});
buildGloss();
wireGlossary();
V.pickHero = HEROES[0].id;
renderTitle();
</script>
