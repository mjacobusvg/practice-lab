<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Hexbound</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b11; --panel:#101826; --card:#16202f; --card-hi:#1e2b3e;
  --ink:#e8eef6; --ink-dim:#94a3b8; --ink-faint:#64748b;
  --line:rgba(255,255,255,0.08); --line-hi:rgba(255,255,255,0.20);
  --gold:#e8b44a; --red:#ef5350; --blue:#5aa9f5; --green:#3ddc97;
  --violet:#a78bfa; --lime:#a3e635; --orange:#fb923c; --pink:#f472b6; --cyan:#38bdf8;
  --r:10px; --r-lg:16px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 760px at 50% -12%, #16202f 0%, transparent 62%),
    radial-gradient(760px 520px at 88% 112%, #1c1730 0%, transparent 60%),
    var(--bg);
  color:var(--ink);
  font-family:'DM Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  font-size:15px; line-height:1.45;
  overflow-x:hidden;
}
h1,h2,h3,.serif{font-family:'DM Serif Display',Georgia,serif;font-weight:400;letter-spacing:.2px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.hidden{display:none !important}
.wrap{max-width:1180px;margin:0 auto;padding:14px 14px 40px}

/* ---------- generic ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:9px 16px;border-radius:var(--r);border:1px solid var(--line-hi);
  background:linear-gradient(180deg,#22304a,#172134);
  font-weight:600;font-size:14px;letter-spacing:.3px;
  transition:transform .12s ease, box-shadow .12s ease, background .12s ease, border-color .12s;
}
.btn:hover:not(:disabled){background:linear-gradient(180deg,#2b3b5b,#1c2841);transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(0)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.primary{background:linear-gradient(180deg,#e8b44a,#c08a16);color:#1a1205;border-color:#f2cd77}
.btn.primary:hover:not(:disabled){background:linear-gradient(180deg,#f6c760,#d0971a)}
.btn.good{background:linear-gradient(180deg,#2c7a5a,#1d5741);border-color:#3ddc97;color:#defff1}
.btn.danger{border-color:rgba(239,83,80,.55);color:#ffb3b1;background:linear-gradient(180deg,#3a1f22,#26151a)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.wide{width:100%}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.muted{color:var(--ink-dim)} .faint{color:var(--ink-faint)}
.tiny{font-size:12px} .mini{font-size:11.5px}
.center{text-align:center}
.row{display:flex;gap:10px;align-items:center}
.row.wr{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sep{height:1px;background:var(--line);margin:12px 0}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;border:1px solid var(--line-hi);font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-dim)}
.pill.t1{color:#8fe3b4;border-color:rgba(61,220,151,.45)}
.pill.t2{color:#ffdd8a;border-color:rgba(232,180,74,.45)}
.pill.t3{color:#9ec9ff;border-color:rgba(90,169,245,.45)}
.pill.t4{color:#ffb0ae;border-color:rgba(239,83,80,.5)}
.key{display:inline-block;min-width:20px;padding:1px 5px;border-radius:5px;background:#0c1421;border:1px solid var(--line-hi);font-size:11px;font-weight:700;text-align:center}

/* ---------- top bar ---------- */
#topbar{position:sticky;top:0;z-index:40;backdrop-filter:blur(10px);background:rgba(7,11,17,.85);border-bottom:1px solid var(--line)}
#topbar .inner{max-width:1180px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:'DM Serif Display',serif;font-size:19px;letter-spacing:.5px;flex:none}
.brand .d{color:var(--gold)}
.stat{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--ink-dim);white-space:nowrap}
.stat b{color:var(--ink);font-weight:700}
.bar{height:7px;border-radius:99px;background:#0b1220;border:1px solid var(--line);overflow:hidden;min-width:74px}
.bar i{display:block;height:100%;border-radius:99px;transition:width .35s ease}
.bar.hp i{background:linear-gradient(90deg,#ef5350,#f97066)}
.bar.xp i{background:linear-gradient(90deg,#5aa9f5,#38bdf8)}
.bar.dread i{background:linear-gradient(90deg,#7c3aed,#ef5350)}
.topspacer{margin-left:auto}

/* ---------- layout ---------- */
#game{display:grid;grid-template-columns:minmax(0,1fr) 352px;gap:14px;align-items:start}
@media(max-width:900px){#game{grid-template-columns:1fr}}
.mapwrap{position:relative;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:#060a10}
#map{display:block;width:100%;touch-action:none;cursor:grab}
#map.drag{cursor:grabbing}
.mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:32px;height:32px;border-radius:9px;background:rgba(10,16,26,.86);border:1px solid var(--line-hi);display:grid;place-items:center;font-weight:700;font-size:15px}
.mapctl button:hover{background:rgba(30,43,62,.95);border-color:var(--gold)}
.maplegend{position:absolute;left:10px;bottom:10px;display:flex;gap:7px;flex-wrap:wrap;max-width:70%}
.lg{display:inline-flex;align-items:center;gap:4px;font-size:11px;background:rgba(8,13,21,.8);border:1px solid var(--line);border-radius:7px;padding:2px 7px;color:var(--ink-dim)}

/* ---------- dice tray ---------- */
.tray{display:flex;gap:6px;flex-wrap:wrap;min-height:46px;align-items:center}
.mdie{
  width:44px;height:44px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#16233a,#0e1726);border:1px solid var(--line-hi);flex:none;position:relative;
  font-size:19px;line-height:1;transition:.12s;
}
.mdie.spent{opacity:.28;filter:grayscale(1)}
.mdie.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 6px 18px rgba(232,180,74,.22);transform:translateY(-2px)}
.mdie.wild{background:linear-gradient(180deg,#3b2f5c,#221b38);border-color:#a78bfa}
.mdie .lb{font-size:8.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-faint);margin-top:3px}
@keyframes tumble{0%{transform:rotate(-24deg) scale(.6);opacity:0}60%{transform:rotate(9deg) scale(1.08);opacity:1}100%{transform:none}}
.mdie.roll{animation:tumble .34s cubic-bezier(.2,1.2,.4,1) both}

/* ---------- combat dice ---------- */
.cdie{
  width:52px;height:52px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  border:1px solid var(--line-hi);background:linear-gradient(180deg,#1a2436,#111a28);flex:none;position:relative;cursor:pointer;transition:.12s;
}
.cdie.base{border-color:rgba(148,163,184,.5)}
.cdie.steel{border-color:rgba(90,169,245,.6);background:linear-gradient(180deg,#16283f,#0f1c2d)}
.cdie.guard{border-color:rgba(61,220,151,.55);background:linear-gradient(180deg,#142a25,#0d1c19)}
.cdie.arcane{border-color:rgba(167,139,250,.6);background:linear-gradient(180deg,#241d3c,#161129)}
.cdie.hunt{border-color:rgba(163,230,53,.55);background:linear-gradient(180deg,#222a12,#161c0c)}
.cdie.foe{border-color:rgba(239,83,80,.5);background:linear-gradient(180deg,#2c1a1e,#1c1114);cursor:default}
.cdie.rr{outline:2px dashed var(--gold);outline-offset:2px}
.cdie .fc{display:flex;gap:3px;align-items:center;font-size:13px;font-weight:700}
.cdie .sg{font-size:10px;color:var(--gold);font-weight:700}
.cdie.blank .fc{color:var(--ink-faint);font-weight:400}
.cdie.roll{animation:tumble .3s cubic-bezier(.2,1.2,.4,1) both}

/* ---------- hex info / actions ---------- */
.side{display:flex;flex-direction:column;gap:12px;position:sticky;top:58px}
@media(max-width:900px){.side{position:static}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.card h3{font-size:17px;margin-bottom:2px}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:2px 0}
.kv span:first-child{color:var(--ink-dim)}
.log{background:#0a1018;border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;height:172px;overflow-y:auto;font-size:12.5px;line-height:1.55;scroll-behavior:smooth}
.log div{padding:1px 0;color:var(--ink-dim);border-bottom:1px solid rgba(255,255,255,.03)}
.log div.hl{color:var(--ink)}
.log .g{color:var(--green)} .log .r{color:#ff9b99} .log .y{color:var(--gold)} .log .b{color:var(--blue)} .log .v{color:var(--violet)}

/* ---------- modal ---------- */
#scrim{position:fixed;inset:0;z-index:100;background:rgba(4,7,12,.78);backdrop-filter:blur(5px);display:grid;place-items:center;padding:14px;overflow-y:auto}
#scrim.hidden{display:none}
.modal{width:100%;max-width:660px;background:var(--panel);border:1px solid var(--line-hi);border-radius:18px;box-shadow:0 30px 90px rgba(0,0,0,.65);overflow:hidden;animation:pop .18s ease both;margin:auto}
.modal.wide{max-width:900px}
@keyframes pop{from{transform:translateY(10px) scale(.985);opacity:0}to{transform:none;opacity:1}}
.modal .mh{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,rgba(255,255,255,.035),transparent)}
.modal .mh .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:#0d1521;border:1px solid var(--line-hi);flex:none}
.modal .mh h2{font-size:22px;line-height:1.1}
.modal .mb{padding:16px 18px;max-height:min(66vh,760px);overflow-y:auto}
.modal .mf{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end;background:rgba(0,0,0,.16)}
.choice{display:block;width:100%;text-align:left;padding:11px 13px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin-bottom:8px;transition:.12s}
.choice:hover:not(:disabled){border-color:var(--gold);background:var(--card-hi);transform:translateX(2px)}
.choice:disabled{opacity:.4;cursor:not-allowed}
.choice b{display:block;font-size:14.5px}
.choice .sub{font-size:12.5px;color:var(--ink-dim);margin-top:2px}

/* ---------- combat ---------- */
.duel{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:620px){.duel{grid-template-columns:1fr}}
.fighter{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.fighter.foe{border-color:rgba(239,83,80,.28)}
.fighter .nm{font-family:'DM Serif Display',serif;font-size:19px;display:flex;align-items:center;gap:8px}
.hpbar{height:12px;border-radius:99px;background:#0b1220;border:1px solid var(--line);overflow:hidden;margin:7px 0}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#ef5350,#fb7185);transition:width .4s ease}
.fighter.me .hpbar i{background:linear-gradient(90deg,#3ddc97,#5aa9f5)}
.tot{display:flex;gap:10px;font-size:13px;font-weight:700;margin-top:8px;flex-wrap:wrap}
.tot span{display:inline-flex;align-items:center;gap:4px;background:#0c1421;border:1px solid var(--line);border-radius:8px;padding:3px 9px}
.status{display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--line-hi);background:#0c1421;margin:2px 3px 0 0}
.surge-opt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--card);margin-bottom:6px;font-size:13px}
.surge-opt.can{border-color:rgba(232,180,74,.5)}
.surge-opt.can:hover{background:var(--card-hi)}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.hit{animation:shake .3s ease}
.float{position:fixed;z-index:210;font-weight:800;font-size:22px;pointer-events:none;animation:fl 1s ease-out forwards;text-shadow:0 2px 10px rgba(0,0,0,.8)}
@keyframes fl{0%{opacity:0;transform:translateY(6px) scale(.8)}18%{opacity:1;transform:translateY(-6px) scale(1.1)}100%{opacity:0;transform:translateY(-52px) scale(1)}}

/* ---------- title ---------- */
.title-hero{text-align:center;padding:38px 0 20px}
.title-hero h1{font-size:clamp(42px,10vw,78px);line-height:1;letter-spacing:2px}
.title-hero h1 span{color:var(--gold)}
.title-hero p{color:var(--ink-dim);margin-top:10px}
.hero-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(256px,1fr));gap:11px}
.hero-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:13px;cursor:pointer;transition:.14s}
.hero-card:hover{border-color:var(--line-hi);background:var(--card-hi)}
.hero-card.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 8px 26px rgba(232,180,74,.13)}
.hero-card .hd{display:flex;gap:11px;align-items:center}
.hero-card .av{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:#0d1521;border:1px solid var(--line-hi);flex:none}
.hero-card .nm{font-family:'DM Serif Display',serif;font-size:19px}
.hero-card .desc{font-size:12.5px;color:var(--ink-dim);margin:8px 0 9px;min-height:50px}
.statline{display:flex;gap:6px;flex-wrap:wrap}
.sb{font-size:11px;background:#0c1421;border:1px solid var(--line);border-radius:7px;padding:2px 7px;color:var(--ink-dim)}
.sb b{color:var(--ink)}
.inp{background:#0a1018;border:1px solid var(--line-hi);border-radius:9px;padding:8px 11px;color:var(--ink);font:inherit;font-size:13.5px;width:100%}
.inp:focus{outline:none;border-color:var(--gold)}

/* ---------- items ---------- */
.item{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--card);margin-bottom:7px}
.item .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:17px;background:#0d1521;border:1px solid var(--line-hi);flex:none}
.item .nm{font-weight:700;font-size:13.5px}
.item .tx{font-size:12px;color:var(--ink-dim)}
.item.equipped{border-color:rgba(232,180,74,.45)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.ghexbg{position:absolute;inset:0;pointer-events:none;opacity:.5}
#tip{position:fixed;z-index:300;max-width:288px;pointer-events:none;opacity:0;background:#0b1220;border:1px solid var(--line-hi);border-radius:10px;padding:8px 11px;font-size:12.5px;line-height:1.4;box-shadow:0 12px 34px rgba(0,0,0,.6);transition:opacity .1s}
#tip.on{opacity:1}
#tip{color:var(--ink)}
#tip b.tt{display:block;margin-bottom:3px;font-size:13px;color:var(--gold)}
#tip b{display:inline;color:var(--gold);font-weight:700}
.gl{border-bottom:1px dotted rgba(232,180,74,.55);cursor:help;text-underline-offset:3px}
.gl:hover{border-bottom-color:var(--gold);color:var(--gold)}
button .gl{cursor:inherit}

/* ---------- ability cards ---------- */
.hand{display:flex;flex-wrap:wrap;gap:8px;padding:11px 0 4px}
.hand.draftgrid{justify-content:center}
.acard{
  flex:1 1 168px;max-width:230px;min-width:158px;border:1px solid var(--line);border-radius:12px;overflow:hidden;
  background:linear-gradient(180deg,#182233,#111a28);transition:.13s;display:flex;flex-direction:column;
}
@media(max-width:560px){.acard{flex:1 1 100%;max-width:none}}
.acard.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 8px 24px rgba(232,180,74,.16)}
.acard.pick{cursor:pointer;flex:0 1 238px;max-width:238px}
.acard.pick:hover{border-color:var(--gold);transform:translateY(-2px)}
.acard .ahd{display:flex;align-items:center;gap:7px;padding:7px 9px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.035)}
.acard .aic{font-size:15px}
.acard .anm{font-family:'DM Serif Display',serif;font-size:14.5px;line-height:1.1;flex:1;min-width:0}
.initb{
  display:inline-grid;place-items:center;min-width:26px;height:22px;padding:0 5px;border-radius:7px;
  background:#0a1220;border:1px solid var(--line-hi);font-size:12px;font-weight:800;color:var(--ink-dim);flex:none;
}
.acard .ahalf{
  display:block;width:100%;flex:1;text-align:left;padding:8px 9px;border:none;background:none;
  border-top:1px solid rgba(255,255,255,.04);transition:.12s;
}
button.ahalf{cursor:pointer}
button.ahalf:hover:not(:disabled){background:rgba(255,255,255,.05)}
button.ahalf:disabled{opacity:.3;cursor:not-allowed}
.acard .ahalf.sel{background:rgba(232,180,74,.14);box-shadow:inset 3px 0 0 var(--gold)}
.acard .ahalf .lbl{display:block;font-size:9.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--ink-faint);margin-bottom:2px}
.acard .ahalf.sel .lbl{color:var(--gold)}
.acard .ahalf .atx{font-size:12.5px;line-height:1.35;color:var(--ink)}
.intent{margin-top:9px;padding:8px 10px;border:1px solid rgba(239,83,80,.4);border-radius:10px;background:rgba(239,83,80,.07)}
.intent .inm{font-family:'DM Serif Display',serif;font-size:17px;line-height:1.15;margin-top:1px}
.played{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}
.played .pl{flex:1;min-width:210px;font-size:12.5px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
.played .pl .lbl{display:inline-block;font-size:9.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--gold);margin-right:6px}
.deckgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
</style>
</head>
<body>
<div id="topbar" class="hidden"><div class="inner" id="topbar-inner"></div></div>
<div class="wrap" id="app"></div>
<div id="scrim" class="hidden"></div>
<div id="tip"></div>
<script>
/* =========================================================================
   HEXBOUND  —  a solo hex-crawl in the spirit of Runebound + HEXplore It
   Single file, no dependencies. Save lives in localStorage.
   ========================================================================= */
'use strict';
const SAVE_KEY = 'hexbound.run.v1';

/* ---------- tiny helpers ---------- */
const $  = s => document.querySelector(s);
const modalOpen = () => { const sc = document.getElementById('scrim'); return sc && !sc.classList.contains('hidden'); };
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp = (n,a,b) => Math.max(a, Math.min(b, n));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const PLUR = {hex:'hexes', 'travel die':'travel dice', die:'dice'};
const plural = (n,w) => `${n} ${n===1 ? w : (PLUR[w] || w + 's')}`;

/* ---------- seeded rng (mulberry32, state persisted with the run) ---------- */
let RSTATE = 1;
function seedFrom(str){
  let h = 2166136261 >>> 0;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}
function rnd(){
  RSTATE = (RSTATE + 0x6D2B79F5) >>> 0;
  let t = RSTATE;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const ri   = (a,b) => a + Math.floor(rnd() * (b - a + 1));      // inclusive
const pick = arr   => arr[Math.floor(rnd() * arr.length)];
const chance = p   => rnd() < p;
function shuffle(a){ const r = a.slice(); for(let i=r.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }
function pickWeighted(list){ // [{w:..}, ..]
  const tot = list.reduce((s,x)=>s+(x.w||1),0); let n = rnd()*tot;
  for(const x of list){ n -= (x.w||1); if(n<=0) return x; }
  return list[list.length-1];
}
const d6 = () => ri(1,6);
const T = ms => (V && V.fast) ? 0 : ms;   // V.fast collapses animation delays (used by the test harness)

/* =========================================================================
   TERRAIN

const key = (q,r) => q + ',' + r;
const unkey = k => { const [q,r] = k.split(',').map(Number); return {q,r}; };
const DIRS = [[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
const neighbors = (q,r) => DIRS.map(([dq,dr]) => ({q:q+dq, r:r+dr}));
const hexDist = (a,b) => (Math.abs(a.q-b.q) + Math.abs(a.q+a.r-b.q-b.r) + Math.abs(a.r-b.r)) / 2;
const at = (q,r) => S.map[key(q,r)];
const hereHex = () => S.map[key(S.pos.q, S.pos.r)];

function hexRing(center, rad){
  const out = [];
  if(rad === 0) return [{q:center.q, r:center.r}];
  let q = center.q + DIRS[4][0]*rad, r = center.r + DIRS[4][1]*rad;
  for(let i=0;i<6;i++) for(let j=0;j<rad;j++){ out.push({q,r}); q += DIRS[i][0]; r += DIRS[i][1]; }
  return out;
}
function hexesWithin(center, rad){
  const out = [];
  for(let i=0;i<=rad;i++) out.push(...hexRing(center, i));
  return out;
}

/* ---------- derived hero numbers ---------- */
function D(){
  const h = S.hero;
  const out = {
    mig:h.stats.mig, agi:h.stats.agi, wit:h.stats.wit, spi:h.stats.spi,
    atk:0, arm:0, hp:0, move:h.move, scout:1, rr:0, dice:h.dice.slice(),
    gold:0, haggle:0, test:0, ward:0, regen:0, zeal:0, en:0, mend:0, roadfree:0, wild:0,
    surge:['dmg','guard'],
  };
  const add = o => {
    if(!o) return;
    for(const k in o){
      if(k === 'dice') out.dice.push(...o.dice);
      else if(k in out) out[k] += o[k];
    }
  };
  for(const slot of ['weapon','offhand','armor','trinket1','trinket2']){
    const it = h.gear[slot] && ITEM(h.gear[slot]);
    if(!it) continue;
    if(it.dice) out.dice.push(...it.dice);
    add(it.bon);
    if(it.surge) out.surge.push(...it.surge);
  }
  for(const t of h.talents) add(TAL(t) && TAL(t).bon);
  for(const p of (h.perks||[])){ if(p.dice) out.dice.push(...p.dice); add(p.bon); if(p.surge) out.surge.push(...p.surge); }
  if(h.id === 'priest') out.mend = 1;
  if(h.id === 'runecarver'){ out.rr += 2; out.test += 0; }
  if(h.id === 'warden') out.ward += 2;
  if(h.id === 'ranger') out.scout += 1;
  if(h.id === 'reaver') out.gold += 50;
  if(out.mend) out.surge.push('mend');
  if(out.mend >= 2) out.mendBig = true;
  out.surge = Array.from(new Set(out.surge));
  out.maxHp = h.baseHp + out.hp + (h.lvl - 1) * 3;
  out.maxEn = 3 + out.spi + out.en;
  out.rrTotal = out.wit + out.rr;
  out.pool = out.dice.concat(Array(Math.max(0, out.mig - 1)).fill('base'));
  return out;
}
function goldMult(){ return 1 + D().gold / 100; }

/* ---------- log ---------- */
function log(msg, cls){
  S.log.push((cls ? '§'+cls+'§' : '') + msg);
  if(S.log.length > 220) S.log = S.log.slice(-160);
  const el = $('#log');
  if(el){ renderLog(); el.scrollTop = el.scrollHeight; }
}
function renderLog(){
  const el = $('#log'); if(!el) return;
  el.innerHTML = S.log.slice(-60).map((l,i,a) => {
    const m = /^§(\w+)§/.exec(l);
    const cls = m ? m[1] : '';
    const txt = m ? l.slice(m[0].length) : l;
    return `<div class="${cls} ${i===a.length-1?'hl':''}">${esc(txt)}</div>`;
  }).join('');
  el.scrollTop = el.scrollHeight;
}

/* ---------- save / load ---------- */
function save(){
  if(!S) return;
  S.rngState = RSTATE;
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    S = JSON.parse(raw);
    RSTATE = S.rngState || 1;
    return true;
  }catch(e){ return false; }
}
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
const hasSave = () => !!localStorage.getItem(SAVE_KEY);

/* =========================================================================
   MAP GENERATION
   ========================================================================= */
const RAD = 5;                       // map radius -> 91 hexes

function genMap(){
  const map = {};
  const all = hexesWithin({q:0,r:0}, RAD);

  // 1. seed terrain with weighted noise, then smooth twice so it forms regions
  for(const h of all){
    const dist = hexDist({q:0,r:0}, h);
    let t = pickWeighted([
      {v:'plains', w: dist < 2 ? 34 : 18},
      {v:'forest', w: 24},
      {v:'hills',  w: 17},
      {v:'mountain', w: dist >= 3 ? 16 : 5},
      {v:'marsh',  w: 12},
      {v:'water',  w: dist >= 2 ? 10 : 3},
    ]).v;
    map[key(h.q,h.r)] = {q:h.q, r:h.r, t, dist, revealed:false, explored:false, feat:null, threat:null, road:false};
  }
  for(let pass=0; pass<2; pass++){
    const snap = {};
    for(const k in map) snap[k] = map[k].t;
    for(const k in map){
      const h = map[k];
      const counts = {};
      for(const n of neighbors(h.q,h.r)){
        const nk = key(n.q,n.r);
        if(snap[nk]) counts[snap[nk]] = (counts[snap[nk]]||0) + 1;
      }
      let best = h.t, bn = 1;
      for(const t in counts) if(counts[t] > bn){ best = t; bn = counts[t]; }
      if(bn >= 3) h.t = best;
    }
  }
  // the home hex is always walkable
  map[key(0,0)].t = 'plains';

  // 2. settlements: city at centre, then towns / waystations spread out
  const taken = new Set([key(0,0)]);
  map[key(0,0)].feat = 'city';
  const spots = shuffle(all.filter(h => {
    const m = map[key(h.q,h.r)];
    return m.t !== 'water' && m.dist >= 2;
  }));
  const placeSpread = (feat, count, minDist, minFromCentre, maxFromCentre, terrainOk) => {
    const placed = [];
    for(const h of spots){
      if(placed.length >= count) break;
      const k = key(h.q,h.r); const m = map[k];
      if(taken.has(k) || m.feat) continue;
      if(m.dist < minFromCentre || m.dist > maxFromCentre) continue;
      if(terrainOk && !terrainOk(m.t)) continue;
      if(placed.some(p => hexDist(p, h) < minDist)) continue;
      m.feat = feat; taken.add(k); placed.push(h);
    }
    return placed;
  };
  const towns = placeSpread('town', 3, 3, 2, 4);
  const ways  = placeSpread('waystation', 3, 2, 2, 5);
  const lairs = placeSpread('lair', 3, 4, 3, 5);
  // the gate: the far hex, as distant as possible from the city
  let gate = null, gbest = -1;
  for(const h of shuffle(all)){
    const m = map[key(h.q,h.r)];
    if(m.feat || m.t === 'water') continue;
    const sc = m.dist * 10 + Math.min(...lairs.map(l => hexDist(l,h)));
    if(sc > gbest){ gbest = sc; gate = m; }
  }
  gate.feat = 'gate'; gate.t = 'mountain';

  // 3. landmarks
  const sites = ['shrine','ruin','barrow','tower','stones','mine','hermit','grove','camp','ruin','barrow','stones','camp','grove'];
  let si = 0;
  for(const h of spots){
    if(si >= sites.length) break;
    const m = map[key(h.q,h.r)];
    if(m.feat) continue;
    if(!chance(0.5)) continue;
    m.feat = sites[si++];
  }

  // 4. roads from the city out to every settlement (straight-ish walks)
  const settle = towns.concat(ways);
  for(const dest of settle){
    let cur = {q:0,r:0};
    let guard = 0;
    while(hexDist(cur, dest) > 0 && guard++ < 30){
      const opts = neighbors(cur.q,cur.r)
        .filter(n => map[key(n.q,n.r)])
        .sort((a,b) => hexDist(a,dest) - hexDist(b,dest));
      const nxt = opts[0]; if(!nxt) break;
      const m = map[key(nxt.q,nxt.r)];
      if(m.t === 'water') m.t = 'plains';           // roads bridge the water
      m.road = true;
      cur = nxt;
    }
  }
  map[key(0,0)].road = true;

  // 5. threat tier per hex, by distance from the city
  for(const k in map){
    const m = map[k];
    m.tier = m.dist <= 1 ? 1 : m.dist <= 2 ? 1 : m.dist <= 3 ? 2 : m.dist <= 4 ? 3 : 3;
    if(m.feat === 'lair') m.tier = 4;
    if(m.feat === 'camp') m.tier = Math.min(4, m.tier + 1);
    if(m.road) m.tier = Math.max(1, m.tier - 1);
  }
  return {map, lairKeys: lairs.map(l => key(l.q,l.r)), gateKey: key(gate.q,gate.r)};
}

/* =========================================================================
   NEW RUN
   ========================================================================= */
function newRun(heroId, seedStr){
  const H = HEROES.find(h => h.id === heroId);
  seedStr = (seedStr || '').trim() || Math.random().toString(36).slice(2, 8).toUpperCase();
  RSTATE = seedFrom(seedStr.toUpperCase());
  const {map, lairKeys, gateKey} = genMap();
  S = {
    v:1, seed: seedStr.toUpperCase(), rngState: RSTATE,
    day:1, dread:0, dreadMax:36, phase:'travel',
    pos:{q:0,r:0}, map, lairKeys, gateKey, seals:0, crownAwake:false,
    dice:[], wildBank:0, movedThisDay:0,
    log:[], flags:{}, shops:{}, bounty:null,
    kills:0, explored:0, deaths:0,
    hero:{
      id:H.id, nm:H.nm, ic:H.ic, lvl:1, xp:0, xpNext:8,
      stats:{...H.stats}, baseHp:H.hp, hp:H.hp, en:3 + H.stats.spi, gold:40,
      dice:H.dice.slice(), move:H.move,
      gear:{weapon:null, offhand:null, armor:null, trinket1:null, trinket2:null},
      bag:['bandage','bandage','tonic','rations'], talents:[], perks:[], fated:true, pts:0, drafts:0,
      deck:[], hand:[], discard:[], lost:[], cardDrafts:0,
    },
  };
  S.hero.deck = (CARDS[H.id] || []).filter(c => c.start).map(c => c.id);
  S.hero.hand = S.hero.deck.slice();
  S.hero.hp = D().maxHp;
  S.hero.en = D().maxEn;
  reveal(S.pos, 1 + D().scout);
  S.map[key(0,0)].explored = true;
  log('You ride out of Kestrel Hold at first light. Seed ' + S.seed + '.', 'y');
  log('Three lairs feed the Sable Crown. Break them, then break it.', 'v');
  log(`You carry ${plural(S.hero.hand.length,'ability card')}. Spend them wisely; a night's sleep returns the lost ones.`, 'b');
  rollMovement(true);
  save();
}

function reveal(centre, rad){
  let n = 0;
  for(const h of hexesWithin(centre, rad)){
    const m = S.map[key(h.q,h.r)];
    if(m && !m.revealed){ m.revealed = true; n++; }
  }
  return n;
}

/* =========================================================================
   CANVAS MAP
   ========================================================================= */
let cv, ctx, DPR = 1;

function hexPx(q, r){
  const s = HX * V.zoom;
  return { x: s * Math.sqrt(3) * (q + r/2), y: s * 1.5 * r };
}
function pxHex(x, y){
  const s = HX * V.zoom;
  const q = (Math.sqrt(3)/3 * x - y/3) / s;
  const r = (2/3 * y) / s;
  // cube round
  let cx = q, cz = r, cy = -cx - cz;
  let rx = Math.round(cx), ry = Math.round(cy), rz = Math.round(cz);
  const dx = Math.abs(rx-cx), dy = Math.abs(ry-cy), dz = Math.abs(rz-cz);
  if(dx > dy && dx > dz) rx = -ry - rz; else if(dy > dz) ry = -rx - rz; else rz = -rx - ry;
  return {q: rx, r: rz};
}
function hexPath(cx, cy, s){
  ctx.beginPath();
  for(let i=0;i<6;i++){
    const a = Math.PI / 180 * (60 * i - 30);
    const x = cx + s * Math.cos(a), y = cy + s * Math.sin(a);
    i ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
  }
  ctx.closePath();
}
function hash2(q,r){ let h = (q*374761393 + r*668265263) ^ 0x5f356495; h = (h ^ (h>>>13)) * 1274126177; return ((h ^ (h>>>16)) >>> 0) / 4294967296; }

function sizeCanvas(){
  if(!cv) return;
  const wrap = cv.parentElement;
  const w = wrap.clientWidth;
  const narrow = w < 640;
  const h = narrow
    ? Math.max(320, Math.min(430, Math.round(window.innerHeight * 0.46)))
    : Math.max(400, Math.min(680, Math.round(window.innerHeight * 0.64)));
  DPR = window.devicePixelRatio || 1;
  cv.width = w * DPR; cv.height = h * DPR;
  cv.style.height = h + 'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
function centreOnHero(){
  const p = hexPx(S.pos.q, S.pos.r);
  V.cam.x = p.x; V.cam.y = p.y;
}

function drawMap(){
  if(!cv || !S) return;
  const W = cv.width / DPR, H = cv.height / DPR;
  ctx.clearRect(0,0,W,H);
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#070c14'); g.addColorStop(1,'#050810');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  const ox = W/2 - V.cam.x, oy = H/2 - V.cam.y;
  const s = HX * V.zoom;
  const moves = legalMoves();
  const moveKeys = {}; moves.forEach(m => moveKeys[m.k] = m);

  // pass 1: tiles
  for(const k in S.map){
    const m = S.map[k];
    const p = hexPx(m.q, m.r);
    const cx = p.x + ox, cy = p.y + oy;
    if(cx < -s*2 || cx > W + s*2 || cy < -s*2 || cy > H + s*2) continue;

    hexPath(cx, cy, s * 0.97);
    if(!m.revealed){
      ctx.fillStyle = '#0a111b'; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.05)'; ctx.lineWidth = 1; ctx.stroke();
      continue;
    }
    const T = TERRA[m.t];
    const n = hash2(m.q, m.r);
    const gg = ctx.createLinearGradient(cx, cy - s, cx, cy + s);
    gg.addColorStop(0, shade(T.col, 0.06 + n*0.12));
    gg.addColorStop(1, shade(T.col2, -0.04 + n*0.06));
    ctx.fillStyle = gg; ctx.fill();
    if(m.explored){ ctx.fillStyle = 'rgba(0,0,0,.26)'; ctx.fill(); }
    ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 1.4; ctx.stroke();

    // road
    if(m.road){
      ctx.strokeStyle = 'rgba(226,205,160,.34)'; ctx.lineWidth = Math.max(2, s*0.13);
      ctx.lineCap = 'round';
      let drew = false;
      for(const nb of neighbors(m.q,m.r)){
        const nm = S.map[key(nb.q,nb.r)];
        if(!nm || !nm.road || !nm.revealed) continue;
        const np = hexPx(nb.q, nb.r);
        ctx.beginPath(); ctx.moveTo(cx, cy);
        ctx.lineTo((cx + np.x + ox)/2, (cy + np.y + oy)/2); ctx.stroke();
        drew = true;
      }
      if(!drew){ ctx.beginPath(); ctx.arc(cx,cy,s*0.1,0,7); ctx.fillStyle='rgba(226,205,160,.3)'; ctx.fill(); }
    }

    // terrain glyph (faint) or feature glyph
    const F = m.feat && FEATS[m.feat];
    if(F){
      if(F.kind === 'lair' && !m.cleared){
        ctx.save();
        ctx.shadowColor = 'rgba(167,139,250,.9)'; ctx.shadowBlur = 16 * V.zoom;
        ctx.fillStyle = 'rgba(167,139,250,.14)'; hexPath(cx,cy,s*0.9); ctx.fill();
        ctx.restore();
      }
      if(F.kind === 'gate' && S.seals >= 3){
        ctx.save();
        ctx.shadowColor = 'rgba(239,83,80,.9)'; ctx.shadowBlur = 20 * V.zoom;
        ctx.fillStyle = 'rgba(239,83,80,.16)'; hexPath(cx,cy,s*0.9); ctx.fill();
        ctx.restore();
      }
      ctx.font = `${Math.round(s*0.86)}px system-ui, sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(m.cleared && F.kind === 'lair' ? '✅' : F.ic, cx, cy + s*0.04);
    } else {
      ctx.globalAlpha = 0.62;
      ctx.font = `${Math.round(s*0.52)}px system-ui, sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(TERRA[m.t].ic, cx, cy + s*0.05);
      ctx.globalAlpha = 1;
    }

    // unexplored marker
    if(!m.explored && m.t !== 'water'){
      ctx.beginPath(); ctx.arc(cx + s*0.52, cy - s*0.5, s*0.13, 0, 7);
      ctx.fillStyle = 'rgba(232,180,74,.85)'; ctx.fill();
    }
    // wandering threat
    if(m.threat){
      ctx.font = `${Math.round(s*0.42)}px system-ui, sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText('⚔️', cx - s*0.5, cy + s*0.6);
    }
  }

  // pass 2: legal-move rings
  for(const k in moveKeys){
    const m = S.map[k]; if(!m) continue;
    const p = hexPx(m.q, m.r); const cx = p.x + ox, cy = p.y + oy;
    ctx.save();
    hexPath(cx, cy, s*0.9);
    ctx.strokeStyle = 'rgba(232,180,74,.9)'; ctx.lineWidth = 2.4;
    ctx.setLineDash([5,4]); ctx.stroke(); ctx.restore();
  }

  // pass 3: hover + selection
  for(const [hx, col, wid] of [[V.hover,'rgba(255,255,255,.55)',2],[V.sel,'#e8b44a',2.6]]){
    if(!hx) continue;
    const m = S.map[key(hx.q,hx.r)]; if(!m) continue;
    const p = hexPx(m.q,m.r);
    hexPath(p.x+ox, p.y+oy, s*0.95);
    ctx.strokeStyle = col; ctx.lineWidth = wid; ctx.setLineDash([]); ctx.stroke();
  }

  // pass 4: hero
  const hp = hexPx(S.pos.q, S.pos.r);
  const hx = hp.x + ox, hy = hp.y + oy;
  ctx.save();
  ctx.shadowColor = 'rgba(232,180,74,.85)'; ctx.shadowBlur = 18;
  ctx.beginPath(); ctx.arc(hx, hy, s*0.42, 0, 7);
  ctx.fillStyle = '#121a28'; ctx.fill();
  ctx.lineWidth = 2.4; ctx.strokeStyle = '#e8b44a'; ctx.stroke();
  ctx.restore();
  ctx.font = `${Math.round(s*0.46)}px system-ui, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(S.hero.ic, hx, hy + s*0.03);
}
function shade(hex, amt){
  const n = parseInt(hex.slice(1), 16);
  let r = (n>>16)&255, g = (n>>8)&255, b = n&255;
  r = clamp(Math.round(r + 255*amt),0,255); g = clamp(Math.round(g + 255*amt),0,255); b = clamp(Math.round(b + 255*amt),0,255);
  return `rgb(${r},${g},${b})`;
}
function canvasHex(ev){
  const rect = cv.getBoundingClientRect();
  const W = rect.width, H = rect.height;
  const x = (ev.clientX - rect.left) - (W/2 - V.cam.x);
  const y = (ev.clientY - rect.top)  - (H/2 - V.cam.y);
  return pxHex(x, y);
}

/* =========================================================================
   MOVEMENT
   ========================================================================= */
function rollMovement(silent){
  const n = D().move;
  S.dice = [];
  for(let i=0;i<n;i++) S.dice.push({f: MDIE[Math.floor(rnd()*6)], spent:false});
  for(let i = 0; i < D().wild && i < S.dice.length; i++) S.dice[i].f = 'wild';
  S.movedThisDay = 0;
  V.rolled = true;
  if(!silent) log(`Dawn of day ${S.day}. You roll ${plural(n,'travel die')}.`, 'b');
}
const freeDice = () => S.dice.filter(d => !d.spent);

function dieMatches(die, m){
  if(die.spent) return false;
  if(die.f === 'wild') return true;
  if(die.f === m.t) return true;
  if(S.hero.id === 'ranger' && (die.f === 'forest' || die.f === 'hills')) return true;
  const cur = hereHex();
  if(m.road && cur.road) return true;             // roads take any face
  return false;
}
function moveCost(m){ return m.t === 'mountain' ? 2 : 1; }

function hasGear(id){ const g = S.hero.gear; return g.weapon===id||g.offhand===id||g.armor===id||g.trinket1===id||g.trinket2===id; }
function diceForMove(m){
  if(!m) return null;
  if(m.t === 'water' && !V.boat) return null;
  const cur = hereHex();
  if(D().roadfree && m.road && cur.road) return [];            // Cartwright
  const idx = [];
  for(let i=0;i<S.dice.length;i++) if(dieMatches(S.dice[i], m)){ idx.push(i); break; }
  if(!idx.length) return null;
  const need = moveCost(m);
  if(need > 1){
    for(let i=0;i<S.dice.length;i++){
      if(idx.length >= need) break;
      if(!S.dice[i].spent && !idx.includes(i)) idx.push(i);
    }
    if(idx.length < need) return null;
  }
  return idx;
}
function legalMoves(){
  if(!S || S.phase !== 'travel') return [];
  const out = [];
  for(const nb of neighbors(S.pos.q, S.pos.r)){
    const k = key(nb.q, nb.r);
    const m = S.map[k];
    if(!m) continue;
    if(V.forceMove){
      if(m.t !== 'water' && freeDice().length >= 2) out.push({k, q:nb.q, r:nb.r, force:true});
      continue;
    }
    const di = diceForMove(m);
    if(di) out.push({k, q:nb.q, r:nb.r, dice:di});
  }
  return out;
}

function tryMove(q, r){
  const mv = legalMoves().find(m => m.q === q && m.r === r);
  const m = S.map[key(q,r)];
  if(!mv){
    if(m && m.t === 'water') flash('No boat, no crossing.');
    else flash('No travel die matches that ground.');
    return;
  }
  if(mv.force){
    let n = 0;
    for(const d of S.dice){ if(!d.spent && n < 2){ d.spent = true; n++; } }
    V.forceMove = false;
    log('You force a path off the known routes, and it costs you.', 'y');
  } else {
    (mv.dice || []).forEach(i => S.dice[i].spent = true);
  }
  S.pos = {q, r};
  S.movedThisDay++;
  V.sel = {q,r};
  const rev = reveal(S.pos, 1 + D().scout);
  if(rev) log(`You take in ${plural(rev,'new hex')} of country.`);
  if(m.t === 'water'){ V.boat = false; log('You paddle across and pull the coracle up the far bank.', 'b'); }
  if(m.t === 'marsh' && freeDice().length && !hasGear('anklet')){
    S.dice.forEach(d => d.spent = true);
    log('The marsh drags at you. Travel ends for the day.', 'y');
  }
  centreOnHero();
  save(); render();
  // arriving somewhere unexplored triggers the encounter right away
  if(!m.explored) setTimeout(() => exploreHere(), T(260));
  else if(m.threat) setTimeout(() => { m.threat = null; startCombat(rollMonster(m.tier), {where:'ambush'}); }, T(260));
}

/* =========================================================================
   DAY CYCLE / DREAD
   ========================================================================= */
function endDay(opt){
  opt = opt || {};
  // dusk
  S.dread = Math.min(S.dreadMax + 4, S.dread + 1 + (opt.extraDread || 0));
  if(S.dread >= 12 && !S.flags.h1){ S.flags.h1 = true; log('A second darkness settles under the first. Everything out here is stronger now.', 'v'); }
  if(S.dread >= 24 && !S.flags.h2){ S.flags.h2 = true; log('The Crown stirs in earnest. The roads are no longer safe anywhere.', 'r'); }
  wanderThreats();
  // dawn
  S.day++;
  const d = D();
  let heal = d.regen + (S.hero.id === 'priest' ? 2 : 0);
  if(heal) healHero(heal, 'the night\'s rest');
  S.hero.en = clamp(S.hero.en + 2, 0, d.maxEn);
  const wasLost = S.hero.lost.length;
  recoverAll();
  if(wasLost) log(`${plural(wasLost,'spent card')} back in your hand.`, 'v');
  rollMovement();
  if(S.dread >= S.dreadMax){
    if(!S.crownAwake) crownMarches();
    else if(!V.combat){ log('The Crown is still walking the region, and it is still looking for you.', 'r'); crownMarches(); }
  }
  save(); render();
}
function wanderThreats(){
  // clear old, then seed a few new roaming threats on explored ground
  const keys = Object.keys(S.map);
  for(const k of keys) if(S.map[k].threat && chance(0.4)) S.map[k].threat = null;
  const n = S.dread >= 24 ? 3 : S.dread >= 12 ? 2 : 1;
  for(let i=0;i<n;i++){
    const k = pick(keys);
    const m = S.map[k];
    if(!m || m.t === 'water' || FEATS[m.feat] && FEATS[m.feat].kind === 'town') continue;
    if(key(S.pos.q,S.pos.r) === k) continue;
    m.threat = true;
  }
}
function crownMarches(){
  S.crownAwake = true;
  log('The sky over the Obsidian Gate splits. The Sable Crown has come for you.', 'r');
  modal({
    ic:'👁️‍🗨️', h:'The Crown Marches',
    b:`<p>Dread has run its course. The Sable Crown does not wait at its gate any longer — it walks out to meet you where you stand.</p>
       <p class="muted" style="margin-top:9px">${S.seals >= 3
          ? 'You carry all three seals. It comes to you diminished, and you are ready.'
          : `You hold ${S.seals} of 3 seals. It comes to you whole. This will not be a fair fight.`}</p>`,
    f:[{lb:'Stand', cls:'primary danger', fn:() => { closeModal(); startCombat(crownStats(), {boss:'crown'}); }}],
    noClose:true,
  });
}
function crownStats(){
  const c = JSON.parse(JSON.stringify(CROWN));
  const short = 3 - S.seals;            // every seal you skipped is a Crown that much less diminished
  c.hp += short * 30; c.arm += short; c.atk += short;
  if(S.seals >= 3){ c.hp -= 14; c.arm -= 1; }
  return c;
}
function dreadTier(){ return S.dread >= 24 ? 2 : S.dread >= 12 ? 1 : 0; }
function scaledTier(base){ return clamp(base + (chance(0.5) ? dreadTier() : Math.min(1,dreadTier())), 1, 4); }

/* =========================================================================
   HERO HELPERS
   ========================================================================= */
function healHero(n, src){
  const d = D();
  const before = S.hero.hp;
  S.hero.hp = clamp(S.hero.hp + n, 0, d.maxHp);
  const got = S.hero.hp - before;
  if(got > 0) log(`You recover ${got} HP${src ? ' from ' + src : ''}.`, 'g');
  return got;
}
function hurtHero(n, src){
  S.hero.hp -= n;
  log(`You take ${n} damage${src ? ' — ' + src : ''}.`, 'r');
  if(S.hero.hp <= 0) heroFalls();
}
function gainGold(n){
  n = Math.round(n * goldMult());
  S.hero.gold += n;
  log(`+${n} gold.`, 'y');
  return n;
}
function spendEnergy(n){ if(S.hero.en < n) return false; S.hero.en -= n; return true; }
function gainXp(n){
  S.hero.xp += n;
  log(`+${n} XP.`, 'b');
  if(S.hero.xp >= S.hero.xpNext) setTimeout(tryLevelUp, T(320));
}
function heroFalls(){
  const wasCrown = V.lastBoss === 'crown' || (V.combat && V.combat.opts && V.combat.opts.boss === 'crown');
  V.lastBoss = null;
  if(wasCrown){
    V.combat = null;
    gameOver('The Sable Crown puts you down where you stood. There is no second thread for this one.');
    return;
  }
  if(S.hero.fated){
    S.hero.fated = false; S.deaths++;
    const lost = Math.floor(S.hero.gold / 2);
    S.hero.gold -= lost;
    // dragged to the nearest settlement
    let best = null, bd = 99;
    for(const k in S.map){
      const m = S.map[k];
      if(FEATS[m.feat] && FEATS[m.feat].kind === 'town'){
        const dd = hexDist(m, S.pos);
        if(dd < bd){ bd = dd; best = m; }
      }
    }
    S.pos = best ? {q:best.q, r:best.r} : {q:0,r:0};
    S.hero.hp = Math.max(1, Math.round(D().maxHp * 0.4));
    recoverAll();
    S.day += 3; S.dread += 3;
    V.combat = null;
    reveal(S.pos, 1); centreOnHero(); rollMovement(true);
    closeModal();
    modal({ic:'🕯️', h:'Fate\'s Thread', b:
      `<p>You fall. You do not die.</p>
       <p class="muted" style="margin-top:9px">Someone hauls you back to ${best ? FEATS[best.feat].nm : 'Kestrel Hold'}. You lose three days, ${lost} gold, and the thread that pulled you out of it. There is no second one.</p>`,
      f:[{lb:'Get up', cls:'primary', fn:() => { closeModal(); save(); render(); }}], noClose:true});
    save();
    return;
  }
  gameOver('Your run ends here. The region keeps what it takes.');
}

/* =========================================================================
   SKILL TESTS   2d6 + stat + bonuses vs DC, energy may be pushed in
   ========================================================================= */
function skillTest(o){
  // o = {stat, dc, nm, ok(margin), fail(margin)}
  let push = 0;
  const d = D();
  const render_ = () => {
    const bonus = d[o.stat] + d.test + push;
    modal({
      ic: STATIC[o.stat], h: o.nm || (STATNM[o.stat] + ' Test'),
      b: `<p class="muted">${o.tx || 'Roll 2d6, add your stat, and beat the number.'}</p>
        <div class="card" style="margin-top:12px">
          <div class="kv"><span>Target</span><b>${o.dc}</b></div>
          <div class="kv"><span>${STATNM[o.stat]}</span><b>+${d[o.stat]}</b></div>
          ${d.test ? `<div class="kv"><span>Training</span><b>+${d.test}</b></div>` : ''}
          <div class="kv"><span>Pushed (energy)</span><b>+${push}</b></div>
          <div class="sep" style="margin:8px 0"></div>
          <div class="kv"><span>Rolling</span><b>2d6 +${bonus}</b></div>
        </div>
        <div class="row wr" style="margin-top:11px">
          <button class="btn sm" id="pushE" ${S.hero.en < 1 || push >= 3 ? 'disabled' : ''}>⚡ Push (+1, costs 1 energy)</button>
          <span class="tiny muted">Energy ${S.hero.en}/${d.maxEn}</span>
        </div>`,
      f: [{lb:'Roll', cls:'primary', id:'rollT'}],
      noClose: true,
    });
    const pe = $('#pushE');
    if(pe) pe.onclick = () => { if(spendEnergy(1)){ push++; render_(); } };
    $('#rollT').onclick = () => {
      const a = d6(), b = d6(), tot = a + b + bonus;
      const win = tot >= o.dc || (a === 6 && b === 6);
      const margin = tot - o.dc;
      modal({
        ic: win ? '✅' : '❌', h: win ? 'Success' : 'Failure',
        b: `<div class="center" style="font-size:30px;font-family:'DM Serif Display',serif;margin-bottom:6px">
              ${a} + ${b} ${bonus ? '+ ' + bonus : ''} = <span style="color:${win ? 'var(--green)' : 'var(--red)'}">${tot}</span>
            </div>
            <p class="center muted tiny">against ${o.dc}${a===6&&b===6?' — double sixes, an automatic success':''}</p>
            <div class="sep"></div>
            <p>${win ? o.okTx || '' : o.failTx || ''}</p>`,
        f: [{lb:'Continue', cls:'primary', fn:() => { closeModal(); (win ? o.ok : o.fail)(margin); save(); render(); }}],
        noClose: true,
      });
    };
  };
  render_();
}

function markNearestLair(){
  let best = null, bd = 99;
  for(const k of S.lairKeys){
    const m = S.map[k];
    if(m.cleared) continue;
    const dd = hexDist(m, S.pos);
    if(dd < bd){ bd = dd; best = m; }
  }
  if(!best){ log('Every lair is already broken.', 'g'); return; }
  const n = reveal({q:best.q, r:best.r}, 1);
  best.revealed = true;
  log(`A lair is marked on your map, ${plural(bd,'hex')} off.`, 'v');
}
function rollItem(tier){
  const pool = ITEMS.filter(i => i.tier <= tier && i.slot !== 'use');
  const use  = ITEMS.filter(i => i.slot === 'use' && i.tier <= tier);
  return chance(0.72) ? pick(pool) : pick(use);
}
function giveItem(id){
  S.hero.bag.push(id);
  const it = ITEM(id);
  log(`You gain ${it.nm}.`, 'y');
}
function rollMonster(tier){
  const t = scaledTier(tier);
  let pool = MONSTERS.filter(m => m.tier === t);
  if(!pool.length) pool = MONSTERS.filter(m => m.tier === clamp(t,1,4));
  const base = pick(pool);
  const m = JSON.parse(JSON.stringify(base));
  if(dreadTier() >= 2){ m.hp = Math.round(m.hp * 1.2); m.atk += 1; }
  return m;
}

/* =========================================================================
   EXPLORATION
   ========================================================================= */
function exploreHere(){
  const m = hereHex();
  const fresh = !m.explored;
  if(fresh){ m.explored = true; S.explored++; gainXp(1); }
  const F = m.feat && FEATS[m.feat];
  if(F && F.kind === 'town'){ openTown(m); return; }
  if(F && F.kind === 'lair'){ lairPrompt(m); return; }
  if(F && F.kind === 'gate'){ gatePrompt(m); return; }
  if(F && F.kind === 'site' && !m.used){ siteEvent(m); return; }
  if(!fresh){ flash('Nothing left here worth the daylight.'); return; }
  drawEncounter(m);
}

function drawEncounter(m){
  const roll = rnd();
  if(m.threat){ m.threat = null; startCombat(rollMonster(m.tier), {where:'ambush'}); return; }
  if(roll < 0.42){ startCombat(rollMonster(m.tier), {}); return; }
  if(roll < 0.80){
    const pool = EVENTS.filter(e => e.tier.includes(clamp(m.tier,1,4)));
    resolveEvent(pick(pool.length ? pool : EVENTS));
    return;
  }
  // quiet find
  const finds = [
    () => { const g = gainGold(ri(8,22) + m.tier*6); return `Coin in a split log. ${g} gold.`; },
    () => { const it = rollItem(clamp(m.tier,1,3)); giveItem(it.id); return `A ${it.nm}, left where someone dropped it.`; },
    () => { healHero(6,'clean water'); return 'A spring, and an hour of quiet.'; },
    () => { const n = reveal(S.pos, 2 + D().scout); return `High ground. ${plural(n,'hex')} of country opens up.`; },
    () => { S.hero.en = D().maxEn; return 'You find a good place to stop, and stop.'; },
  ];
  const tx = pick(finds)();
  modal({ic:'🧭', h:'Quiet Ground', b:`<p>${tx}</p>`, f:[{lb:'Move on', cls:'primary', fn:()=>{closeModal();save();render();}}]});
}

function siteEvent(m){
  const F = FEATS[m.feat];
  const done = tx => modal({ic:F.ic, h:F.nm, b:`<p>${tx}</p>`, f:[{lb:'Continue', cls:'primary', fn:()=>{closeModal();save();render();}}]});
  m.used = true;
  switch(m.feat){
    case 'shrine': resolveEvent(EVENTS.find(e => e.id === 'shrine')); m.used = true; break;
    case 'tower': {
      const n = reveal(S.pos, 4);
      gainXp(4);
      done(`You climb, and the region lays itself out. ${plural(n,'hex')} revealed.`);
      break;
    }
    case 'grove': {
      const d = D();
      S.hero.hp = d.maxHp; S.hero.en = d.maxEn;
      done('Nothing hunts here. You sleep for eleven hours and wake whole.');
      break;
    }
    case 'stones': {
      skillTest({stat:'spi', dc:9, nm:'Standing Stones',
        tx:'Stand between them and see whether they agree with you.',
        okTx:'The hum settles into your bones and stays there.',
        failTx:'The hum gets into your teeth and will not leave.',
        ok:()=>{ const st = pick(['mig','agi','wit','spi']); S.hero.stats[st]++; log(`Permanent +1 ${STATNM[st]}.`,'v'); gainXp(4); },
        fail:()=>{ hurtHero(4,'the stones'); S.hero.en = 0; }});
      break;
    }
    case 'mine': {
      skillTest({stat:'mig', dc:9, nm:'Old Mine',
        tx:'The props are rotten and the seam is not.',
        okTx:'You come out with your arms full.', failTx:'The roof comes down behind you, and partly on you.',
        ok:()=>{ gainGold(ri(40,80)); if(chance(0.4)) giveItem(rollItem(3).id); gainXp(4); },
        fail:()=>{ hurtHero(7,'a collapse'); gainGold(ri(10,20)); }});
      break;
    }
    case 'ruin': {
      skillTest({stat:'wit', dc:9, nm:'Ruin',
        tx:'The writing is not a language. It is a set of instructions.',
        okTx:'You read enough of it to know where not to stand.',
        failTx:'You read enough of it to wake what was reading back.',
        ok:()=>{ giveItem(rollItem(3).id); gainXp(5); markNearestLair(); },
        fail:()=>{ startCombat(rollMonster(clamp(m.tier+1,1,4)), {}); }});
      break;
    }
    case 'barrow': {
      modal({ic:'⚰️', h:'Barrow', b:`<p>A door in a hill, and it opens outward. Whatever is inside was buried with everything it owned.</p>`,
        f:[
          {lb:'Go in', cls:'danger', fn:()=>{ closeModal(); startCombat(rollMonster(clamp(m.tier+1,2,4)), {loot:3, gold:1.6}); }},
          {lb:'Seal it instead', cls:'ghost', fn:()=>{ closeModal(); S.dread = Math.max(0,S.dread-1); gainXp(3); log('You wedge the door and pile stones on it. Dread falls by 1.','g'); save(); render(); }},
        ]});
      break;
    }
    case 'camp': {
      modal({ic:'🏕️', h:'Warband Camp', b:`<p>Cookfires, picket lines, and a great deal more of them than there were last week. They have not seen you yet.</p>`,
        f:[
          {lb:'Raid it', cls:'danger', fn:()=>{ closeModal(); startCombat(Object.assign(JSON.parse(JSON.stringify(MONSTERS.find(x=>x.id==='brigand'))), {tier:clamp(m.tier,2,4)}), {loot:2, gold:2, camp:key(m.q,m.r)}); }},
          {lb:'Slip past', cls:'ghost', fn:()=>{ closeModal(); skillTest({stat:'agi', dc:9, nm:'Slip Past',
              okTx:'You are three ridges away before the dogs start.', failTx:'The dogs start early.',
              ok:()=>{ gainXp(3); }, fail:()=>{ startCombat(rollMonster(clamp(m.tier,2,4)), {}); }}); }},
        ]});
      break;
    }
    case 'hermit': {
      const offer = pick(ITEMS.filter(i => i.tier === 3));
      const price = Math.round(offer.cost * 0.6);
      const tal = pick(TALENTS.filter(t => !S.hero.talents.includes(t.id)));
      modal({ic:'🛖', h:'Hermitage', b:
        `<p>One door, one window, and an occupant who has clearly been expecting somebody, though possibly not you.</p>
         <div class="sep"></div>
         <button class="choice" id="hA" ${S.hero.gold < price ? 'disabled' : ''}>
           <b>${offer.ic} Buy the ${esc(offer.nm)} — ${price}g</b><div class="sub">${esc(offer.tx)}</div></button>
         <button class="choice" id="hB" ${S.hero.gold < 70 || !tal ? 'disabled' : ''}>
           <b>${tal ? tal.ic : ''} Be taught: ${tal ? esc(tal.nm) : '—'} — 70g</b><div class="sub">${tal ? esc(tal.tx) : 'Nothing left to learn here.'}</div></button>
         <button class="choice" id="hC"><b>🍵 Accept the tea and leave</b><div class="sub">Heal fully. Restore energy.</div></button>`,
        f:[]});
      $('#hA').onclick = () => { S.hero.gold -= price; giveItem(offer.id); closeModal(); save(); render(); };
      $('#hB').onclick = () => { S.hero.gold -= 70; S.hero.talents.push(tal.id); log(`You learn ${tal.nm}.`,'v'); closeModal(); save(); render(); };
      $('#hC').onclick = () => { const d = D(); S.hero.hp = d.maxHp; S.hero.en = d.maxEn; log('The tea is remarkable.','g'); closeModal(); save(); render(); };
      break;
    }
    default: drawEncounter(m);
  }
}

/* ---------- generic event resolution ---------- */
function resolveEvent(ev){
  const body = `<p>${esc(ev.tx)}</p><div class="sep"></div>` + ev.opts.map((o,i) => {
    const ok = !o.need || o.need();
    return `<button class="choice" data-o="${i}" ${ok?'':'disabled'}>
      <b>${esc(o.lb)}</b>${o.sub ? `<div class="sub">${esc(o.sub)}</div>` : ''}</button>`;
  }).join('');
  modal({ic:ev.ic, h:ev.nm, b:body, f:[]});
  $$('#scrim [data-o]').forEach(btn => {
    btn.onclick = () => {
      const o = ev.opts[+btn.dataset.o];
      if(o.test){
        skillTest(Object.assign({}, o.test, {nm:ev.nm, tx:ev.tx, okTx:o.okTx, failTx:o.failTx, ok:o.ok||(()=>{}), fail:o.fail||(()=>{})}));
      } else if(o.fight){
        closeModal();
        const base = MONSTERS.find(m => m.id === o.fight) || rollMonster(2);
        startCombat(JSON.parse(JSON.stringify(base)), {});
      } else if(o.shop){
        openShop({nm:'Road Peddler', ic:'🎒', stockKey:'peddler:' + S.day, tier:2, mark:1.15});
      } else if(o.sell){
        openSell();
      } else {
        const tx = o.fn() || '';
        modal({ic:ev.ic, h:ev.nm, b:`<p>${tx}</p>`, f:[{lb:'Continue', cls:'primary', fn:()=>{closeModal();save();render();}}]});
      }
    };
  });
}

/* =========================================================================
   COMBAT
   Each round: the enemy reveals its intent, you play the TOP half of one
   ability card and the BOTTOM half of another, initiative decides who
   swings first, and your dice pool is the modifier rolled on top.
   ========================================================================= */
function startCombat(foe, opts){
  opts = opts || {};
  const deck = intentDeck(foe);
  const C = {
    foe: Object.assign({}, foe, {maxHp: foe.hp, burn:0, psn:0, stun:0, shieldBonus:0, rage:0, curse:0}),
    opts, round:1, phase:'cards',
    intentDeck: deck, order: shuffle(deck.map((x,i) => i)), intent: null,
    myDice:[], foeDice:[], rrLeft:0, spentSurge:0, sharp:0,
    pickTop:null, pickBot:null, play:null, myInit:99, resting:false,
    pend:{dmg:0, pierce:false, guard:0},
    me:{burn:0, poison:0, stun:0, hexed:0, stone:0, fury:0, curse:0},
    done:false, hist:[],
  };
  V.combat = C;
  V.lastBoss = null;
  log(`${foe.ic} ${foe.nm} blocks the way.`, 'r');
  newCombatRound(true);
}
function cPool(){ return D().pool; }
function cLog(t, cls){ const C = V.combat; if(C){ C.hist.push((cls?'§'+cls+'§':'')+t); if(C.hist.length>40) C.hist.shift(); } log(t, cls); }

/* ---------- hand ---------- */
function handIds(){ return S.hero.hand.slice(); }
function spendCard(id, lost){
  const h = S.hero;
  const i = h.hand.indexOf(id);
  if(i >= 0) h.hand.splice(i, 1);
  (lost ? h.lost : h.discard).push(id);
}
function recoverDiscards(){
  const h = S.hero;
  if(!h.discard.length) return;
  h.hand = h.hand.concat(h.discard);
  h.discard = [];
}
function recoverAll(){
  const h = S.hero;
  h.hand = h.deck.slice();
  h.discard = []; h.lost = [];
}

function drawIntent(){
  const C = V.combat;
  if(!C.order.length) C.order = shuffle(C.intentDeck.map((x,i) => i));
  C.intent = C.intentDeck[C.order.shift()];
}

function newCombatRound(first){
  const C = V.combat;
  if(!C || C.done) return;
  if(!first){
    if(C.me.burn > 0){ C.me.burn--; dealToMe(3, 'burning', true); }
    if(C.me.poison > 0){ C.me.poison--; dealToMe(2, 'venom', true); }
    if(C.foe.burn > 0){ C.foe.burn--; dealToFoe(2, 'cinders', true); }
    if(C.foe.psn > 0){ C.foe.psn--; dealToFoe(2, 'venom', true); }
    if(C.foe.spec === 'regen' && C.foe.hp > 0){ C.foe.hp = Math.min(C.foe.maxHp, C.foe.hp + 3); cLog(`${C.foe.nm} knits itself back together (+3).`); }
    if(C.foe.spec === 'crown'){ C.foe.rage++; cLog('The Crown grows heavier. +1 attack.'); }
  }
  if(C.done) return;
  if(C.me.stun > 0) C.me.stun--;
  if(C.foe.stun > 0) C.foe.stun--;
  if(C.me.curse > 0) C.me.curseNow = C.me.curse, C.me.curse = 0; else C.me.curseNow = 0;
  if(C.foe.curse > 0) C.foe.curseNow = C.foe.curse, C.foe.curse = 0; else C.foe.curseNow = 0;

  C.mustRest = false;
  if(S.hero.hand.length < 2){
    if(S.hero.discard.length >= 2){
      C.mustRest = true;
      cLog('You are down to your last card. Catch your breath or it is over.', 'y');
    } else { exhausted(); return; }
  }

  drawIntent();
  C.pickTop = null; C.pickBot = null; C.play = null; C.resting = false; C.shown = null;
  C.myDice = []; C.foeDice = []; C.pend = {dmg:0, pierce:false, guard:0}; C.spentSurge = 0;
  C.phase = 'cards';
  renderCombat();
}

function pickHalf(id, half){
  const C = V.combat;
  if(!C || C.phase !== 'cards') return;
  if(half === 'top'){
    if(C.pickTop === id){ C.pickTop = null; }
    else { if(C.pickBot === id) C.pickBot = null; C.pickTop = id; }
  } else {
    if(C.pickBot === id){ C.pickBot = null; }
    else { if(C.pickTop === id) C.pickTop = null; C.pickBot = id; }
  }
  renderCombat();
}
function commitCards(){
  const C = V.combat;
  if(!C || C.phase !== 'cards' || !C.pickTop || !C.pickBot) return;
  const topCard = CARD(C.pickTop), botCard = CARD(C.pickBot);
  const A = topCard.top, B = botCard.bot;
  const play = {atk:0, sh:0, heal:0, ward:0, rr:0, en:0, pierce:0, stun:0, dbl:0, leech:0,
                refresh:0, burn:0, psn:0, curse:0, retal:0, gold:0, cure:0, dice:[], surge:[]};
  for(const a of [A, B]){
    for(const k in a){
      if(k === 'tx' || k === 'lost') continue;
      if(k === 'dice' || k === 'surge') play[k] = play[k].concat(a[k]);
      else play[k] = (play[k] || 0) + a[k];
    }
  }
  C.play = play;
  C.myInit = topCard.init;
  C.shown = {topNm:topCard.nm, topTx:A.tx, botNm:botCard.nm, botTx:B.tx};
  cLog(`${topCard.nm} (top) into ${botCard.nm} (bottom).`, 'b');
  spendCard(C.pickTop, A.lost);
  spendCard(C.pickBot, B.lost);

  if(play.heal) healHero(play.heal, 'your own hand');
  if(play.en){ S.hero.en = clamp(S.hero.en + play.en, 0, D().maxEn); cLog(`+${play.en} energy.`, 'b'); }
  if(play.cure){ C.me.burn = 0; C.me.poison = 0; cLog('You are clean of it.', 'g'); }
  if(play.burn){ C.foe.burn = play.burn; cLog(`${C.foe.nm} catches light.`, 'y'); }
  if(play.psn){ C.foe.psn = play.psn; cLog(`${C.foe.nm} is poisoned.`, 'y'); }
  if(play.stun){ C.foe.stun = 2; cLog(`${C.foe.nm} is staggered.`, 'y'); }
  if(play.curse){ C.foe.curse = play.curse; cLog(`${C.foe.nm} will hit ${play.curse} softer next round.`, 'y'); }
  if(play.gold) gainGold(play.gold);
  if(play.refresh){
    if(S.hero.lost.length){
      const id = S.hero.lost.pop();
      S.hero.hand.push(id);
      cLog(`${CARD(id).nm} comes back to your hand.`, 'v');
    } else cLog('Nothing lost to take back.', 'y');
  }

  C.myDice = cPool().concat(play.dice).map(k => Object.assign(rollDie(k), {mark:false, fresh:true}));
  C.foeDice = C.foe.pool.map(k => rollDie(k));
  C.rrLeft = Math.max(0, D().rrTotal + play.rr - (C.me.hexed ? 1 : 0));
  C.pend = {dmg:0, pierce:!!play.pierce, guard:0};
  C.spentSurge = 0;
  C.phase = 'dice';
  renderCombat();
}
function catchBreath(){
  const C = V.combat, h = S.hero;
  if(!C || C.phase !== 'cards') return;
  if(h.discard.length < 2){ flash('You need at least two cards in the discard to make it worth the round.'); return; }
  const i = Math.floor(rnd() * h.discard.length);
  const lostId = h.discard.splice(i, 1)[0];
  h.lost.push(lostId);
  h.hand = h.hand.concat(h.discard);
  h.discard = [];
  cLog(`You catch your breath. ${CARD(lostId).nm} is spent for good.`, 'y');
  C.play = null; C.myInit = 99; C.resting = true;
  C.myDice = [];
  C.foeDice = C.foe.pool.map(k => rollDie(k));
  C.rrLeft = 0; C.spentSurge = 0; C.pend = {dmg:0, pierce:false, guard:0};
  C.phase = 'dice';
  renderCombat();
}
function exhausted(){
  const C = V.combat;
  const dmg = Math.max(2, (C.foe.tier || 1) * 2);
  cLog('Your hand is empty. You break off and run for it.', 'r');
  V.combat = null;
  closeModal();
  recoverDiscards();
  S.dice.forEach(d => d.spent = true);
  log('Out of cards and out of the fight. Camp or take a room to get the lost ones back.', 'y');
  hurtHero(dmg, 'a parting blow as you break off');
  save(); render();
}

/* ---------- the numbers ---------- */
function mySurges(){ const C = V.combat; return C.myDice.reduce((s,d)=>s+d.s,0) - C.spentSurge; }
function surgeOptions(){ const C = V.combat; return Array.from(new Set(D().surge.concat((C.play && C.play.surge) || []))); }
function myAttack(){
  const C = V.combat, d = D(), p = C.play || {};
  if(C.me.stun > 0) return 0;
  let diceAtk = C.myDice.reduce((s,x)=>s+x.a,0);
  if(p.dbl) diceAtk *= 2;
  let a = diceAtk + d.atk + (p.atk||0) + C.pend.dmg + C.me.fury + (C.sharp||0);
  if(S.hero.id === 'blade' && C.round === 1) a += 3;
  if(d.zeal && S.hero.hp <= d.maxHp/2) a += d.zeal;
  if(C.me.curseNow) a -= C.me.curseNow;
  if(C.me.hexed) a -= 2;
  return Math.max(0, a);
}
function myShields(){ const C = V.combat, p = C.play || {}; return C.myDice.reduce((s,x)=>s+x.d,0) + C.pend.guard + (p.sh||0); }
function myWard(){ const C = V.combat, p = C.play || {}; return D().ward + (p.ward||0) + (C.me.stone ? 3 : 0); }
function foeAttackVal(){
  const C = V.combat;
  if(C.foe.stun > 0) return 0;
  const it = C.intent || {};
  // the revealed intent replaces the monster's old flat attack bonus rather than stacking on it
  return Math.max(0, C.foeDice.reduce((s,x)=>s+x.a,0) + (it.atk||0) + (C.foe.rage||0) - (C.foe.curseNow||0));
}
function foeShields(){ const C = V.combat; return C.foeDice.reduce((s,x)=>s+x.d,0) + (C.foe.shieldBonus||0) + ((C.intent && C.intent.sh)||0); }

function dealToFoe(n, src, quiet){
  const C = V.combat;
  C.foe.hp -= n;
  if(!quiet) cLog(`You hit for ${n}.`, 'g'); else cLog(`${C.foe.nm} takes ${n} from ${src}.`, 'g');
  floatText('-' + n, '#3ddc97', '#foeCard');
  if(C.foe.hp <= 0 && !C.done){ C.done = true; setTimeout(() => winCombat(C), T(420)); }
}
function dealToMe(n, src, quiet){
  const C = V.combat, d = D();
  let dmg = n;
  if(!quiet) dmg = Math.max(0, dmg - myWard());
  if(dmg <= 0){ cLog(`You shrug off ${src}.`); return 0; }
  S.hero.hp -= dmg;
  cLog(`${cap(src)} costs you ${dmg}.`, 'r');
  floatText('-' + dmg, '#ef5350', '#meCard');
  const el = $('#meCard'); if(el){ el.classList.add('hit'); setTimeout(()=>el.classList.remove('hit'), 320); }
  if(S.hero.hp <= 0 && !C.done){ C.done = true; V.lastBoss = C.opts.boss || null; V.combat = null; setTimeout(heroFalls, T(400)); }
  return dmg;
}

function doReroll(){
  const C = V.combat;
  if(!C || C.done || C.phase !== 'dice') return;
  const marks = C.myDice.filter(d => d.mark);
  if(!marks.length || C.rrLeft <= 0) return;
  const n = Math.min(marks.length, C.rrLeft);
  let used = 0;
  for(const die of C.myDice){
    if(!die.mark || used >= n) continue;
    const nd = rollDie(die.k);
    die.a = nd.a; die.d = nd.d; die.s = nd.s; die.mark = false; die.fresh = true;
    used++;
  }
  C.rrLeft -= used;
  C.myDice.forEach(d => d.mark = false);
  renderCombat();
}
function spendSurge(id){
  const C = V.combat;
  if(!C || C.done) return;
  const so = SURGES[id];
  if(!so || mySurges() < so.cost) return;
  C.spentSurge += so.cost;
  if(id === 'dmg') C.pend.dmg += 2;
  if(id === 'pierce') C.pend.pierce = true;
  if(id === 'guard') C.pend.guard += 2;
  if(id === 'stagger'){ C.foe.stun = 2; cLog(`${C.foe.nm} is staggered.`, 'y'); }
  if(id === 'scorch'){ C.foe.burn = 3; cLog(`${C.foe.nm} catches light.`, 'y'); }
  if(id === 'mend') healHero(D().mend >= 2 ? 4 : 2, 'a small rite');
  renderCombat();
}
function foeSurgeSpend(){
  const C = V.combat;
  let s = C.foeDice.reduce((t,d)=>t+d.s,0);
  const sp = C.foe.spec;
  while(s > 0){
    if(sp === 'poison'){ C.me.poison = 3; cLog('Venom works into the wound.', 'r'); }
    else if(sp === 'burn'){ C.me.burn = 3; cLog('You are burning.', 'r'); }
    else if(sp === 'drain'){ C.foe.hp = Math.min(C.foe.maxHp, C.foe.hp + 3); S.hero.en = Math.max(0, S.hero.en - 1); cLog(`${C.foe.nm} drains 3 and takes an energy.`, 'r'); }
    else if(sp === 'crush'){ C.foe.crush = true; cLog('It swings through your guard.', 'r'); }
    else if(sp === 'parry'){ C.foe.shieldBonus = (C.foe.shieldBonus||0) + 3; cLog('It parries hard.', 'r'); }
    else if(sp === 'hex'){ C.me.hexed = 2; cLog('A hex settles on you.', 'r'); }
    else if(sp === 'crown'){
      const r = pick(['poison','burn','drain','crush']);
      if(r === 'poison') C.me.poison = 3;
      if(r === 'burn') C.me.burn = 3;
      if(r === 'drain') C.foe.hp = Math.min(C.foe.maxHp, C.foe.hp + 4);
      if(r === 'crush') C.foe.crush = true;
      cLog('The Crown does something you have no name for.', 'r');
    }
    else { C.foe.shieldBonus = (C.foe.shieldBonus||0) + 1; }
    s--;
  }
}

function strike(){
  const C = V.combat;
  if(!C || C.phase !== 'dice' || C.done) return;
  C.phase = 'resolve';
  C.foe.crush = false;
  foeSurgeSpend();
  const d = D(), p = C.play || {}, it = C.intent || {};
  const meFirst = (C.myInit || 99) <= (it.init || 99);

  const swingMine = () => {
    if(C.done) return;
    const mine = myAttack();
    const fsh = C.pend.pierce ? 0 : foeShields();
    const toFoe = Math.max(0, mine - fsh - (C.foe.arm || 0));
    if(C.me.stun > 0){ cLog('You are still shaking off the blow.', 'y'); return; }
    if(toFoe > 0){
      dealToFoe(toFoe);
      if(p.leech){ const h = Math.ceil(toFoe / 2); healHero(h, 'the wound you opened'); }
    } else if(C.resting){ /* resting: no swing */ }
    else cLog('Your blow finds nothing but shield and plate.', 'y');
  };
  const swingTheirs = () => {
    if(C.done) return;
    if(it.heal){ C.foe.hp = Math.min(C.foe.maxHp, C.foe.hp + it.heal); cLog(`${C.foe.nm} recovers ${it.heal}.`, 'r'); }
    const fatk = foeAttackVal();
    if(fatk <= 0){ if(C.foe.stun > 0) cLog(`${C.foe.nm} is still recovering.`, 'y'); return; }
    const msh = (C.foe.crush || it.pierce) ? 0 : myShields();
    const raw = Math.max(0, fatk - msh - d.arm);
    const dealt = raw > 0 ? dealToMe(raw, C.foe.nm + '\'s ' + (it.nm || 'attack')) : 0;
    if(raw <= 0){ cLog('You take the blow on your guard.', 'g'); return; }
    if(dealt > 0){
      if(it.leech){ C.foe.hp = Math.min(C.foe.maxHp, C.foe.hp + Math.ceil(dealt/2)); cLog(`${C.foe.nm} feeds on it.`, 'r'); }
      if(it.psn){ C.me.poison = it.psn; cLog('Venom.', 'r'); }
      if(it.burn){ C.me.burn = it.burn; cLog('You are burning.', 'r'); }
      if(it.stun){ C.me.stun = 2; cLog('You are knocked off your feet.', 'r'); }
      if(it.curse){ C.me.curse = it.curse; cLog(`You will hit ${it.curse} softer next round.`, 'r'); }
      if(p.retal && !C.done) dealToFoe(p.retal, 'your guard', true);
    }
  };

  if(meFirst){ swingMine(); swingTheirs(); }
  else { swingTheirs(); swingMine(); }

  if(C.me.hexed) C.me.hexed--;
  C.me.fury = 0;
  C.foe.shieldBonus = 0;
  if(!C.done){
    C.round++;
    setTimeout(() => newCombatRound(false), T(420));
  }
  renderCombat();
}

function tryFlee(){
  const C = V.combat;
  if(!C || C.done) return;
  if(C.opts.boss){ flash('There is no walking away from this one.'); return; }
  const auto = S.hero.id === 'reaver';
  const dc = 7 + C.foe.tier * 2;
  const finish = ok => {
    if(ok){
      V.combat = null; closeModal();
      recoverDiscards();
      log('You break contact and go.', 'y');
      S.dice.forEach(x => x.spent = true);
      save(); render();
    } else {
      cLog('You cannot get clear.', 'r');
      dealToMe(Math.max(2, C.foe.tier * 3), 'a parting blow');
      if(V.combat) renderCombat();
    }
  };
  if(auto){ finish(true); return; }
  closeModal();
  skillTest({stat:'agi', dc, nm:'Break Away',
    tx:'Get out while there is still ground behind you.',
    okTx:'You are gone before it decides to follow.', failTx:'It follows.',
    ok:()=>finish(true), fail:()=>finish(false)});
}

function winCombat(C){
  C = C || V.combat;
  if(!C || C.paid) return;
  C.paid = true;
  const foe = C.foe;
  S.kills++;
  if(S.bounty && !S.bounty.done && S.bounty.id === foe.id){ S.bounty.done = true; log('Bounty target down. Collect in any settlement.', 'y'); }
  const g = gainGold(ri(foe.gold[0], foe.gold[1]) * (C.opts.gold || 1));
  gainXp(foe.xp);
  let loot = null;
  const lootChance = 0.3 + (C.opts.loot ? 0.4 : 0) + foe.tier * 0.06;
  if(chance(lootChance)){ loot = rollItem(clamp(foe.tier, 1, 3)); giveItem(loot.id); }
  if(foe.tier >= 4 && chance(0.25)){ const rel = pick(RELICS().filter(r => !S.hero.bag.includes(r.id))); if(rel){ giveItem(rel.id); loot = rel; } }
  if(C.opts.camp){ const m = S.map[C.opts.camp]; if(m){ m.feat = null; m.threat = null; S.dread = Math.max(0, S.dread - 1); } }
  const boss = C.opts.boss;
  const spent = S.hero.discard.length + S.hero.lost.length;
  V.combat = null;
  recoverDiscards();
  if(boss === 'crown'){ victory(); return; }
  if(boss === 'lair'){
    const m = hereHex();
    m.cleared = true; S.seals++;
    S.dread = Math.max(0, S.dread - 4);
    modal({ic:'🔱', h:'The Lair Breaks', b:
      `<p>You put it down, and the ground stops humming.</p>
       <p class="muted" style="margin-top:9px">You take the seal. <b>${S.seals} of 3</b>. Dread falls by 4.</p>
       ${S.seals >= 3 ? '<p style="margin-top:9px;color:var(--gold)">Three seals. The Obsidian Gate is open to you, and the Crown knows your name.</p>' : ''}`,
      f:[{lb:'Take a relic from the hoard', cls:'primary', fn:()=>{ closeModal(); if(S.seals>=3){ S.map[S.gateKey].revealed = true; reveal(unkey(S.gateKey),1); } relicChoice(); }}], noClose:true});
    save();
    return;
  }
  modal({ic:'🏆', h:'Victory', b:
    `<p>${esc(foe.nm)} goes down after ${plural(C.round,'round')}.</p>
     <div class="sep"></div>
     <div class="kv"><span>Experience</span><b>+${foe.xp}</b></div>
     <div class="kv"><span>Gold</span><b>+${g}</b></div>
     ${loot ? `<div class="kv"><span>Salvage</span><b>${loot.ic} ${esc(loot.nm)}</b></div>` : ''}
     <div class="kv"><span>Health</span><b>${S.hero.hp} / ${D().maxHp}</b></div>
     <div class="kv"><span>Cards in hand</span><b>${S.hero.hand.length}${S.hero.lost.length ? ` <span class="mini faint">(${S.hero.lost.length} lost until you sleep)</span>` : ''}</b></div>`,
    f:[{lb:'Continue', cls:'primary', fn:()=>{ closeModal(); save(); render(); }}], noClose:true});
  save();
}

// A level-up must never stamp over a modal the player is still reading.
function tryLevelUp(){
  if(!S || S.hero.lvl >= 10 || S.hero.xp < S.hero.xpNext) return;
  if(!$('#scrim').classList.contains('hidden')){ setTimeout(tryLevelUp, V.fast ? 60 : 450); return; }
  levelUp();
}
function levelUp(){
  const h = S.hero;
  if(h.lvl >= 10){ h.xp = Math.min(h.xp, xpFor(10)); return; }
  if(h.xp < h.xpNext) return;              // two quick XP gains must not stack two levels
  h.lvl++;
  h.xpNext = xpFor(h.lvl);
  const entry = (TRACKS[h.id] || []).find(t => t.lvl === h.lvl);
  if(entry){
    h.perks.push({nm:entry.nm, ic:entry.ic, tx:entry.tx, bon:entry.bon, dice:entry.dice, surge:entry.surge});
  }
  h.pts += 1;
  if(h.lvl % 2 === 1) h.drafts += 1;                           // talent draft on odd levels
  if(h.lvl % 2 === 0) h.cardDrafts = (h.cardDrafts||0) + 1;    // new ability card on even levels
  const d = D();
  S.hero.hp = clamp(S.hero.hp + 6, 0, d.maxHp);
  log(`Level ${h.lvl}. ${entry ? entry.nm + ' — ' + entry.tx : ''}`, 'v');
  showLevelUp(entry);
}

  if(!pool.length){ h.drafts = 0; save(); render(); return; }
  modal({
    ic:'🎴', h:'Draft a Talent', noClose:true,
    b:`<p class="muted">Three cards off the top. Take one.</p><div class="sep"></div>` +
      pool.map(t => `<button class="choice" data-tal="${t.id}">

    f:[],
  });
  $$('#scrim [data-tal]').forEach(b => b.onclick = () => {
    h.talents.push(b.dataset.tal);
    h.drafts--;
    log(`You take ${TAL(b.dataset.tal).nm}.`, 'v');

    setTimeout(spendRewards, T(120));
  });
}

function draftCard(){
  const h = S.hero;
  const pool = (CARDS[h.id] || []).filter(c => !h.deck.includes(c.id));
  if(!pool.length){ h.cardDrafts = 0; save(); render(); return; }
  modal({
    ic:'🃏', h:'A New Ability', wide:true, noClose:true,
    b:`<p class="muted">Something you have been working towards. Take one into your deck — it joins your hand now.</p><div class="sep"></div>
       <div class="hand draftgrid">${pool.map(c => `
         <div class="acard pick" data-newcard="${c.id}">
           <div class="ahd"><span class="initb">${c.init}</span><span class="aic">${c.ic}</span><span class="anm">${esc(c.nm)}</span></div>
           <div class="ahalf top"><span class="lbl">Top</span><span class="atx">${gtx(c.top.tx)}</span></div>
           <div class="ahalf bot"><span class="lbl">Bottom</span><span class="atx">${gtx(c.bot.tx)}</span></div>
         </div>`).join('')}</div>`,
    f:[],
  });
  $$('#scrim [data-newcard]').forEach(el => el.onclick = () => {
    const id = el.dataset.newcard;
    h.deck.push(id);
    h.hand.push(id);
    h.cardDrafts--;
    log(`${CARD(id).nm} joins your deck.`, 'v');
    closeModal();
    setTimeout(spendRewards, T(120));
  });
}

let GLOSS_PAIRS = null, GLOSS_RE = null;
function buildGloss(){
  GLOSS_PAIRS = [];
  for(const k in GLOSSARY) for(const a of GLOSSARY[k].alias) GLOSS_PAIRS.push([a.toLowerCase(), k]);
  GLOSS_PAIRS.sort((x,y) => y[0].length - x[0].length);
  const esc_ = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  GLOSS_RE = new RegExp('(?<![\\w&])(' + GLOSS_PAIRS.map(p => esc_(p[0])).join('|') + ')(?![\\w])', 'gi');
}
function glossKey(word){
  const w = word.toLowerCase();
  for(const [a, k] of GLOSS_PAIRS) if(a === w) return k;
  return null;
}
/* escape, then mark up every glossary term inside */
function gtx(str){
  if(!GLOSS_RE) buildGloss();
  return esc(str).replace(GLOSS_RE, m => {
    const k = glossKey(m);
    return k ? `<span class="gl" data-g="${k}">${m}</span>` : m;
  });
}
const gword = (k, label) => `<span class="gl" data-g="${k}">${esc(label || GLOSSARY[k].nm)}</span>`;

/* ---------- the shared tooltip ---------- */
function showTip(el, title, body, owner){
  const t = $('#tip');
  t.innerHTML = `<b class="tt">${title}</b>${body}`;
  t.classList.add('on');
  V.tipOwner = owner || 'x';
  const r = el.getBoundingClientRect();
  const w = t.offsetWidth || 280;
  let left = r.left + r.width/2 - w/2;
  left = Math.min(innerWidth - w - 8, Math.max(8, left));
  let top = r.bottom + 8;
  if(top + t.offsetHeight > innerHeight - 8) top = Math.max(8, r.top - t.offsetHeight - 8);
  t.style.left = left + 'px';
  t.style.top = top + 'px';
}
function hideTip(owner){
  if(owner && V.tipOwner !== owner) return;
  $('#tip').classList.remove('on');
  V.tipOwner = null;
}
function wireGlossary(){
  const find = e => e.target && e.target.closest && e.target.closest('.gl[data-g]');
  document.addEventListener('mouseover', e => {
    const el = find(e); if(!el) return;
    const g = GLOSSARY[el.dataset.g]; if(!g) return;
    showTip(el, g.ic + ' ' + g.nm, g.tx, 'gloss');
  });
  document.addEventListener('mouseout', e => { if(find(e)) hideTip('gloss'); });
  // touch: a tap explains the term, unless it sits inside a button that does something else
  document.addEventListener('click', e => {
    const el = find(e); if(!el) return;
    if(el.closest('button')) return;
    const g = GLOSSARY[el.dataset.g]; if(!g) return;
    e.stopPropagation();
    showTip(el, g.ic + ' ' + g.nm, g.tx, 'gloss');
    clearTimeout(V.tipTimer);
    V.tipTimer = setTimeout(() => hideTip('gloss'), 5000);
  });
}
function openGlossary(back){
  const groups = {};
  for(const k in GLOSSARY){ const g = GLOSSARY[k]; (groups[g.grp] = groups[g.grp] || []).push(g); }
  modal({
    ic:'📖', h:'What Everything Means', wide:true,
    sub:'Hover any underlined word anywhere in the game to get this without opening a menu',
    b: Object.keys(groups).map(grp => `
      <h3 style="margin:14px 0 7px">${esc(grp)}</h3>
      ${groups[grp].map(g => `<div class="item" style="align-items:flex-start">
        <div class="ic">${g.ic}</div>
        <div><div class="nm">${esc(g.nm)}</div><div class="tx">${g.tx}</div></div>
      </div>`).join('')}`).join(''),
    f:[{lb:'Back', cls:'primary', fn:()=>{ closeModal(); if(back) back(); else if(S) render(); else renderTitle(); }}],
    onClose: back,
  });
}
