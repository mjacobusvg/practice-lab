   ========================================================================= */
function modal(o){
  const sc = $('#scrim');
  hideTip();
  V.hover = null;
  sc.classList.remove('hidden');
  sc.innerHTML = `<div class="modal ${o.wide?'wide':''}">
    <div class="mh"><div class="ic">${o.ic||'📜'}</div><div style="flex:1"><h2>${o.h||''}</h2>${o.sub?`<div class="tiny muted">${o.sub}</div>`:''}</div>
      ${o.noClose ? '' : '<button class="btn sm ghost" id="mClose">Close</button>'}</div>
    <div class="mb">${o.b||''}</div>
    ${(o.f && o.f.length) ? `<div class="mf">${o.f.map((b,i)=>`<button class="btn ${b.cls||''}" data-f="${i}" ${b.id?`id="${b.id}"`:''} ${b.dis?'disabled':''}>${b.lb}</button>`).join('')}</div>` : ''}
  </div>`;
  if(!o.noClose) $('#mClose').onclick = () => { closeModal(); if(o.onClose) o.onClose(); save(); render(); };
  (o.f||[]).forEach((b,i) => { if(b.fn) sc.querySelector(`[data-f="${i}"]`).onclick = b.fn; });
  sc.onclick = e => { if(e.target === sc && !o.noClose){ closeModal(); if(o.onClose) o.onClose(); save(); render(); } };
}
function closeModal(){ const sc = $('#scrim'); sc.classList.add('hidden'); sc.innerHTML = ''; sc.onclick = null; }
function flash(msg){
  const el = document.createElement('div');
  el.className = 'float';
  el.style.cssText += 'left:50%;top:22%;transform:translateX(-50%);color:#e8b44a;font-size:15px;background:rgba(10,16,26,.95);padding:8px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.18)';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}
function floatText(t, col, anchorSel){
  const a = $(anchorSel);
  const r = a ? a.getBoundingClientRect() : {left:innerWidth/2-20, top:innerHeight/2, width:40};
  const el = document.createElement('div');
  el.className = 'float'; el.style.color = col;
  el.style.left = (r.left + r.width/2) + 'px'; el.style.top = (r.top + 30) + 'px';
  el.textContent = t;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}
function tipOn(el, title, body){
  el.addEventListener('mouseenter', () => showTip(el, title, body, 'x'));
  el.addEventListener('mouseleave', () => hideTip('x'));
}

const slotOf = it => it.slot === 'trinket' ? 'trinket1' : it.slot;
function equipItem(id){
  const it = ITEM(id);
  const h = S.hero;
  let slot = it.slot;
  if(slot === 'trinket'){
    slot = !h.gear.trinket1 ? 'trinket1' : (!h.gear.trinket2 ? 'trinket2' : (V.trinketSlot || 'trinket1'));
  }
  const old = h.gear[slot];
  h.gear[slot] = id;
  h.bag.splice(h.bag.indexOf(id), 1);
  if(old) h.bag.push(old);
  S.hero.hp = Math.min(S.hero.hp, D().maxHp);
  log(`Equipped ${it.nm}.`, 'y');
  openInventory();
  save(); render();
}
function unequip(slot){
  const h = S.hero;
  if(!h.gear[slot]) return;
  h.bag.push(h.gear[slot]);
  h.gear[slot] = null;
  S.hero.hp = Math.min(S.hero.hp, D().maxHp);
  openInventory(); save(); render();
}

        </div>

  $$('#scrim [data-eq]').forEach(b => b.onclick = () => {

    if(it.slot === 'trinket' && h.gear.trinket1 && h.gear.trinket2){

        f:[

  });

    openInventory(); save(); render();
  });
  $$('#scrim [data-use]').forEach(b => b.onclick = () => { useItem(bag[+b.dataset.use].id); });
}

function useItem(id, inCombat){
  const it = ITEM(id);
  const h = S.hero, d = D(), C = V.combat;
  const consume = () => { const i = h.bag.indexOf(id); if(i >= 0) h.bag.splice(i,1); };
  const combatOnly = ['fury','stone','sharp','stagger','rrs','bomb'];
  if(combatOnly.includes(it.use) && (!C || C.done)){ flash('Only useful in a fight.'); return; }
  switch(it.use){
    case 'heal8': healHero(8, it.nm); break;
    case 'heal16': healHero(16, it.nm); break;
    case 'heal30': healHero(30, it.nm); break;
    case 'energy3': h.en = clamp(h.en + 3, 0, d.maxEn); log('+3 energy.', 'b'); break;
    case 'rations': healHero(5, it.nm); h.en = clamp(h.en + 2, 0, d.maxEn); break;
    case 'wine': healHero(10, it.nm); h.en = d.maxEn; break;
    case 'cure': if(C){ C.me.burn = 0; C.me.poison = 0; } healHero(4, it.nm); break;
    case 'fury': C.me.fury += 5; cLog('Fury oil. +5 attack this round.', 'y'); break;
    case 'sharp': C.me.sharp = (C.me.sharp||0); C.me.fury += 0; C.sharp = (C.sharp||0) + 2; cLog('Edge honed. +2 attack for the fight.', 'y'); break;
    case 'stone': C.me.stone = 1; cLog('Your skin goes hard as flint.', 'y'); break;
    case 'stagger': C.foe.stun = 2; cLog(`${C.foe.nm} reels.`, 'y'); break;
    case 'rrs': C.rrLeft += 3; cLog('+3 rerolls.', 'y'); break;
    case 'bomb': dealToFoe(14, 'the bomb', true); break;
    case 'flee': if(C && !C.opts.boss){ V.combat = null; closeModal(); recoverDiscards(); log('You vanish into the smoke.', 'y'); consume(); save(); render(); return; } flash('Not from this one.'); return;
    case 'reveal': { const n = reveal(S.pos, 3); log(`${plural(n,'hex')} revealed.`, 'b'); break; }
    case 'boat': { V.boat = true; flash('You may cross one water hex this turn.'); break; }
    default: break;
  }
  consume();
  save();
  if(C) renderCombat(); else { if(!$('#scrim').classList.contains('hidden')) openInventory(); render(); }
}

function relicChoice(){
  const held = new Set(S.hero.bag.concat(Object.values(S.hero.gear)));
  let pool = RELICS().filter(r => !held.has(r.id));
  if(pool.length < 2) pool = RELICS();
  const two = shuffle(pool).slice(0,2);
  modal({ic:'💠', h:'The Hoard', noClose:true,
    b:`<p class="muted">Whatever it was hoarding is yours now. You can carry one of these out.</p><div class="sep"></div>` +
      two.map((r,i) => `<button class="choice" data-rel="${i}"><b>${r.ic} ${esc(r.nm)}</b><div class="sub">${esc(r.tx)}</div>
        <div class="mini faint" style="margin-top:3px">Relic · ${SLOTNM[r.slot]}</div></button>`).join(''),
    f:[]});
  $$('#scrim [data-rel]').forEach(b => b.onclick = () => {
    giveItem(two[+b.dataset.rel].id);

  });
}

function townRank(m){ return m.feat === 'city' ? 3 : m.feat === 'town' ? 2 : 1; }
function stockFor(m){
  const k = key(m.q,m.r);
  const bucket = Math.floor(S.day / 4);
  const id = k + ':' + bucket;
  if(S.shops[id]) return S.shops[id];
  const rank = townRank(m);
  const n = rank === 3 ? 10 : rank === 2 ? 7 : 5;
  const pool = ITEMS.filter(i => !i.relic && i.tier <= rank + (rank === 3 ? 1 : 0));
  const stock = [];
  const seen = new Set();
  for(let i=0;i<40 && stock.length < n;i++){
    const it = pick(pool);
    if(seen.has(it.id) && it.slot !== 'use') continue;
    seen.add(it.id);
    stock.push(it.id);
  }
  S.shops[id] = stock;
  return stock;
}
function priceOf(it){
  const d = D();
  return Math.max(4, Math.round(it.cost * (1 - d.haggle/100)));
}
function openTown(m){
  const F = FEATS[m.feat];

  const rank = townRank(m);
  const innCost = 8 + S.hero.lvl * 4;

  modal({

        </div>
        <div>
          <button class="choice" id="tBounty"><b>📋 Bounty board</b><div class="sub">${S.bounty ? 'You have one open.' : 'Somebody always wants something dead.'}</div></button>
          ${rank === 3 ? `<button class="choice" id="tTrain" ${S.hero.gold < 140 ? 'disabled' : ''}>
            <b>🎴 Train — 140g</b><div class="sub">Draft a talent from three.</div></button>` : ''}
          ${rank >= 2 ? `<button class="choice" id="tMap" ${S.hero.gold < 30 ? 'disabled' : ''}>
            <b>🗺️ Buy charts — 30g</b><div class="sub">Reveal a wide ring of country around the town.</div></button>` : ''}
          <button class="choice" id="tRumour"><b>🗣️ Listen in the taproom</b><div class="sub">Free. Marks the nearest lair you have not broken.</div></button>
        </div>
      </div>
      <div class="sep"></div>
      <div class="row wr tiny muted">
        <span class="sb">❤️ ${S.hero.hp}/${d.maxHp}</span>
        <span class="sb">⚡ ${S.hero.en}/${d.maxEn}</span>

      </div>`,
    f:[{lb:'Character card', fn:()=>{ closeModal(); openCard(); }}, {lb:'Leave', cls:'ghost', fn:()=>{ closeModal(); save(); render(); }}],
  });
  const wire = (id, fn) => { const el = $('#'+id); if(el) el.onclick = fn; };

function openShop(o){
  const stock = o.stock || (function(){
    const pool = ITEMS.filter(i => !i.relic && i.tier <= (o.tier||2));
    return shuffle(pool).slice(0,6).map(i => i.id);
  })();
  const body = stock.length ? stock.map((id,i) => {
    const it = ITEM(id); if(!it) return '';
    const p = Math.round(priceOf(it) * (o.mark || 1));
    return itemCard(it, `<div class="col" style="gap:4px;align-items:flex-end">
      <div class="tiny" style="color:var(--gold);font-weight:700">${p}g</div>
      <button class="btn sm ${S.hero.gold >= p ? 'primary' : ''}" data-buy="${i}" ${S.hero.gold < p ? 'disabled' : ''}>Buy</button></div>`);
  }).join('') : '<div class="tiny faint">Sold out.</div>';
  modal({
    ic:'🏪', h:o.nm || 'Market', wide:true, sub:`${S.hero.gold} gold`,
    b:body,
    f:[{lb:'Sell instead', fn:()=>openSell(()=>openShop(o))}, {lb:'Done', cls:'primary', fn:()=>{ closeModal(); if(o.back) o.back(); else { save(); render(); } }}],
  });
  $$('#scrim [data-buy]').forEach(b => b.onclick = () => {
    const i = +b.dataset.buy;
    const it = ITEM(stock[i]);
    const p = Math.round(priceOf(it) * (o.mark || 1));
    if(S.hero.gold < p) return;
    S.hero.gold -= p;
    S.hero.bag.push(it.id);
    stock.splice(i,1);
    log(`Bought ${it.nm} for ${p}g.`, 'y');
    save(); openShop(o);
  });
}
function openSell(back){
  const bag = S.hero.bag.map(id => ITEM(id)).filter(Boolean);
  modal({
    ic:'💰', h:'Sell', wide:true, sub:`${S.hero.gold} gold`,
    b: bag.length ? bag.map((it,i) => itemCard(it, `<div class="col" style="gap:4px;align-items:flex-end">
        <div class="tiny" style="color:var(--gold);font-weight:700">${Math.round(it.cost*0.45)}g</div>
        <button class="btn sm" data-s="${i}">Sell</button></div>`)).join('') : '<div class="tiny faint">Your pack is empty.</div>',
    f:[{lb:'Done', cls:'primary', fn:()=>{ closeModal(); if(back) back(); else { save(); render(); } }}],
  });
  $$('#scrim [data-s]').forEach(b => b.onclick = () => {
    const it = bag[+b.dataset.s];
    S.hero.bag.splice(S.hero.bag.indexOf(it.id), 1);

function dieFaceHtml(die, cls, idx){

  if(die.d) parts.push(`<span style="color:#7fe6b6">🛡${die.d}</span>`);
  const blank = !die.a && !die.d && !die.s;
  return `<div class="cdie ${DICE[die.k].cls} ${die.mark?'rr':''} ${blank?'blank':''} ${die.fresh?'roll':''}" ${idx!=null?`data-die="${idx}"`:''}>
    <div class="fc">${blank ? '—' : parts.join('')}</div>
    ${die.s ? `<div class="sg">✦${die.s>1?die.s:''}</div>` : ''}

function statusChips(o){
  const out = [];
  if(o.burn) out.push(`<span class="status gl" data-g="burn" style="color:#fb923c">🔥 burning ${o.burn}</span>`);
  if(o.poison || o.psn) out.push(`<span class="status gl" data-g="venom" style="color:#a3e635">🧪 venom ${o.poison||o.psn}</span>`);
  if(o.stun) out.push(`<span class="status gl" data-g="stagger" style="color:#e8b44a">💫 staggered</span>`);
  if(o.hexed) out.push(`<span class="status gl" data-g="hexed" style="color:#a78bfa">🔯 hexed</span>`);
  if(o.stone) out.push(`<span class="status gl" data-g="stone" style="color:#38bdf8">🪨 stoneskin</span>`);
  if(o.curseNow) out.push(`<span class="status gl" data-g="sap" style="color:#f472b6">🩶 hitting ${o.curseNow} softer</span>`);
  return out.join('');
}
function intentHtml(){
  const C = V.combat, it = C.intent;
  if(!it) return '';
  const bits = [];
  if(it.atk) bits.push(`<b class="gl" data-g="attack" style="color:#ff9b99">⚔ +${it.atk}</b>`);
  if(it.sh) bits.push(`<b class="gl" data-g="shields" style="color:#7fe6b6">🛡 +${it.sh}</b>`);
  if(it.heal) bits.push(`<b style="color:#7fe6b6">✚ heals ${it.heal}</b>`);
  if(it.pierce) bits.push(`<span class="gl" data-g="pierce" style="color:var(--gold)">pierce</span>`);
  if(it.stun) bits.push(`<span class="gl" data-g="knockdown" style="color:var(--gold)">knockdown</span>`);
  if(it.leech) bits.push(`<span class="gl" data-g="leech" style="color:var(--gold)">feeds</span>`);
  if(it.psn) bits.push(`<span class="gl" data-g="venom" style="color:var(--lime)">venom</span>`);
  if(it.burn) bits.push(`<span class="gl" data-g="burn" style="color:var(--orange)">burn</span>`);
  if(it.curse) bits.push(`<span class="gl" data-g="sap" style="color:var(--pink)">saps you</span>`);
  return `<div class="intent">
    <div class="spread"><div class="tiny muted"><span class="gl" data-g="intent">Its intent this round</span></div>
      <span class="initb gl" data-g="initiative">${it.init}</span></div>
    <div class="inm">${esc(it.nm)}</div>
    <div class="row wr tiny" style="gap:9px;margin-top:3px">${bits.join('')}</div>
  </div>`;
}
function acardHtml(id){
  const C = V.combat, c = CARD(id);
  if(!c) return '';
  const topOn = C.pickTop === id, botOn = C.pickBot === id;
  const topTaken = C.pickTop && !topOn, botTaken = C.pickBot && !botOn;
  return `<div class="acard ${topOn||botOn?'on':''}">
    <div class="ahd"><span class="initb">${c.init}</span><span class="aic">${c.ic}</span><span class="anm">${esc(c.nm)}</span></div>
    <button class="ahalf top ${topOn?'sel':''}" data-card="${id}" data-half="top" ${topTaken?'disabled':''}>
      <span class="lbl">Top</span><span class="atx">${gtx(c.top.tx)}</span></button>
    <button class="ahalf bot ${botOn?'sel':''}" data-card="${id}" data-half="bot" ${botTaken?'disabled':''}>
      <span class="lbl">Bottom</span><span class="atx">${gtx(c.bot.tx)}</span></button>
  </div>`;
}
function renderCombat(){
  const C = V.combat;
  if(!C || C.paid) return;
  const d = D();
  const h = S.hero;
  const cards = C.phase === 'cards';
  const p = C.play || {};
  const it = C.intent || {};

  // previewed numbers (dice phase only)
  const mine = cards ? 0 : myAttack();
  const fsh = C.pend.pierce ? 0 : foeShields();
  const toFoe = cards ? 0 : Math.max(0, mine - fsh - (C.foe.arm||0));
  const fatk = cards ? 0 : foeAttackVal();
  const msh = (C.foe.crush || it.pierce) ? 0 : myShields();
  const toMe = cards ? 0 : Math.max(0, fatk - msh - d.arm - myWard());
  const surges = cards ? 0 : mySurges();
  const usables = h.bag.map(id => ITEM(id)).filter(i => i && i.slot === 'use');
  const meFirst = (C.myInit || 99) <= (it.init || 99);

  const body = `
    <div class="duel">
      <div class="fighter me" id="meCard">
        <div class="nm">${h.ic} ${esc(h.nm)}</div>
        <div class="hpbar"><i style="width:${clamp(h.hp/d.maxHp*100,0,100)}%"></i></div>
        <div class="spread tiny"><span class="muted">${Math.max(0,h.hp)} / ${d.maxHp} HP</span><span class="muted">⚡ ${h.en}/${d.maxEn}</span></div>
        <div>${statusChips(C.me)}</div>
        ${cards ? `<div class="tiny muted" style="margin-top:9px">
            <span class="gl" data-g="hand">Hand <b style="color:var(--ink)">${h.hand.length}</b></span> · <span class="gl" data-g="discard">discard ${h.discard.length}</span> · <span class="gl" data-g="lost">lost ${h.lost.length}</span></div>`
          : `<div class="tray" style="margin-top:9px">${C.myDice.length ? C.myDice.map((x,i)=>dieFaceHtml(x,'',i)).join('') : '<span class="tiny faint">No dice — you spent the round recovering.</span>'}</div>
            <div class="tot">
              <span class="gl" data-g="attack">⚔ Attack <b>${mine}</b></span>
              <span class="gl" data-g="shields">🛡 Shields <b>${msh + d.arm + myWard()}</b></span>
              <span class="gl" data-g="surge" style="color:var(--gold)">✦ Surges <b>${surges}</b></span>
              <span class="${meFirst?'':'faint'}" style="color:${meFirst?'var(--green)':''}">${meFirst ? '⚡ you swing first' : '⏱ it swings first'}</span>
            </div>`}
      </div>
      <div class="fighter foe" id="foeCard">
        <div class="nm">${C.foe.ic} ${esc(C.foe.nm)} <span class="pill t${clamp(C.foe.tier,1,4)}" style="margin-left:auto">T${C.foe.tier}</span></div>
        <div class="hpbar"><i style="width:${clamp(C.foe.hp/C.foe.maxHp*100,0,100)}%"></i></div>
        <div class="spread tiny"><span class="muted">${Math.max(0,C.foe.hp)} / ${C.foe.maxHp} HP</span><span class="muted">Armor ${C.foe.arm}</span></div>
        <div>${statusChips(C.foe)}</div>
        ${intentHtml()}
        ${cards ? '' : `<div class="tray" style="margin-top:9px">${C.foeDice.map(x=>dieFaceHtml(x)).join('')}</div>
          <div class="tot">
            <span class="gl" data-g="attack">⚔ Attack <b>${fatk}</b></span>
            <span class="gl" data-g="shields">🛡 Shields <b>${foeShields() + C.foe.arm}</b></span>
          </div>`}
      </div>
    </div>

    ${cards ? `
      <div class="card" style="margin-top:11px${C.mustRest ? ';border-color:rgba(232,180,74,.55)' : ''}">
        <div class="spread">
          <div class="tiny">${C.mustRest
            ? `<b style="color:var(--gold)">You are out of cards.</b> <span class="muted">${gtx('Catch your breath to pull your discard back, or break off.')}</span>`
            : `<b>${gtx('Play a top and a bottom.')}</b> <span class="muted">${gtx('The card you take the top from sets your initiative — lower swings first.')}</span>`}</div>
          <button class="btn sm ${C.mustRest ? 'primary' : 'ghost'}" id="cBreath" ${h.discard.length >= 2 ? '' : 'disabled'}>😮‍💨 Catch your breath</button>
        </div>
        <div class="row wr tiny" style="margin-top:6px">
          <span class="sb">Top: <b>${C.pickTop ? esc(CARD(C.pickTop).nm) : '—'}</b></span>
          <span class="sb">Bottom: <b>${C.pickBot ? esc(CARD(C.pickBot).nm) : '—'}</b></span>
          <span class="sb gl" data-g="initiative">Initiative: <b>${C.pickTop ? CARD(C.pickTop).init : '—'}</b> vs <b>${it.init}</b></span>
        </div>
      </div>
      <div class="hand" ${C.mustRest ? 'style="opacity:.45;pointer-events:none"' : ''}>${h.hand.map(acardHtml).join('')}</div>
      ${h.lost.length ? `<div class="tiny faint" style="margin-top:8px">Lost this day: ${h.lost.map(i=>esc(CARD(i).nm)).join(', ')}. Camping brings them back.</div>` : ''}
    ` : `
      ${C.shown && !C.resting ? `<div class="played">
        <div class="pl"><span class="lbl">Top</span><b>${esc(C.shown.topNm)}</b> <span class="muted">${esc(C.shown.topTx)}</span></div>
        <div class="pl"><span class="lbl">Bot</span><b>${esc(C.shown.botNm)}</b> <span class="muted">${esc(C.shown.botTx)}</span></div>
      </div>` : ''}
      <div class="card" style="margin-top:11px">
        <div class="spread">
          <div class="tiny"><b style="color:var(--green)">You deal ${toFoe}</b> · <b style="color:#ff9b99">you take ${toMe}</b></div>
          <div class="row">
            <span class="tiny muted">Rerolls ${C.rrLeft}</span>
            <button class="btn sm ${C.myDice.some(x=>x.mark) ? 'primary' : ''}" id="cRR" ${C.rrLeft <= 0 || !C.myDice.some(x=>x.mark) ? 'disabled' : ''}>🎲 Reroll ${C.myDice.filter(x=>x.mark).length || 'marked'}</button>
          </div>
        </div>
        <div class="mini faint" style="margin-top:4px">${C.resting ? 'You spent the round recovering. Take the hit.' : gtx('Click your own dice to mark them (dashed outline), then hit Reroll. Spend surges, then strike.')}</div>
      </div>

      ${surges > 0 ? `<div style="margin-top:10px">
        <div class="tiny muted" style="margin-bottom:5px">Spend surges (${surges} available)</div>
        ${surgeOptions().map(s => {
          const so = SURGES[s];
          const can = surges >= so.cost;
          return `<div class="surge-opt ${can?'can':''}" ${can?`data-surge="${s}"`:''} style="${can?'cursor:pointer':'opacity:.4'}">
            <div><b>${gtx(so.nm)}</b> <span class="muted">${gtx(so.tx)}</span></div>
            <div style="color:var(--gold);font-weight:700">${'✦'.repeat(so.cost)}</div></div>`;
        }).join('')}
      </div>` : ''}

      ${usables.length ? `<div style="margin-top:10px">
        <div class="tiny muted" style="margin-bottom:5px">Pack</div>
        <div class="row wr">${usables.map(i => `<button class="btn sm" data-uitem="${i.id}">${i.ic} ${esc(i.nm)}</button>`).join('')}</div>
      </div>` : ''}
    `}

    <div class="log" style="height:${cards ? 78 : 96}px;margin-top:11px">${C.hist.slice(-16).map(l => {
      const m = /^§(\w+)§/.exec(l); const cls = m?m[1]:''; const t = m?l.slice(m[0].length):l;
      return `<div class="${cls}">${esc(t)}</div>`;
    }).join('')}</div>`;

  modal({
    ic: C.foe.ic, h: C.foe.nm, wide:true, noClose:true,
    sub:`Round ${C.round}${C.opts.boss ? ' · no retreat' : ''}${MSPEC[C.foe.spec] ? ' · ' + gtx(MSPEC[C.foe.spec].nm + ': ' + MSPEC[C.foe.spec].tx) : ''}`,
    b: body,
    f: cards
      ? [ {lb:'📖 Terms', cls:'ghost', fn:()=>openGlossary(renderCombat)},
          ...(C.opts.boss ? [] : [{lb:'🏃 Break away', cls:'ghost', fn:tryFlee}]),
          C.mustRest
            ? {lb:'😮‍💨 Catch your breath', cls:'primary', fn:catchBreath, dis: h.discard.length < 2}
            : {lb:'▶️ Commit', cls:'primary', fn:commitCards, dis: !(C.pickTop && C.pickBot)} ]
      : [ {lb:'📖 Terms', cls:'ghost', fn:()=>openGlossary(renderCombat)},
          ...(C.opts.boss ? [] : [{lb:'🏃 Break away', cls:'ghost', fn:tryFlee}]),
          {lb:'⚔️ Strike', cls:'primary', fn:strike, dis: C.phase !== 'dice' || C.done} ],
  });

  $$('#scrim [data-card]').forEach(el => el.onclick = () => pickHalf(el.dataset.card, el.dataset.half));
  const breath = $('#cBreath'); if(breath) breath.onclick = catchBreath;
  const rrBtn = $('#cRR'); if(rrBtn) rrBtn.onclick = doReroll;
  $$('#scrim [data-die]').forEach(el => el.onclick = () => {
    const i = +el.dataset.die;
    const marked = C.myDice.filter(x=>x.mark).length;
    if(!C.myDice[i].mark && marked >= C.rrLeft){ flash('No rerolls left for that many.'); return; }
    C.myDice[i].mark = !C.myDice[i].mark;
    renderCombat();
  });
  $$('#scrim [data-surge]').forEach(el => el.onclick = () => spendSurge(el.dataset.surge));
  $$('#scrim [data-uitem]').forEach(el => el.onclick = () => useItem(el.dataset.uitem, true));
  C.myDice.forEach(x => x.fresh = false);
}

function render(){
  if(V.screen === 'title'){ renderTitle(); return; }
  renderTop();
  const app = $('#app');
  if(!$('#map')){
    app.innerHTML = `
      <div id="game">
        <div class="mapwrap">
          <canvas id="map"></canvas>
          <div class="mapctl">
            <button id="zIn" title="Zoom in">+</button>
            <button id="zOut" title="Zoom out">−</button>

          </div>
          <div class="maplegend" id="legend"></div>
        </div>
        <div class="side" id="side"></div>
      </div>`;
    cv = $('#map'); ctx = cv.getContext('2d');
    wireCanvas();
    sizeCanvas(); centreOnHero();
  }
  renderSide();
  drawMap();
  renderLog();
}
function renderTop(){

    <div class="brand">HEX<span class="d">BOUND</span></div>

    <span class="stat" title="Health">❤️ <b>${Math.max(0,h.hp)}</b>/${d.maxHp}
      <span class="bar hp"><i style="width:${clamp(h.hp/d.maxHp*100,0,100)}%"></i></span></span>

function renderSide(){
  const m = hereHex();
  const F = m.feat && FEATS[m.feat];
  const d = D();
  const T = TERRA[m.t];
  const free = freeDice().length;
  const canExplore = !m.explored || (F && F.kind === 'town') || (F && F.kind === 'lair' && !m.cleared) || (F && F.kind === 'gate') || (F && F.kind === 'site' && !m.used);
  const exploreLabel = F && F.kind === 'town' ? `Enter ${F.nm}` : F && F.kind === 'lair' ? 'Descend into the lair'
    : F && F.kind === 'gate' ? 'Approach the gate' : m.explored ? 'Search again' : 'Explore this hex';

  $('#side').innerHTML = `
    <div class="card">
      <div class="spread"><h3>${F ? F.ic + ' ' + (m.feat==='city'?'Kestrel Hold':F.nm) : T.ic + ' ' + T.nm}</h3>
        <span class="pill t${clamp(m.tier,1,4)}">Tier ${m.tier}</span></div>
      <div class="tiny muted">${F ? esc(F.tx) : (m.explored ? 'You have been over this ground already.' : 'Unsearched.')}</div>
      <div class="row wr tiny" style="margin-top:7px">
        <span class="sb">${T.ic} ${T.nm}</span>
        ${m.road ? '<span class="sb">🛤️ Road</span>' : ''}
        ${m.explored ? '<span class="sb">✔️ Explored</span>' : '<span class="sb" style="color:var(--gold)">● Unexplored</span>'}

      <div class="col" style="margin-top:10px">
        <button class="btn wide ${canExplore?'primary':''}" id="aExplore" ${canExplore?'':'disabled'}>${exploreLabel}</button>
        <div class="row">
          <button class="btn sm" id="aCamp" style="flex:1">⛺ Make camp</button>
          <button class="btn sm" id="aDay" style="flex:1">🌙 End the day</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="spread"><h3>Travel</h3><span class="tiny muted">${free} of ${S.dice.length} left</span></div>
      <div class="tray" style="margin-top:7px">${S.dice.map((x,i) => `
        <div class="mdie ${x.spent?'spent':''} ${x.f==='wild'?'wild':''} ${V.rolled?'roll':''}" data-mdie="${i}">
          <div>${MFACE[x.f].ic}</div><div class="lb">${MFACE[x.f].lb}</div>
        </div>`).join('')}</div>
      <div class="mini faint" style="margin-top:7px">${gtx('Click a neighbouring hex to move. You spend a travel die matching its ground; a wild face goes anywhere; roads take any face; mountains cost two dice; water needs a boat.')}</div>
      <button class="btn sm wide ${V.forceMove?'primary':''}" id="aForce" style="margin-top:8px" ${free<2?'disabled':''}>
        ${V.forceMove ? '✦ Pick a hex (or cancel)' : '✦ Force a path — spend 2 dice, go anywhere'}</button>
    </div>

    ${S.bounty ? `<div class="card"><div class="spread"><h3>📋 Bounty</h3>${S.bounty.done?'<span class="pill t1">Ready</span>':''}</div>
      <div class="tiny muted">${esc(S.bounty.nm)} — ${S.bounty.reward}g</div></div>` : ''}

    <div class="log" id="log"></div>
    <div class="row wr">
      <button class="btn sm ghost" id="aCodex">📖 Rules</button>
      <button class="btn sm ghost" id="aTerms">🔤 Terms</button>
      <button class="btn sm ghost" id="aSeals">🔱 Objectives</button>
      <span class="tiny faint" style="margin-left:auto">seed ${esc(S.seed)}</span>
    </div>`;

  $('#aExplore').onclick = exploreHere;
  $('#aCamp').onclick = makeCamp;
  $('#aDay').onclick = () => { log('You let the light go and sleep where you are.'); endDay(); };
  $('#aForce').onclick = () => { V.forceMove = !V.forceMove; render(); };
  $('#aCodex').onclick = openCodex;
  $('#aTerms').onclick = () => openGlossary();
  $('#aSeals').onclick = openObjectives;
  $('#legend').innerHTML = `<span class="lg">${S.hero.ic} you</span><span class="lg">🕳️ lair</span><span class="lg">🌑 gate</span><span class="lg">⚔️ roaming</span><span class="lg" style="color:var(--gold)">● unexplored</span>`;
  V.rolled = false;
}
function makeCamp(){

  log('You make camp and keep the fire small.');
  endDay();
}

       <div class="kv"><span>World hardens at</span><b>12 and 24</b></div>
     </div>`,
    f:[{lb:'Back', cls:'primary', fn:()=>{closeModal();render();}}]});
}

      <div>
        <div class="card"><h3>The day</h3><div class="tiny muted">
          Each dawn you roll travel dice. Spend one whose face matches the ground you are moving onto: 🌾 plains, 🌲 forest, ⛰️ hills, 🏔️ mountain, 🪱 marsh. A ✦ wild face goes anywhere. Roads take any face. Mountains cost two dice. Marsh ends your travel when you enter it. Water needs a boat.
          <br><br>Out of dice, or done for the day? End the day. Dread rises by 1.</div></div>
        <div class="card" style="margin-top:10px"><h3>Exploring</h3><div class="tiny muted">
          Every hex holds something the first time: a fight, an event with real choices, a settlement, a landmark, or quiet ground. Landmarks are one-shot and worth going out of your way for.</div></div>
        <div class="card" style="margin-top:10px"><h3>Skill tests</h3><div class="tiny muted">
          Roll 2d6, add the stat, beat the number. You may spend energy to push, +1 each, up to 3. Double sixes always succeed.</div></div>
      </div>
      <div>
        <div class="card"><h3>Combat</h3><div class="tiny muted">
          Every round the enemy <b style="color:var(--ink)">reveals its intent first</b>. Then you play two ability cards from your hand: the <b style="color:var(--ink)">top half of one</b> and the <b style="color:var(--ink)">bottom half of the other</b>. The card you take the top from sets your initiative, and the lower number swings first — kill it before it acts and it never acts.
          <br><br>Then both sides roll dice as the <b style="color:var(--ink)">modifier</b> on top of those card numbers. Faces show ⚔ attack, 🛡 shields, ✦ surges. Mark dice and reroll them (Wits-many a round, plus gear), spend surges, then strike.
          <br><br>Damage dealt = card + dice + gear − their shields − their armor.</div></div>
        <div class="card" style="margin-top:10px"><h3>Your hand is a second health bar</h3><div class="tiny muted">
          Cards you play go to your <b style="color:var(--ink)">discard</b> and come back when the fight ends. Cards marked LOST are gone until you sleep. If you are ever down to fewer than two cards you break off and run, taking a parting blow.
          <br><br><b style="color:var(--ink)">Catch your breath</b> mid-fight to pull your whole discard back, at the cost of the round and one random card burned for good. You will be made to do it when you run dry, so a long fight is really a question of how many breaths you can afford. Camping, an inn, or simply ending the day returns everything.</div></div>
        <div class="card" style="margin-top:10px"><h3>Levelling</h3><div class="tiny muted">
          XP levels you to 10. Every level hands you the next reward printed on your character card, plus a stat point. Odd levels give you a draft of three talents; even levels give you a <b style="color:var(--ink)">new ability card</b> for your deck. Nothing is random about the track — it is the same every run, so you can plan around it.</div></div>
        <div class="card" style="margin-top:10px"><h3>Winning</h3><div class="tiny muted">
          Three lairs. Break each one for a seal, and dread falls by 4. With all three, the Obsidian Gate opens and you can finish the Sable Crown on your terms. Let dread hit ${(S&&S.dreadMax)||30} and it finishes you on its.</div></div>
      </div>
    </div>`,
    f:[{lb:'🔤 Every term explained', fn:()=>{ closeModal(); openGlossary(); }},
       {lb:'Back', cls:'primary', fn:()=>{closeModal(); if(S) render(); else renderTitle();}}]});
}

/* =========================================================================
   TITLE SCREEN
   ========================================================================= */
function renderTitle(){
  $('#topbar').classList.add('hidden');
  const app = $('#app');
  const sel = V.pickHero || HEROES[0].id;
  app.innerHTML = `
    <div class="title-hero">
      <div class="pill">A solo hex-crawl</div>
      <h1>HEX<span>BOUND</span></h1>
      <p>Ride out of Kestrel Hold. Break three lairs. Kill the thing that has been eating the region,<br>before it finishes the job and comes looking for you.</p>
    </div>
    ${hasSave() ? `<div class="panel center" style="margin-bottom:14px">
      <div class="row" style="justify-content:center"><b>A run is already in progress.</b>
      <button class="btn primary" id="btnResume">Resume</button>
      <button class="btn ghost danger" id="btnWipe">Discard it</button></div></div>` : ''}
    <div class="panel">
      <div class="spread" style="margin-bottom:11px"><h2>Choose a hero</h2>
        <span class="tiny muted">Each has its own ten-level card track</span></div>
      <div class="hero-grid" id="heroGrid">
        ${HEROES.map(h => `
          <div class="hero-card ${h.id===sel?'on':''}" data-h="${h.id}">
            <div class="hd"><div class="av">${h.ic}</div>
              <div><div class="nm">${esc(h.nm)}</div>
              <div class="tiny muted">${h.hp} HP · ${h.move} travel dice</div></div></div>
            <div class="desc">${esc(h.desc)}</div>
            <div class="statline">
              ${Object.keys(STATNM).map(k => `<span class="sb">${STATIC[k]} ${STATNM[k].slice(0,3)} <b>${h.stats[k]}</b></span>`).join('')}
            </div>
            <div class="sep" style="margin:9px 0"></div>
            <div class="tiny"><b style="color:var(--gold)">${esc(h.power.nm)}</b><div class="muted">${esc(h.power.tx)}</div></div>
            <div class="tiny muted" style="margin-top:7px">Pool: ${h.dice.map(k=>DICE[k].ic).join(' ')} · deck of ${(CARDS[h.id]||[]).length} abilities nobody else can play</div>
          </div>`).join('')}
      </div>
      <div class="sep"></div>
      <div class="row wr">
        <div style="flex:1;min-width:200px">
          <div class="tiny muted" style="margin-bottom:4px">Seed (optional — same seed, same region)</div>
          <input class="inp" id="seedIn" placeholder="leave blank for a new region" maxlength="12">
        </div>
        <button class="btn primary" id="btnStart" style="align-self:flex-end;padding:11px 26px">Ride out</button>
        <button class="btn ghost" id="btnHelp" style="align-self:flex-end">📖 How it works</button>
      </div>
    </div>
    <div class="panel" style="margin-top:14px">
      <h2 style="margin-bottom:8px">What this is</h2>
      <div class="grid2">
        <div class="tiny muted">
          <p><b style="color:var(--ink)">Travel is a dice puzzle.</b> You roll terrain dice each dawn and spend them to cross ground that matches. Where you can get to is never quite where you wanted to go.</p>
          <p style="margin-top:8px"><b style="color:var(--ink)">The map is unknown.</b> A region of 91 hexes, generated fresh, revealed as you push into it. Settlements, landmarks, lairs and one gate.</p>
        </div>
        <div class="tiny muted">
          <p><b style="color:var(--ink)">Fights are cards over dice.</b> The enemy shows its intent, then you play the top of one ability card and the bottom of another, and initiative decides who swings first. Your dice are the modifier rolled on top, so gear still changes what you roll.</p>
          <p style="margin-top:8px"><b style="color:var(--ink)">Dread is the clock.</b> It rises every day and hardens the whole region twice on the way up. Breaking a lair pushes it back. You are always trading time for strength.</p>
        </div>
      </div>
    </div>`;
  $$('#heroGrid [data-h]').forEach(el => el.onclick = () => { V.pickHero = el.dataset.h; renderTitle(); });
  $('#btnStart').onclick = () => {
    newRun(V.pickHero || HEROES[0].id, $('#seedIn').value);
    V.screen = 'game';
    $('#app').innerHTML = '';
    render();
    setTimeout(() => { sizeCanvas(); centreOnHero(); drawMap(); }, 30);
  };
  $('#btnHelp').onclick = openCodex;
  if($('#btnResume')) $('#btnResume').onclick = () => {
    if(load()){ V.screen = 'game'; $('#app').innerHTML = ''; render(); setTimeout(()=>{ sizeCanvas(); centreOnHero(); drawMap(); }, 30); }
  };
  if($('#btnWipe')) $('#btnWipe').onclick = () => { clearSave(); renderTitle(); };
}

/* =========================================================================
   CANVAS INPUT
   ========================================================================= */
function wireCanvas(){
  let down = null, moved = false;
  const pos = e => ({x: (e.touches ? e.touches[0].clientX : e.clientX), y: (e.touches ? e.touches[0].clientY : e.clientY)});
  const start = e => { if(modalOpen()) return; const p = pos(e); down = {x:p.x, y:p.y, cx:V.cam.x, cy:V.cam.y}; moved = false; cv.classList.add('drag'); };
  const move = e => {
    const p = pos(e);
    if(down){
      const dx = p.x - down.x, dy = p.y - down.y;
      if(Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
      V.cam.x = down.cx - dx; V.cam.y = down.cy - dy;
      drawMap();
    } else if(!e.touches){
      if(modalOpen()){ if(V.hover){ V.hover = null; drawMap(); } hideTip('map'); return; }
      const h = canvasHex(e);
      const k = key(h.q,h.r);
      if(S.map[k]){ if(!V.hover || V.hover.q !== h.q || V.hover.r !== h.r){ V.hover = h; drawMap(); showHexTip(e, S.map[k]); } }
      else if(V.hover){ V.hover = null; drawMap(); hideTip('map'); }
    }
  };
  const end = e => {
    cv.classList.remove('drag');
    if(down && !moved){
      const ev = e.changedTouches ? {clientX:e.changedTouches[0].clientX, clientY:e.changedTouches[0].clientY} : e;
      const h = canvasHex(ev);
      onHexClick(h);
    }
    down = null;
  };
  cv.addEventListener('mousedown', start);
  window.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  cv.addEventListener('mouseleave', () => { V.hover = null; hideTip('map'); drawMap(); });
  cv.addEventListener('touchstart', start, {passive:true});
  cv.addEventListener('touchmove', move, {passive:true});
  cv.addEventListener('touchend', end);
  cv.addEventListener('wheel', e => { e.preventDefault(); V.zoom = clamp(V.zoom * (e.deltaY > 0 ? 0.92 : 1.08), 0.55, 1.9); drawMap(); }, {passive:false});
  $('#zIn').onclick = () => { V.zoom = clamp(V.zoom * 1.15, 0.55, 1.9); centreOnHero(); drawMap(); };
  $('#zOut').onclick = () => { V.zoom = clamp(V.zoom / 1.15, 0.55, 1.9); centreOnHero(); drawMap(); };
  $('#zHome').onclick = () => { centreOnHero(); drawMap(); };
  window.addEventListener('resize', () => { sizeCanvas(); centreOnHero(); drawMap(); });
}
function onHexClick(h){
  const k = key(h.q,h.r);
  const m = S.map[k];
  if(!m) return;
  if(h.q === S.pos.q && h.r === S.pos.r){ exploreHere(); return; }
  if(hexDist(h, S.pos) === 1){ tryMove(h.q, h.r); return; }
  V.sel = h; drawMap();
  flash(m.revealed ? `${TERRA[m.t].nm}${m.feat ? ' · ' + FEATS[m.feat].nm : ''} — ${plural(hexDist(h,S.pos),'hex')} off` : 'Unmapped country');
}
function showHexTip(e, m){
  if(!m.revealed || modalOpen()) return;
  const t = $('#tip');
  const F = m.feat && FEATS[m.feat];
  const di = diceForMove(m);
  const adj = hexDist(m, S.pos) === 1;
  t.innerHTML = `<b class="tt">${F ? F.ic + ' ' + (m.feat==='city'?'Kestrel Hold':F.nm) : TERRA[m.t].ic + ' ' + TERRA[m.t].nm}</b>
    <div class="tiny">Tier ${m.tier}${m.road ? ' · road' : ''}${m.explored ? ' · explored' : ''}</div>
    ${adj ? `<div class="tiny" style="color:${di ? 'var(--green)' : 'var(--red)'};margin-top:3px">
      ${di ? (di.length ? `Costs ${plural(di.length,'die')}` : 'Free along the road') : (m.t === 'water' ? 'Water — needs a boat' : 'No matching travel die')}</div>` : ''}`;
  t.classList.add('on');
  V.tipOwner = 'map';
  t.style.left = Math.min(innerWidth - 296, e.clientX + 14) + 'px';
  t.style.top = (e.clientY + 16) + 'px';
}

/* =========================================================================
   BOOT
   ========================================================================= */
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ const sc = $('#scrim'); if(!sc.classList.contains('hidden') && sc.querySelector('#mClose')) sc.querySelector('#mClose').click(); return; }
  if(V.screen !== 'game' || !S) return;
  if(!$('#scrim').classList.contains('hidden')) return;
  const k = e.key.toLowerCase();
  if(k === 'e') exploreHere();
  if(k === 'c') openCard();
  if(k === 'i') openInventory();
  if(k === 'n') endDay();
  if(k === '?') openCodex();
});
buildGloss();
wireGlossary();
V.pickHero = HEROES[0].id;
renderTitle();
</script>
