function makeHero(H){
  const h = {
    id:H.id, nm:H.nm, ic:H.ic, lvl:1, xp:0, xpNext: xpFor(1),
    stats:{...H.stats}, baseHp:H.hp, hp:H.hp, en:3 + H.stats.spi,
    dice:H.dice.slice(), move:H.move,
    gear:{weapon:null, offhand:null, armor:null, trinket1:null, trinket2:null},
    talents:[], perks:[], fated:true, ticks:0, drafts:0,
    ranks:{gua:0, m1:0, m2:0, hlt:0, eng:0}, levelCards:0, mRound:0,
  };
  return h;
}
function newRun(heroIds, seedStr){
  const ids = Array.isArray(heroIds) ? heroIds : [heroIds];
  seedStr = (seedStr || '').trim() || Math.random().toString(36).slice(2, 8).toUpperCase();
  RSTATE = seedFrom(seedStr.toUpperCase());
  const {map, lairKeys, gateKey} = genMap();
  S = {
    v:2, seed: seedStr.toUpperCase(), rngState: RSTATE,
    day:1, dread:0, diff: V.pickDiff || 'ride', dreadMax:36, phase:'travel',
    pos:{q:0,r:0}, map, lairKeys, gateKey, seals:0, crownAwake:false,
    dice:[], wildBank:0, movedThisDay:0,
    log:[], flags:{}, shops:{}, bounty:null,
    kills:0, explored:0, deaths:0,
    party: ids.map(id => makeHero(HEROES.find(h => h.id === id))),
    sel:0, lead:0, gold:60 + 20 * ids.length,
  };
  S.dreadMax = (DIFFS.find(d => d.id === S.diff) || DIFFS[1]).dread;
  S.hero = S.party[0];
  // gold and the pack belong to the party, not to one of them
  S.bag = ['bandage','bandage','tonic','rations'];
  S.party.forEach(h => { h.hp = D(h).maxHp; h.en = D(h).maxEn; });
  V.layerSig = null; V.sel = null; V.hover = null;
  reveal(S.pos, 1 + PARTY().scout);
  S.map[key(0,0)].explored = true;
  log(`${S.party.map(h => h.nm).join(', ')} ride out of Kestrel Hold at first light. Seed ${S.seed}.`, 'y');
  log('Three lairs feed the Sable Crown. Break them, then break it.', 'v');
  log('Each of you has four actions printed on your card. One each, every round.', 'b');
  rollMovement(true);
  save();
}

function reveal(centre, rad){
  let n = 0;
  const before = Object.keys(S.map).filter(k => S.map[k].revealed).length;
  for(const h of hexesWithin(centre, rad)){
    const m = S.map[key(h.q,h.r)];
    if(m && !m.revealed){ m.revealed = true; n++; }
  }
  if(n > 0 && before > 0) sfx('reveal', 300);
  return n;
}

/* =========================================================================
   CANVAS MAP
   ========================================================================= */
let cv, ctx, DPR = 1;

function hexPx(q, r){
  const s = HX * V.zoom;
  return { x: s * Math.sqrt(3) * (q + r/2), y: s * 1.5 * r };
}
function pxHex(x, y){
  const s = HX * V.zoom;
  const q = (Math.sqrt(3)/3 * x - y/3) / s;
  const r = (2/3 * y) / s;
  // cube round
  let cx = q, cz = r, cy = -cx - cz;
  let rx = Math.round(cx), ry = Math.round(cy), rz = Math.round(cz);
  const dx = Math.abs(rx-cx), dy = Math.abs(ry-cy), dz = Math.abs(rz-cz);
  if(dx > dy && dx > dz) rx = -ry - rz; else if(dy > dz) ry = -rx - rz; else rz = -rx - ry;
  return {q: rx, r: rz};
}
function hexPath(cx, cy, s){
  ctx.beginPath();
  for(let i=0;i<6;i++){
    const a = Math.PI / 180 * (60 * i - 30);
    const x = cx + s * Math.cos(a), y = cy + s * Math.sin(a);
    i ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
  }
  ctx.closePath();
}
function hash2(q,r){ let h = (q*374761393 + r*668265263) ^ 0x5f356495; h = (h ^ (h>>>13)) * 1274126177; return ((h ^ (h>>>16)) >>> 0) / 4294967296; }

function sizeCanvas(){
  if(!cv) return;
  const wrap = cv.parentElement;
  const w = wrap.clientWidth;
  const narrow = w < 640;
  const h = narrow
    ? Math.max(320, Math.min(430, Math.round(window.innerHeight * 0.46)))
    : Math.max(400, Math.min(680, Math.round(window.innerHeight * 0.64)));
  DPR = window.devicePixelRatio || 1;
  cv.width = w * DPR; cv.height = h * DPR;
  cv.style.height = h + 'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
function centreOnHero(){
  const p = hexPx(S.pos.q, S.pos.r);
  V.cam.x = p.x; V.cam.y = p.y;
}

/* =========================================================================
   TERRAIN SPRITES
   Each terrain gets a handful of pre-rendered variants, drawn once into an
   offscreen canvas and blitted from then on. Nothing procedural runs per
   frame, and none of it touches the run's RNG.
   ========================================================================= */
const TILE = {};
function prng(seed){
  let t = seed >>> 0;
  return () => { t = (t + 0x6D2B79F5) >>> 0; let x = t;
    x = Math.imul(x ^ (x >>> 15), x | 1); x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };
}
function strHash(s){ let h = 2166136261 >>> 0; for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h >>> 0; }
function hexOn(x, cx, cy, s){
  x.beginPath();
  for(let i=0;i<6;i++){
    const a = Math.PI/180 * (60*i - 30);
    const px = cx + s*Math.cos(a), py = cy + s*Math.sin(a);
    i ? x.lineTo(px,py) : x.moveTo(px,py);
  }
  x.closePath();
}
function tileFor(terr, variant, s){
  const px = Math.max(1, Math.round(s * DPR));
  const k = terr + '|' + variant + '|' + px;
  if(TILE[k]) return TILE[k];
  const size = px * 2 + 6;
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  drawTile(c.getContext('2d'), size/2, size/2, px, terr, variant);
  TILE[k] = c;
  return c;
}
function drawTile(x, cx, cy, s, terr, v){
  const T = TERRA[terr];
  const R = prng(strHash(terr) ^ Math.imul(v + 1, 2654435761));
  x.save();
  hexOn(x, cx, cy, s * 0.995);
  x.clip();

  // base slope: lit from the north-west like a physical tile
  const g = x.createLinearGradient(cx - s*0.5, cy - s, cx + s*0.4, cy + s);
  g.addColorStop(0, shade(T.col, 0.13));
  g.addColorStop(0.55, shade(T.col, 0.01));
  g.addColorStop(1, shade(T.col2, -0.07));
  x.fillStyle = g;
  x.fillRect(cx - s, cy - s, s*2, s*2);

  // ground grain
  for(let i=0;i<90;i++){
    const a = R()*Math.PI*2, r = Math.sqrt(R())*s;
    const px2 = cx + Math.cos(a)*r, py = cy + Math.sin(a)*r;
    x.fillStyle = R() > 0.5 ? 'rgba(255,255,255,.035)' : 'rgba(0,0,0,.05)';
    x.fillRect(px2, py, Math.max(1, s*0.035), Math.max(1, s*0.035));
  }

  const shadow = (px2, py, w, h) => {
    x.fillStyle = 'rgba(0,0,0,.22)';
    x.beginPath(); x.ellipse(px2, py, w, h, 0, 0, 7); x.fill();
  };

  if(terr === 'plains'){
    for(let i=0;i<4;i++){
      const a = R()*Math.PI*2, r = R()*s*0.6;
      x.fillStyle = R() > .5 ? 'rgba(255,255,255,.055)' : 'rgba(0,0,0,.05)';
      x.beginPath(); x.ellipse(cx+Math.cos(a)*r, cy+Math.sin(a)*r, s*(0.3+R()*0.3), s*(0.16+R()*0.14), R()*2, 0, 7); x.fill();
    }
    x.lineWidth = Math.max(1, s*0.045); x.lineCap = 'round';
    for(let i=0;i<14;i++){
      const a = R()*Math.PI*2, r = Math.sqrt(R())*s*0.78;
      const bx = cx + Math.cos(a)*r, by = cy + Math.sin(a)*r;
      x.strokeStyle = `rgba(${R()>.5?'210,214,150':'120,132,78'},.5)`;
      x.beginPath();
      x.moveTo(bx, by); x.quadraticCurveTo(bx - s*0.05, by - s*0.1, bx - s*0.09, by - s*0.17);
      x.moveTo(bx, by); x.quadraticCurveTo(bx + s*0.05, by - s*0.1, bx + s*0.08, by - s*0.18);
      x.stroke();
    }
  }
  else if(terr === 'forest'){
    const trees = [];
    for(let i=0;i<9;i++){
      const a = R()*Math.PI*2, r = Math.sqrt(R())*s*0.74;
      trees.push({x: cx+Math.cos(a)*r, y: cy+Math.sin(a)*r, h: s*(0.36+R()*0.22), w: s*(0.16+R()*0.07)});
    }
    trees.sort((a,b) => a.y - b.y);
    for(const t of trees){
      shadow(t.x + t.w*0.35, t.y + t.h*0.06, t.w*1.05, t.w*0.38);
      x.fillStyle = 'rgba(58,42,26,.85)';
      x.fillRect(t.x - t.w*0.07, t.y - t.h*0.05, t.w*0.14, t.h*0.22);
      for(let tier=0; tier<3; tier++){
        const ty = t.y - t.h*(0.02 + tier*0.26);
        const tw = t.w * (1 - tier*0.24);
        x.beginPath();
        x.moveTo(t.x, ty - t.h*0.42);
        x.lineTo(t.x + tw, ty);
        x.lineTo(t.x - tw, ty);
        x.closePath();
        const tg = x.createLinearGradient(t.x - tw, ty, t.x + tw, ty);
        tg.addColorStop(0, '#4f8f62'); tg.addColorStop(0.5, '#2f6a45'); tg.addColorStop(1, '#1e4a30');
        x.fillStyle = tg; x.fill();
        x.strokeStyle = 'rgba(12,30,20,.5)'; x.lineWidth = Math.max(0.6, s*0.015); x.stroke();
      }
    }
  }
  else if(terr === 'hills'){
    const humps = [];
    for(let i=0;i<4;i++){
      const a = R()*Math.PI*2, r = Math.sqrt(R())*s*0.6;
      humps.push({x: cx+Math.cos(a)*r, y: cy+Math.sin(a)*r*0.7, w: s*(0.34+R()*0.2)});
    }
    humps.sort((a,b) => a.y - b.y);
    for(const hm of humps){
      x.beginPath();
      x.moveTo(hm.x - hm.w, hm.y);
      x.quadraticCurveTo(hm.x - hm.w*0.45, hm.y - hm.w*0.92, hm.x, hm.y - hm.w*0.62);
      x.quadraticCurveTo(hm.x + hm.w*0.5, hm.y - hm.w*0.34, hm.x + hm.w, hm.y);
      x.closePath();
      const hg = x.createLinearGradient(hm.x, hm.y - hm.w, hm.x, hm.y);
      hg.addColorStop(0, shade(T.col, 0.16)); hg.addColorStop(1, shade(T.col2, -0.02));
      x.fillStyle = hg; x.fill();
      x.strokeStyle = 'rgba(0,0,0,.24)'; x.lineWidth = Math.max(0.7, s*0.018); x.stroke();
    }
  }
  else if(terr === 'mountain'){
    const peaks = [];
    for(let i=0;i<3;i++){
      peaks.push({x: cx + (R()-0.5)*s*1.05, y: cy + s*(0.16 + R()*0.3), h: s*(0.72+R()*0.34), w: s*(0.36+R()*0.16)});
    }
    peaks.sort((a,b) => a.y - b.y);
    for(const pk of peaks){
      shadow(pk.x, pk.y + s*0.03, pk.w*1.1, pk.w*0.24);
      x.beginPath(); x.moveTo(pk.x, pk.y - pk.h); x.lineTo(pk.x + pk.w, pk.y); x.lineTo(pk.x - pk.w, pk.y); x.closePath();
      const mg = x.createLinearGradient(pk.x - pk.w, pk.y, pk.x + pk.w, pk.y);
      mg.addColorStop(0, '#9aa3b0'); mg.addColorStop(0.46, '#77808e'); mg.addColorStop(0.54, '#59616e'); mg.addColorStop(1, '#434a56');
      x.fillStyle = mg; x.fill();
      // snow cap
      const capY = pk.y - pk.h*0.62, capW = pk.w*0.38;
      x.beginPath();
      x.moveTo(pk.x, pk.y - pk.h);
      x.lineTo(pk.x + capW, capY);
      x.lineTo(pk.x + capW*0.42, capY - pk.h*0.06);
      x.lineTo(pk.x + capW*0.1, capY + pk.h*0.05);
      x.lineTo(pk.x - capW*0.34, capY - pk.h*0.04);
      x.lineTo(pk.x - capW, capY);
      x.closePath();
      x.fillStyle = 'rgba(240,246,255,.92)'; x.fill();
      x.strokeStyle = 'rgba(20,26,36,.45)'; x.lineWidth = Math.max(0.7, s*0.016);
      x.beginPath(); x.moveTo(pk.x, pk.y - pk.h); x.lineTo(pk.x + pk.w, pk.y); x.lineTo(pk.x - pk.w, pk.y); x.closePath(); x.stroke();
    }
  }
  else if(terr === 'marsh'){
    for(let i=0;i<5;i++){
      const a = R()*Math.PI*2, r = Math.sqrt(R())*s*0.62;
      x.fillStyle = `rgba(36,58,54,${0.34 + R()*0.24})`;
      x.beginPath(); x.ellipse(cx+Math.cos(a)*r, cy+Math.sin(a)*r, s*(0.2+R()*0.22), s*(0.1+R()*0.1), R()*2, 0, 7); x.fill();
      x.strokeStyle = 'rgba(150,190,180,.16)'; x.lineWidth = Math.max(0.6, s*0.02); x.stroke();
    }
    x.lineCap = 'round'; x.lineWidth = Math.max(1, s*0.035);
    for(let i=0;i<16;i++){
      const a = R()*Math.PI*2, r = Math.sqrt(R())*s*0.8;
      const bx = cx + Math.cos(a)*r, by = cy + Math.sin(a)*r;
      const lean = (R()-0.5)*s*0.16;
      x.strokeStyle = R() > .45 ? 'rgba(126,142,92,.75)' : 'rgba(84,98,64,.8)';
      x.beginPath(); x.moveTo(bx, by);
      x.quadraticCurveTo(bx + lean*0.5, by - s*0.14, bx + lean, by - s*(0.22 + R()*0.12));
      x.stroke();
    }
  }
  else if(terr === 'water'){
    const wg = x.createLinearGradient(cx, cy - s, cx, cy + s);
    wg.addColorStop(0, '#356a97'); wg.addColorStop(1, '#173855');
    x.fillStyle = wg; x.fillRect(cx-s, cy-s, s*2, s*2);
    x.lineCap = 'round';
    for(let i=0;i<7;i++){
      const wy = cy - s*0.72 + (i/6)*s*1.44 + (R()-0.5)*s*0.08;
      const wx = cx - s*0.7 + (R()-0.5)*s*0.3;
      const len = s*(0.5 + R()*0.7);
      x.strokeStyle = `rgba(190,224,245,${0.1 + R()*0.2})`;
      x.lineWidth = Math.max(1, s*0.045);
      x.beginPath();
      x.moveTo(wx, wy);
      x.quadraticCurveTo(wx + len*0.5, wy - s*0.07, wx + len, wy);
      x.stroke();
    }
  }

  // inner bevel: light along the top-left edges, shadow along the bottom-right
  x.lineWidth = Math.max(1.2, s*0.075);
  x.strokeStyle = 'rgba(255,255,255,.10)';
  x.beginPath();
  for(let i=3;i<=6;i++){
    const a = Math.PI/180 * (60*i - 30);
    const px2 = cx + s*0.99*Math.cos(a), py = cy + s*0.99*Math.sin(a);
    i === 3 ? x.moveTo(px2,py) : x.lineTo(px2,py);
  }
  x.stroke();
  x.strokeStyle = 'rgba(0,0,0,.26)';
  x.beginPath();
  for(let i=0;i<=3;i++){
    const a = Math.PI/180 * (60*i - 30);
    const px2 = cx + s*0.99*Math.cos(a), py = cy + s*0.99*Math.sin(a);
    i === 0 ? x.moveTo(px2,py) : x.lineTo(px2,py);
  }
  x.stroke();
  x.restore();
}

/* =========================================================================
   MAP
   The static half of the map (ground, roads, places, fog, vignette) is
   composited into an offscreen layer and only rebuilt when something on it
   actually changed. Each frame just blits that and draws the moving parts.
   ========================================================================= */
function mapSignature(W, H){
  let rev = 0, exp = 0, thr = 0, cl = 0, ft = 0;
  for(const k in S.map){
    const m = S.map[k];
    if(m.revealed) rev++; if(m.explored) exp++; if(m.threat) thr++; if(m.cleared) cl++; if(m.feat) ft++;
  }
  return [Math.round(V.cam.x), Math.round(V.cam.y), V.zoom.toFixed(3), W, H, DPR,
          rev, exp, thr, cl, ft, S.seals, S.hero.id].join('|');
}
function buildLayer(W, H){
  if(!V.layer) V.layer = document.createElement('canvas');
  const c = V.layer;
  if(c.width !== Math.round(W*DPR) || c.height !== Math.round(H*DPR)){
    c.width = Math.round(W*DPR); c.height = Math.round(H*DPR);
  }
  const x = c.getContext('2d');
  x.setTransform(DPR, 0, 0, DPR, 0, 0);
  x.clearRect(0, 0, W, H);

  const bg = x.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#060a12'); bg.addColorStop(1, '#04070d');
  x.fillStyle = bg; x.fillRect(0, 0, W, H);

  const ox = W/2 - V.cam.x, oy = H/2 - V.cam.y;
  const s = HX * V.zoom;
  const vis = [];
  for(const k in S.map){
    const m = S.map[k];
    const p = hexPx(m.q, m.r);
    const cx = p.x + ox, cy = p.y + oy;
    if(cx < -s*2 || cx > W + s*2 || cy < -s*2 || cy > H + s*2) continue;
    vis.push({m, cx, cy});
  }

  // unknown country
  for(const {m, cx, cy} of vis){
    if(m.revealed) continue;
    hexOn(x, cx, cy, s*0.97);
    const fg = x.createRadialGradient(cx, cy - s*0.3, s*0.1, cx, cy, s);
    fg.addColorStop(0, '#0d1420'); fg.addColorStop(1, '#070c14');
    x.fillStyle = fg; x.fill();
    x.strokeStyle = 'rgba(255,255,255,.045)'; x.lineWidth = 1; x.stroke();
  }

  // ground
  const tsize = s*2 + 6/DPR;
  for(const {m, cx, cy} of vis){
    if(!m.revealed) continue;
    const v = Math.floor(hash2(m.q, m.r) * 4);
    x.drawImage(tileFor(m.t, v, s), cx - tsize/2, cy - tsize/2, tsize, tsize);
    if(m.explored){ hexOn(x, cx, cy, s*0.99); x.fillStyle = 'rgba(4,8,14,.30)'; x.fill(); }
  }

  // roads: dark casing, then a lighter core
  x.lineCap = 'round'; x.lineJoin = 'round';
  for(const pass of [0, 1]){
    x.strokeStyle = pass ? 'rgba(232,214,176,.42)' : 'rgba(30,22,12,.45)';
    x.lineWidth = Math.max(1.5, s * (pass ? 0.1 : 0.17));
    for(const {m, cx, cy} of vis){
      if(!m.road || !m.revealed) continue;
      let drew = false;
      for(const nb of neighbors(m.q, m.r)){
        const nm = S.map[key(nb.q, nb.r)];
        if(!nm || !nm.road || !nm.revealed) continue;
        const np = hexPx(nb.q, nb.r);
        x.beginPath(); x.moveTo(cx, cy);
        x.lineTo((cx + np.x + ox)/2, (cy + np.y + oy)/2); x.stroke();
        drew = true;
      }
      if(!drew){ x.beginPath(); x.arc(cx, cy, s*0.09, 0, 7); x.stroke(); }
    }
  }

  // places and markers
  for(const {m, cx, cy} of vis){
    if(!m.revealed) continue;
    const F = m.feat && FEATS[m.feat];
    if(F){
      const glow = (F.kind === 'lair' && !m.cleared) ? 'rgba(167,139,250,'
                 : (F.kind === 'gate' && S.seals >= 3) ? 'rgba(239,83,80,' : null;
      if(glow){
        x.save();
        x.shadowColor = glow + '.8)'; x.shadowBlur = 18 * V.zoom;
        hexOn(x, cx, cy, s*0.9); x.fillStyle = glow + '.15)'; x.fill();
        x.restore();
      }
      x.beginPath(); x.arc(cx, cy, s*0.46, 0, 7);
      x.fillStyle = 'rgba(6,10,18,.62)'; x.fill();
      x.strokeStyle = 'rgba(255,255,255,.14)'; x.lineWidth = 1; x.stroke();
      x.font = `${Math.round(s*0.64)}px system-ui, sans-serif`;
      x.textAlign = 'center'; x.textBaseline = 'middle';
      x.fillText(m.cleared && F.kind === 'lair' ? '✅' : F.ic, cx, cy + s*0.03);
    }
    if(!m.explored && m.t !== 'water'){
      x.beginPath(); x.arc(cx + s*0.5, cy - s*0.52, s*0.135, 0, 7);
      x.fillStyle = 'rgba(232,180,74,.92)'; x.fill();
      x.strokeStyle = 'rgba(0,0,0,.4)'; x.lineWidth = 1; x.stroke();
    }
    if(m.threat){
      x.save();
      x.shadowColor = 'rgba(239,83,80,.9)'; x.shadowBlur = 9;
      x.font = `${Math.round(s*0.4)}px system-ui, sans-serif`;
      x.textAlign = 'center'; x.textBaseline = 'middle';
      x.fillText('⚔️', cx - s*0.48, cy + s*0.55);
      x.restore();
    }
  }

  // vignette
  const vg = x.createRadialGradient(W/2, H/2, Math.min(W,H)*0.34, W/2, H/2, Math.max(W,H)*0.78);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.5)');
  x.fillStyle = vg; x.fillRect(0, 0, W, H);
}

function drawMap(){
  if(!cv || !S) return;
  const W = cv.width / DPR, H = cv.height / DPR;
  const sig = mapSignature(W, H);
  if(sig !== V.layerSig){ buildLayer(W, H); V.layerSig = sig; }

  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(V.layer, 0, 0, W, H);

  const ox = W/2 - V.cam.x, oy = H/2 - V.cam.y;
  const s = HX * V.zoom;
  const t = Date.now();

  // a slow pulse around anything that wants you to come and look at it
  for(const k of S.lairKeys.concat([S.gateKey])){
    const m = S.map[k];
    if(!m || !m.revealed || m.cleared) continue;
    if(m.feat === 'gate' && S.seals < 3) continue;
    const p = hexPx(m.q, m.r);
    const cx = p.x + ox, cy = p.y + oy;
    if(cx < -s*2 || cx > W + s*2 || cy < -s*2 || cy > H + s*2) continue;
    const pulse = 0.5 + 0.5*Math.sin(t/620);
    hexPath(cx, cy, s * (0.86 + pulse*0.07));
    ctx.strokeStyle = (m.feat === 'gate' ? 'rgba(239,83,80,' : 'rgba(167,139,250,') + (0.25 + pulse*0.45) + ')';
    ctx.lineWidth = 2 + pulse*1.4;
    ctx.setLineDash([]); ctx.stroke();
  }

  // where you can go, with the dashes marching
  const moveKeys = {};
  legalMoves().forEach(m => moveKeys[m.k] = m);
  const march = (t/70) % 9;
  for(const k in moveKeys){
    const m = S.map[k]; if(!m) continue;
    const p = hexPx(m.q, m.r);
    ctx.save();
    hexPath(p.x + ox, p.y + oy, s*0.9);
    ctx.strokeStyle = 'rgba(232,180,74,.95)'; ctx.lineWidth = 2.4;
    ctx.setLineDash([5,4]); ctx.lineDashOffset = -march;
    ctx.stroke(); ctx.restore();
  }

  for(const [hx, col, wid] of [[V.hover,'rgba(255,255,255,.6)',2],[V.sel,'#e8b44a',2.6]]){
    if(!hx) continue;
    const m = S.map[key(hx.q,hx.r)]; if(!m) continue;
    const p = hexPx(m.q, m.r);
    hexPath(p.x+ox, p.y+oy, s*0.95);
    ctx.strokeStyle = col; ctx.lineWidth = wid; ctx.setLineDash([]); ctx.stroke();
  }

  // you
  const hp = hexPx(S.pos.q, S.pos.r);
  const hx2 = hp.x + ox, hy = hp.y + oy;
  const bob = Math.sin(t/520) * s*0.035;
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.ellipse(hx2, hy + s*0.42, s*0.3, s*0.1, 0, 0, 7);
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fill();
  ctx.save();
  ctx.shadowColor = 'rgba(232,180,74,.9)'; ctx.shadowBlur = 16 + 5*Math.sin(t/520);
  ctx.beginPath(); ctx.arc(hx2, hy + bob, s*0.42, 0, 7);
  const pg = ctx.createLinearGradient(hx2, hy - s*0.4 + bob, hx2, hy + s*0.4 + bob);
  pg.addColorStop(0, '#1d2740'); pg.addColorStop(1, '#0d1420');
  ctx.fillStyle = pg; ctx.fill();
  ctx.lineWidth = 2.4; ctx.strokeStyle = '#e8b44a'; ctx.stroke();
  ctx.restore();
  ctx.font = `${Math.round(s*0.46)}px system-ui, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText((leadHero() || S.hero).ic, hx2, hy + bob + s*0.03);
}

/* one throttled loop for the pulse, the marching dashes and the hero bobbing */
function mapTick(ts){
  V.raf = requestAnimationFrame(mapTick);
  if(V.screen !== 'game' || !S || !cv || document.hidden) return;
  if(ts && V.lastFrame && ts - V.lastFrame < 33) return;   // ~30fps is plenty
  V.lastFrame = ts || 0;
  drawMap();
}

function shade(hex, amt){
  const n = parseInt(hex.slice(1), 16);
  let r = (n>>16)&255, g = (n>>8)&255, b = n&255;
  r = clamp(Math.round(r + 255*amt),0,255); g = clamp(Math.round(g + 255*amt),0,255); b = clamp(Math.round(b + 255*amt),0,255);
  return `rgb(${r},${g},${b})`;
}
function canvasHex(ev){
  const rect = cv.getBoundingClientRect();
  const W = rect.width, H = rect.height;
  const x = (ev.clientX - rect.left) - (W/2 - V.cam.x);
  const y = (ev.clientY - rect.top)  - (H/2 - V.cam.y);
  return pxHex(x, y);
}

/* =========================================================================
   MOVEMENT
   ========================================================================= */
function rollMovement(silent){
  const n = PARTY().move;
  S.dice = [];
  for(let i=0;i<n;i++) S.dice.push({f: MDIE[Math.floor(rnd()*6)], spent:false});
  sfx('dice', 200);
  for(let i = 0; i < PARTY().wild && i < S.dice.length; i++) S.dice[i].f = 'wild';
  S.movedThisDay = 0;
  V.rolled = true;
  if(!silent) log(`Dawn of day ${S.day}. You roll ${plural(n,'travel die')}.`, 'b');
}
const freeDice = () => S.dice.filter(d => !d.spent);

function dieMatches(die, m){
  if(die.spent) return false;
  if(die.f === 'wild') return true;
  if(die.f === m.t) return true;
  if(alive().some(h => h.id === 'ranger') && (die.f === 'forest' || die.f === 'hills')) return true;   // the Ranger leads the whole party through
  const cur = hereHex();
  if(m.road && cur.road) return true;             // roads take any face
  return false;
}
function moveCost(m){ return m.t === 'mountain' ? 2 : 1; }

function hasGear(id){ return party().some(h => Object.values(h.gear).includes(id)); }
function diceForMove(m){
  if(!m) return null;
  if(m.t === 'water' && !V.boat) return null;
  const cur = hereHex();
  if(PARTY().roadfree && m.road && cur.road) return [];            // Cartwright
  const idx = [];
  for(let i=0;i<S.dice.length;i++) if(dieMatches(S.dice[i], m)){ idx.push(i); break; }
  if(!idx.length) return null;
  const need = moveCost(m);
  if(need > 1){
    for(let i=0;i<S.dice.length;i++){
      if(idx.length >= need) break;
      if(!S.dice[i].spent && !idx.includes(i)) idx.push(i);
    }
    if(idx.length < need) return null;
  }
  return idx;
}
function legalMoves(){
  if(!S || S.phase !== 'travel') return [];
  const out = [];
  for(const nb of neighbors(S.pos.q, S.pos.r)){
    const k = key(nb.q, nb.r);
    const m = S.map[k];
    if(!m) continue;
    if(V.forceMove){
      if(m.t !== 'water' && freeDice().length >= 2) out.push({k, q:nb.q, r:nb.r, force:true});
      continue;
    }
    const di = diceForMove(m);
    if(di) out.push({k, q:nb.q, r:nb.r, dice:di});
  }
  return out;
}

function tryMove(q, r){
  const mv = legalMoves().find(m => m.q === q && m.r === r);
  const m = S.map[key(q,r)];
  if(!mv){
    sfx('deny');
    if(m && m.t === 'water') flash('No boat, no crossing.');
    else flash('No travel die matches that ground.');
    return;
  }
  if(!V.combat) MUS.set('travel');
  if(mv.force){
    let n = 0;
    for(const d of S.dice){ if(!d.spent && n < 2){ d.spent = true; n++; } }
    V.forceMove = false;
    log('You force a path off the known routes, and it costs you.', 'y');
  } else {
    (mv.dice || []).forEach(i => S.dice[i].spent = true);
  }
  S.pos = {q, r};
  S.movedThisDay++;
  sfx('move');
  V.sel = {q,r};
  const rev = reveal(S.pos, 1 + PARTY().scout);
  if(rev) log(`You take in ${plural(rev,'new hex')} of country.`);
  if(m.t === 'water'){ V.boat = false; log('You paddle across and pull the coracle up the far bank.', 'b'); }
  if(m.t === 'marsh' && freeDice().length && !hasGear('anklet')){
    S.dice.forEach(d => d.spent = true);
    log('The marsh drags at you. Travel ends for the day.', 'y');
  }
  centreOnHero();
  save(); render();
  // arriving somewhere unexplored triggers the encounter right away
  if(!m.explored) setTimeout(() => exploreHere(), T(260));
  else if(m.threat) setTimeout(() => { m.threat = null; startCombat(rollMonster(m.tier), {where:'ambush'}); }, T(260));
}

/* =========================================================================
   DAY CYCLE / DREAD
   ========================================================================= */
function endDay(opt){
  opt = opt || {};
  // dusk
  S.dread = Math.min(S.dreadMax + 4, S.dread + 1 + (opt.extraDread || 0));
  if(S.dread >= dreadMark(1) && !S.flags.h1){ S.flags.h1 = true; sfx('dread'); log('A second darkness settles under the first. Everything out here is stronger now.', 'v'); }
  if(S.dread >= dreadMark(2) && !S.flags.h2){ S.flags.h2 = true; sfx('dread'); log('The Crown stirs in earnest. The roads are no longer safe anywhere.', 'r'); }
  wanderThreats();
  // dawn
  S.day++;
  sfx('dawn', 500);
  const d = D();
  party().forEach(h => {
    const hd = D(h);
    const heal = hd.regen + (h.id === 'priest' ? 2 + ((h.ranks && h.ranks.m1) || 0) : 0);
    if(heal && !isDown(h)) healHero(heal, "the night's rest", h);
  });
  party().forEach(h => { const hd = D(h); h.en = clamp(h.en + hd.enRegen, 0, hd.maxEn); });

  party().forEach(h => { if(isDown(h)){ h.hp = Math.max(1, Math.round(D(h).maxHp * 0.5)); log(`${h.nm} is back on their feet.`, 'g'); } });
  rollMovement();
  if(S.dread >= S.dreadMax){
    if(!S.crownAwake) crownMarches();
    else if(!V.combat){ log('The Crown is still walking the region, and it is still looking for you.', 'r'); crownMarches(); }
  }
  save(); render();
}
function wanderThreats(){
  // clear old, then seed a few new roaming threats on explored ground
  const keys = Object.keys(S.map);
  for(const k of keys) if(S.map[k].threat && chance(0.4)) S.map[k].threat = null;
  const n = S.dread >= dreadMark(2) ? 3 : S.dread >= dreadMark(1) ? 2 : 1;
  for(let i=0;i<n;i++){
    const k = pick(keys);
    const m = S.map[k];
    if(!m || m.t === 'water' || FEATS[m.feat] && FEATS[m.feat].kind === 'town') continue;
    if(key(S.pos.q,S.pos.r) === k) continue;
    m.threat = true;
  }
}
function crownMarches(){
  S.crownAwake = true;
  log('The sky over the Obsidian Gate splits. The Sable Crown has come for you.', 'r');
  modal({
    ic:'👁️‍🗨️', h:'The Crown Marches',
    b:`<p>Dread has run its course. The Sable Crown does not wait at its gate any longer — it walks out to meet you where you stand.</p>
       <p class="muted" style="margin-top:9px">${S.seals >= 3
          ? 'You carry all three seals. It comes to you diminished, and you are ready.'
          : `You hold ${S.seals} of 3 seals. It comes to you whole. This will not be a fair fight.`}</p>`,
    f:[{lb:'Stand', cls:'primary danger', fn:() => { closeModal(); startCombat(crownStats(), {boss:'crown'}); }}],
    noClose:true,
  });
}
function crownStats(){
  const c = JSON.parse(JSON.stringify(CROWN));
  const short = 3 - S.seals;            // every seal you skipped is a Crown that much less diminished
  c.hp += short * 30; c.arm += short; c.pwr = (c.pwr||0) + short;
  if(S.seals >= 3) c.arm -= 1;
  return scaleFoe(c, {crown:true});
}
const dreadMark = n => Math.round(((S && S.dreadMax) || 34) * (n === 1 ? 0.35 : 0.7));
function dreadTier(){ return S.dread >= dreadMark(2) ? 2 : S.dread >= dreadMark(1) ? 1 : 0; }
function scaledTier(base){ return clamp(base + (chance(0.5) ? dreadTier() : Math.min(1,dreadTier())), 1, 4); }

/* =========================================================================
   HERO HELPERS
   ========================================================================= */
/* whoever most needs it, unless a caller names someone */
function mostWounded(){
  return party().filter(h => !isDown(h) && h.hp < D(h).maxHp)
    .sort((a,b) => (a.hp / D(a).maxHp) - (b.hp / D(b).maxHp))[0] || null;
}
function healHero(n, src, who){
  const h = who || mostWounded() || leadHero() || S.hero;
  const d = D(h);
  const before = h.hp;
  h.hp = clamp(h.hp + n, 0, d.maxHp);
  const got = h.hp - before;
  if(got > 0){ log(`${h.nm} recovers ${got} HP${src ? ' from ' + src : ''}.`, 'g'); sfx('heal', 120); }
  return got;
}
/* damage with nobody named lands on the front rank, not on whoever you happen
   to be looking at — the selected hero may be lying down. */
function hurtHero(n, src, who){
  const h = who || leadHero() || S.hero;
  h.hp -= n;
  log(`${h.nm} takes ${n} damage${src ? ' — ' + src : ''}.`, 'r');
  if(h.hp <= 0){ h.hp = 0; log(`${h.nm} goes down.`, 'r'); heroFalls(); }
}
function gainGold(n){
  n = Math.round(n * goldMult());
  S.gold += n;
  log(`+${n} gold.`, 'y');
  sfx('gold', 150);
  return n;
}
function spendEnergy(n){ if(S.hero.en < n) return false; S.hero.en -= n; return true; }
function gainXp(n){
  party().forEach(h => h.xp += n);
  log(`+${n} XP to everyone.`, 'b');
  if(party().some(h => h.lvl < 10 && h.xp >= h.xpNext)) setTimeout(tryLevelUp, T(320));
}
function heroFalls(){
  const wasCrown = V.lastBoss === 'crown' || (V.combat && V.combat.opts && V.combat.opts.boss === 'crown');
  V.lastBoss = null;
  if(conscious().length){ save(); render(); return; }      // somebody is still standing
  if(wasCrown){
    V.combat = null;
    gameOver('The Sable Crown puts the party down where they stood. There is no second thread for this one.');
    return;
  }
  if(party().some(h => h.fated)){
    party().forEach(h => h.fated = false);
    S.deaths++;
    const lost = Math.floor(S.gold / 2);
    S.gold -= lost;
    // dragged to the nearest settlement
    let best = null, bd = 99;
    for(const k in S.map){
      const m = S.map[k];
      if(FEATS[m.feat] && FEATS[m.feat].kind === 'town'){
        const dd = hexDist(m, S.pos);
        if(dd < bd){ bd = dd; best = m; }
      }
    }
    S.pos = best ? {q:best.q, r:best.r} : {q:0,r:0};
    party().forEach(h => { h.hp = Math.max(1, Math.round(D(h).maxHp * 0.4)); });
    S.lead = 0;
    S.day += 3; S.dread += 3;
    V.combat = null;
    reveal(S.pos, 1); centreOnHero(); rollMovement(true);
    closeModal();
    modal({ic:'🕯️', h:'Fate\'s Thread', b:
      `<p>You fall. You do not die.</p>
       <p class="muted" style="margin-top:9px">Someone hauls you back to ${best ? FEATS[best.feat].nm : 'Kestrel Hold'}. You lose three days, ${lost} gold, and the thread that pulled you out of it. There is no second one.</p>`,
      f:[{lb:'Get up', cls:'primary', fn:() => { closeModal(); save(); render(); }}], noClose:true});
    save();
    return;
  }
  gameOver('The party falls together. The region keeps what it takes.');
}

/* =========================================================================
   SKILL TESTS   2d6 + stat + bonuses vs DC, energy may be pushed in
   ========================================================================= */
function skillTest(o){
  // o = {stat, dc, nm, ok(margin), fail(margin)}
  let push = 0;
  const who = bestAt(o.stat);          // the party puts its best hand to it
  const d = D(who);
  const render_ = () => {
    const bonus = d[o.stat] + d.test + push;
    modal({
      ic: STATIC[o.stat], h: o.nm || (STATNM[o.stat] + ' Test'),
      b: `<p class="muted">${o.tx || 'Roll 2d6, add your stat, and beat the number.'}</p>
        <div class="card" style="margin-top:12px">
          <div class="kv"><span>Target</span><b>${o.dc}</b></div>
          <div class="kv"><span>${STATNM[o.stat]}</span><b>+${d[o.stat]}</b></div>
          ${d.test ? `<div class="kv"><span>Training</span><b>+${d.test}</b></div>` : ''}
          <div class="kv"><span>Pushed (energy)</span><b>+${push}</b></div>
          <div class="sep" style="margin:8px 0"></div>
          <div class="kv"><span>Rolling</span><b>2d6 +${bonus}</b></div>
        </div>
        <div class="row wr" style="margin-top:11px">
          <button class="btn sm" id="pushE" ${who.en < 1 || push >= 3 ? 'disabled' : ''}>⚡ Push (+1, costs 1 energy)</button>
          <span class="tiny muted">${who.ic} ${esc(who.nm)} · energy ${who.en}/${d.maxEn}</span>
        </div>`,
      f: [{lb:'Roll', cls:'primary', id:'rollT'}],
      noClose: true,
    });
    const pe = $('#pushE');
    if(pe) pe.onclick = () => { if(who.en >= 1){ who.en--; push++; render_(); } };
    $('#rollT').onclick = () => {
      const a = d6(), b = d6(), tot = a + b + bonus;
      const win = tot >= o.dc || (a === 6 && b === 6);
      sfx('dice', 0);
      setTimeout(() => sfx(win ? 'reveal' : 'deny', 0), 180);
      const margin = tot - o.dc;
      modal({
        ic: win ? '✅' : '❌', h: win ? 'Success' : 'Failure',
        b: `<div class="center" style="font-size:30px;font-family:'DM Serif Display',serif;margin-bottom:6px">
              ${a} + ${b} ${bonus ? '+ ' + bonus : ''} = <span style="color:${win ? 'var(--green)' : 'var(--red)'}">${tot}</span>
            </div>
            <p class="center muted tiny">against ${o.dc}${a===6&&b===6?' — double sixes, an automatic success':''}</p>
            <div class="sep"></div>
            <p>${win ? o.okTx || '' : o.failTx || ''}</p>`,
        f: [{lb:'Continue', cls:'primary', fn:() => { closeModal(); (win ? o.ok : o.fail)(margin); save(); render(); }}],
        noClose: true,
      });
    };
  };
  render_();
}

/* =========================================================================
   DIFFICULTY
   The region used to scale with dread alone, so out-levelling it simply
   worked: a level 10 hero met the same monsters a level 4 hero did. Now it
   levels with you, at a rate the difficulty sets.
   ========================================================================= */
const DIFFS = [
  {id:'road', nm:"Ranger's Road", ic:'🌤️',
   tx:'A forgiving region. Softer enemies, easier coin, and the Crown is content to wait.',
   hp:0.85, pwr:-1, lvlHp:0.05, lvlPwr:4, dread:40, gold:1.25, crownHp:0.78},
  {id:'ride', nm:'The Long Ride', ic:'⚔️',
   tx:'The region as it is meant to be. Every level you take, it takes one too.',
   hp:1.0, pwr:0, lvlHp:0.09, lvlPwr:3, dread:34, gold:1.0, crownHp:1.05},
  {id:'regard', nm:"The Crown's Regard", ic:'👁️',
   tx:'It has noticed you. Everything hits harder, coin is scarce, and the clock is short.',
   hp:1.34, pwr:2, lvlHp:0.13, lvlPwr:2, dread:28, gold:0.78, crownHp:1.42},
];
const diff = () => DIFFS.find(d => d.id === (S && S.diff)) || DIFFS[1];

/* every enemy is scaled at the moment it is drawn, by difficulty, by your
   level, and by how far the dread track has run */
function scaleFoe(m, opts){
  opts = opts || {};
  const F = diff();
  const lvl = partyPower();
  const dt = dreadTier();
  // Wandering monsters take the level scaling in full — that is the point, so
  // out-levelling the region stops working. Set-piece bosses are already tuned
  // by hand and only take a quarter of it, or they double before you arrive.
  const boss = opts.boss || opts.crown;
  const lvlMul = 1 + lvl * F.lvlHp * (boss ? 0.25 : 1);
  const dtMul  = 1 + dt * (boss ? 0.06 : 0.12);
  // A party does NOT hit three times as hard, because only the heroes who take
  // the Attack action are in the swing — the usual shape of a round is two
  // swinging while one guards. Measured at level 1 and level 8 alike, a trio
  // deals about 1.6x a lone hero, so that is what the health scales by. It was
  // 3.4x while every hero contributed a card every round, and leaving it there
  // turned every fight into a twelve-round grind.
  const extra  = Math.max(0, party().length - 1);
  const hpMul  = (opts.crown ? F.crownHp : F.hp) * lvlMul * dtMul * (1 + extra * 0.3);
  m.hp = Math.max(6, Math.round(m.hp * hpMul));
  m.maxHp = m.hp;
  m.pwr = Math.max(0, (m.pwr || 0) + F.pwr + Math.floor(lvl / F.lvlPwr / (boss ? 2 : 1)) + dt);
  if(dt >= 2 && !boss) m.arm = (m.arm || 0) + 1;
  if(extra) m.arm = (m.arm || 0) + extra;   // three sets of dice find the gaps faster
  return m;
}

function markNearestLair(){
  let best = null, bd = 99;
  for(const k of S.lairKeys){
    const m = S.map[k];
    if(m.cleared) continue;
    const dd = hexDist(m, S.pos);
    if(dd < bd){ bd = dd; best = m; }
  }
  if(!best){ log('Every lair is already broken.', 'g'); return; }
  const n = reveal({q:best.q, r:best.r}, 1);
  best.revealed = true;
  log(`A lair is marked on your map, ${plural(bd,'hex')} off.`, 'v');
}
function rollItem(tier){
  const pool = ITEMS.filter(i => i.tier <= tier && i.slot !== 'use');
  const use  = ITEMS.filter(i => i.slot === 'use' && i.tier <= tier);
  return chance(0.72) ? pick(pool) : pick(use);
}
function giveItem(id){
  S.bag.push(id);
  const it = ITEM(id);
  log(`You gain ${it.nm}.`, 'y');
}
function rollMonster(tier){
  const t = scaledTier(tier);
  let pool = MONSTERS.filter(m => m.tier === t);
  if(!pool.length) pool = MONSTERS.filter(m => m.tier === clamp(t,1,4));
  const base = pick(pool);
  return scaleFoe(JSON.parse(JSON.stringify(base)));
}

/* =========================================================================
   EXPLORATION
   ========================================================================= */
function exploreHere(){
  const m = hereHex();
  const fresh = !m.explored;
  if(fresh){ m.explored = true; S.explored++; gainXp(1); }
  const F = m.feat && FEATS[m.feat];
  if(F && F.kind === 'town'){ MUS.set('town'); openTown(m); return; }
  if(F && F.kind === 'lair'){ lairPrompt(m); return; }
  if(F && F.kind === 'gate'){ gatePrompt(m); return; }
  if(F && F.kind === 'site' && !m.used){ siteEvent(m); return; }
  if(!fresh){ flash('Nothing left here worth the daylight.'); return; }
  drawEncounter(m);
}

function drawEncounter(m){
  const roll = rnd();
  if(m.threat){ m.threat = null; startCombat(rollMonster(m.tier), {where:'ambush'}); return; }
  if(roll < 0.42){ startCombat(rollMonster(m.tier), {}); return; }
  if(roll < 0.80){
    const pool = EVENTS.filter(e => e.tier.includes(clamp(m.tier,1,4)));
    resolveEvent(pick(pool.length ? pool : EVENTS));
    return;
  }
  // quiet find
  const finds = [
    () => { const g = gainGold(ri(8,22) + m.tier*6); return `Coin in a split log. ${g} gold.`; },
    () => { const it = rollItem(clamp(m.tier,1,3)); giveItem(it.id); return `A ${it.nm}, left where someone dropped it.`; },
    () => { healHero(6,'clean water'); return 'A spring, and an hour of quiet.'; },
    () => { const n = reveal(S.pos, 2 + D().scout); return `High ground. ${plural(n,'hex')} of country opens up.`; },
    () => { S.hero.en = D().maxEn; return 'You find a good place to stop, and stop.'; },
  ];
  const tx = pick(finds)();
  modal({ic:'🧭', h:'Quiet Ground', b:`<p>${tx}</p>`, f:[{lb:'Move on', cls:'primary', fn:()=>{closeModal();save();render();}}]});
}

function siteEvent(m){
  const F = FEATS[m.feat];
  const done = tx => modal({ic:F.ic, h:F.nm, b:`<p>${tx}</p>`, f:[{lb:'Continue', cls:'primary', fn:()=>{closeModal();save();render();}}]});
  m.used = true;
  switch(m.feat){
    case 'shrine': resolveEvent(EVENTS.find(e => e.id === 'shrine')); m.used = true; break;
    case 'tower': {
      const n = reveal(S.pos, 4);
      gainXp(4);
      done(`You climb, and the region lays itself out. ${plural(n,'hex')} revealed.`);
      break;
    }
    case 'grove': {
      party().forEach(m => { const md = D(m); m.hp = md.maxHp; m.en = md.maxEn; });
      S.lead = 0;
      done('Nothing hunts here. You sleep for eleven hours and wake whole.');
      break;
    }
    case 'stones': {
      skillTest({stat:'spi', dc:9, nm:'Standing Stones',
        tx:'Stand between them and see whether they agree with you.',
        okTx:'The hum settles into your bones and stays there.',
        failTx:'The hum gets into your teeth and will not leave.',
        ok:()=>{ const st = pick(['mig','agi','wit','spi']); S.hero.stats[st]++; log(`Permanent +1 ${STATNM[st]}.`,'v'); gainXp(4); },
        fail:()=>{ hurtHero(4,'the stones'); S.hero.en = 0; }});
      break;
    }
    case 'mine': {
      skillTest({stat:'mig', dc:9, nm:'Old Mine',
        tx:'The props are rotten and the seam is not.',
        okTx:'You come out with your arms full.', failTx:'The roof comes down behind you, and partly on you.',
        ok:()=>{ gainGold(ri(40,80)); if(chance(0.4)) giveItem(rollItem(3).id); gainXp(4); },
        fail:()=>{ hurtHero(7,'a collapse'); gainGold(ri(10,20)); }});
      break;
    }
    case 'ruin': {
      skillTest({stat:'wit', dc:9, nm:'Ruin',
        tx:'The writing is not a language. It is a set of instructions.',
        okTx:'You read enough of it to know where not to stand.',
        failTx:'You read enough of it to wake what was reading back.',
        ok:()=>{ giveItem(rollItem(3).id); gainXp(5); markNearestLair(); },
        fail:()=>{ startCombat(rollMonster(clamp(m.tier+1,1,4)), {}); }});
      break;
    }
    case 'barrow': {
      modal({ic:'⚰️', h:'Barrow', b:`<p>A door in a hill, and it opens outward. Whatever is inside was buried with everything it owned.</p>`,
        f:[
          {lb:'Go in', cls:'danger', fn:()=>{ closeModal(); startCombat(rollMonster(clamp(m.tier+1,2,4)), {loot:3, gold:1.6}); }},
          {lb:'Seal it instead', cls:'ghost', fn:()=>{ closeModal(); S.dread = Math.max(0,S.dread-1); gainXp(3); log('You wedge the door and pile stones on it. Dread falls by 1.','g'); save(); render(); }},
        ]});
      break;
    }
    case 'camp': {
      modal({ic:'🏕️', h:'Warband Camp', b:`<p>Cookfires, picket lines, and a great deal more of them than there were last week. They have not seen you yet.</p>`,
        f:[
          {lb:'Raid it', cls:'danger', fn:()=>{ closeModal(); startCombat(Object.assign(JSON.parse(JSON.stringify(MONSTERS.find(x=>x.id==='brigand'))), {tier:clamp(m.tier,2,4)}), {loot:2, gold:2, camp:key(m.q,m.r)}); }},
          {lb:'Slip past', cls:'ghost', fn:()=>{ closeModal(); skillTest({stat:'agi', dc:9, nm:'Slip Past',
              okTx:'You are three ridges away before the dogs start.', failTx:'The dogs start early.',
              ok:()=>{ gainXp(3); }, fail:()=>{ startCombat(rollMonster(clamp(m.tier,2,4)), {}); }}); }},
        ]});
      break;
    }
    case 'hermit': {
      const offer = pick(ITEMS.filter(i => i.tier === 3));
      const price = Math.round(offer.cost * 0.6);
      const tal = pick(TALENTS.filter(t => !S.hero.talents.includes(t.id)));
      modal({ic:'🛖', h:'Hermitage', b:
        `<p>One door, one window, and an occupant who has clearly been expecting somebody, though possibly not you.</p>
         <div class="sep"></div>
         <button class="choice" id="hA" ${S.gold < price ? 'disabled' : ''}>
           <b>${offer.ic} Buy the ${esc(offer.nm)} — ${price}g</b><div class="sub">${esc(offer.tx)}</div></button>
         <button class="choice" id="hB" ${S.gold < 70 || !tal ? 'disabled' : ''}>
           <b>${tal ? tal.ic : ''} Be taught: ${tal ? esc(tal.nm) : '—'} — 70g</b><div class="sub">${tal ? esc(tal.tx) : 'Nothing left to learn here.'}</div></button>
         <button class="choice" id="hC"><b>🍵 Accept the tea and leave</b><div class="sub">Heal fully. Restore energy.</div></button>`,
        f:[]});
      $('#hA').onclick = () => { S.gold -= price; giveItem(offer.id); closeModal(); save(); render(); };
      $('#hB').onclick = () => { S.gold -= 70; S.hero.talents.push(tal.id); log(`You learn ${tal.nm}.`,'v'); closeModal(); save(); render(); };
      $('#hC').onclick = () => { party().forEach(m => { const md = D(m); m.hp = md.maxHp; m.en = md.maxEn; }); S.lead = 0; log('The tea is remarkable.','g'); closeModal(); save(); render(); };
      break;
    }
    default: drawEncounter(m);
  }
}

/* ---------- generic event resolution ---------- */
function resolveEvent(ev){
  const body = `<p>${esc(ev.tx)}</p><div class="sep"></div>` + ev.opts.map((o,i) => {
    const ok = !o.need || o.need();
    return `<button class="choice" data-o="${i}" ${ok?'':'disabled'}>
      <b>${esc(o.lb)}</b>${o.sub ? `<div class="sub">${esc(o.sub)}</div>` : ''}</button>`;
  }).join('');
  modal({ic:ev.ic, h:ev.nm, b:body, f:[]});
  $$('#scrim [data-o]').forEach(btn => {
    btn.onclick = () => {
      const o = ev.opts[+btn.dataset.o];
      if(o.test){
        skillTest(Object.assign({}, o.test, {nm:ev.nm, tx:ev.tx, okTx:o.okTx, failTx:o.failTx, ok:o.ok||(()=>{}), fail:o.fail||(()=>{})}));
      } else if(o.fight){
        closeModal();
        const base = MONSTERS.find(m => m.id === o.fight) || rollMonster(2);
        startCombat(JSON.parse(JSON.stringify(base)), {});
      } else if(o.shop){
        openShop({nm:'Road Peddler', ic:'🎒', stockKey:'peddler:' + S.day, tier:2, mark:1.15});
      } else if(o.sell){
        openSell();
      } else {
        const tx = o.fn() || '';
        modal({ic:ev.ic, h:ev.nm, b:`<p>${tx}</p>`, f:[{lb:'Continue', cls:'primary', fn:()=>{closeModal();save();render();}}]});
      }
    };
  });
}


/* =========================================================================
   ABILITY CARDS  —  the Gloomhaven layer
   Each hero owns a deck nobody else can play. Every round you play the TOP
   half of one card and the BOTTOM half of another; the lower initiative of
   the two you lead with decides who swings first. Cards go to your discard
   as you spend them, and anything marked LOST is gone until you sleep.
   Card numbers are the base; your dice pool is the modifier rolled on top.

   action keys: atk sh heal ward rr en  pierce stun dbl leech refresh
                burn psn (on the enemy)  curse (enemy hits softer)
                retal  dice[]  surge[]  gold  lost
   ========================================================================= */
const CARDS = {
warden: [

/* =========================================================================
   COMBAT — the party
   Every hero still standing plays a TOP and a BOTTOM each round, exactly as
   the solo game did. Their halves are pooled into one set of party numbers,
   their dice into one pool. The lowest initiative played sets the order, and
   whoever stands in the front rank takes what comes back.
   ========================================================================= */
function conscious(){ return party().filter(h => !isDown(h)); }

/* what the Second Masteries have added to this round */
function blankBuff(){ return {atk:0, sh:0, shHelp:0, ward:0, retal:0, rr:0, pierce:0, first:0, dblShield:0, noArm:0, armCut:0}; }
/* what a hero's Second Mastery costs them right now */
function mCost(h){
  const m = MST(h, 'm2'); if(!m) return 0;
  return Math.max(1, m.cost - (rankOf(h, 'm2') >= 4 ? 1 : 0));
}
/* Only the heroes whose action actually puts them in the swing roll dice, and
   each die remembers whose it is, because shields are not pooled the way
   attack is — see myShields. */
const swinging = () => conscious().filter(h => { const f = actFor(h, actOf(h)); return f && f.joins; });
const actOf = h => (V.combat && V.combat.acts) ? V.combat.acts[h.id] : null;
function partyPool(){
  const pool = [];
  for(const h of swinging()) D(h).pool.forEach(k => pool.push({k, hid:h.id}));
  return pool;
}
/* Every hero who took Attack swings for its printed base plus their rank plus
   their gear. The base is what a played card used to put on the table; without
   it a level-1 round is three dice and a rounding error. A mastery that puts
   its hero in the swing brings their gear and dice but no Attack base — the
   mastery's own number is what it is worth. */
function partyAtkBonus(){
  return swinging().reduce((n,h) =>
    n + D(h).atk + (actOf(h) === 'atk' ? 3 + rankOf(h,'atk') : 0), 0);
}
function partyRerolls(){ return conscious().reduce((n,h) => n + D(h).rrTotal, 0); }
function partySurgeOptions(){
  const out = new Set();
  swinging().forEach(h => D(h).surge.forEach(x => out.add(x)));
  if(!out.size) conscious().forEach(h => D(h).surge.forEach(x => out.add(x)));
  return Array.from(out);
}

function startCombat(foe, opts){
  opts = opts || {};
  const deck = intentDeck(foe);
  const C = {
    foe: Object.assign({}, foe, {maxHp: foe.hp, burn:0, psn:0, stun:0, shieldBonus:0, rage:0, curse:0,
                                 arm: foe.trait === 'entrench' ? Math.max(foe.arm||0, 8) : foe.arm}),
    opts, round:1, phase:'acts',
    intentDeck: deck, order: shuffle(deck.map((x,i) => i)), intent: null,
    myDice:[], foeDice:[], rrLeft:0, spentSurge:0, sharp:0,
    mb: blankBuff(),          // what this round's chosen actions add up to
    acts:{},                  // heroId -> action id, one each
    itemUsed:{},              // heroId -> did their Defend already spend its item
    myInit:99,
    pend:{dmg:0, pierce:false, guard:0},
    me:{burn:0, poison:0, stun:0, hexed:0, stone:0, fury:0, curse:0},
    done:false, hist:[],
  };
  V.combat = C;
  V.lastBoss = null;
  MUS.set(opts.boss ? 'boss' : 'combat', true);
  log(`${foe.ic} ${foe.nm} blocks the way.`, 'r');
  newCombatRound(true);
}

function newCombatRound(first){
  const C = V.combat;
  if(!C || C.done) return;
  if(!first){
    if(C.me.burn > 0){ C.me.burn--; dealToMe(3, 'burning', true); }
    if(C.me.poison > 0){ C.me.poison--; dealToMe(2, 'venom', true); }
    if(C.foe.burn > 0){ C.foe.burn--; dealToFoe(2, 'cinders', true); }
    if(C.foe.psn > 0){ C.foe.psn--; dealToFoe(2, 'venom', true); }
    if(C.foe.spec === 'regen' && C.foe.hp > 0){ C.foe.hp = Math.min(C.foe.maxHp, C.foe.hp + 3); cLog(`${C.foe.nm} knits itself back together (+3).`); }
    if(C.foe.trait === 'regrowth' && C.foe.hp > 0){
      if(C.foe.burn > 0) cLog(`${C.foe.nm} tries to close its wounds, but the fire will not let it.`, 'g');
      else { C.foe.hp = Math.min(C.foe.maxHp, C.foe.hp + 8); cLog(`${C.foe.nm} grows back what you took. +8.`, 'r'); }
    }
    if(C.foe.spec === 'crown'){ C.foe.rage++; cLog('The Crown grows heavier. +1 attack.'); }
    if(C.foe.spec === 'crown' && !C.foe.phase2 && C.foe.hp <= C.foe.maxHp * 0.5){
      C.foe.phase2 = true;
      C.foe.pwr = (C.foe.pwr || 0) + 2;
      C.foe.arm = (C.foe.arm || 0) + 1;
      C.me.burn = 2;
      cLog('The Crown sheds its first shape. It comes back harder, and the air catches light.', 'r');
      sfx('lair');
      fx('#foeCard', 'gash', 620);
    }
  }
  if(C.done) return;
  if(!conscious().length){ partyDown(); return; }
  if(C.me.stun > 0) C.me.stun--;
  if(C.foe.stun > 0) C.foe.stun--;
  if(C.foe.stunBrace > 0) C.foe.stunBrace--;
  C.me.curseNow = C.me.curse || 0; C.me.curse = 0;
  C.foe.curseNow = C.foe.curse || 0; C.foe.curse = 0;

  drawIntent();
  C.acts = {}; C.itemUsed = {}; C.shown = null;
  C.myDice = []; C.foeDice = []; C.pend = {dmg:0, pierce:false, guard:0}; C.spentSurge = 0;
  C.mb = blankBuff();
  C.phase = 'acts';
  renderCombat();
}

/* who has not chosen their action yet */
function pendingHeroes(){
  const C = V.combat;
  return conscious().filter(h => !C.acts[h.id]);
}
function pickAction(heroId, actId){
  const C = V.combat;
  if(!C || C.phase !== 'acts') return;
  const h = party().find(x => x.id === heroId);
  if(!h || isDown(h)) return;
  if(C.acts[h.id] === actId){ delete C.acts[h.id]; renderCombat(); return; }
  if(!canTake(h, actId)){
    const f = actFor(h, actId);
    flash(f && f.locked ? 'That mastery is locked. A tick opens it.' : 'Not enough energy for that.');
    return;
  }
  C.acts[h.id] = actId;
  sfx('cardPlay', 0);
  renderCombat();
}

/* =========================================================================
   COMMITTING THE ROUND
   Everyone's chosen action is resolved into one set of party numbers: who is
   swinging (their dice join the roll), what is being guarded, what the
   masteries added, and the lowest initiative anybody played.
   ========================================================================= */
function commitActions(){
  const C = V.combat;
  if(!C || C.phase !== 'acts' || pendingHeroes().length) return;
  C.mb = blankBuff();
  let init = 99;
  const shown = [];
  const lead = leadHero();
  const afterRoll = [];

  for(const h of conscious()){
    const f = actFor(h, C.acts[h.id]);
    if(!f) continue;
    init = Math.min(init, f.init);
    if(f.cost) h.en = Math.max(0, h.en - f.cost);

    if(f.id === 'def'){
      // a guard from the back rank covers rather than blocks — see myShields
      const sh = 3 + rankOf(h, 'gua');
      if(h === lead) C.mb.sh += sh; else C.mb.shHelp += sh;
      // the breath you get back from not swinging. Without this a party with no
      // Hedge Priest has no way at all to heal inside a fight, and the card
      // bottoms used to do it constantly.
      healHero(1 + Math.floor(rankOf(h, 'gua') / 2), 'the moment behind your guard', h);
    }
    if(f.m && f.m.fire) f.m.fire(C, h, f.R);
    if(f.m && f.m.afterRoll) afterRoll.push([f.m, h, f.R]);

    shown.push({who:h, nm:f.nm, ic:f.ic, tx:f.tx, init:f.init, cost:f.cost});
  }

  C.myInit = init;
  C.shown = shown;
  C.afterRoll = afterRoll;
  sfx('cardPlay');
  cLog(shown.map(x => `${x.who.nm}: ${x.nm}`).join(' · '), 'b');

  C.myDice = partyPool().map(x => Object.assign(rollDie(x.k), {mark:false, fresh:true, hid:x.hid}));
  applyNoBlank(C.myDice);
  for(const [m, h, R] of afterRoll) m.afterRoll(C, h, R);
  C.foeDice = C.foe.pool.map(k => rollDie(k));
  C.rrLeft = Math.max(0, partyRerolls() + C.mb.rr - (C.me.hexed ? 1 : 0));
  C.pend = {dmg:0, pierce:false, guard:0};
  C.spentSurge = 0;
  C.phase = 'dice';
  renderCombat();
}

function partyDown(){
  const C = V.combat;                     // read the fight BEFORE dropping it
  V.lastBoss = (C && C.opts && C.opts.boss) || V.lastBoss;
  V.combat = null;
  setTimeout(heroFalls, T(300));
}

/* Stagger costs the enemy a whole attack, which is the strongest thing in the
   game, and a party of three gets three goes at it — so without this a trio
   simply keeps anything permanently staggered and never gets hit. After it
   shakes one off it is BRACED, and the next stagger slides off it. */
function staggerFoe(C, src){
  if(C.foe.stunBrace > 0){
    cLog(`${C.foe.nm} is braced for that. The stagger does not take.`, 'y');
    return false;
  }
  C.foe.stun = 2;
  C.foe.stunBrace = 4;
  cLog(`${C.foe.nm} is staggered${src ? ' by ' + src : ''}.`, 'y');
  sunderIfEntrenched(C);
  return true;
}
function sunderIfEntrenched(C){
  const extra = Math.max(0, ...conscious().map(h => D(h).sunder || 0));   // the Plate Breaker strips anything
  if(C.foe.trait === 'entrench' && C.foe.arm){
    C.foe.arm = Math.max(0, C.foe.arm - 3);
    cLog(`Plates shear off it. Armor down to ${C.foe.arm}.`, 'g');
  } else if(extra && C.foe.arm){
    C.foe.arm = Math.max(0, C.foe.arm - extra);
    cLog(`You break its guard open. Armor down to ${C.foe.arm}.`, 'g');
  }
}
function applyNoBlank(dice){
  const d = D(leadHero() || S.hero);
  if(d.noBlank || d.minatk) dice.forEach(x => { if(!x.a && !x.d && !x.s) x.a = 1; });
  if(d.gambit && dice.length){          // the Gambit Coin rerolls your worst die for free
    let worst = 0, low = Infinity;
    dice.forEach((x,i) => { const v = x.a*2 + x.d + x.s*2; if(v < low){ low = v; worst = i; } });
    const nd = rollDie(dice[worst].k);
    dice[worst].a = nd.a; dice[worst].d = nd.d; dice[worst].s = nd.s; dice[worst].fresh = true;
  }
}
function cLog(t, cls){ const C = V.combat; if(C){ C.hist.push((cls?'§'+cls+'§':'')+t); if(C.hist.length>40) C.hist.shift(); } log(t, cls); }

function drawIntent(){
  const C = V.combat;
  if(!C.order.length) C.order = shuffle(C.intentDeck.map((x,i) => i));
  C.intent = C.intentDeck[C.order.shift()];
  C.intentFresh = true;
  sfx('intent', 200);
}

/* Defend & Use Item is the only way into the pack mid-fight, and it is one
   thing per defender per round. */
function canUseItemNow(){
  const C = V.combat;
  if(!C || C.done) return null;
  return conscious().find(h => C.acts[h.id] === 'def' && !C.itemUsed[h.id]) || null;
}

/* ---------- the numbers ---------- */
function mySurges(){ const C = V.combat; return C.myDice.reduce((s,d)=>s+d.s,0) - C.spentSurge; }
function surgeOptions(){ return partySurgeOptions(); }
function myAttack(){
  const C = V.combat, mb = C.mb || blankBuff();
  if(C.me.stun > 0) return 0;
  const diceAtk = C.myDice.reduce((s,x)=>s+x.a,0);
  let a = diceAtk + partyAtkBonus() + mb.atk + C.pend.dmg + C.me.fury + (C.sharp||0);
  for(const h of swinging()){                  // only the heroes actually swinging bring their edge
    const hd = D(h);
    if(hd.zeal && h.hp <= hd.maxHp/2) a += hd.zeal;
    if(hd.firstatk && C.intent && C.myInit <= (C.intent.init || 99)) a += hd.firstatk;
  }
  if(C.me.curseNow) a -= C.me.curseNow;
  if(C.me.hexed) a -= 2;
  return Math.max(0, a);
}
/* Attack is pooled, because three heroes really are all swinging at one thing.
   A guard is not: only the hero in the front rank is being hit, so only THEIR
   shields stop the blow in full. Everyone else is covering from behind, which
   is worth half. Without this a trio's pooled shields simply exceed anything
   in the region and nothing can touch them. */
function myShields(){
  const C = V.combat, mb = C.mb || blankBuff();
  const lead = leadHero();
  const lid = lead ? lead.id : null;
  let own = 0, help = 0;
  C.myDice.forEach(x => { if(!x.hid || x.hid === lid) own += x.d; else help += x.d; });
  own += C.pend.guard + mb.sh;
  help += mb.shHelp;
  if(mb.dblShield) own *= 2;                    // Set Against It doubles the front rank's own guard
  return own + Math.floor(help / 2);
}
/* only the hero in the front rank wears their own armour and wards */
function myWard(){
  const C = V.combat, mb = C.mb || blankBuff();
  const lead = leadHero();
  return (lead ? D(lead).ward : 0) + mb.ward + (C.me.stone ? 3 : 0);
}
function leadArmor(){ const lead = leadHero(); return lead ? D(lead).arm : 0; }
/* A party's guard no longer scales with its size either: the enemy swings at
   the front rank, and only one hero is usually defending, so a trio's
   mitigation is close to a lone hero's. What the extra bodies really buy is a
   health pool to lose them out of, so the multiplier here is small — enough
   that three people standing in the open are a bigger target, not enough to
   punish them for existing. */
const threatMul = () => 1 + 0.15 * Math.max(0, party().length - 1);
function foeAttackVal(){
  const C = V.combat;
  if(C.foe.stun > 0) return 0;
  const it = C.intent || {};
  // the revealed intent replaces the monster's old flat attack bonus rather than stacking on it
  const raw = C.foeDice.reduce((s,x)=>s+x.a,0) + (it.atk||0) + (C.foe.pwr||0) + (C.foe.rage||0);
  return Math.max(0, Math.round(raw * threatMul()) - (C.foe.curseNow||0));
}
function foeShields(){ const C = V.combat; return C.foeDice.reduce((s,x)=>s+x.d,0) + (C.foe.shieldBonus||0) + ((C.intent && C.intent.sh)||0); }

function dealToFoe(n, src, quiet){
  const C = V.combat;
  C.foe.hp -= n;
  if(!quiet) cLog(`You hit for ${n}.`, 'g'); else cLog(`${C.foe.nm} takes ${n} from ${src}.`, 'g');
  floatText('-' + n, '#3ddc97', '#foeCard');
  fx('#foeCard', 'gash', 620);
  sfx(quiet ? 'burn' : 'hitFoe', 70);
  const fc = $('#foeCard'); if(fc){ fc.classList.add('hit'); setTimeout(()=>fc.classList.remove('hit'), 320); }
  if(C.foe.hp <= 0 && !C.done){ C.done = true; setTimeout(() => winCombat(C), T(420)); }
}
function dealToMe(n, src, quiet){
  const C = V.combat;
  const target = leadHero() || S.hero;
  let dmg = n;
  if(!quiet) dmg = Math.max(0, dmg - myWard());
  if(dmg <= 0){ cLog(`${target.nm} shrugs off ${src}.`); return 0; }
  target.hp -= dmg;
  cLog(`${cap(src)} costs ${target.nm} ${dmg}.`, 'r');
  floatText('-' + dmg, '#ef5350', '#meCard');
  fx('#meCard', 'redflash', 640);
  sfx(quiet ? 'burn' : 'hitMe', 70);
  const el = $('#meCard'); if(el){ el.classList.add('hit'); setTimeout(()=>el.classList.remove('hit'), 320); }
  if(target.hp <= 0){
    target.hp = 0;
    cLog(`${target.nm} goes down.`, 'r');
    const next = party().findIndex(h => !isDown(h));
    if(next >= 0){ S.lead = next; cLog(`${party()[next].nm} steps into the front rank.`, 'y'); }
    else if(C && !C.done){ C.done = true; V.lastBoss = C.opts.boss || null; V.combat = null; setTimeout(heroFalls, T(400)); }
  }
  return dmg;
}

function doReroll(){
  const C = V.combat;
  if(!C || C.done || C.phase !== 'dice') return;
  const marks = C.myDice.filter(d => d.mark);
  if(!marks.length || C.rrLeft <= 0) return;
  const n = Math.min(marks.length, C.rrLeft);
  let used = 0;
  for(const die of C.myDice){
    if(!die.mark || used >= n) continue;
    const nd = rollDie(die.k);
    die.a = nd.a; die.d = nd.d; die.s = nd.s; die.mark = false; die.fresh = true;
    used++;
  }
  applyNoBlank(C.myDice);
  C.rrLeft -= used;
  C.myDice.forEach(d => d.mark = false);
  sfx('dice', 80);
  renderCombat();
}
function spendSurge(id){
  const C = V.combat;
  if(!C || C.done) return;
  const so = SURGES[id];
  if(!so || mySurges() < so.cost) return;
  C.spentSurge += so.cost;
  sfx('surge', 60);
  if(id === 'dmg') C.pend.dmg += 2;
  if(id === 'pierce') C.pend.pierce = true;
  if(id === 'guard') C.pend.guard += 2;
  if(id === 'stagger') staggerFoe(C, 'the surge');
  if(id === 'scorch'){ C.foe.burn = 3; cLog(`${C.foe.nm} catches light.`, 'y'); }
  if(id === 'mend'){ const m = Math.max(0, ...conscious().map(h => D(h).mend)); healHero(m >= 2 ? 4 : 2, 'a small rite'); }
  renderCombat();
}
function foeSurgeSpend(){
  const C = V.combat;
  let s = C.foeDice.reduce((t,d)=>t+d.s,0);
  const sp = C.foe.spec;
  while(s > 0){
    if(sp === 'poison'){ C.me.poison = 3; cLog('Venom works into the wound.', 'r'); }
    else if(sp === 'burn'){ C.me.burn = 3; cLog('You are burning.', 'r'); }
    else if(sp === 'drain'){ C.foe.hp = Math.min(C.foe.maxHp, C.foe.hp + 3); const dl = leadHero() || S.hero; dl.en = Math.max(0, dl.en - 1); cLog(`${C.foe.nm} drains 3 and takes an energy from ${dl.nm}.`, 'r'); }
    else if(sp === 'crush'){ C.foe.crush = true; cLog('It swings through your guard.', 'r'); }
    else if(sp === 'parry'){ C.foe.shieldBonus = (C.foe.shieldBonus||0) + 3; cLog('It parries hard.', 'r'); }
    else if(sp === 'hex'){ C.me.hexed = 2; cLog('A hex settles on you.', 'r'); }
    else if(sp === 'crown'){
      const r = pick(['poison','burn','drain','crush']);
      if(r === 'poison') C.me.poison = 3;
      if(r === 'burn') C.me.burn = 3;
      if(r === 'drain') C.foe.hp = Math.min(C.foe.maxHp, C.foe.hp + 4);
      if(r === 'crush') C.foe.crush = true;
      cLog('The Crown does something you have no name for.', 'r');
    }
    else { C.foe.shieldBonus = (C.foe.shieldBonus||0) + 1; }
    s--;
  }
}

function strike(){
  const C = V.combat;
  if(!C || C.phase !== 'dice' || C.done) return;
  C.phase = 'resolve';
  C.foe.crush = false;
  foeSurgeSpend();
  const d = D(), it = C.intent || {};
  const mb = C.mb || blankBuff();
  const meFirst = mb.first ? true : (C.myInit || 99) <= (it.init || 99);

  const swingMine = () => {
    if(C.done) return;
    if(C.me.stun > 0){ cLog('You are still shaking off the blow.', 'y'); return; }
    const mine = myAttack();
    const fsh = (C.pend.pierce || mb.pierce) ? 0 : foeShields();
    const farm = mb.noArm ? 0 : Math.max(0, (C.foe.arm || 0) - mb.armCut);
    let toFoe = C.foe.trait === 'swarm' ? 0 : Math.max(0, mine - fsh - farm);
    // what the blow is made of, so a trait can strip out the parts it ignores
    const parts = {
      card: mb.atk,
      gear: partyAtkBonus(),
      surge: C.pend.dmg,
      arcane: C.myDice.reduce((n,x) => n + (x.k === 'arcane' ? x.a : 0), 0),
      attackingDice: C.myDice.filter(x => x.a > 0).length,
      meFirst,
    };
    const out = damageToFoe(C, toFoe, parts);
    toFoe = Math.max(0, Math.round(out.dmg));
    const pyre = Math.max(0, ...conscious().map(h => D(h).pyre));
    if(toFoe > 0 && pyre && C.foe.burn > 0) toFoe += pyre;
    const exec = Math.max(0, ...conscious().map(h => D(h).execute));
    if(toFoe > 0 && exec && C.foe.hp <= C.foe.maxHp * 0.25){ toFoe *= 2; cLog('It is already failing. You finish the motion.', 'g'); }
    const spill = Math.max(0, ...conscious().map(h => D(h).spill));
    if(spill && mySurges() > 0) toFoe += mySurges();
    if(out.note) cLog(out.note, toFoe > 0 ? 'g' : 'y');
    if(toFoe > 0){
      dealToFoe(toFoe);
      const leech = Math.max(0, ...swinging().map(x => D(x).leech || 0));
      if(leech){ healHero(Math.ceil(toFoe / 2), 'the wound you opened'); }
      if(conscious().some(h => D(h).kindle) && !C.me.kindled){ C.me.kindled = true; C.foe.burn = Math.max(C.foe.burn, 3); cLog('It catches light on the first cut.', 'y'); }
      if(C.foe.trait === 'mirror' && toFoe > 12){
        const back = Math.floor(toFoe / 3);
        cLog('The blow comes back off it.', 'r');
        dealToMe(back, 'your own strike, returned', true);
      }
    } else if(swinging().length) { cLog('Your blow finds nothing but shield and plate.', 'y'); sfx('block'); }
    else cLog('Nobody swung. Nothing lands.', 'y');
  };
  const swingTheirs = () => {
    if(C.done) return;
    if(it.heal){ C.foe.hp = Math.min(C.foe.maxHp, C.foe.hp + it.heal); cLog(`${C.foe.nm} recovers ${it.heal}.`, 'r'); }
    const fatk = foeAttackVal();
    if(fatk <= 0){ if(C.foe.stun > 0) cLog(`${C.foe.nm} is still recovering.`, 'y'); return; }
    const msh = (C.foe.crush || it.pierce) ? 0 : myShields();
    const raw = Math.max(0, fatk - msh - leadArmor());
    const dealt = raw > 0 ? dealToMe(raw, C.foe.nm + '\'s ' + (it.nm || 'attack')) : 0;
    if(raw <= 0){ cLog('You take the blow on your guard.', 'g'); sfx('block'); return; }
    if(dealt > 0){
      if(it.leech){ C.foe.hp = Math.min(C.foe.maxHp, C.foe.hp + Math.ceil(dealt/2)); cLog(`${C.foe.nm} feeds on it.`, 'r'); }
      if(it.psn){ C.me.poison = it.psn; cLog('Venom.', 'r'); }
      if(it.burn){ C.me.burn = it.burn; cLog('You are burning.', 'r'); }
      if(it.stun){ C.me.stun = 2; cLog('You are knocked off your feet.', 'r'); }
      if(it.curse){ C.me.curse = it.curse; cLog(`You will hit ${it.curse} softer next round.`, 'r'); }
      const retal = mb.retal || 0;
      if(retal && !C.done) dealToFoe(retal, 'your guard', true);
    }
  };

  if(meFirst){ swingMine(); swingTheirs(); }
  else { swingTheirs(); swingMine(); }

  if(C.foe.trait === 'feeder' && !C.done){
    const left = mySurges();
    if(left > 0){
      const fed = left * 3;
      C.foe.hp = Math.min(C.foe.maxHp, C.foe.hp + fed);
      cLog(`It swallows ${plural(left,'surge')} you never spent. +${fed}.`, 'r');
    }
  }
  if(C.me.hexed) C.me.hexed--;
  C.me.fury = 0;
  C.foe.shieldBonus = 0;
  if(!C.done){
    C.round++;
    setTimeout(() => newCombatRound(false), T(420));
  }
  renderCombat();
}

function tryFlee(){
  const C = V.combat;
  if(!C || C.done) return;
  if(C.opts.boss){ flash('There is no walking away from this one.'); return; }
  const auto = alive().some(h => h.id === 'reaver');    // the Reaver knows a way out for everyone
  const dc = 7 + C.foe.tier * 2;
  const finish = ok => {
    if(ok){
      V.combat = null; closeModal();
      MUS.set('travel');
      log('You break contact and go.', 'y');
      S.dice.forEach(x => x.spent = true);
      save(); render();
    } else {
      cLog('You cannot get clear.', 'r');
      dealToMe(Math.max(2, C.foe.tier * 3), 'a parting blow');
      if(V.combat) renderCombat();
    }
  };
  if(auto){ finish(true); return; }
  closeModal();
  skillTest({stat:'agi', dc, nm:'Break Away',
    tx:'Get out while there is still ground behind you.',
    okTx:'You are gone before it decides to follow.', failTx:'It follows.',
    ok:()=>finish(true), fail:()=>finish(false)});
}

function winCombat(C){
  C = C || V.combat;
  if(!C || C.paid) return;
  C.paid = true;
  const foe = C.foe;
  S.kills++;
  if(S.bounty && !S.bounty.done && S.bounty.id === foe.id){ S.bounty.done = true; log('Bounty target down. Collect in any settlement.', 'y'); }
  const g = gainGold(ri(foe.gold[0], foe.gold[1]) * (C.opts.gold || 1));
  gainXp(foe.xp);
  let loot = null;
  const lootChance = 0.3 + (C.opts.loot ? 0.4 : 0) + foe.tier * 0.06;
  if(chance(lootChance)){ loot = rollItem(clamp(foe.tier, 1, 3)); giveItem(loot.id); }
  if(foe.tier >= 4 && chance(0.25)){ const rel = pick(RELICS().filter(r => !S.bag.includes(r.id))); if(rel){ giveItem(rel.id); loot = rel; } }
  if(C.opts.camp){ const m = S.map[C.opts.camp]; if(m){ m.feat = null; m.threat = null; S.dread = Math.max(0, S.dread - 1); } }
  const boss = C.opts.boss;
  V.combat = null;
  MUS.set('travel');
  if(boss === 'crown'){ victory(); return; }
  if(boss === 'lair'){
    sfx('lair');
    const m = hereHex();
    m.cleared = true; S.seals++;
    S.dread = Math.max(0, S.dread - 4);
    modal({ic:'🔱', h:'The Lair Breaks', b:
      `<p>You put it down, and the ground stops humming.</p>

/* =========================================================================

   ========================================================================= */
// A level-up must never stamp over a modal the player is still reading.
function tryLevelUp(){
  if(!S) return;
  const due = party().find(h => h.lvl < 10 && h.xp >= h.xpNext);
  if(!due) return;
  if(!$('#scrim').classList.contains('hidden')){ setTimeout(tryLevelUp, V.fast ? 60 : 450); return; }
  selectHero(party().indexOf(due));
  levelUp();
}
function levelUp(){
  const h = S.hero;
  if(h.lvl >= 10){ h.xp = Math.min(h.xp, xpFor(10)); return; }
  if(h.xp < h.xpNext) return;              // two quick XP gains must not stack two levels
  h.lvl++;
  h.xpNext = xpFor(h.lvl);
  const entry = (TRACKS[h.id] || []).find(t => t.lvl === h.lvl);
  if(entry){
    h.perks.push({nm:entry.nm, ic:entry.ic, tx:entry.tx, bon:entry.bon, dice:entry.dice, surge:entry.surge});
  }
  h.levelCards = (h.levelCards || 0) + 1;                      // a card decides the ticks
  if(h.lvl % 2 === 1) h.drafts += 1;                           // talent draft on odd levels
  if(h.lvl % 2 === 0) h.ticks += 1;                            // a spare tick on even levels
  const d = D();
  S.hero.hp = clamp(S.hero.hp + 6, 0, d.maxHp);
  log(`Level ${h.lvl}. ${entry ? entry.nm + ' — ' + entry.tx : ''}`, 'v');
  showLevelUp(entry);
}
function showLevelUp(entry){
  const h = S.hero;
  sfx('levelUp');
  modal({
    ic:'⬆️', h:`Level ${h.lvl}`, wide:true,
    b: `<div class="center" style="margin-bottom:12px">
          <div class="pill">${esc(h.nm)} · Level ${h.lvl}</div>
        </div>
        ${entry ? `<div class="item equipped" style="align-items:center">
          <div class="ic">${entry.ic}</div>
          <div><div class="nm">${esc(entry.nm)}</div><div class="tx">${gtx(entry.tx)}</div>
          <div class="mini faint" style="margin-top:2px">${gtx('Printed on your character card at level ' + entry.lvl + '.')}</div></div></div>` : ''}
        <div class="card" style="margin-top:10px">
          <div class="kv"><span>Max health</span><b>${D().maxHp}</b></div>
          <div class="kv"><span>${gword('levelcard','Level cards to draw')}</span><b>${h.levelCards||0}</b></div>
          <div class="kv"><span>${gword('tick','Ticks in hand')}</span><b>${h.ticks}</b></div>
          <div class="kv"><span>${gword('talent','Talent drafts waiting')}</span><b>${h.drafts}</b></div>
        </div>`,
    f:[{lb:'Spend rewards', cls:'primary', fn:() => { closeModal(); spendRewards(); }}],
    noClose:true,
  });
}
function spendRewards(){
  let h = S.hero;
  if(!owedBy(h)){                                     // move on to whoever still has something owed
    const owed = party().findIndex(owedBy);
    if(owed >= 0){ selectHero(owed); h = S.hero; }
  }
  if(h.levelCards > 0){ drawLevelCard(); return; }
  if(h.ticks > 0){ spendTick(); return; }
  if(h.drafts > 0){ draftTalent(); return; }
  setTimeout(tryLevelUp, T(150));
  save(); render();
}
const owedBy = h => !!(h && (h.levelCards || h.ticks || h.drafts));
const owedCount = h => (h.levelCards||0) + (h.ticks||0) + (h.drafts||0);

/* =========================================================================

   A level does not hand you a fixed point any more. You draw off the top of
   the level deck, and the deck is mostly generous in exchange for telling you
   where the tick has to go. `to` names a track, or is null for a free tick.
   ========================================================================= */
const LEVEL_CARDS = [
  {id:'lc1',  nm:'Hard Miles',        ic:'🥾', w:5, n:1, to:null,  tx:'A tick. Put it wherever you have been feeling the lack.'},
  {id:'lc2',  nm:'Time to Think',     ic:'🕯️', w:4, n:1, to:null,  tx:'A tick, and no one telling you what to do with it.'},

  {id:'lc4',  nm:'What Held',         ic:'🛡️', w:3, n:2, to:'gua', tx:'Two ticks, both of them into Guard.'},
  {id:'lc5',  nm:'Wind Back',         ic:'❤️', w:3, n:2, to:'hlt', tx:'Two ticks of Health, and the health that comes with them.'},
  {id:'lc6',  nm:'Second Wind',       ic:'⚡', w:3, n:2, to:'eng', tx:'Two ticks of Energy. You will want it for a Mastery.'},
  {id:'lc7',  nm:'The Old Habit',     ic:'🌀', w:3, n:2, to:'m1',  tx:'Two ticks into your First Mastery. It only gets more like you.'},
  {id:'lc8',  nm:'The New Trick',     ic:'🔮', w:3, n:2, to:'m2',  tx:'Two ticks into your Second Mastery. If it was locked, it is not now.'},
  {id:'lc9',  nm:'Ground Covered',    ic:'🧭', w:2, n:2, to:'nav', tx:'Two ticks of Navigate. The region gets smaller.'},
  {id:'lc10', nm:'Sharp Eyes',        ic:'🔭', w:2, n:2, to:'exp', tx:'Two ticks of Explore.'},
  {id:'lc11', nm:'Still Standing',    ic:'🏕️', w:2, n:2, to:'sur', tx:'Two ticks of Survival.'},
  {id:'lc12', nm:'A Good Year',       ic:'⭐', w:2, n:2, to:null,  tx:'Two ticks, free. Place them where you like.'},
  {id:'lc13', nm:'Everything At Once',ic:'👑', w:1, n:3, to:null,  tx:'Three ticks, free. This does not come around often.'},
];
function drawLevelCard(){
  const h = S.hero;
  if(!h.levelCards){ spendRewards(); return; }
  // weighted draw, and a card that would only feed a maxed track is redrawn
  const pool = LEVEL_CARDS.filter(c => !c.to || !atMax(h, c.to));
  const bag = [];
  (pool.length ? pool : LEVEL_CARDS).forEach(c => { for(let i=0;i<c.w;i++) bag.push(c); });
  const card = bag[Math.floor(rnd() * bag.length)];
  const t = card.to ? TRACK(card.to) : null;
  sfx('levelUp', 0);
  modal({
    ic:'🎴', h:'Level Card', noClose:true,
    sub:`${h.ic} ${h.nm} · level ${h.lvl}`,
    b:`<div class="solocard"><div class="acard pick" style="--accent:${heroArt(h).col}">
        ${cardWatermark()}
        <div class="ahd"><span class="aic">${card.ic}</span><span class="anm">${esc(card.nm)}</span></div>
        <div class="ahalf top"><span class="lbl">${card.to ? 'Into ' + t.nm : 'Anywhere you like'}</span>
          <span class="atx">${gtx(card.tx)}</span></div>
       </div></div>
       <div class="card" style="margin-top:11px">
         <div class="kv"><span>${gword('tick','Ticks')}</span><b>${card.n}</b></div>
         <div class="kv"><span>Where</span><b>${card.to ? t.ic + ' ' + t.nm : 'your choice'}</b></div>
       </div>`,
    f:[{lb:'Take it', cls:'primary', fn:()=>{
      h.levelCards--;
      if(card.to){
        const before = rankOf(h, card.to);
        const room = Math.max(0, MAXRANK - before);
        const put = Math.min(card.n, room);
        if(put) addRank(h, card.to, put);
        if(put < card.n) h.ticks += card.n - put;      // a full track hands the rest back loose
        log(`${h.nm}: ${card.nm} — ${t.nm} ${before} → ${rankOf(h, card.to)}${put < card.n ? `, ${card.n-put} tick spare` : ''}.`, 'v');
      } else {
        h.ticks += card.n;
        log(`${h.nm}: ${card.nm} — ${plural(card.n,'tick')} to place.`, 'v');
      }
      closeModal();
      setTimeout(spendRewards, T(120));
    }}],
  });
}

/* =========================================================================
   SPENDING A TICK  —  the rank board, one row per track
   ========================================================================= */
function trackRowHtml(h, t, opts){
  opts = opts || {};
  const R = rankOf(h, t.id);
  const full = R >= MAXRANK;
  const m = t.mastery ? MST(h, t.mastery === 1 ? 'm1' : 'm2') : null;
  const nm = m ? m.nm : t.nm;
  const ic = m ? m.ic : t.ic;
  const sub = m ? m.tx(R) : t.tx;
  const locked = t.mastery === 2 && R < 1;
  const pips = Array.from({length: MAXRANK}, (_, i) =>
    `<i class="pip ${i < R ? 'on' : ''} ${opts.next && i === R ? 'next' : ''}"></i>`).join('');
  return `<div class="trow ${full?'full':''} ${locked?'locked':''}" ${opts.pick && !full ? `data-tick="${t.id}"` : ''}>
    <div class="tic">${ic}</div>
    <div style="flex:1;min-width:0">
      <div class="row" style="gap:7px">
        <b class="tiny">${esc(nm)}</b>
        ${m ? `<span class="mini faint">${t.nm}</span>` : ''}
        ${t.stat ? `<span class="mini faint">${STATIC[t.stat]} ${STATNM[t.stat]}</span>` : ''}
        ${locked ? '<span class="mini" style="color:var(--gold)">locked</span>' : ''}
        ${t.mastery === 2 && !locked ? `<span class="mini" style="color:var(--gold)">⚡${mCost(h)}</span>` : ''}
        <span class="rankn">${R}${full?'':'/'+MAXRANK}</span>
      </div>
      <div class="pips">${pips}</div>
      <div class="mini muted">${gtx(sub)}</div>
    </div>
  </div>`;
}
function boardHtml(h, opts){
  const grps = ['Abilities','Vitals','Skills'];
  return grps.map(g => `<div class="bgrp"><div class="mini faint bglbl">${g}</div>
    ${BOARD.filter(t => t.grp === g).map(t => trackRowHtml(h, t, opts)).join('')}</div>`).join('');
}
function spendTick(){
  const h = S.hero;
  if(!h.ticks){ spendRewards(); return; }
  modal({
    ic:'▸', h:'Place a Tick', wide:true, noClose:true,
    sub:`${h.ic} ${h.nm} · ${plural(h.ticks,'tick')} in hand`,
    b:`<p class="muted tiny">${gtx('A tick raises one track by a rank, and it is permanent. Eight ranks is as far as any track goes.')}</p>
       <div class="sep"></div>
       <div class="boardgrid">${boardHtml(h, {pick:true, next:true})}</div>`,
    f:[],
  });
  $$('#scrim [data-tick]').forEach(el => el.onclick = () => {
    const id = el.dataset.tick;
    if(atMax(h, id) || !h.ticks) return;
    const t = TRACK(id), before = rankOf(h, id);
    addRank(h, id, 1);
    h.ticks--;
    sfx('levelUp', 0);
    log(`${h.nm}: ${t.nm} ${before} → ${rankOf(h, id)}.`, 'v');
    save();
    // a hero with ticks left keeps the board open rather than reopening it per tick
    if(h.ticks){ spendTick(); return; }
    closeModal();
    setTimeout(spendRewards, T(120));
  });
}
function draftTalent(){
  const h = S.hero;
  const pool = shuffle(TALENTS.filter(t => !h.talents.includes(t.id))).slice(0,3);
  if(!pool.length){ h.drafts = 0; save(); render(); return; }
  modal({
    ic:'🎴', h:'Draft a Talent', noClose:true,
    b:`<p class="muted"><b style="color:var(--ink)">${h.ic} ${esc(h.nm)}</b> — three cards off the top. Take one.</p><div class="sep"></div>` +
      pool.map(t => `<button class="choice" data-tal="${t.id}">
        <b>${t.ic} ${esc(t.nm)}</b><div class="sub">${gtx(t.tx)}</div></button>`).join(''),
    f:[],
  });
  $$('#scrim [data-tal]').forEach(b => b.onclick = () => {
    h.talents.push(b.dataset.tal);
    h.drafts--;
    log(`You take ${TAL(b.dataset.tal).nm}.`, 'v');
    closeModal();
    setTimeout(spendRewards, T(120));
  });
}
