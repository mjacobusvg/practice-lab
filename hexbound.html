<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Hexbound</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b11; --panel:#101826; --card:#16202f; --card-hi:#1e2b3e;
  --ink:#e8eef6; --ink-dim:#94a3b8; --ink-faint:#64748b;
  --line:rgba(255,255,255,0.08); --line-hi:rgba(255,255,255,0.20);
  --gold:#e8b44a; --red:#ef5350; --blue:#5aa9f5; --green:#3ddc97;
  --violet:#a78bfa; --lime:#a3e635; --orange:#fb923c; --pink:#f472b6; --cyan:#38bdf8;
  --r:10px; --r-lg:16px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 760px at 50% -12%, #16202f 0%, transparent 62%),
    radial-gradient(760px 520px at 88% 112%, #1c1730 0%, transparent 60%),
    var(--bg);
  color:var(--ink);
  font-family:'DM Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  font-size:15px; line-height:1.45;
  overflow-x:hidden;
}
h1,h2,h3,.serif{font-family:'DM Serif Display',Georgia,serif;font-weight:400;letter-spacing:.2px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.hidden{display:none !important}
.wrap{max-width:1180px;margin:0 auto;padding:14px 14px 40px}

/* ---------- generic ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:9px 16px;border-radius:var(--r);border:1px solid var(--line-hi);
  background:linear-gradient(180deg,#22304a,#172134);
  font-weight:600;font-size:14px;letter-spacing:.3px;
  transition:transform .12s ease, box-shadow .12s ease, background .12s ease, border-color .12s;
}
.btn:hover:not(:disabled){background:linear-gradient(180deg,#2b3b5b,#1c2841);transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(0)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.primary{background:linear-gradient(180deg,#e8b44a,#c08a16);color:#1a1205;border-color:#f2cd77}
.btn.primary:hover:not(:disabled){background:linear-gradient(180deg,#f6c760,#d0971a)}
.btn.good{background:linear-gradient(180deg,#2c7a5a,#1d5741);border-color:#3ddc97;color:#defff1}
.btn.danger{border-color:rgba(239,83,80,.55);color:#ffb3b1;background:linear-gradient(180deg,#3a1f22,#26151a)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.wide{width:100%}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.muted{color:var(--ink-dim)} .faint{color:var(--ink-faint)}
.tiny{font-size:12px} .mini{font-size:11.5px}
.center{text-align:center}
.row{display:flex;gap:10px;align-items:center}
.row.wr{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sep{height:1px;background:var(--line);margin:12px 0}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;border:1px solid var(--line-hi);font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-dim)}
.pill.t1{color:#8fe3b4;border-color:rgba(61,220,151,.45)}
.pill.t2{color:#ffdd8a;border-color:rgba(232,180,74,.45)}
.pill.t3{color:#9ec9ff;border-color:rgba(90,169,245,.45)}
.pill.t4{color:#ffb0ae;border-color:rgba(239,83,80,.5)}
.key{display:inline-block;min-width:20px;padding:1px 5px;border-radius:5px;background:#0c1421;border:1px solid var(--line-hi);font-size:11px;font-weight:700;text-align:center}

/* ---------- top bar ---------- */
#topbar{position:sticky;top:0;z-index:40;backdrop-filter:blur(10px);background:rgba(7,11,17,.85);border-bottom:1px solid var(--line)}
#topbar .inner{max-width:1180px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:'DM Serif Display',serif;font-size:19px;letter-spacing:.5px;flex:none}
.brand .d{color:var(--gold)}
.stat{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--ink-dim);white-space:nowrap}
.stat b{color:var(--ink);font-weight:700}
.bar{height:7px;border-radius:99px;background:#0b1220;border:1px solid var(--line);overflow:hidden;min-width:74px}
.bar i{display:block;height:100%;border-radius:99px;transition:width .35s ease}
.bar.hp i{background:linear-gradient(90deg,#ef5350,#f97066)}
.bar.xp i{background:linear-gradient(90deg,#5aa9f5,#38bdf8)}
.bar.dread i{background:linear-gradient(90deg,#7c3aed,#ef5350)}
.topspacer{margin-left:auto}

/* ---------- layout ---------- */
#game{display:grid;grid-template-columns:minmax(0,1fr) 352px;gap:14px;align-items:start}
@media(max-width:900px){#game{grid-template-columns:1fr}}
.mapwrap{position:relative;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:#060a10}
#map{display:block;width:100%;touch-action:none;cursor:grab}
#map.drag{cursor:grabbing}
.mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:32px;height:32px;border-radius:9px;background:rgba(10,16,26,.86);border:1px solid var(--line-hi);display:grid;place-items:center;font-weight:700;font-size:15px}
.mapctl button:hover{background:rgba(30,43,62,.95);border-color:var(--gold)}
.maplegend{position:absolute;left:10px;bottom:10px;display:flex;gap:7px;flex-wrap:wrap;max-width:70%}
.lg{display:inline-flex;align-items:center;gap:4px;font-size:11px;background:rgba(8,13,21,.8);border:1px solid var(--line);border-radius:7px;padding:2px 7px;color:var(--ink-dim)}

/* ---------- dice tray ---------- */
.tray{display:flex;gap:6px;flex-wrap:wrap;min-height:46px;align-items:center}
.mdie{
  width:44px;height:44px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#16233a,#0e1726);border:1px solid var(--line-hi);flex:none;position:relative;
  font-size:19px;line-height:1;transition:.12s;
}
.mdie.spent{opacity:.28;filter:grayscale(1)}
.mdie.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 6px 18px rgba(232,180,74,.22);transform:translateY(-2px)}
.mdie.wild{background:linear-gradient(180deg,#3b2f5c,#221b38);border-color:#a78bfa}
.mdie .lb{font-size:8.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-faint);margin-top:3px}
@keyframes tumble{0%{transform:rotate(-24deg) scale(.6);opacity:0}60%{transform:rotate(9deg) scale(1.08);opacity:1}100%{transform:none}}
.mdie.roll{animation:tumble .34s cubic-bezier(.2,1.2,.4,1) both}

/* ---------- combat dice ---------- */
.cdie{
  width:52px;height:52px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  border:1px solid var(--line-hi);background:linear-gradient(180deg,#1a2436,#111a28);flex:none;position:relative;cursor:pointer;transition:.12s;
}
.cdie.base{border-color:rgba(148,163,184,.5)}
.cdie.steel{border-color:rgba(90,169,245,.6);background:linear-gradient(180deg,#16283f,#0f1c2d)}
.cdie.guard{border-color:rgba(61,220,151,.55);background:linear-gradient(180deg,#142a25,#0d1c19)}
.cdie.arcane{border-color:rgba(167,139,250,.6);background:linear-gradient(180deg,#241d3c,#161129)}
.cdie.hunt{border-color:rgba(163,230,53,.55);background:linear-gradient(180deg,#222a12,#161c0c)}
.cdie.foe{border-color:rgba(239,83,80,.5);background:linear-gradient(180deg,#2c1a1e,#1c1114);cursor:default}
.cdie.rr{outline:2px dashed var(--gold);outline-offset:2px}
.cdie .fc{display:flex;gap:3px;align-items:center;font-size:13px;font-weight:700}
.cdie .sg{font-size:10px;color:var(--gold);font-weight:700}
.cdie.blank .fc{color:var(--ink-faint);font-weight:400}
.cdie.roll{animation:tumble .3s cubic-bezier(.2,1.2,.4,1) both}

/* ---------- hex info / actions ---------- */
.side{display:flex;flex-direction:column;gap:12px;position:sticky;top:58px}
@media(max-width:900px){.side{position:static}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.card h3{font-size:17px;margin-bottom:2px}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:2px 0}
.kv span:first-child{color:var(--ink-dim)}
.log{background:#0a1018;border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;height:172px;overflow-y:auto;font-size:12.5px;line-height:1.55;scroll-behavior:smooth}
.log div{padding:1px 0;color:var(--ink-dim);border-bottom:1px solid rgba(255,255,255,.03)}
.log div.hl{color:var(--ink)}
.log .g{color:var(--green)} .log .r{color:#ff9b99} .log .y{color:var(--gold)} .log .b{color:var(--blue)} .log .v{color:var(--violet)}

/* ---------- modal ---------- */
#scrim{position:fixed;inset:0;z-index:100;background:rgba(4,7,12,.78);backdrop-filter:blur(5px);display:grid;place-items:center;padding:14px;overflow-y:auto}
#scrim.hidden{display:none}
.modal{width:100%;max-width:660px;background:var(--panel);border:1px solid var(--line-hi);border-radius:18px;box-shadow:0 30px 90px rgba(0,0,0,.65);overflow:hidden;animation:pop .18s ease both;margin:auto}
.modal.wide{max-width:900px}
@keyframes pop{from{transform:translateY(10px) scale(.985);opacity:0}to{transform:none;opacity:1}}
.modal .mh{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,rgba(255,255,255,.035),transparent)}
.modal .mh .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:#0d1521;border:1px solid var(--line-hi);flex:none}
.modal .mh h2{font-size:22px;line-height:1.1}
.modal .mb{padding:16px 18px;max-height:min(66vh,760px);overflow-y:auto}
.modal .mf{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end;background:rgba(0,0,0,.16)}
.choice{display:block;width:100%;text-align:left;padding:11px 13px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin-bottom:8px;transition:.12s}
.choice:hover:not(:disabled){border-color:var(--gold);background:var(--card-hi);transform:translateX(2px)}
.choice:disabled{opacity:.4;cursor:not-allowed}
.choice b{display:block;font-size:14.5px}
.choice .sub{font-size:12.5px;color:var(--ink-dim);margin-top:2px}

/* ---------- combat ---------- */
.duel{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:620px){.duel{grid-template-columns:1fr}}
.fighter{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.fighter.foe{border-color:rgba(239,83,80,.28)}
.fighter .nm{font-family:'DM Serif Display',serif;font-size:19px;display:flex;align-items:center;gap:8px}
.hpbar{height:12px;border-radius:99px;background:#0b1220;border:1px solid var(--line);overflow:hidden;margin:7px 0}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#ef5350,#fb7185);transition:width .4s ease}
.fighter.me .hpbar i{background:linear-gradient(90deg,#3ddc97,#5aa9f5)}
.tot{display:flex;gap:10px;font-size:13px;font-weight:700;margin-top:8px;flex-wrap:wrap}
.tot span{display:inline-flex;align-items:center;gap:4px;background:#0c1421;border:1px solid var(--line);border-radius:8px;padding:3px 9px}
.status{display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--line-hi);background:#0c1421;margin:2px 3px 0 0}
.surge-opt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--card);margin-bottom:6px;font-size:13px}
.surge-opt.can{border-color:rgba(232,180,74,.5)}
.surge-opt.can:hover{background:var(--card-hi)}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.hit{animation:shake .3s ease}
.float{position:fixed;z-index:210;font-weight:800;font-size:22px;pointer-events:none;animation:fl 1s ease-out forwards;text-shadow:0 2px 10px rgba(0,0,0,.8)}
@keyframes fl{0%{opacity:0;transform:translateY(6px) scale(.8)}18%{opacity:1;transform:translateY(-6px) scale(1.1)}100%{opacity:0;transform:translateY(-52px) scale(1)}}

/* ---------- title ---------- */
.title-hero{text-align:center;padding:38px 0 20px}
.title-hero h1{font-size:clamp(42px,10vw,78px);line-height:1;letter-spacing:2px}
.title-hero h1 span{color:var(--gold)}
.title-hero p{color:var(--ink-dim);margin-top:10px}
.hero-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(256px,1fr));gap:11px}
.hero-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:13px;cursor:pointer;transition:.14s}
.hero-card:hover{border-color:var(--line-hi);background:var(--card-hi)}
.hero-card.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 8px 26px rgba(232,180,74,.13)}
.hero-card .hd{display:flex;gap:11px;align-items:center}
.hero-card .av{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:#0d1521;border:1px solid var(--line-hi);flex:none}
.hero-card .nm{font-family:'DM Serif Display',serif;font-size:19px}
.hero-card .desc{font-size:12.5px;color:var(--ink-dim);margin:8px 0 9px;min-height:50px}
.statline{display:flex;gap:6px;flex-wrap:wrap}
.sb{font-size:11px;background:#0c1421;border:1px solid var(--line);border-radius:7px;padding:2px 7px;color:var(--ink-dim)}
.sb b{color:var(--ink)}
.inp{background:#0a1018;border:1px solid var(--line-hi);border-radius:9px;padding:8px 11px;color:var(--ink);font:inherit;font-size:13.5px;width:100%}
.inp:focus{outline:none;border-color:var(--gold)}

/* ---------- items ---------- */
.item{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--card);margin-bottom:7px}
.item .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:17px;background:#0d1521;border:1px solid var(--line-hi);flex:none}
.item .nm{font-weight:700;font-size:13.5px}
.item .tx{font-size:12px;color:var(--ink-dim)}
.item.equipped{border-color:rgba(232,180,74,.45)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.ghexbg{position:absolute;inset:0;pointer-events:none;opacity:.5}
#tip{position:fixed;z-index:300;max-width:288px;pointer-events:none;opacity:0;background:#0b1220;border:1px solid var(--line-hi);border-radius:10px;padding:8px 11px;font-size:12.5px;line-height:1.4;box-shadow:0 12px 34px rgba(0,0,0,.6);transition:opacity .1s}
#tip.on{opacity:1}
#tip{color:var(--ink)}
#tip b.tt{display:block;margin-bottom:3px;font-size:13px;color:var(--gold)}
#tip b{display:inline;color:var(--gold);font-weight:700}
.gl{border-bottom:1px dotted rgba(232,180,74,.55);cursor:help;text-underline-offset:3px}
.gl:hover{border-bottom-color:var(--gold);color:var(--gold)}
button .gl{cursor:inherit}

/* ---------- ability cards ---------- */
.hand{display:flex;flex-wrap:wrap;gap:8px;padding:11px 0 4px}
.hand.draftgrid{justify-content:center}
.acard{
  flex:1 1 168px;max-width:230px;min-width:158px;border:1px solid var(--line);border-radius:12px;overflow:hidden;
  background:linear-gradient(180deg,#182233,#111a28);transition:.13s;display:flex;flex-direction:column;
}
@media(max-width:560px){.acard{flex:1 1 100%;max-width:none}}
.acard.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 8px 24px rgba(232,180,74,.16)}
.acard.pick{cursor:pointer;flex:0 1 238px;max-width:238px}
.acard.pick:hover{border-color:var(--gold);transform:translateY(-2px)}
/* a single card presented on its own, not in a hand */
.solocard{display:flex;justify-content:center;padding:4px 0 2px}
.solocard .acard{flex:0 0 320px;max-width:320px;min-width:0;cursor:default}
.solocard .acard:hover{transform:none}
.acard .ahd{display:flex;align-items:center;gap:7px;padding:7px 9px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.035)}
.acard .aic{font-size:15px}
.acard .anm{font-family:'DM Serif Display',serif;font-size:14.5px;line-height:1.1;flex:1;min-width:0}
.initb{
  display:inline-grid;place-items:center;min-width:26px;height:22px;padding:0 5px;border-radius:7px;
  background:#0a1220;border:1px solid var(--line-hi);font-size:12px;font-weight:800;color:var(--ink-dim);flex:none;
}
.acard .ahalf{
  display:block;width:100%;flex:1;text-align:left;padding:8px 9px;border:none;background:none;
  border-top:1px solid rgba(255,255,255,.04);transition:.12s;
}
button.ahalf{cursor:pointer}
button.ahalf:hover:not(:disabled){background:rgba(255,255,255,.05)}
button.ahalf:disabled{opacity:.3;cursor:not-allowed}
.acard .ahalf.sel{background:rgba(232,180,74,.14);box-shadow:inset 3px 0 0 var(--gold)}
.acard .ahalf .lbl{display:block;font-size:9.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--ink-faint);margin-bottom:2px}
.acard .ahalf.sel .lbl{color:var(--gold)}
.acard .ahalf .atx{font-size:12.5px;line-height:1.35;color:var(--ink)}
.intent{margin-top:9px;padding:8px 10px;border:1px solid rgba(239,83,80,.4);border-radius:10px;background:rgba(239,83,80,.07)}
.intent .inm{font-family:'DM Serif Display',serif;font-size:17px;line-height:1.15;margin-top:1px}
.played{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}
.played .pl{flex:1;min-width:210px;font-size:12.5px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
.played .pl .lbl{display:inline-block;font-size:9.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--gold);margin-right:6px}
.deckgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}

/* ---------- drawn die faces ---------- */
.dieface{width:100%;height:100%;display:block}
.cdie{padding:3px}
.cdie .fc{display:none}
.mdie .tface{width:30px;height:30px;display:block;image-rendering:auto}
.acard{position:relative}
.cwm{position:absolute;right:-18px;bottom:-18px;width:92px;height:92px;opacity:.06;pointer-events:none;z-index:0}
.acard.on .cwm{opacity:.13}
.acard > *:not(.cwm){position:relative;z-index:1}
.acard .ahd{border-left:3px solid var(--accent, var(--line-hi))}
.acard{background-image:repeating-linear-gradient(135deg, rgba(255,255,255,.014) 0 3px, transparent 3px 6px)}

/* ---------- enemy motifs and combat flourishes ---------- */
.fighter{position:relative;overflow:hidden}
.fwm{position:absolute;right:-18px;bottom:-22px;width:112px;height:112px;opacity:.07;pointer-events:none;z-index:0}
.fighter > *:not(.fwm):not(.gash):not(.redflash){position:relative;z-index:1}
.fighter.foe{border-color:color-mix(in srgb, var(--foe, #ef5350) 32%, transparent)}
.intent{position:relative;overflow:hidden;border-color:color-mix(in srgb, var(--foe, #ef5350) 48%, transparent) !important;
  background:color-mix(in srgb, var(--foe, #ef5350) 8%, transparent) !important}
.iwm{position:absolute;right:-12px;top:-14px;width:78px;height:78px;opacity:.13;pointer-events:none;z-index:0}
.intent > *:not(.iwm){position:relative;z-index:1}
@keyframes flipin{from{transform:rotateX(-85deg);opacity:0}60%{opacity:1}to{transform:none;opacity:1}}
.intent.reveal{animation:flipin .42s cubic-bezier(.2,.9,.3,1.15) both;transform-origin:top center}
@keyframes swipe{
  0%{transform:translate(-115%,-30%) rotate(-22deg) scaleX(.35);opacity:0}
  30%{opacity:1}
  100%{transform:translate(115%,30%) rotate(-22deg) scaleX(1.25);opacity:0}}
.gash{position:absolute;left:0;top:34%;width:100%;height:14px;pointer-events:none;z-index:6;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.85) 35%,rgba(255,140,140,.95) 55%,transparent);
  filter:blur(1.2px);animation:swipe .55s ease-out forwards}
@keyframes redflash{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
.redflash{position:absolute;inset:0;pointer-events:none;z-index:5;
  background:radial-gradient(circle at 50% 50%, rgba(239,83,80,0) 38%, rgba(239,83,80,.45) 100%);
  animation:redflash .6s ease-out forwards}
@keyframes flyaway{to{transform:translate(var(--dx),var(--dy)) scale(.34) rotate(var(--rot));opacity:0}}
.flycard{position:fixed;z-index:400;pointer-events:none;margin:0;
  animation:flyaway .56s cubic-bezier(.45,0,.6,1) forwards}
@media (prefers-reduced-motion: reduce){
  .gash,.redflash,.flycard,.intent.reveal{animation-duration:.01ms !important}
}

/* ---------- the face chart inside a tooltip ---------- */
.facegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tipdie{width:100%;height:36px;padding:2px;border-radius:8px;cursor:default}
#tip{max-width:210px}

/* ---------- gear comparison ---------- */
#tip.wide{max-width:320px}
.cmphead{font-size:12px;color:var(--ink-dim);margin-bottom:6px}
.cmphead b{color:var(--ink);font-weight:700}
.cmpgrid{display:flex;flex-direction:column;gap:2px}
.cmprow{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;line-height:1.45}
.cmprow span{color:var(--ink-dim)}
.cmprow b{white-space:nowrap}
.item.cmpable{cursor:help}
.item.cmpable:hover{border-color:var(--line-hi);background:var(--card-hi)}

/* ---------- difficulty picker ---------- */
.diffgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.diffcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;transition:.13s}
.diffcard:hover{border-color:var(--line-hi);background:var(--card-hi)}
.diffcard.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 6px 20px rgba(232,180,74,.12)}

/* ---------- the enemy's trait ---------- */
.traitbar{margin-top:9px;padding:8px 10px;border-radius:10px;
  border:1px solid color-mix(in srgb, var(--tc, #a78bfa) 55%, transparent);
  background:color-mix(in srgb, var(--tc, #a78bfa) 11%, transparent)}
.traitbar b{color:var(--tc, #a78bfa)}
.traitbar .pill{border-color:color-mix(in srgb, var(--tc,#a78bfa) 50%, transparent);color:var(--tc,#a78bfa)}

/* ---------- the party ---------- */
.proster{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:6px;margin-top:8px}
.pmem{padding:6px 8px;border:1px solid var(--line);border-radius:9px;background:#0d1521;cursor:pointer;transition:.12s}
.pmem:hover{border-color:var(--line-hi);background:var(--card-hi)}
.pmem.viewing{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.pmem.lead{background:linear-gradient(180deg,#1d2740,#0d1521)}
.pmem.down{opacity:.4;filter:grayscale(1)}
.frontpip{color:var(--gold);font-size:12px;flex:0 0 auto;margin-left:2px}
.cdie{position:relative}
.cdie.back{opacity:.86}
.cdie .downer{position:absolute;top:-4px;left:-4px;font-size:10px;line-height:1;pointer-events:none;
  background:#0d1521;border:1px solid var(--line);border-radius:50%;padding:2px;z-index:2}
.pchip{display:inline-flex;align-items:center;gap:5px;padding:2px 7px;border-radius:8px;border:1px solid var(--line);background:#0d1521;cursor:pointer;font-size:12px}
.pchip.on{border-color:var(--gold)}
.pchip.down{opacity:.45;filter:grayscale(1)}
.partybar{display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap}

/* ---- the rank board ---- */
.boardgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(252px,1fr));gap:10px;align-items:start}
.bgrp{border:1px solid var(--line);border-radius:11px;background:var(--card);padding:8px 9px}
.bglbl{text-transform:uppercase;letter-spacing:1.1px;margin-bottom:6px}
.trow{display:flex;gap:9px;align-items:flex-start;padding:7px 8px;border-radius:9px;border:1px solid transparent;transition:.12s}
.trow+.trow{margin-top:3px}
.trow[data-tick]{cursor:pointer}
.trow[data-tick]:hover{border-color:var(--gold);background:var(--card-hi)}
.trow.full{opacity:.55}
.trow.locked .tic{filter:grayscale(1);opacity:.5}
.trow .tic{width:26px;height:26px;display:grid;place-items:center;font-size:15px;flex:0 0 auto;
  border:1px solid var(--line);border-radius:7px;background:#0d1521}
.trow .rankn{margin-left:auto;font-size:10.5px;color:var(--ink-dim);font-variant-numeric:tabular-nums;flex:0 0 auto}
.pips{display:flex;gap:3px;margin:4px 0 3px}
.pips .pip{width:100%;height:5px;border-radius:2px;background:#16202f;border:1px solid var(--line)}
.pips .pip.on{background:var(--gold);border-color:var(--gold)}
.pips .pip.next{border-color:var(--gold);border-style:dashed}

/* ---- the four actions ---- */
.actgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:9px;margin-top:10px}
.actcol{border:1px solid var(--line);border-radius:11px;background:var(--card);padding:7px}
.acthd{display:flex;align-items:center;gap:6px;padding:2px 4px 7px;border-bottom:1px solid var(--line);margin-bottom:6px}
.acttile{display:block;width:100%;text-align:left;padding:7px 8px;border-radius:9px;cursor:pointer;
  border:1px solid var(--line);background:#0d1521;color:var(--ink);transition:.12s;font:inherit}
.acttile+.acttile{margin-top:5px}
.acttile:hover:not(.no){border-color:var(--gold);background:var(--card-hi);transform:translateY(-1px)}
.acttile.on{border-color:var(--gold);background:linear-gradient(180deg,#22304a,#101a29);box-shadow:0 0 0 1px var(--gold)}
.acttile.no{opacity:.4;cursor:not-allowed}
.acttile .aticon{font-size:15px;line-height:1}
.acttile .attx{margin-top:3px;line-height:1.35}
.acttile .pips{margin:5px 0 0}
.acttile .pips .pip{height:4px}
.initb.sm{font-size:10px;padding:1px 5px}

.hero-card{position:relative}
.pickpip{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:var(--gold);
  color:#1a1205;font-weight:800;font-size:12px;display:grid;place-items:center;z-index:2}
</style>
</head>
<body>
<div id="topbar" class="hidden"><div class="inner" id="topbar-inner"></div></div>
<div class="wrap" id="app"></div>
<div id="scrim" class="hidden"></div>
<div id="tip"></div>
<script>
/* =========================================================================
   HEXBOUND  —  a solo hex-crawl in the spirit of Runebound + HEXplore It
   Single file, no dependencies. Save lives in localStorage.
   ========================================================================= */
'use strict';
const SAVE_KEY = 'hexbound.run.v1';

/* ---------- tiny helpers ---------- */
const $  = s => document.querySelector(s);
const modalOpen = () => { const sc = document.getElementById('scrim'); return sc && !sc.classList.contains('hidden'); };
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp = (n,a,b) => Math.max(a, Math.min(b, n));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const PLUR = {hex:'hexes', 'travel die':'travel dice', die:'dice'};
const plural = (n,w) => `${n} ${n===1 ? w : (PLUR[w] || w + 's')}`;

/* ---------- seeded rng (mulberry32, state persisted with the run) ---------- */
let RSTATE = 1;
function seedFrom(str){
  let h = 2166136261 >>> 0;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}
function rnd(){
  RSTATE = (RSTATE + 0x6D2B79F5) >>> 0;
  let t = RSTATE;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const ri   = (a,b) => a + Math.floor(rnd() * (b - a + 1));      // inclusive
const pick = arr   => arr[Math.floor(rnd() * arr.length)];
const chance = p   => rnd() < p;
function shuffle(a){ const r = a.slice(); for(let i=r.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }
function pickWeighted(list){ // [{w:..}, ..]
  const tot = list.reduce((s,x)=>s+(x.w||1),0); let n = rnd()*tot;
  for(const x of list){ n -= (x.w||1); if(n<=0) return x; }
  return list[list.length-1];
}
const d6 = () => ri(1,6);
const T = ms => (V && V.fast) ? 0 : ms;   // V.fast collapses animation delays (used by the test harness)

/* =========================================================================
   TERRAIN
   ========================================================================= */
const TERRA = {
  plains:   {nm:'Plains',   ic:'🌾', col:'#9aa85c', col2:'#7d8a48', move:1, hide:0},
  forest:   {nm:'Forest',   ic:'🌲', col:'#3f7a55', col2:'#2e5c40', move:1, hide:1},
  hills:    {nm:'Hills',    ic:'⛰️', col:'#8a7a53', col2:'#6d6041', move:1, hide:0},
  mountain: {nm:'Mountain', ic:'🏔️', col:'#7d8694', col2:'#5f6773', move:2, hide:0},
  marsh:    {nm:'Marsh',    ic:'🪱', col:'#5c6b52', col2:'#465340', move:1, hide:1},
  water:    {nm:'Water',    ic:'🌊', col:'#2d5c86', col2:'#1f4363', move:9, hide:0},
};
const LAND = ['plains','forest','hills','mountain','marsh'];
// A movement die: five terrains + a wild face.
const MDIE = ['plains','forest','hills','mountain','marsh','wild'];
const MFACE = {
  plains:{ic:'🌾',lb:'plains'}, forest:{ic:'🌲',lb:'forest'}, hills:{ic:'⛰️',lb:'hills'},
  mountain:{ic:'🏔️',lb:'mtn'}, marsh:{ic:'🪱',lb:'marsh'},  wild:{ic:'✦',lb:'wild'},
};

/* =========================================================================
   COMBAT DICE  —  faces are {a:attack, d:shield, s:surge}
   ========================================================================= */
const DICE = {
  base:  {nm:'Grit',   cls:'base',   ic:'⚪', faces:[{},{a:1},{a:1},{a:2},{d:1},{a:1,s:1}]},
  steel: {nm:'Steel',  cls:'steel',  ic:'🔵', faces:[{a:1},{a:2},{a:2},{a:3},{a:1,s:1},{a:2,s:1}]},
  guard: {nm:'Guard',  cls:'guard',  ic:'🟢', faces:[{d:1},{d:2},{d:2},{a:1,d:1},{d:1,s:1},{d:3}]},
  arcane:{nm:'Arcane', cls:'arcane', ic:'🟣', faces:[{a:1},{a:2},{s:1},{a:1,s:1},{a:3},{s:2}]},
  hunt:  {nm:'Hunt',   cls:'hunt',   ic:'🟡', faces:[{a:1},{a:2},{a:2},{d:1},{a:1,s:1},{a:4}]},
  foe:   {nm:'Foe',    cls:'foe',    ic:'🔴', faces:[{a:1},{a:1},{a:2},{d:1},{a:2,s:1},{a:3}]},
  brute: {nm:'Brute',  cls:'foe',    ic:'🔴', faces:[{a:1},{a:2},{a:3},{a:3},{d:1},{a:4,s:1}]},
  wisp:  {nm:'Wisp',   cls:'foe',    ic:'🔴', faces:[{},{a:1},{d:2},{a:1,s:1},{d:1,s:1},{a:2}]},
};
function rollDie(key){ const D = DICE[key]; const f = D.faces[Math.floor(rnd()*6)]; return {k:key, a:f.a||0, d:f.d||0, s:f.s||0}; }

/* =========================================================================
   HEROES
   ========================================================================= */
const HEROES = [
  { id:'warden', nm:'Warden of Ash', ic:'🛡️',
    desc:'A shield-sworn survivor. Slow to fall, slower to yield.',
    stats:{mig:3,agi:1,wit:1,spi:2}, hp:26, dice:['base','base','guard'], move:3 },
  { id:'ranger', nm:'Thornwood Ranger', ic:'🏹',
    desc:'Reads the land like a page. Nothing in the wild is unmapped for long.',
    stats:{mig:2,agi:3,wit:2,spi:1}, hp:21, dice:['base','hunt'], move:4 },
  { id:'runecarver', nm:'Runecarver', ic:'🔮',
    desc:'Cuts meaning into stone, and stone into enemies.',
    stats:{mig:1,agi:1,wit:3,spi:3}, hp:19, dice:['base','arcane'], move:3 },
  { id:'blade', nm:'Sworn Blade', ic:'⚔️',
    desc:'One oath, one edge, and a great deal of momentum.',
    stats:{mig:3,agi:2,wit:1,spi:1}, hp:23, dice:['base','steel'], move:3 },
  { id:'priest', nm:'Hedge Priest', ic:'🕯️',
    desc:'Keeps the old small rites. They work more often than anyone admits.',
    stats:{mig:1,agi:2,wit:2,spi:3}, hp:21, dice:['base','guard','arcane'], move:3 },
  { id:'reaver', nm:'Vault Reaver', ic:'🗝️',
    desc:'Was never here. Took the good half of whatever it was.',
    stats:{mig:2,agi:3,wit:2,spi:1}, hp:20, dice:['base','hunt'], move:4 },
];
const STATNM = {mig:'Might', agi:'Agility', wit:'Wits', spi:'Spirit'};
const STATIC = {mig:'💪', agi:'🌀', wit:'📖', spi:'✨'};

/* =========================================================================
   THE RANK BOARD
   Nine tracks printed on every character card. A TICK raises one by a rank,
   and a tick is the only progression currency there is: level cards hand them
   out, reward cards hand them out, and a training hall sells them.

   Four of the nine ARE the old attributes under the job they actually do, so
   every piece of gear that says "+1 Agility" still means exactly what it said.
   The other five are new ground: a guard track, two masteries, and the two
   vitals.  `key` is where the rank lives on the hero: a stat key reads out of
   h.stats, the rest read out of h.ranks.
   ========================================================================= */
const BOARD = [
  {id:'atk', nm:'Attack',         ic:'⚔️',  grp:'Abilities', stat:'mig',
   tx:'What you swing for and how many dice you swing with. Every rank is +1 attack, and every second rank puts another Grit die in the pool. Might tests read off this track.'},
  {id:'gua', nm:'Guard',          ic:'🛡️',  grp:'Abilities',
   tx:'Standing your ground. Every second rank is +1 armor, every third rank puts a Guard die in the pool, and rank 1 alone is +1 prevented each round.'},
  {id:'m1',  nm:'First Mastery',  grp:'Abilities', mastery:1,
   tx:'The thing your hero already does without being asked. Ranks make it stronger; it is never switched off.'},
  {id:'m2',  nm:'Second Mastery', grp:'Abilities', mastery:2,
   tx:'An action, not a habit. It costs Energy in a fight and it is locked until you spend a tick on it. Ranks make it stronger and, at rank 4, cheaper.'},
  {id:'hlt', nm:'Health',         ic:'❤️',  grp:'Vitals',
   tx:'Every rank is +4 max health, and taking the rank heals you for the same.'},
  {id:'eng', nm:'Energy',         ic:'⚡',  grp:'Vitals',
   tx:'Every rank is +1 max energy. Energy pushes skill tests and pays for your Second Mastery, and every third rank gets you one more back each dawn.'},
  {id:'nav', nm:'Navigate',       ic:'🧭',  grp:'Skills', stat:'agi',
   tx:'Ground covered. Every second rank is another travel die at dawn. Agility tests, and breaking away from a fight, read off this track.'},
  {id:'exp', nm:'Explore',        ic:'🔭',  grp:'Skills', stat:'wit',
   tx:'What you notice. Rerolls in combat come from here, every third rank reveals another ring of country, and Wits tests read off this track.'},
  {id:'sur', nm:'Survival',       ic:'🏕️',  grp:'Skills', stat:'spi',
   tx:'Keeping going. Every second rank heals 1 more each dawn, camping is worth more, and Spirit tests read off this track.'},
];
const TRACK = id => BOARD.find(t => t.id === id);

/* =========================================================================
   MASTERIES
   Two per hero, printed on the character card the way HEXplore It prints them.

   FIRST MASTERY is the thing the hero already does and never switches off —
   the old signature power, now with a rank on it.
   SECOND MASTERY is an action. It is locked until you spend a tick on it, it
   costs Energy, and it fires in the dice phase, after you have seen the roll
   and before you strike. Once per hero per round. At rank 4 it costs one less.
   `fire` writes into C.mb, the round's mastery buffs, which the combat numbers
   read live.
   ========================================================================= */
const MASTERY = {
  warden: {
    m1:{nm:'Unbroken', ic:'🧿', init:25,
        tx:R=>`Shield ${2+R}, and prevent ${1+R} more damage this round. You step into the front rank.`,
        fire:(C,h,R)=>{ C.mb.sh += 2+R; C.mb.ward += 1+R;
          const i = party().indexOf(h); if(i >= 0) S.lead = i;
          cLog(`${h.nm} plants and does not move.`, 'g'); }},
    m2:{nm:'Set Against It', ic:'🧱', init:55, cost:2,
        tx:R=>`Your own guard counts double this round, and it takes ${2+R} back every time it lands a hit.`,
        fire:(C,h,R)=>{ C.mb.dblShield = 1; C.mb.retal += 2+R;
          cLog(`${h.nm} sets against it. Guard doubled, and it bleeds for trying.`, 'g'); }},
  },
  ranger: {
    m1:{nm:'Mark the Shot', ic:'🎯', init:35,
        tx:R=>`Your dice join the roll and you hit for ${1+R} more. Every die that comes up with no attack is rerolled once, free.`,
        joins:1,
        fire:(C,h,R)=>{ C.mb.atk += 1+R; cLog(`${h.nm} picks the seam in its guard.`, 'g'); },
        afterRoll:(C,h,R)=>{ let n=0;
          C.myDice.forEach(x => { if(!x.a && !x.rerolled){ const d=rollDie(x.k); x.a=d.a; x.d=d.d; x.s=d.s; x.fresh=true; x.rerolled=1; n++; } });
          if(n) cLog(`${h.nm}'s eye fixes ${plural(n,'die')}.`, 'v'); }},
    m2:{nm:'Called Shot', ic:'🏹', init:50, cost:2,
        tx:R=>`Your dice join the roll. This attack pierces — its shields do not apply — and hits for ${2+R} more.`,
        joins:1,
        fire:(C,h,R)=>{ C.mb.pierce = 1; C.mb.atk += 2+R;
          cLog(`${h.nm} takes the long breath and finds the gap.`, 'g'); }},
  },
  runecarver: {
    m1:{nm:'Second Reading', ic:'📖', init:30,
        tx:R=>`Your dice join the roll, and the party gets ${2+R} more rerolls this round.`,
        joins:1,
        fire:(C,h,R)=>{ C.mb.rr += 2+R; cLog(`${h.nm} reads the line again, and it says something else.`, 'v'); }},
    m2:{nm:'Rewrite the Line', ic:'✍️', init:60, cost:2,
        tx:R=>`Your dice join the roll and you hit for ${R} more. Every die not showing an attack is rerolled, free.`,
        joins:1,
        fire:(C,h,R)=>{ C.mb.atk += R; cLog(`${h.nm} cuts the words out and cuts new ones in.`, 'v'); },
        afterRoll:(C,h,R)=>{ let n=0;
          C.myDice.forEach(x => { if(!x.a){ const d=rollDie(x.k); x.a=d.a; x.d=d.d; x.s=d.s; x.fresh=true; n++; } });
          cLog(`${plural(n,'die')} rewritten.`, 'v'); sfx('dice', 0); }},
  },
  blade: {
    m1:{nm:'Opening Stroke', ic:'🗡️', init:5,
        tx:R=>`Your dice join the roll and you hit for ${2+R} more — and nothing in the region is faster than this.`,
        joins:1,
        fire:(C,h,R)=>{ C.mb.atk += 2+R; cLog(`${h.nm} is moving before it has finished deciding.`, 'g'); }},
    m2:{nm:'Riposte', ic:'🤺', init:40, cost:2,
        tx:R=>`Your dice join the roll. You swing first whatever the initiative says, and hit for ${1+R} more.`,
        joins:1,
        fire:(C,h,R)=>{ C.mb.first = 1; C.mb.atk += 1+R;
          cLog(`${h.nm} steps inside its reach. You go first.`, 'g'); }},
  },
  priest: {
    m1:{nm:'Dawnsong', ic:'🌅', init:20,
        tx:R=>`Heal ${2+R} to whoever is worst off, and everyone still standing takes back 1 energy.`,
        fire:(C,h,R)=>{ healHero(2+R, 'the dawnsong');
          conscious().forEach(m => { m.en = clamp(m.en + 1, 0, D(m).maxEn); });
          cLog(`${h.nm} keeps the small rite going.`, 'g'); }},
    m2:{nm:'Last Rite', ic:'🕯️', init:45, cost:2,
        tx:R=>`Heal ${4+R*2} to whoever is worst off, and burn and venom are washed off the party.`,
        fire:(C,h,R)=>{ healHero(4+R*2, 'the last rite');
          if(C.me.burn || C.me.poison){ C.me.burn = 0; C.me.poison = 0; cLog('The fire goes out and the venom thins.', 'g'); } }},
  },
  reaver: {
    m1:{nm:'Slip Behind', ic:'🗝️', init:15,
        tx:R=>`Your dice join the roll, and its armor counts ${2+R} less this round.`,
        joins:1,
        fire:(C,h,R)=>{ C.mb.armCut += 2+R; cLog(`${h.nm} is somewhere it should not be able to reach.`, 'g'); }},
    m2:{nm:'Cut Purse and Run', ic:'🪙', init:35, cost:2,
        tx:R=>`Your dice join the roll, its armor counts for nothing this round, and you lift ${10+R*8} gold off it.`,
        joins:1,
        fire:(C,h,R)=>{ C.mb.noArm = 1; gainGold(10+R*8);
          cLog(`${h.nm} finds the strap holding its plate on.`, 'g'); }},
  },
};

/* =========================================================================
   THE FOUR ACTIONS
   Every hero picks exactly one each round, off their own character card, the
   way HEXplore It prints them. Attack and Defend are the same two for
   everybody and read straight off the board; the other two are the masteries,
   which nobody else has. Lower initiative swings first, and the party's is
   the lowest anyone played — so the choice sets the speed of the round too.
   ========================================================================= */
const ACTIONS = [
  {id:'atk', slot:null, nm:'Attack', ic:'⚔️', init:45, track:'atk', base:3,
   tx:h=>`Your ${D(h).pool.length} dice join the roll and you swing for ${3 + rankOf(h,'atk') + D(h).atk} on top.`},
  {id:'def', slot:null, nm:'Defend & Use Item', ic:'🛡️', init:20, track:'gua', base:3,
   tx:h=>`Shield ${3 + rankOf(h,'gua')}, get ${1 + Math.floor(rankOf(h,'gua')/2)} health back, and use one thing out of the pack without it costing the round.`},
  {id:'m1',  slot:'m1', nm:'First Mastery',  init:40, track:'m1'},
  {id:'m2',  slot:'m2', nm:'Second Mastery', init:60, track:'m2'},
];
const ACT = id => ACTIONS.find(a => a.id === id);
/* what a hero's chosen action is called and costs on screen */
function actFor(h, id){
  const a = ACT(id); if(!a) return null;
  const m = a.slot ? MST(h, a.slot) : null;
  const R = rankOf(h, a.track);
  return {
    id, a, m, R,
    nm: m ? m.nm : a.nm,
    ic: m ? m.ic : a.ic,
    init: Math.max(1, (m && m.init != null ? m.init : a.init) - rankOf(h, 'nav')),
    cost: (m && m.cost) ? Math.max(1, m.cost - (R >= 4 ? 1 : 0)) : 0,
    tx: m ? m.tx(R) : a.tx(h),
    joins: a.id === 'atk' || (m && m.joins),
    locked: a.id === 'm2' && R < 1,
  };
}
function canTake(h, id){
  const f = actFor(h, id);
  if(!f || f.locked) return false;
  return h.en >= f.cost;
}
const MST = (h, slot) => (MASTERY[h.id] || {})[slot] || null;
/* the rank a hero currently has on a track */
function rankOf(h, id){
  const t = TRACK(id); if(!t || !h) return 0;
  return t.stat ? (h.stats[t.stat] || 0) : ((h.ranks && h.ranks[id]) || 0);
}
function addRank(h, id, n){
  const t = TRACK(id); if(!t) return;
  n = n == null ? 1 : n;
  if(t.stat) h.stats[t.stat] = (h.stats[t.stat] || 0) + n;
  else { h.ranks = h.ranks || {}; h.ranks[id] = (h.ranks[id] || 0) + n; }
  if(id === 'hlt') h.hp = Math.min(h.hp + 4 * n, D(h).maxHp);   // the rank heals what it adds
}
const MAXRANK = 8;
const atMax = (h, id) => rankOf(h, id) >= MAXRANK;
/* how far a hero has come: every rank they did not start the run with */
const startRanks = h => { const H = HEROES.find(x => x.id === h.id);
  return H ? (H.stats.mig + H.stats.agi + H.stats.wit + H.stats.spi) : 7; };
const boardRanks = h => BOARD.reduce((n, t) => n + rankOf(h, t.id), 0);
const ticksIn = h => Math.max(0, boardRanks(h) - startRanks(h));
/* What the region has to keep up with. Levels alone stopped being the measure
   the moment ticks became the currency: a party that trains hard buys armor,
   warding and health the level number never sees, and the Crown stopped being
   able to touch them. Two ticks count for as much as a level. */
function partyPower(){
  const ps = party();
  if(!ps.length) return 0;
  const lvl = ps.reduce((n, h) => Math.max(n, h.lvl || 1), 1) - 1;
  const ticks = ps.reduce((n, h) => Math.max(n, ticksIn(h)), 0);
  return lvl + Math.floor(ticks / 2);
}

/* how much of your attack actually reaches a given enemy this round */
function damageToFoe(C, raw, parts){
  const t = C.foe.trait;
  if(!t) return {dmg: raw, note:''};
  const d = D();
  if(t === 'warded'){
    const through = Math.max(0, parts.card * (1 + (d.wardcut ? 1 : 0)) + parts.gear + parts.surge);
    return {dmg: through, note: through < raw ? 'Its ward drinks everything your dice threw.' : ''};
  }
  if(t === 'swarm'){
    const hits = parts.attackingDice * 3;
    return {dmg: hits, note: `You cut through ${plural(parts.attackingDice,'part')} of it.`};
  }
  if(t === 'phasing' && C.round % 2 === 1){
    const through = Math.max(0, parts.arcane * (1 + (d.phasecut ? 1 : 0)) + parts.surge);
    return {dmg: through, note: through < raw ? 'It is half here. Steel passes through nothing.' : ''};
  }
  if(t === 'brittle' && parts.meFirst) return {dmg: raw * 2, note:'You caught it flat. The blow lands twice over.'};
  return {dmg: raw, note:''};
}

/* ---------- the party ----------
   S.party holds every hero. S.hero is a LIVE REFERENCE into that array (the
   one you are currently looking at), which keeps the hundred-odd places that
   already say S.hero working untouched. It is stripped before saving so the
   two never serialise as separate objects and drift apart. */
const party = () => (S && S.party) ? S.party : (S && S.hero ? [S.hero] : []);
const alive = () => party().filter(h => h.hp > 0);
const isDown = h => h.hp <= 0;
function selectHero(i){
  if(!S.party || !S.party[i]) return;
  S.sel = i;
  S.hero = S.party[i];
}
function leadHero(){
  const p = party();
  if(!p.length) return null;
  const l = p[S.lead];
  if(l && !isDown(l)) return l;
  const next = p.findIndex(h => !isDown(h));     // the front rank falls to whoever is still standing
  if(next >= 0){ S.lead = next; return p[next]; }
  return p[0];
}
/* travel is handled by whoever in the party is best at it */
function PARTY(){
  const ds = alive().map(h => D(h));
  if(!ds.length) return D();
  const best = k => Math.max(...ds.map(d => d[k]));
  return {move: best('move'), scout: best('scout'), gold: best('gold'),
          haggle: best('haggle'), test: best('test'), wild: best('wild'), roadfree: best('roadfree')};
}
const bestAt = stat => alive().slice().sort((a,b) => D(b)[stat] - D(a)[stat])[0] || S.hero;

const key = (q,r) => q + ',' + r;
const unkey = k => { const [q,r] = k.split(',').map(Number); return {q,r}; };
const DIRS = [[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
const neighbors = (q,r) => DIRS.map(([dq,dr]) => ({q:q+dq, r:r+dr}));
const hexDist = (a,b) => (Math.abs(a.q-b.q) + Math.abs(a.q+a.r-b.q-b.r) + Math.abs(a.r-b.r)) / 2;
const at = (q,r) => S.map[key(q,r)];
const hereHex = () => S.map[key(S.pos.q, S.pos.r)];

function hexRing(center, rad){
  const out = [];
  if(rad === 0) return [{q:center.q, r:center.r}];
  let q = center.q + DIRS[4][0]*rad, r = center.r + DIRS[4][1]*rad;
  for(let i=0;i<6;i++) for(let j=0;j<rad;j++){ out.push({q,r}); q += DIRS[i][0]; r += DIRS[i][1]; }
  return out;
}
function hexesWithin(center, rad){
  const out = [];
  for(let i=0;i<=rad;i++) out.push(...hexRing(center, i));
  return out;
}

/* ---------- derived hero numbers ---------- */
function D(h0){
  const h = h0 || S.hero;
  const out = {
    mig:h.stats.mig, agi:h.stats.agi, wit:h.stats.wit, spi:h.stats.spi,
    atk:0, arm:0, hp:0, move:h.move, scout:1, rr:0, dice:h.dice.slice(),
    gold:0, haggle:0, test:0, ward:0, regen:0, zeal:0, en:0, mend:0, roadfree:0, wild:0, noBlank:0,
    kindle:0, pyre:0, sunder:0, firstatk:0, minatk:0, spill:0, wardcut:0, phasecut:0, gambit:0, execute:0,
    surge:['dmg','guard'], upgrade:[],
  };
  const add = o => {
    if(!o) return;
    for(const k in o){
      if(k === 'dice') out.dice.push(...o.dice);
      else if(k in out) out[k] += o[k];
    }
  };
  for(const slot of ['weapon','offhand','armor','trinket1','trinket2']){
    const it = h.gear[slot] && ITEM(h.gear[slot]);
    if(!it) continue;
    if(it.dice) out.dice.push(...it.dice);
    add(it.bon);
    if(it.surge) out.surge.push(...it.surge);
    if(it.upgrade) out.upgrade.push(...it.upgrade);
  }
  for(const t of h.talents){ const T = TAL(t); if(!T) continue; add(T.bon); if(T.upgrade) out.upgrade.push(...T.upgrade); }
  for(const p of (h.perks||[])){ if(p.dice) out.dice.push(...p.dice); add(p.bon); if(p.surge) out.surge.push(...p.surge); if(p.upgrade) out.upgrade.push(...p.upgrade); }
  /* the First Mastery, at whatever rank the board says */
  const fm = (h.ranks && h.ranks.m1) || 0;
  if(h.id === 'priest') out.mend = 1;
  if(h.id === 'runecarver') out.rr += 2 + fm;
  if(h.id === 'warden') out.ward += 2 + fm;
  if(h.id === 'ranger'){ out.scout += 1 + Math.floor(fm/2); out.move += Math.floor(fm/3); }
  if(h.id === 'reaver') out.gold += 50 + fm * 10;
  if(out.mend) out.surge.push('mend');
  if(out.mend >= 2) out.mendBig = true;

  /* ---- the rank board ----
     Attack, Navigate, Explore and Survival are already folded in above as
     Might / Agility / Wits / Spirit. These are the five tracks that are new
     ground, read straight off h.ranks so gear and talents stack on top. */
  const R = h.ranks || {};
  const gua = R.gua || 0, hlt = R.hlt || 0, eng = R.eng || 0;
  out.gua = gua; out.m1 = R.m1 || 0; out.m2 = R.m2 || 0; out.hlt = hlt; out.eng = eng;
  if(gua){
    out.arm  += Math.floor(gua / 2);                 // every second rank is armor
    out.ward += 1;                                    // the first rank alone is worth a point prevented
    for(let i = 3; i <= gua; i += 3) out.dice.push('guard');
  }
  out.move  += Math.floor((out.agi) / 2);             // Navigate: a travel die every second rank
  out.scout += Math.floor((out.wit) / 3);             // Explore: a ring every third rank
  out.regen += Math.floor((out.spi) / 2);             // Survival: dawn healing
  out.enRegen = 2 + Math.floor(eng / 3);

  out.surge = Array.from(new Set(out.surge));
  out.maxHp = h.baseHp + out.hp + (h.lvl - 1) * 3 + hlt * 4;
  out.maxEn = 3 + out.spi + out.en + eng;
  out.rrTotal = out.wit + out.rr;
  out.pool = out.dice.concat(Array(Math.max(0, Math.floor(out.mig / 2))).fill('base'));
  for(const u of out.upgrade){          // gear that reforges a die into a better one
    let n = u.n || 1;
    for(let i = 0; i < out.pool.length && n > 0; i++){
      if(out.pool[i] === u.from){ out.pool[i] = u.to; n--; }
    }
  }
  return out;
}

}
function renderLog(){
  const el = $('#log'); if(!el) return;
  el.innerHTML = S.log.slice(-60).map((l,i,a) => {
    const m = /^§(\w+)§/.exec(l);
    const cls = m ? m[1] : '';
    const txt = m ? l.slice(m[0].length) : l;
    return `<div class="${cls} ${i===a.length-1?'hl':''}">${esc(txt)}</div>`;
  }).join('');
  el.scrollTop = el.scrollHeight;
}

/* ---------- save / load ---------- */
function save(){
  if(!S) return;
  S.rngState = RSTATE;
  try{
    const out = {};
    for(const k in S) if(k !== 'hero') out[k] = S[k];   // hero is an alias into party
    localStorage.setItem(SAVE_KEY, JSON.stringify(out));
  }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    S = JSON.parse(raw);
    if(!S.party){                                      // a run saved before parties existed
      S.party = [S.hero];
      if(S.gold == null) S.gold = S.hero.gold || 0;    // gold and the pack used to live on the hero
      if(!S.bag) S.bag = S.hero.bag || [];
    }
    S.party.forEach(h => {                             // fields later builds added
      if(!h.ranks) h.ranks = {gua:0, m1:0, m2:0, hlt:0, eng:0};   // the rank board
      if(h.levelCards == null) h.levelCards = 0;
      if(h.ticks == null) h.ticks = h.pts || 0;        // stat points became ticks
      delete h.pts;
    });
    if(S.sel == null || !S.party[S.sel]) S.sel = 0;
    if(S.lead == null || !S.party[S.lead]) S.lead = 0;
    S.hero = S.party[S.sel] || S.party[0];
    RSTATE = S.rngState || 1;
    return true;
  }catch(e){ return false; }
}
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
const hasSave = () => !!localStorage.getItem(SAVE_KEY);

/* =========================================================================
   MAP GENERATION
   ========================================================================= */
const RAD = 5;                       // map radius -> 91 hexes

function genMap(){
  const map = {};
  const all = hexesWithin({q:0,r:0}, RAD);

  // 1. seed terrain with weighted noise, then smooth twice so it forms regions
  for(const h of all){
    const dist = hexDist({q:0,r:0}, h);
    let t = pickWeighted([
      {v:'plains', w: dist < 2 ? 34 : 18},
      {v:'forest', w: 24},
      {v:'hills',  w: 17},
      {v:'mountain', w: dist >= 3 ? 16 : 5},
      {v:'marsh',  w: 12},
      {v:'water',  w: dist >= 2 ? 10 : 3},
    ]).v;
    map[key(h.q,h.r)] = {q:h.q, r:h.r, t, dist, revealed:false, explored:false, feat:null, threat:null, road:false};
  }
  for(let pass=0; pass<2; pass++){
    const snap = {};
    for(const k in map) snap[k] = map[k].t;
    for(const k in map){
      const h = map[k];
      const counts = {};
      for(const n of neighbors(h.q,h.r)){
        const nk = key(n.q,n.r);
        if(snap[nk]) counts[snap[nk]] = (counts[snap[nk]]||0) + 1;
      }
      let best = h.t, bn = 1;
      for(const t in counts) if(counts[t] > bn){ best = t; bn = counts[t]; }
      if(bn >= 3) h.t = best;
    }
  }
  // the home hex is always walkable
  map[key(0,0)].t = 'plains';

  // 2. settlements: city at centre, then towns / waystations spread out
  const taken = new Set([key(0,0)]);
  map[key(0,0)].feat = 'city';
  const spots = shuffle(all.filter(h => {
    const m = map[key(h.q,h.r)];
    return m.t !== 'water' && m.dist >= 2;
  }));
  const placeSpread = (feat, count, minDist, minFromCentre, maxFromCentre, terrainOk) => {
    const placed = [];
    for(const h of spots){
      if(placed.length >= count) break;
      const k = key(h.q,h.r); const m = map[k];
      if(taken.has(k) || m.feat) continue;
      if(m.dist < minFromCentre || m.dist > maxFromCentre) continue;
      if(terrainOk && !terrainOk(m.t)) continue;
      if(placed.some(p => hexDist(p, h) < minDist)) continue;
      m.feat = feat; taken.add(k); placed.push(h);
    }
    return placed;
  };
  const towns = placeSpread('town', 3, 3, 2, 4);
  const ways  = placeSpread('waystation', 3, 2, 2, 5);
  const lairs = placeSpread('lair', 3, 4, 3, 5);
  // the gate: the far hex, as distant as possible from the city
  let gate = null, gbest = -1;
  for(const h of shuffle(all)){
    const m = map[key(h.q,h.r)];
    if(m.feat || m.t === 'water') continue;
    const sc = m.dist * 10 + Math.min(...lairs.map(l => hexDist(l,h)));
    if(sc > gbest){ gbest = sc; gate = m; }
  }
  gate.feat = 'gate'; gate.t = 'mountain';

  // 3. landmarks
  const sites = ['shrine','ruin','barrow','tower','stones','mine','hermit','grove','camp','ruin','barrow','stones','camp','grove'];
  let si = 0;
  for(const h of spots){
    if(si >= sites.length) break;
    const m = map[key(h.q,h.r)];
    if(m.feat) continue;
    if(!chance(0.5)) continue;
    m.feat = sites[si++];
  }

  // 4. roads from the city out to every settlement (straight-ish walks)
  const settle = towns.concat(ways);
  for(const dest of settle){
    let cur = {q:0,r:0};
    let guard = 0;
    while(hexDist(cur, dest) > 0 && guard++ < 30){
      const opts = neighbors(cur.q,cur.r)
        .filter(n => map[key(n.q,n.r)])
        .sort((a,b) => hexDist(a,dest) - hexDist(b,dest));
      const nxt = opts[0]; if(!nxt) break;
      const m = map[key(nxt.q,nxt.r)];
      if(m.t === 'water') m.t = 'plains';           // roads bridge the water
      m.road = true;
      cur = nxt;
    }
  }
  map[key(0,0)].road = true;

  // 5. threat tier per hex, by distance from the city
  for(const k in map){
    const m = map[k];
    m.tier = m.dist <= 1 ? 1 : m.dist <= 2 ? 1 : m.dist <= 3 ? 2 : m.dist <= 4 ? 3 : 3;
    if(m.feat === 'lair') m.tier = 4;
    if(m.feat === 'camp') m.tier = Math.min(4, m.tier + 1);
    if(m.road) m.tier = Math.max(1, m.tier - 1);
  }
  return {map, lairKeys: lairs.map(l => key(l.q,l.r)), gateKey: key(gate.q,gate.r)};
}
