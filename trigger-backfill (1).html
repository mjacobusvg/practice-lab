<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ask the Archive — Backfill Trigger</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 500px; margin: 80px auto; padding: 20px; background: #f9f7f5; color: #1a1714; }
  h1 { font-size: 20px; margin-bottom: 8px; }
  p { font-size: 14px; color: #5c5650; margin-bottom: 24px; }
  input { width: 100%; padding: 10px 14px; border: 1px solid #e8e3dd; border-radius: 8px; font-size: 14px; margin-bottom: 12px; box-sizing: border-box; }
  button { width: 100%; padding: 13px; background: #1d6fa4; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
  button:disabled { background: #94a3b8; cursor: not-allowed; }
  .status { margin-top: 16px; padding: 12px 16px; border-radius: 8px; font-size: 13px; display: none; }
  .status.running { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; display: block; }
  .status.success { background: #dcfce7; border: 1px solid #86efac; color: #15803d; display: block; }
  .status.error { background: #fdecea; border: 1px solid #f5c6c6; color: #a32d2d; display: block; }
</style>
</head>
<body>
  <h1>Ask the Archive — Backfill Trigger</h1>
  <p>This will pull all posts and comments from Circle and load them into Supabase. It runs in the background and may take 5-10 minutes. Check Netlify function logs for progress.</p>

  <input type="password" id="secret" placeholder="Enter your BACKFILL_SECRET value" />
  <button id="btn" onclick="trigger()">Start Backfill</button>
  <div class="status" id="status"></div>

  <script>
    async function trigger() {
      var secret = document.getElementById('secret').value.trim();
      if (!secret) { alert('Enter your backfill secret first.'); return; }

      var btn = document.getElementById('btn');
      var status = document.getElementById('status');

      btn.disabled = true;
      btn.textContent = 'Starting...';
      status.className = 'status running';
      status.textContent = 'Backfill started. Running in background — this may take 5-10 minutes. Check Netlify function logs for circle-backfill-background to watch progress.';

      try {
        var resp = await fetch('https://thinkbeyondpractice.com/.netlify/functions/circle-backfill-background', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ secret: secret })
        });

        if (resp.status === 202) {
          status.className = 'status success';
          status.textContent = 'Backfill is running in the background. Check Netlify logs for circle-backfill-background to see progress. You will see POST OK lines as each post gets embedded.';
          btn.textContent = 'Started';
        } else if (resp.status === 401) {
          status.className = 'status error';
          status.textContent = 'Wrong secret. Check your BACKFILL_SECRET in Netlify env vars.';
          btn.disabled = false;
          btn.textContent = 'Start Backfill';
        } else {
          var data = await resp.json();
          status.className = 'status error';
          status.textContent = 'Error: ' + (data.error || resp.status);
          btn.disabled = false;
          btn.textContent = 'Start Backfill';
        }
      } catch(e) {
        status.className = 'status error';
        status.textContent = 'Network error: ' + e.message;
        btn.disabled = false;
        btn.textContent = 'Start Backfill';
      }
    }
  </script>
</body>
</html>
