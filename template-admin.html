<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Template Admin — Think Beyond Practice</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, sans-serif; background: #f9f7f5; color: #1a1714; padding: 32px 24px; max-width: 1000px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  p.sub { font-size: 13px; color: #5c5650; margin-bottom: 24px; }

  .auth-row { display: flex; gap: 8px; margin-bottom: 20px; }
  .auth-row input { flex: 1; padding: 10px 12px; border: 1px solid #e0dbd4; border-radius: 8px; font-size: 14px; font-family: inherit; }
  .auth-row button { padding: 10px 16px; background: #1d6fa4; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .auth-row button:disabled { background: #94a3b8; cursor: not-allowed; }

  .toolbar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .filter-btn { padding: 6px 14px; border: 1px solid #e0dbd4; border-radius: 20px; background: white; font-size: 13px; cursor: pointer; }
  .filter-btn.active { background: #1d6fa4; color: white; border-color: #1d6fa4; }
  .sync-btn { padding: 6px 14px; border: 1px solid #1d6fa4; border-radius: 20px; background: white; color: #1d6fa4; font-size: 13px; cursor: pointer; font-weight: 600; }
  .sync-btn:hover { background: #f0f7ff; }
  .search-input { padding: 7px 12px; border: 1px solid #e0dbd4; border-radius: 20px; font-size: 13px; font-family: inherit; width: 200px; }

  .stats-bar { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
  .stat { font-size: 13px; color: #5c5650; }
  .stat strong { color: #1a1714; }

  .error { color: #dc2626; font-size: 13px; margin-bottom: 12px; display: none; }
  .msg { color: #059669; font-size: 13px; margin-bottom: 12px; display: none; }
  .loading { color: #5c5650; font-size: 13px; margin-bottom: 12px; display: none; }
  .dashboard { display: none; }

  .card { background: white; border: 1px solid #e0dbd4; border-radius: 10px; padding: 16px; margin-bottom: 10px; }
  .card-header { display: flex; align-items: flex-start; gap: 12px; }
  .card-title { flex: 1; }
  .card-title a { font-size: 15px; font-weight: 500; color: #1d6fa4; text-decoration: none; }
  .card-title a:hover { text-decoration: underline; }
  .card-meta { font-size: 12px; color: #8a847e; margin-top: 3px; }
  .card-preview { font-size: 13px; color: #5c5650; margin-top: 10px; line-height: 1.5; border-top: 1px solid #f0ece6; padding-top: 10px; }

  .card-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  .type-select { padding: 6px 10px; border: 1px solid #e0dbd4; border-radius: 6px; font-size: 13px; font-family: inherit; background: white; }
  .price-input { padding: 6px 10px; border: 1px solid #e0dbd4; border-radius: 6px; font-size: 13px; font-family: inherit; width: 90px; }
  .price-input::placeholder { color: #b0a8a0; }
  .approve-btn { padding: 6px 14px; background: #059669; color: white; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .approve-btn:hover { background: #047857; }
  .approve-btn.approved { background: #d1fae5; color: #065f46; cursor: default; }
  .reject-btn { padding: 6px 12px; background: white; color: #dc2626; border: 1px solid #fca5a5; border-radius: 6px; font-size: 13px; cursor: pointer; }
  .reject-btn:hover { background: #fee2e2; }
  .rejected-label { font-size: 12px; color: #dc2626; font-style: italic; }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .badge-template { background: #dbeafe; color: #1e40af; }
  .badge-cheatsheet { background: #ede9fe; color: #5b21b6; }
  .badge-reference { background: #fef3c7; color: #92400e; }
  .badge-unreviewed { background: #f3f4f6; color: #6b7280; }
  .badge-rejected { background: #fee2e2; color: #dc2626; }
  .badge-approved { background: #d1fae5; color: #065f46; }

  .empty { text-align: center; padding: 40px; color: #8a847e; font-size: 14px; }
  .file-upload-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .file-input { font-size: 12px; color: #5c5650; flex: 1; }
  .upload-btn { padding: 5px 12px; background: white; border: 1px solid #e0dbd4; border-radius: 6px; font-size: 12px; cursor: pointer; color: #1d6fa4; font-weight: 500; white-space: nowrap; }
  .upload-btn:hover { background: #f0f7ff; }
  .upload-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .file-status { font-size: 12px; color: #059669; display: none; }
  .file-link { font-size: 12px; color: #1d6fa4; text-decoration: none; }
  .file-link:hover { text-decoration: underline; }
</style>
</head>
<body>

<h1>Template Admin</h1>
<p class="sub">Review and approve templates for the Think Beyond Template Archive.</p>

<div class="auth-row">
  <input type="password" id="secret" placeholder="Backfill secret..." onkeydown="if(event.key==='Enter') load()" />
  <button id="load-btn" onclick="load()">Load</button>
</div>

<div class="error" id="error"></div>
<div class="msg" id="msg"></div>
<div class="loading" id="loading">Loading...</div>

<div class="dashboard" id="dashboard">

  <div class="toolbar">
    <button class="filter-btn active" id="filter-all" onclick="setFilter('all')">All</button>
    <button class="filter-btn" id="filter-unreviewed" onclick="setFilter('unreviewed')">Unreviewed</button>
    <button class="filter-btn" id="filter-approved" onclick="setFilter('approved')">Approved</button>
    <button class="filter-btn" id="filter-rejected" onclick="setFilter('rejected')">Rejected</button>
    <input type="text" class="search-input" id="search-input" placeholder="Search..." oninput="renderList()" />
    <button class="sync-btn" onclick="syncTemplates()">↻ Sync from Forum</button>
  </div>

  <div class="stats-bar" id="stats-bar"></div>

  <div id="template-list"></div>
</div>

<script>
  var allTemplates = [];
  var currentFilter = 'all';
  var currentSecret = '';

  async function load() {
    currentSecret = document.getElementById('secret').value.trim();
    if (!currentSecret) return;
    var btn = document.getElementById('load-btn');
    showLoading(true);

    try {
      var resp = await fetch('/.netlify/functions/sync-templates', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ secret: currentSecret, action: 'list' })
      });

      // sync-templates handles list via ask-archive function
      // Actually fetch from a dedicated list endpoint
      var resp2 = await fetch('/.netlify/functions/ask-archive', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'list_templates', secret: currentSecret })
      });

      var data = await resp2.json();
      if (!resp2.ok || data.error) {
        showError('Error ' + resp2.status + ': ' + (data.error || 'Unknown'));
        showLoading(false);
        return;
      }

      allTemplates = data.templates || [];
      showLoading(false);
      document.getElementById('dashboard').style.display = 'block';
      renderStats();
      renderList();

    } catch(e) {
      showError('Network error: ' + e.message);
      showLoading(false);
    }
  }

  async function syncTemplates() {
    showMsg('Syncing from forum posts...');
    try {
      var resp = await fetch('/.netlify/functions/sync-templates', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ secret: currentSecret })
      });
      var data = await resp.json();
      if (data.error) { showError(data.error); return; }
      showMsg('Sync complete — scanned ' + data.scanned + ' posts, found ' + data.candidates + ' candidates, added ' + data.newlyInserted + ' new.');
      await load();
    } catch(e) {
      showError('Sync error: ' + e.message);
    }
  }

  function setFilter(f) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
    document.getElementById('filter-' + f).classList.add('active');
    renderList();
  }

  function renderStats() {
    var approved = allTemplates.filter(function(t) { return t.approved; }).length;
    var unreviewed = allTemplates.filter(function(t) { return !t.approved && t.type === 'unreviewed'; }).length;
    var rejected = allTemplates.filter(function(t) { return t.type === 'rejected'; }).length;

    document.getElementById('stats-bar').innerHTML =
      '<div class="stat">Total: <strong>' + allTemplates.length + '</strong></div>' +
      '<div class="stat">Approved: <strong style="color:#059669">' + approved + '</strong></div>' +
      '<div class="stat">Unreviewed: <strong style="color:#d97706">' + unreviewed + '</strong></div>' +
      '<div class="stat">Rejected: <strong style="color:#dc2626">' + rejected + '</strong></div>';
  }

  function renderList() {
    var search = document.getElementById('search-input').value.toLowerCase();
    var filtered = allTemplates.filter(function(t) {
      if (currentFilter === 'unreviewed' && (t.approved || t.type === 'rejected')) return false;
      if (currentFilter === 'approved' && !t.approved) return false;
      if (currentFilter === 'rejected' && t.type !== 'rejected') return false;
      if (search && !(t.title || '').toLowerCase().includes(search) && !(t.body_preview || '').toLowerCase().includes(search)) return false;
      return true;
    });

    var list = document.getElementById('template-list');
    if (filtered.length === 0) {
      list.innerHTML = '<div class="empty">No templates found.</div>';
      return;
    }

    list.innerHTML = filtered.map(function(t) {
      var statusBadge = t.approved
        ? '<span class="badge badge-approved">Approved</span>'
        : t.type === 'rejected'
          ? '<span class="badge badge-rejected">Rejected</span>'
          : '<span class="badge badge-unreviewed">Unreviewed</span>';

      var typeBadge = t.type && t.type !== 'unreviewed' && t.type !== 'rejected'
        ? '<span class="badge badge-' + t.type + '">' + t.type.charAt(0).toUpperCase() + t.type.slice(1) + '</span>'
        : '';

      var priceDisplay = t.price ? '$' + parseFloat(t.price).toFixed(2) : '';

      return '<div class="card" id="card-' + t.id + '">' +
        '<div class="card-header">' +
          '<div class="card-title">' +
            '<a href="' + (t.url || '#') + '" target="_blank">' + escHtml(t.title || 'Untitled') + '</a>' +
            '<div class="card-meta">' + escHtml(t.space_name || '') + (t.author ? ' · ' + escHtml(t.author) : '') + '</div>' +
          '</div>' +
          '<div style="display:flex;gap:6px;flex-shrink:0;">' + statusBadge + typeBadge + '</div>' +
        '</div>' +
        (t.body_preview ? '<div class="card-preview">' + escHtml(t.body_preview.substring(0, 200)) + '...</div>' : '') +
        '<div class="card-controls">' +
          '<select class="type-select" id="type-' + t.id + '" onchange="updateField(' + t.id + ',\'type\',this.value)">' +
            '<option value="unreviewed"' + (t.type === 'unreviewed' ? ' selected' : '') + '>Unreviewed</option>' +
            '<option value="template"' + (t.type === 'template' ? ' selected' : '') + '>Template</option>' +
            '<option value="cheatsheet"' + (t.type === 'cheatsheet' ? ' selected' : '') + '>Cheatsheet</option>' +
            '<option value="reference"' + (t.type === 'reference' ? ' selected' : '') + '>Reference</option>' +
            '<option value="rejected"' + (t.type === 'rejected' ? ' selected' : '') + '>Rejected</option>' +
          '</select>' +
          '<input type="number" class="price-input" id="price-' + t.id + '" placeholder="Price $" value="' + (t.price || '') + '" step="0.01" min="0" onchange="updateField(' + t.id + ',\'price\',this.value)" />' +
          (t.approved
            ? '<button class="approve-btn approved">✓ Approved</button>'
            : '<button class="approve-btn" onclick="approve(' + t.id + ')">Approve</button>') +
          (!t.approved && t.type !== 'rejected'
            ? '<button class="reject-btn" onclick="reject(' + t.id + ')">Reject</button>'
            : '') +
        '</div>' +
        '<div class="file-upload-row">' +
          (t.file_url
            ? '<span style="font-size:12px;color:#5c5650;">File: </span><a class="file-link" href="' + escHtml(t.file_url) + '" target="_blank">Uploaded ✓</a>' +
              '<label class="upload-btn" style="margin-left:8px;">Replace <input type="file" style="display:none" accept=".pdf,.doc,.docx,.txt" onchange="uploadFile(' + t.id + ', this)"></label>'
            : '<span style="font-size:12px;color:#8a847e;">No file uploaded</span>' +
              '<label class="upload-btn">Upload File <input type="file" style="display:none" accept=".pdf,.doc,.docx,.txt" onchange="uploadFile(' + t.id + ', this)"></label>') +
          '<span class="file-status" id="file-status-' + t.id + '">Uploading...</span>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  async function updateField(id, field, value) {
    var update = {};
    update[field] = field === 'price' ? (parseFloat(value) || null) : value;
    var t = allTemplates.find(function(t) { return t.id === id; });
    if (t) t[field] = update[field];

    await fetch('/.netlify/functions/ask-archive', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'update_template', secret: currentSecret, id: id, update: update })
    });
    renderStats();
  }

  async function approve(id) {
    var typeEl = document.getElementById('type-' + id);
    var priceEl = document.getElementById('price-' + id);
    var type = typeEl ? typeEl.value : 'template';
    var price = priceEl ? parseFloat(priceEl.value) || null : null;

    if (!type || type === 'unreviewed') {
      showError('Set a type before approving.');
      return;
    }

    var t = allTemplates.find(function(t) { return t.id === id; });
    if (t) { t.approved = true; t.type = type; t.price = price; }

    await fetch('/.netlify/functions/ask-archive', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'update_template', secret: currentSecret, id: id, update: { approved: true, type: type, price: price } })
    });

    renderStats();
    renderList();
  }

  async function reject(id) {
    var t = allTemplates.find(function(t) { return t.id === id; });
    if (t) { t.type = 'rejected'; t.approved = false; }

    await fetch('/.netlify/functions/ask-archive', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'update_template', secret: currentSecret, id: id, update: { type: 'rejected', approved: false } })
    });

    renderStats();
    renderList();
  }

  async function uploadFile(id, input) {
    var file = input.files[0];
    if (!file) return;

    var status = document.getElementById('file-status-' + id);
    status.textContent = 'Uploading...';
    status.style.display = 'inline';
    input.disabled = true;

    try {
      // Read file as base64
      var base64 = await new Promise(function(resolve, reject) {
        var reader = new FileReader();
        reader.onload = function(e) { resolve(e.target.result.split(',')[1]); };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });

      var resp = await fetch('/.netlify/functions/ask-archive', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'upload_template_file',
          secret: currentSecret,
          id: id,
          filename: file.name,
          contentType: file.type || 'application/octet-stream',
          data: base64
        })
      });

      var data = await resp.json();
      if (data.error) {
        status.textContent = 'Upload failed: ' + data.error;
        status.style.color = '#dc2626';
      } else {
        status.textContent = 'Uploaded ✓';
        status.style.color = '#059669';
        // Update local record
        var t = allTemplates.find(function(t) { return t.id === id; });
        if (t) t.file_url = data.file_url;
        setTimeout(function() { renderList(); }, 1000);
      }
    } catch(e) {
      status.textContent = 'Error: ' + e.message;
      status.style.color = '#dc2626';
    }
    input.disabled = false;
  }

  function showError(msg) {
    var el = document.getElementById('error');
    el.textContent = msg;
    el.style.display = 'block';
    setTimeout(function() { el.style.display = 'none'; }, 5000);
  }

  function showMsg(msg) {
    var el = document.getElementById('msg');
    el.textContent = msg;
    el.style.display = 'block';
    setTimeout(function() { el.style.display = 'none'; }, 5000);
  }

  function showLoading(show) {
    document.getElementById('loading').style.display = show ? 'block' : 'none';
    document.getElementById('load-btn').disabled = show;
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>

</body>
</html>
