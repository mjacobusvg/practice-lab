<!doctype html><meta charset="utf-8"><title>battery host</title>
<!-- Same-origin host for the battery. An about:blank parent partitions localStorage away from
     the framed Scribe, and the per-patient draft checks need to read it. -->
<body style="margin:0"><iframe id="f" style="width:1500px;height:950px;border:0"></iframe>
<script>document.getElementById('f').src='/ai-scribe-practice.html?slot='+(new URLSearchParams(location.search).get('slot')||'probe');</script>
