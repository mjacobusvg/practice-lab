[build]
  functions = "netlify/functions"

[functions."ask-archive-background"]
  timeout = 900

# ── Scheduled Functions ──

[[scheduled_functions]]
  name = "circle-weekly-sync"
  schedule = "0 7 * * 6"

[[scheduled_functions]]
  name = "credentialing-reminders"
  schedule = "0 8 * * *"

[[scheduled_functions]]
  name = "compliance-reminders"
  schedule = "0 9 * * *"

# ── Redirects ──

# Credentialing Hub (standalone subdomain)
[[redirects]]
  from = "/credentialing-hub"
  to = "https://credentialing.thinkbeyondpractice.com"
  status = 301

# Practice Manager dashboard
[[redirects]]
  from = "/practice-manager"
  to = "/practice-manager.html"
  status = 200

[[redirects]]
  from = "/practice-manager-demo"
  to = "/practice-manager-demo.html"
  status = 200

# Practice Manager tools
[[redirects]]
  from = "/hipaa-hub"
  to = "/pm-hipaa-hub.html"
  status = 200

[[redirects]]
  from = "/compliance-tracker"
  to = "/pm-compliance-tracker.html"
  status = 200

[[redirects]]
  from = "/pm-letters"
  to = "/pm-letter-generator.html"
  status = 200

[[redirects]]
  from = "/pm-interactions"
  to = "/pm-interaction-checker.html"
  status = 200

[[redirects]]
  from = "/pm-chart-coder"
  to = "/pm-chart-coder.html"
  status = 200

# Practice Lab
[[redirects]]
  from = "/practice-lab"
  to = "/practice-lab-hub.html"
  status = 200

[[redirects]]
  from = "/practice-lab/billing"
  to = "/practice-lab-billing.html"
  status = 200

[[redirects]]
  from = "/practice-lab/private-practice"
  to = "/practice-lab-private-practice.html"
  status = 200
