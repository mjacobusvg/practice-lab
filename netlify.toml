[build]
  functions = "netlify/functions"

[functions."ask-archive-background"]
  timeout = 900

[[scheduled_functions]]
  name = "circle-weekly-sync"
  schedule = "0 7 * * 6"

[[scheduled_functions]]
  name = "credentialing-reminders"
  schedule = "0 8 * * *"

[[redirects]]
  from = "/credentialing-hub"
  to   = "/credentialing-hub.html"
  status = 200

[[redirects]]
  from = "/practice-manager"
  to   = "/practice-manager.html"
  status = 200

[[redirects]]
  from = "/practice-lab"
  to   = "/practice-lab.html"
  status = 200

[[redirects]]
  from = "/practice-lab/*"
  to   = "/practice-lab.html"
  status = 200
