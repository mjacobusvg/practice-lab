[build]
  functions = "netlify/functions"

[functions."ask-archive-background"]
  timeout = 900

[functions."circle-weekly-sync-background"]
  timeout = 900

# ── Scheduled Functions ──
[[scheduled_functions]]
  name = "circle-weekly-sync-background"
  schedule = "0 7 * * 6"

[[scheduled_functions]]
  name = "compliance-reminders"
  schedule = "0 9 * * *"

# ── Redirects ──

# The Vault (standalone practice profile)
[[redirects]]
  from = "/vault"
  to = "/vault.html"
  status = 200

# Credentialing Hub (standalone subdomain)
[[redirects]]
  from = "/credentialing-hub"
  to = "https://credentialing.thinkbeyondpractice.com"
  status = 301

# Practice Manager dashboard
[[redirects]]
  from = "/practice-manager"
  to = "/practice-manager.html"
  status = 200

[[redirects]]
  from = "/practice-manager-demo"
  to = "/practice-manager-demo.html"
  status = 200

