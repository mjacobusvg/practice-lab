[build]
  functions = "netlify/functions"

[functions."ask-archive-background"]
  timeout = 900

[functions."circle-weekly-sync-background"]
  timeout = 900

# Forum content sync: pulls Circle posts+comments into the member-facing
# forum_posts / forum_comments tables (what platform.html displays).
[functions."sync-forum-background"]
  timeout = 900

# Avatar migration: copies Circle-hotlinked member avatars into Supabase Storage
# and repoints accounts.avatar_url. One-time (re-runnable); run before Circle shutdown.
[functions."migrate-avatars-background"]
  timeout = 900

# Profile sync: backfills member headline/bio/location/website/linkedin from Circle.
# One-time (re-runnable); fills only empty fields. Run before Circle shutdown.
[functions."sync-profiles-background"]
  timeout = 900

# Inngest serve endpoint: runs the Ask the Archive and Chart Coder pipelines.
# These do multiple sequential AI calls and must not be killed at the default
# 10s limit. Extend to the background max (15 min) like the other background fns.
[functions."inngest-serve"]
  timeout = 900

# AI proxies: large clinical generations (e.g. termination 4-section package)
# can exceed the default 10s synchronous limit. Extend to the paid-plan max (26s).
[functions."clinical-proxy"]
  timeout = 26

[functions."anthropic-proxy"]
  timeout = 26

# Email broadcasts send synchronously, 5 recipients at a time, so a full-list
# send (hundreds of members) can run well past the default 10s and get killed
# mid-send (a partial broadcast). Extend to the paid-plan max (26s). This covers
# both send-now and the scheduled path (send-scheduled-broadcasts awaits this).
[functions."broadcast-send"]
  timeout = 26

# ── Scheduled Functions ──
# Circle syncs RETIRED at the platform migration (2026-07). Circle is no longer
# the source of truth. The weekly Ask-the-Archive embed (circle-weekly-sync-
# background) is replaced by real-time embedding: create-post / create-member-post
# fire embed-post-background on every new post. The forum display sync and both
# functions remain for a manual final catch-up, but neither runs on a schedule.
#
# NOTE: schedules MUST use [functions."name"] with a `schedule` key — this is the
# only netlify.toml syntax Netlify recognizes. The old [[scheduled_functions]]
# table was silently ignored (schedules never registered, so nothing fired).

[functions."compliance-reminders"]
  schedule = "0 9 * * *"

# Weekly community digest: Sunday 13:00 UTC (~9am ET). Emails opted-in members
# a roundup of the week's most-discussed threads.
[functions."digest-weekly"]
  schedule = "0 13 * * 0"

# Publishes any scheduled announcements/posts whose time has come, every 10 min.
[functions."publish-scheduled"]
  schedule = "*/10 * * * *"

# Sends any scheduled email broadcast whose time has come, every 10 min.
[functions."send-scheduled-broadcasts"]
  schedule = "*/10 * * * *"

# Daily 15:00 UTC (~8am PT): finds referrals whose new member cleared the 15-day
# guarantee and is still paying, flags them 'qualified', and emails Michael to
# pay the referrer. Never pays or changes tiers itself.
[functions."referral-retention-check"]
  schedule = "0 15 * * *"

# 16:00 UTC (9am PT / 12pm ET), every day EXCEPT Monday (0,2-6 = Sun, Tue-Sat) so
# it never collides with the Monday 7:30am PT free-tier weekly broadcast. Welcome
# drip for new free members: one email per member per run (welcome -> note builder
# -> chart coder -> upgrade), only genuine self-signups created on/after Jul 20
# (not the pre-created contacts). Honors contacts.subscribed=false. A step that
# would land on Monday simply goes out Tuesday.
[functions."onboarding-drip"]
  schedule = "0 16 * * 0,2,3,4,5,6"

# Daily 10:00 UTC (~3am PT): reverts any limited-time comp whose tier_override has
# expired (drops to free, clears the override + template block). Only touches
# accounts with no active subscription, so paying members are never downgraded.
[functions."revert-expired-comps"]
  schedule = "0 10 * * *"

# Sunday 14:00 UTC (~7am PT): drafts Michael's Sunday paid-member broadcast from
# the week's new posts and emails the ready-to-send draft to HIM (never to members).
# Restarts the Circle-era "here's this week's two posts" ritual on our own platform;
# he reviews and sends from the composer. Distinct from digest-weekly (an automated
# roundup to opted-in members) — this one is his curated, personal Sunday note.
[functions."sunday-broadcast-prep"]
  schedule = "0 14 * * 0"

# Weekly billing watchdog: Monday 12:00 UTC (~8am ET). Reads live Stripe and
# emails Michael any failing cards / paid-tier-without-payment / mismatches.
# Read-only: it never changes a tier or a subscription.
[functions."reconcile-subscriptions"]
  schedule = "0 12 * * 1"

# ── Redirects ──
# Old Circle subdomain: anyone hitting community.thinkbeyondpractice.com (a stale
# bookmark from the Circle days) lands on the new platform. This is a HOST-level
# 301 handled by Netlify over real HTTPS — it replaces the Namecheap "URL Redirect
# Record", which cannot serve HTTPS for a custom subdomain (hence the connection
# time-outs). Requires community.thinkbeyondpractice.com to be added as a domain
# alias on this Netlify site so Netlify accepts the Host + issues its SSL cert.
[[redirects]]
  from = "https://community.thinkbeyondpractice.com/*"
  to = "https://thinkbeyondpractice.com/platform"
  status = 301
  force = true

[[redirects]]
  from = "http://community.thinkbeyondpractice.com/*"
  to = "https://thinkbeyondpractice.com/platform"
  status = 301
  force = true

# Circle migration: the forum now lives on the platform. These give an instant,
# already-propagated, self-controlled path to hand out (thinkbeyondpractice.com/forum).
[[redirects]]
  from = "/forum"
  to = "/platform"
  status = 301
  force = true

[[redirects]]
  from = "/community"
  to = "/platform"
  status = 301
  force = true

# /member and /members (retired) now live on the platform. force=true so the
# redirect wins even though members.html still exists as a file.
[[redirects]]
  from = "/member"
  to = "/platform"
  status = 301
  force = true

[[redirects]]
  from = "/members"
  to = "/platform"
  status = 301
  force = true

[[redirects]]
  from = "/members.html"
  to = "/platform"
  status = 301
  force = true

