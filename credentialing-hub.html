<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Credentialing Hub | Think Beyond Practice</title>
<meta name="description" content="Enter your credentialing information once. Copy it everywhere. Track every application until you are approved.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0b1120;
  --navy-mid: #111c30;
  --navy-light: #1a2d47;
  --navy-card: #152238;
  --teal: #2aabb8;
  --teal-dim: #1d7d88;
  --teal-glow: rgba(42,171,184,0.12);
  --cream: #e8e2d6;
  --cream-dim: #b0aa9e;
  --white: #f5f4f2;
  --green: #34d399;
  --amber: #fbbf24;
  --red: #f87171;
  --rule: rgba(42,171,184,0.15);
  --radius: 10px;
  --font-display: 'DM Serif Display', serif;
  --font-body: 'Plus Jakarta Sans', sans-serif;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--navy);
  color: var(--cream);
  font-family: var(--font-body);
  min-height: 100vh;
  line-height: 1.6;
}

/* ── Layout ── */
.hub-container { max-width:1100px; margin:0 auto; padding:32px 20px 80px; }

.hub-header { text-align:center; margin-bottom:40px; }
.hub-header h1 { font-family:var(--font-display); font-size:2.2rem; color:var(--white); margin-bottom:8px; }
.hub-header h1 span { color:var(--teal); }
.hub-header p { color:var(--cream-dim); font-size:0.92rem; max-width:600px; margin:0 auto; }

/* ── Tabs ── */
.tab-bar {
  display:flex; gap:4px; margin-bottom:32px;
  border-bottom:1px solid var(--rule); overflow-x:auto;
}
.tab-btn {
  background:none; border:none; color:var(--cream-dim);
  font-family:var(--font-body); font-size:0.88rem; font-weight:600;
  padding:12px 20px; cursor:pointer; border-bottom:2px solid transparent;
  transition:all 0.2s; white-space:nowrap; display:flex; align-items:center; gap:8px;
}
.tab-btn:hover { color:var(--white); }
.tab-btn.active { color:var(--teal); border-bottom-color:var(--teal); }
.tab-icon { font-size:1.1rem; }

.tab-panel { display:none; }
.tab-panel.active { display:block; }

/* ── Completion Bar ── */
.completion-bar {
  background:var(--navy-mid); border:1px solid var(--rule); border-radius:var(--radius);
  padding:16px 24px; margin-bottom:28px; display:flex; align-items:center; gap:16px;
}
.bar-track { flex:1; height:8px; background:var(--navy-light); border-radius:4px; overflow:hidden; }
.bar-fill { height:100%; background:linear-gradient(90deg,var(--teal-dim),var(--teal)); border-radius:4px; transition:width 0.4s ease; }
.bar-label { font-size:0.85rem; font-weight:600; color:var(--teal); min-width:80px; text-align:right; }
.bar-text { font-size:0.85rem; color:var(--cream-dim); }

/* ── Vault Sections ── */
.vault-section {
  background:var(--navy-card); border:1px solid var(--rule);
  border-radius:var(--radius); margin-bottom:20px; overflow:hidden;
}
.vault-section-header {
  padding:16px 24px; cursor:pointer; display:flex;
  justify-content:space-between; align-items:center; transition:background 0.2s;
  user-select:none;
}
.vault-section-header:hover { background:rgba(42,171,184,0.05); }
.vault-section-header h3 { font-family:var(--font-display); font-size:1.15rem; color:var(--white); }
.section-meta { display:flex; align-items:center; gap:12px; }
.section-stat { font-size:0.8rem; color:var(--cream-dim); }
.chevron { color:var(--teal); font-size:0.7rem; transition:transform 0.2s; }
.chevron.open { transform:rotate(180deg); }
.vault-section-body { padding:0 24px 24px; display:none; }
.vault-section-body.open { display:block; }

/* ── Fields ── */
.field-group { margin-bottom:18px; }
.field-group label { display:block; font-weight:600; font-size:0.85rem; color:var(--white); margin-bottom:4px; }
.field-hint { font-size:0.78rem; color:var(--cream-dim); margin-bottom:8px; line-height:1.5; }
.field-group input,
.field-group select,
.field-group textarea {
  width:100%; background:var(--navy); border:1px solid var(--rule); border-radius:6px;
  color:var(--cream); font-family:var(--font-body); font-size:0.9rem; padding:10px 14px;
  transition:border-color 0.2s;
}
.field-group input:focus,
.field-group select:focus,
.field-group textarea:focus {
  outline:none; border-color:var(--teal); box-shadow:0 0 0 2px var(--teal-glow);
}
.field-group textarea { min-height:80px; resize:vertical; }
.field-group select { cursor:pointer; }

.npi-row { display:flex; gap:8px; }
.npi-row input { flex:1; }
.npi-lookup-btn {
  background:var(--teal); color:var(--navy); border:none; border-radius:6px;
  padding:10px 18px; font-family:var(--font-body); font-weight:700; font-size:0.85rem;
  cursor:pointer; transition:opacity 0.2s; white-space:nowrap;
}
.npi-lookup-btn:hover { opacity:0.85; }
.npi-lookup-btn:disabled { opacity:0.5; cursor:not-allowed; }

.npi-status { font-size:0.8rem; margin-top:6px; padding:8px 12px; border-radius:6px; }
.npi-status.success { background:rgba(52,211,153,0.1); color:var(--green); }
.npi-status.error { background:rgba(248,113,113,0.1); color:var(--red); }

/* ── Ghost Pilot ── */
.ghost-view-tabs { display:flex; gap:8px; margin-bottom:24px; flex-wrap:wrap; }
.ghost-view-btn {
  background:var(--navy-mid); border:1px solid var(--rule); color:var(--cream-dim);
  padding:10px 20px; border-radius:var(--radius); font-family:var(--font-body);
  font-weight:600; font-size:0.85rem; cursor:pointer; transition:all 0.2s;
}
.ghost-view-btn:hover { border-color:var(--teal); color:var(--white); }
.ghost-view-btn.active { background:var(--teal-glow); border-color:var(--teal); color:var(--teal); }

.ghost-view-desc { font-size:0.85rem; color:var(--cream-dim); margin-bottom:24px; font-style:italic; }

.ghost-section {
  background:var(--navy-card); border:1px solid var(--rule);
  border-radius:var(--radius); margin-bottom:16px; overflow:hidden;
}
.ghost-section h4 {
  font-family:var(--font-display); font-size:1rem; color:var(--teal);
  padding:14px 20px; border-bottom:1px solid var(--rule); background:rgba(42,171,184,0.04);
}
.ghost-field {
  display:flex; justify-content:space-between; align-items:center;
  padding:10px 20px; border-bottom:1px solid rgba(42,171,184,0.06); transition:background 0.15s;
}
.ghost-field:last-child { border-bottom:none; }
.ghost-field:hover { background:rgba(42,171,184,0.04); }
.ghost-field-label { font-size:0.82rem; color:var(--cream-dim); min-width:160px; }
.ghost-field-value { font-size:0.9rem; color:var(--white); flex:1; text-align:right; word-break:break-word; padding:0 12px; white-space:pre-line; }
.ghost-field-value.empty { color:var(--cream-dim); font-style:italic; opacity:0.5; }

.copy-btn {
  background:var(--navy-light); border:1px solid var(--rule); color:var(--cream-dim);
  font-family:var(--font-body); font-size:0.75rem; font-weight:600; padding:4px 12px;
  border-radius:4px; cursor:pointer; transition:all 0.15s; white-space:nowrap; min-width:56px; text-align:center;
}
.copy-btn:hover { border-color:var(--teal); color:var(--teal); }
.copy-btn.copied { background:rgba(52,211,153,0.15); border-color:var(--green); color:var(--green); }
.copy-btn:disabled { opacity:0.3; cursor:not-allowed; }

/* ── Gaps Warning ── */
.gaps-list {
  background:rgba(251,191,36,0.08); border:1px solid rgba(251,191,36,0.2);
  border-radius:var(--radius); padding:16px 20px; margin-bottom:24px;
}
.gaps-list h4 { color:var(--amber); font-size:0.88rem; margin-bottom:8px; }
.gaps-list ul { list-style:none; }
.gaps-list ul li { color:var(--cream-dim); font-size:0.82rem; padding:3px 0; }
.gaps-list ul li::before { content:"○ "; color:var(--amber); }

/* ── Mapper ── */
.mapper-intro { color:var(--cream-dim); font-size:0.9rem; margin-bottom:24px; line-height:1.6; max-width:700px; }
.mapper-state-select { margin-bottom:28px; }
.mapper-state-select select { width:100%; max-width:400px; }
.mapper-step {
  background:var(--navy-card); border:1px solid var(--rule); border-radius:var(--radius);
  margin-bottom:16px; padding:20px 24px;
}
.mapper-step-num {
  display:inline-block; background:var(--teal); color:var(--navy); font-weight:700;
  font-size:0.75rem; padding:3px 10px; border-radius:4px; margin-bottom:10px;
}
.mapper-step h4 { font-family:var(--font-display); font-size:1.05rem; color:var(--white); margin-bottom:6px; }
.mapper-step p { font-size:0.85rem; color:var(--cream-dim); line-height:1.6; margin-bottom:8px; }
.mapper-step a { color:var(--teal); text-decoration:none; font-weight:600; font-size:0.85rem; }
.mapper-step a:hover { text-decoration:underline; }
.mapper-step .timeline-tag {
  display:inline-block; background:rgba(42,171,184,0.1); border:1px solid rgba(42,171,184,0.2);
  color:var(--teal); font-size:0.78rem; font-weight:600; padding:3px 10px; border-radius:4px; margin-top:4px;
}
.mapper-tip {
  background:rgba(251,191,36,0.08); border:1px solid rgba(251,191,36,0.2);
  border-radius:var(--radius); padding:16px 20px; margin-top:24px;
}
.mapper-tip h4 { color:var(--amber); font-size:0.88rem; margin-bottom:6px; }
.mapper-tip p { color:var(--cream-dim); font-size:0.85rem; line-height:1.6; }

.generate-pdf-btn {
  background:var(--teal); color:var(--navy); border:none; border-radius:var(--radius);
  padding:14px 28px; font-family:var(--font-body); font-weight:700; font-size:0.9rem;
  cursor:pointer; transition:opacity 0.2s; margin-top:20px; display:inline-block;
}
.generate-pdf-btn:hover { opacity:0.85; }
.ssn-prompt { margin-top:20px; }
.ssn-prompt label { font-size:0.85rem; color:var(--cream-dim); display:block; margin-bottom:6px; }
.ssn-prompt input { max-width:280px; }
.ssn-prompt .ssn-note { font-size:0.75rem; color:var(--cream-dim); margin-top:6px; opacity:0.7; }

/* ── Coming Soon ── */
.coming-soon { text-align:center; padding:80px 40px; }
.cs-icon { font-size:3rem; margin-bottom:16px; opacity:0.6; }
.coming-soon h2 { font-family:var(--font-display); font-size:1.6rem; color:var(--white); margin-bottom:12px; }
.coming-soon p { color:var(--cream-dim); max-width:500px; margin:0 auto; line-height:1.7; font-size:0.9rem; }
.coming-soon ul { list-style:none; margin-top:24px; display:inline-block; text-align:left; }
.coming-soon ul li { color:var(--cream-dim); font-size:0.88rem; padding:6px 0; }
.coming-soon ul li::before { content:"→ "; color:var(--teal); font-weight:700; }

/* ── Save Toast ── */
.save-toast {
  position:fixed; bottom:24px; right:24px; background:var(--teal); color:var(--navy);
  padding:12px 24px; border-radius:var(--radius); font-weight:700; font-size:0.85rem;
  opacity:0; transform:translateY(10px); transition:all 0.3s; pointer-events:none; z-index:100;
}
.save-toast.visible { opacity:1; transform:translateY(0); }

/* ── Master Checklist ── */
.master-checklist {
  background:var(--navy-mid); border:1px solid var(--rule); border-radius:var(--radius);
  padding:20px 24px; margin-bottom:28px;
}
.master-checklist h3 {
  font-family:var(--font-display); font-size:1.05rem; color:var(--white); margin-bottom:14px;
}
.checklist-items { display:flex; flex-wrap:wrap; gap:8px 16px; }
.checklist-item {
  display:flex; align-items:center; gap:8px; font-size:0.82rem; color:var(--cream-dim);
  cursor:pointer; user-select:none; padding:6px 12px; border-radius:6px;
  border:1px solid transparent; transition:all 0.2s;
}
.checklist-item:hover { border-color:var(--rule); }
.checklist-item.done { color:var(--green); text-decoration:line-through; opacity:0.7; }
.checklist-item .check-box {
  width:18px; height:18px; border:2px solid var(--rule); border-radius:4px;
  display:flex; align-items:center; justify-content:center; font-size:0.7rem;
  flex-shrink:0; transition:all 0.2s;
}
.checklist-item.done .check-box { background:var(--green); border-color:var(--green); color:var(--navy); }
.checklist-step-num { font-weight:700; color:var(--teal); min-width:14px; }

/* ── Pulse Scripts ── */
.pulse-section {
  background:var(--navy-card); border:1px solid var(--rule); border-radius:var(--radius);
  margin-bottom:16px; overflow:hidden;
}
.pulse-section-header {
  padding:16px 24px; cursor:pointer; display:flex; justify-content:space-between;
  align-items:center; transition:background 0.2s; user-select:none;
}
.pulse-section-header:hover { background:rgba(42,171,184,0.05); }
.pulse-section-header h4 { font-family:var(--font-display); font-size:1.05rem; color:var(--white); }
.pulse-section-body { padding:0 24px 24px; display:none; }
.pulse-section-body.open { display:block; }
.pulse-script-block {
  background:var(--navy); border:1px solid var(--rule); border-radius:6px;
  padding:14px 18px; margin-bottom:12px; position:relative;
}
.pulse-script-block p { font-size:0.85rem; color:var(--cream); line-height:1.7; white-space:pre-line; }
.pulse-script-block .script-label {
  font-size:0.72rem; font-weight:700; color:var(--teal); text-transform:uppercase;
  letter-spacing:0.5px; margin-bottom:6px;
}
.pulse-copy-all {
  position:absolute; top:12px; right:12px; background:var(--navy-light); border:1px solid var(--rule);
  color:var(--cream-dim); font-size:0.72rem; font-weight:600; padding:3px 10px; border-radius:4px;
  cursor:pointer; transition:all 0.15s;
}
.pulse-copy-all:hover { border-color:var(--teal); color:var(--teal); }
.pulse-copy-all.copied { background:rgba(52,211,153,0.15); border-color:var(--green); color:var(--green); }
.pulse-tip { font-size:0.82rem; color:var(--amber); margin-top:8px; font-style:italic; }
.pulse-intro { color:var(--cream-dim); font-size:0.9rem; margin-bottom:24px; line-height:1.6; max-width:700px; }
.pulse-principle {
  background:rgba(42,171,184,0.08); border:1px solid rgba(42,171,184,0.2);
  border-radius:var(--radius); padding:16px 20px; margin-bottom:24px;
}
.pulse-principle p { font-size:0.88rem; color:var(--cream); line-height:1.6; }

/* ── Responsive ── */
@media (max-width:640px) {
  .hub-header h1 { font-size:1.6rem; }
  .tab-btn { padding:10px 14px; font-size:0.8rem; }
  .completion-bar { flex-direction:column; gap:8px; }
  .bar-label { text-align:left; }
  .ghost-field { flex-direction:column; align-items:flex-start; gap:6px; padding:12px 20px; }
  .ghost-field-value { text-align:left; padding:0; }
  .npi-row { flex-direction:column; }
}
</style>
</head>
<body>

<div class="hub-container">
  <div class="hub-header">
    <h1>Credentialing <span>Hub</span></h1>
    <p>Credentialing is not hard. It is repetitive, error-prone, and nobody tells you what to do first. This tool fixes all three. Enter your information once. Copy it everywhere. Follow a clear sequence. Track every application until you are approved.</p>
  </div>

  <div id="master-checklist"></div>

  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('vault')" data-tab="vault"><span class="tab-icon">&#x1F510;</span> The Vault</button>
    <button class="tab-btn" onclick="switchTab('ghost')" data-tab="ghost"><span class="tab-icon">&#x1F47B;</span> Ghost Pilot</button>
    <button class="tab-btn" onclick="switchTab('mapper')" data-tab="mapper"><span class="tab-icon">&#x1F5FA;</span> The Mapper</button>
    <button class="tab-btn" onclick="switchTab('pulse')" data-tab="pulse"><span class="tab-icon">&#x1F4E1;</span> The Pulse</button>
  </div>

  <!-- VAULT TAB -->
  <div id="panel-vault" class="tab-panel active"></div>

  <!-- GHOST PILOT TAB -->
  <div id="panel-ghost" class="tab-panel"></div>

  <!-- MAPPER TAB -->
  <div id="panel-mapper" class="tab-panel"></div>

  <!-- PULSE TAB -->
  <div id="panel-pulse" class="tab-panel"></div>
</div>

<div id="save-toast" class="save-toast">Profile saved</div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────
const STORAGE_KEY = 'credentialing-hub-profile';
let profile = {};
let saveTimer = null;

const VAULT_SECTIONS = [
  {
    id:'identity', title:'Provider Identity',
    fields:[
      {key:'legalName',label:'Full Legal Name',hint:'As it appears on your license. Every application asks for this exactly as licensed.',type:'text'},
      {key:'providerType',label:'Provider Type',hint:'Determines which CMS-855I sections apply to you and which specialty checkbox gets checked.',type:'select',options:['','Physician (MD/DO)','Nurse Practitioner','Clinical Nurse Specialist','Physician Assistant','Certified Registered Nurse Anesthetist','Certified Nurse Midwife','Clinical Social Worker','Psychologist, Clinical','Psychologist Billing Independently','Qualified Audiologist','Qualified Speech Language Pathologist','Occupational Therapist','Physical Therapist','Registered Dietitian or Nutrition Professional','Anesthesiology Assistant','Other']},
      {key:'physicianSpecialty',label:'Physician Specialty (if MD/DO)',hint:'Your primary Medicare specialty designation. Only applies if Provider Type is Physician. CMS-855I Section 2G.',type:'text',optional:true},
      {key:'dob',label:'Date of Birth',hint:'Required by CAQH, Medicare, and every commercial payer.',type:'date'},
      {key:'gender',label:'Gender',hint:'CAQH and some state Medicaid applications require this.',type:'select',options:['','Male','Female','Non-Binary','Prefer not to say']},
      {key:'languages',label:'Languages Spoken',hint:'CAQH uses this for provider directory listings.',type:'text'},
      {key:'email',label:'Primary Email',hint:'Used for all credentialing correspondence. Use a professional email.',type:'email'},
      {key:'phone',label:'Primary Phone',hint:'Provider relations will call this number.',type:'tel'}
    ]
  },
  {
    id:'identifiers', title:'Professional Identifiers',
    fields:[
      {key:'npi1',label:'NPI (Type 1 — Individual)',hint:'Your individual NPI. Required on every application. Enter it here and click Lookup to auto-fill other fields.',type:'npi'},
      {key:'npi2',label:'NPI (Type 2 — Organization)',hint:'Your organization NPI number (10 digits), if you bill under a group or business entity. This is NOT your business name. Leave blank if you only bill under your individual Type 1 NPI.',type:'text'},
      {key:'ein',label:'Tax ID / EIN',hint:'Your business EIN (or SSN if sole proprietor — but we recommend getting an EIN). Public information.',type:'text'},
      {key:'dea',label:'DEA Number',hint:'Required for controlled substance prescribing. Public via DEA verification.',type:'text'},
      {key:'deaExp',label:'DEA Expiration Date',hint:'CAQH and payers need this. Do not let it lapse during credentialing.',type:'date'},
      {key:'licenseState',label:'License State',hint:'State where you hold your primary license.',type:'text'},
      {key:'licenseNum',label:'State License Number',hint:'Your primary state license number.',type:'text'},
      {key:'licenseExp',label:'License Expiration Date',hint:'Payers will not credential you with an expired license.',type:'date'},
      {key:'taxonomy',label:'Taxonomy Code(s)',hint:'Your primary NUCC taxonomy code. Examples: 363LP0808X (Psych NP), 363L00000X (NP), 207Q00000X (Family Medicine MD), 363A00000X (PA).',type:'text'},
      {key:'caqhId',label:'CAQH Provider ID',hint:'If you already have one. If not, you will get one when you register at proview.caqh.org.',type:'text'},
      {key:'medicarePtan',label:'Medicare PTAN',hint:'Assigned after Medicare enrollment is approved. Leave blank if not yet enrolled.',type:'text'},
      {key:'medicaidId',label:'Medicaid Provider Number',hint:'State-specific. Leave blank if not yet enrolled in Medicaid.',type:'text'}
    ]
  },
  {
    id:'education', title:'Education & Training',
    fields:[
      {key:'degree1School',label:'Primary Clinical Degree — School',hint:'The graduate program that qualifies you for your clinical specialty. For physicians, this is your medical school. For NPs, your nursing program. This is what CMS-855I and CAQH pull as your "Medical or Professional School."',type:'text'},
      {key:'degree1Type',label:'Primary Clinical Degree — Type',hint:'MD, DO, MSN, DNP, DSW, AuD, DPT, etc. The degree that qualifies you for your board certification.',type:'text'},
      {key:'degree1Date',label:'Primary Clinical Degree — Graduation Date',hint:'Month and year.',type:'text'},
      {key:'degree2School',label:'Additional Degree — School (if applicable)',hint:'Any other graduate degree (e.g., MA in Clinical Psychology, MPH). Leave blank if you only have one graduate degree.',type:'text',optional:true},
      {key:'degree2Type',label:'Additional Degree — Type (if applicable)',hint:'Degree type for your additional program.',type:'text',optional:true},
      {key:'degree2Date',label:'Additional Degree — Graduation Date (if applicable)',hint:'Month and year.',type:'text',optional:true},
      {key:'postGradProgram',label:'Post-Graduate Training Program',hint:'Residency, fellowship, or other post-graduate program name if applicable.',type:'text',optional:true},
      {key:'postGradInstitution',label:'Post-Graduate Training Institution',hint:'Where you completed post-graduate training.',type:'text',optional:true},
      {key:'postGradDates',label:'Post-Graduate Training Dates',hint:'Start and end dates.',type:'text',optional:true},
      {key:'boardCert',label:'Board Certification(s)',hint:'e.g., ANCC PMHNP-BC, ABPN Board Certified, NCCPA PA-C. Include certifying body.',type:'text'},
      {key:'boardCertEntity',label:'Certifying Entity',hint:'The organization that issued your board certification. e.g., ANCC, ABPN, ABIM, NCCPA, AACN.',type:'text'},
      {key:'boardCertDate',label:'Certification Date',hint:'Date certified.',type:'text'},
      {key:'boardCertExp',label:'Certification Expiration',hint:'When your certification expires.',type:'date'},
      {key:'compactLicense',label:'Compact License?',hint:'Do you hold a compact/multistate license (e.g., NLC for nurses, IMLC for physicians)? CMS-855I asks this in Section 2B.',type:'select',options:['','Yes','No'],optional:true}
    ]
  },
  {

// ── STORAGE ───────────────────────────────────────────────────────────
function loadProfile() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) profile = JSON.parse(raw);
  } catch(e) { profile = {}; }
}

function saveProfile() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(profile));
      const toast = document.getElementById('save-toast');
      toast.classList.add('visible');
      setTimeout(() => toast.classList.remove('visible'), 1500);
    } catch(e) { console.error('Save failed:', e); }
  }, 600);
}

function updateField(key, value) {
  profile[key] = value;
  saveProfile();
  updateCompletionBar();
}

// ── EXPORT / IMPORT BACKUP ───────────────────────────────────────────
function exportProfile() {
  var data = JSON.stringify(profile, null, 2);
  var blob = new Blob([data], {type: 'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'credentialing-hub-backup-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importProfile() {
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = function(e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev) {
      try {
        var data = JSON.parse(ev.target.result);
        if (typeof data !== 'object' || Array.isArray(data)) throw new Error('Invalid format');
        if (!confirm('This will replace ALL your current Vault data with the backup file. Are you sure?')) return;
        profile = data;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(profile));
        location.reload();
      } catch(err) {
        alert('Import failed: ' + err.message + '. Make sure this is a valid Credentialing Hub backup file.');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

// ── FIELD VALIDATION ─────────────────────────────────────────────────
function validateField(key, value) {
  if (!value || String(value).trim() === '') return null;
  var v = String(value).trim();
  switch(key) {
    case 'npi1':
    case 'npi2':
      if (!/^\d{10}$/.test(v)) return 'NPI must be exactly 10 digits';
      break;
    case 'ein':
      var cleaned = v.replace(/[-\s]/g, '');
      if (!/^\d{9}$/.test(cleaned)) return 'EIN must be 9 digits (XX-XXXXXXX)';
      break;
    case 'dea':
      if (!/^[A-Z]{2}\d{7}$/i.test(v)) return 'DEA format: 2 letters followed by 7 digits';
      break;
    case 'email':
    case 'practiceEmail':
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return 'Enter a valid email address';
      break;
    case 'taxonomy':
      if (!/^\d{10}X$/.test(v)) return 'Taxonomy code format: 10 digits followed by X';
      break;
  }
  return null;
}

// ── COPY ALL FOR GHOST PILOT SECTION ─────────────────────────────────
function copyAllSection(sectionKeys) {
  var lines = [];
  sectionKeys.forEach(function(key) {
    var f = allFields[key];
    if (f && profile[key] && String(profile[key]).trim() !== '') {
      lines.push(f.label + ': ' + String(profile[key]).replace(/\n/g, ', '));
    }
  });
  var text = lines.join('\n');
  navigator.clipboard.writeText(text).then(function() {
    var toast = document.getElementById('save-toast');
    toast.textContent = 'Section copied!';
    toast.classList.add('visible');
    setTimeout(function() { toast.classList.remove('visible'); toast.textContent = 'Saved'; }, 1500);
  });
}

// ── TAB SWITCHING ─────────────────────────────────────────────────────
function switchTab(tabId) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelector('[data-tab="'+tabId+'"]').classList.add('active');
  document.getElementById('panel-'+tabId).classList.add('active');
  if (tabId === 'ghost') renderGhostPilot();
}

// ── COMPLETION BAR ────────────────────────────────────────────────────
function getCompletionStats() {
  const keys = Object.keys(allFields);
  const excluded = getExcludedKeys();
  const countable = keys.filter(k => !excluded.has(k));
  const total = countable.length;
  const filled = countable.filter(k => profile[k] && String(profile[k]).trim() !== '').length;
  return { total, filled, pct: total > 0 ? Math.round((filled/total)*100) : 0 };
}

function getExcludedKeys() {
  const excluded = new Set();
  // Always optional fields
  ['degree2School','degree2Type','degree2Date','gaps','medicarePtan','medicaidId',
   'postGradProgram','postGradInstitution','postGradDates','electronicRecordsSite',
   'physicianSpecialty','compactLicense'].forEach(k => excluded.add(k));
  // Conditional disclosure details: exclude if parent is "None" or empty
  const conditionals = [
    {parent:'discLicense', child:'discLicenseDetail', triggerValue:'Yes — see details'},
    {parent:'discCriminal', child:'discCriminalDetail', triggerValue:'Yes — see details'},
    {parent:'discPrivileges', child:'discPrivilegesDetail', triggerValue:'Yes — see details'},
    {parent:'discDea', child:'discDeaDetail', triggerValue:'Yes — see details'},
    {parent:'malClaims', child:'malClaimsDetail', triggerValue:'Yes'},
    {parent:'electronicRecords', child:'electronicRecordsSite', triggerValue:'Yes'}
  ];
  conditionals.forEach(c => {
    if (profile[c.parent] !== c.triggerValue) excluded.add(c.child);
  });
  return excluded;
}

function updateCompletionBar() {
  const s = getCompletionStats();
  const fill = document.getElementById('bar-fill');
  const label = document.getElementById('bar-label');
  if (fill) fill.style.width = s.pct + '%';
  if (label) label.textContent = s.pct + '% (' + s.filled + '/' + s.total + ')';
  // Update section stats
  const excluded = getExcludedKeys();
  VAULT_SECTIONS.forEach(sec => {
    const el = document.getElementById('stat-'+sec.id);
    if (el) {
      const countableFields = sec.fields.filter(fld => !excluded.has(fld.key));
      const t = countableFields.length;
      const f = countableFields.filter(fld => profile[fld.key] && String(profile[fld.key]).trim() !== '').length;
      el.textContent = f + '/' + t;
    }
  });
}

// ── VAULT RENDERING ───────────────────────────────────────────────────
function renderVault() {
  const container = document.getElementById('panel-vault');
  let html = '';

  // Completion bar
  const s = getCompletionStats();
  html += '<div class="completion-bar">';
  html += '<span class="bar-text">Profile Completion</span>';
  html += '<div class="bar-track"><div class="bar-fill" id="bar-fill" style="width:'+s.pct+'%"></div></div>';
  html += '<span class="bar-label" id="bar-label">'+s.pct+'% ('+s.filled+'/'+s.total+')</span>';
  html += '</div>';

  // Export/Import buttons
  html += '<div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap">';
  html += '<button onclick="exportProfile()" style="padding:6px 14px;background:transparent;border:1px solid var(--rule);color:var(--cream-dim);border-radius:6px;font-size:0.78rem;cursor:pointer">Export Backup</button>';
  html += '<button onclick="importProfile()" style="padding:6px 14px;background:transparent;border:1px solid var(--rule);color:var(--cream-dim);border-radius:6px;font-size:0.78rem;cursor:pointer">Import Backup</button>';
  html += '</div>';

  // Sections
  VAULT_SECTIONS.forEach((sec, idx) => {
    const secFilled = sec.fields.filter(f => profile[f.key] && String(profile[f.key]).trim() !== '').length;
    const isOpen = idx === 0;
    html += '<div class="vault-section">';
    html += '<div class="vault-section-header" onclick="toggleVaultSection(\''+sec.id+'\')">';
    html += '<h3>'+sec.title+'</h3>';
    html += '<div class="section-meta"><span class="section-stat" id="stat-'+sec.id+'">'+secFilled+'/'+sec.fields.length+'</span>';
    html += '<span class="chevron'+(isOpen?' open':'')+'" id="chev-'+sec.id+'">&#x25BC;</span></div>';
    html += '</div>';
    html += '<div class="vault-section-body'+(isOpen?' open':'')+'" id="body-'+sec.id+'">';
    sec.fields.forEach(f => {
      html += renderField(f);
    });
    html += '</div></div>';
  });

  container.innerHTML = html;

  // Bind input events
  VAULT_SECTIONS.forEach(sec => {
    sec.fields.forEach(f => {
      const el = document.getElementById('field-'+f.key);
      if (el) {
        el.addEventListener('input', function() { updateField(f.key, this.value); });
        el.addEventListener('change', function() { updateField(f.key, this.value); });
      }
    });
  });
}

function renderField(f) {
  let html = '<div class="field-group">';
  html += '<label>'+f.label+'</label>';
  html += '<div class="field-hint">'+f.hint+'</div>';

  const val = profile[f.key] || '';
  const escaped = escapeHtml(val);

  if (f.type === 'npi') {
    html += '<div class="npi-row">';
    html += '<input type="text" id="field-'+f.key+'" value="'+escaped+'" maxlength="10">';
    html += '<button class="npi-lookup-btn" onclick="lookupNPI()">Lookup NPI</button>';
    html += '</div>';
    html += '<div id="npi-status"></div>';
  } else if (f.type === 'textarea') {
    html += '<textarea id="field-'+f.key+'">'+escaped+'</textarea>';
  } else if (f.type === 'select') {
    html += '<select id="field-'+f.key+'">';
    f.options.forEach(o => {
      html += '<option value="'+escapeHtml(o)+'"'+(val===o?' selected':'')+'>'+( o || '— Select —')+'</option>';
    });
    html += '</select>';
  } else {
    html += '<input type="'+(f.type||'text')+'" id="field-'+f.key+'" value="'+escaped+'">';
  }

  // Validation error
  var valError = validateField(f.key, val);
  if (valError) {
    html += '<div style="color:#e74c3c;font-size:0.75rem;margin-top:4px">' + valError + '</div>';
  }

  html += '</div>';
  return html;
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toggleVaultSection(id) {
  const body = document.getElementById('body-'+id);
  const chev = document.getElementById('chev-'+id);
  if (body.classList.contains('open')) {
    body.classList.remove('open');
    chev.classList.remove('open');
  } else {
    body.classList.add('open');
    chev.classList.add('open');
  }
}

// ── NPI LOOKUP ────────────────────────────────────────────────────────
async function lookupNPI() {
  const npiInput = document.getElementById('field-npi1');
  const statusEl = document.getElementById('npi-status');
  const npi = (npiInput.value || '').trim();

  if (npi.length !== 10) {
    statusEl.innerHTML = '<div class="npi-status error">NPI must be exactly 10 digits.</div>';
    return;
  }

  const btn = document.querySelector('.npi-lookup-btn');
  btn.disabled = true;
  btn.textContent = 'Looking up...';
  statusEl.innerHTML = '';

  try {
    const res = await fetch('/.netlify/functions/npi-lookup?number='+npi);
    const data = await res.json();

    if (data.result_count > 0) {
      const r = data.results[0];
      const basic = r.basic || {};
      const taxonomy = (r.taxonomies || []).find(t => t.primary) || r.taxonomies?.[0] || {};
      const addr = (r.addresses || []).find(a => a.address_purpose === 'LOCATION') || r.addresses?.[0] || {};

      const nameStr = [basic.first_name, basic.middle_name, basic.last_name, basic.credential].filter(Boolean).join(' ');

      if (nameStr) {
        profile.legalName = nameStr;
        const el = document.getElementById('field-legalName');
        if (el) el.value = nameStr;
      }
      if (taxonomy.code) {
        const taxStr = taxonomy.code + (taxonomy.desc ? ' ('+taxonomy.desc+')' : '');
        profile.taxonomy = taxStr;
        const el = document.getElementById('field-taxonomy');
        if (el) el.value = taxStr;
      }
      if (addr.address_1) {
        const addrStr = [addr.address_1, addr.address_2, (addr.city||'')+', '+(addr.state||'')+' '+(addr.postal_code||'')].filter(Boolean).join('\n');
        profile.practiceAddress = addrStr;
        const el = document.getElementById('field-practiceAddress');
        if (el) el.value = addrStr;
      }
      if (addr.telephone_number) {
        profile.practicePhone = addr.telephone_number;
        const el = document.getElementById('field-practicePhone');
        if (el) el.value = addr.telephone_number;
      }

      saveProfile();
      updateCompletionBar();
      statusEl.innerHTML = '<div class="npi-status success">Found: '+escapeHtml(nameStr)+'. Auto-filled name, taxonomy, address, and phone.</div>';
    } else {
      statusEl.innerHTML = '<div class="npi-status error">No results found for that NPI.</div>';
    }
  } catch(err) {
    statusEl.innerHTML = '<div class="npi-status error">Lookup failed. Check your connection and try again.</div>';
  }

  btn.disabled = false;
  btn.textContent = 'Lookup NPI';
}

    html += '<p style="margin-top:10px;color:var(--teal);font-style:italic">Upload copies of all documents directly into CAQH. Most commercial payers pull these documents from CAQH, so uploading them here saves you from submitting them separately to each payer.</p>';

    html += '<details style="margin-top:12px"><summary style="cursor:pointer;color:var(--teal);font-size:0.82rem;font-weight:600;padding:4px 0">What you need before you start</summary>';
    html += '<div style="padding:10px 0;font-size:0.82rem;line-height:1.6;color:var(--cream-dim)">';
    html += '<p style="margin-bottom:8px">Availity is a portal, not a payer. It is the gateway you use to submit enrollment requests to multiple payers. The payers pull your credentialing documents from CAQH.</p>';
    html += '<p style="margin-bottom:3px">&#9744; <strong style="color:var(--cream)">Availity account</strong> — Register for free at <a href="https://apps.availity.com/availity/web/public.elegant.login" target="_blank" style="color:var(--teal)">availity.com</a> if you do not have one</p>';
    html += '<p style="margin-bottom:3px">&#9744; <strong style="color:var(--cream)">CAQH profile complete and attested</strong> — Every payer on Availity pulls your data from CAQH. If CAQH is not complete, the payer cannot process your application</p>';
    html += '<p style="margin-bottom:3px">&#9744; <strong style="color:var(--cream)">CAQH ID</strong> — You will need this when submitting through Availity</p>';
    html += '<p style="margin-bottom:3px">&#9744; <strong style="color:var(--cream)">NPI</strong></p>';
    html += '<p style="margin-bottom:3px">&#9744; <strong style="color:var(--cream)">Know which payers you are applying to</strong> — Check the Mapper tab for your state-specific list</p>';

    html += '</div></details>';
    html += '</div>';
  }

  // Missing fields
  const excluded = getExcludedKeys();
  const missing = [];
  view.sections.forEach(s => {
    s.keys.forEach(k => {
      if (excluded.has(k)) return;
      const f = allFields[k];
      if (f && (!profile[k] || String(profile[k]).trim() === '')) {
        missing.push(f.label);
      }
    });
  });

  if (missing.length > 0) {
    html += '<div class="gaps-list"><h4>Missing fields for this application ('+missing.length+')</h4><ul>';
    missing.slice(0,8).forEach(m => { html += '<li>'+m+'</li>'; });
    if (missing.length > 8) html += '<li>...and '+(missing.length-8)+' more</li>';
    html += '</ul></div>';
  }

  // Sections
  view.sections.forEach(sec => {
    var keysJson = JSON.stringify(sec.keys).replace(/'/g, "\\'");
    html += '<div class="ghost-section"><div style="display:flex;justify-content:space-between;align-items:center"><h4>'+sec.title+'</h4>';
    html += '<button onclick="copyAllSection('+escapeHtml(JSON.stringify(sec.keys))+')" style="padding:4px 10px;background:transparent;border:1px solid var(--rule);color:var(--cream-dim);border-radius:4px;font-size:0.72rem;cursor:pointer">Copy All</button>';
    html += '</div>';
    sec.keys.forEach(k => {
      const f = allFields[k];
      if (!f) return;
      const val = profile[k] || '';
      const hasValue = val && String(val).trim() !== '';
      html += '<div class="ghost-field">';
      html += '<span class="ghost-field-label">'+f.label+'</span>';
      html += '<span class="ghost-field-value'+(hasValue?'':' empty')+'">'+(hasValue ? escapeHtml(val) : '—')+'</span>';
      html += '<button class="copy-btn" onclick="copyField(\''+k+'\', this)"'+(hasValue?'':' disabled')+'>Copy</button>';
      html += '</div>';
    });
    html += '</div>';
  });

  container.innerHTML = html;
}

function switchGhostView(viewId) {
  activeGhostView = viewId;
  renderGhostPilot();
}

function copyField(key, btn) {
  const val = profile[key];
  if (!val || String(val).trim() === '') return;

  navigator.clipboard.writeText(String(val)).then(() => {
    btn.classList.add('copied');
    btn.textContent = 'Copied';
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.textContent = 'Copy';
    }, 1500);
  });
}

function renderChecklist() {
  const el = document.getElementById('master-checklist');
  const checks = profile._checklist || {};
  let html = '<div class="master-checklist">';
  html += '<h3>Your Credentialing Roadmap</h3>';

  // Why this order explainer
  html += '<details style="margin-bottom:18px">';
  html += '<summary style="cursor:pointer;color:var(--teal);font-size:0.85rem;font-weight:600;padding:6px 0">Why this order matters</summary>';
  html += '<div style="padding:12px 0;font-size:0.85rem;line-height:1.7;color:var(--cream)">';

  html += '<p style="margin-bottom:10px"><strong style="color:var(--teal)">Step 1: Vault.</strong> Every application asks for the same data: your NPI, license, DEA, education, malpractice insurance, work history, references. Enter it once here, then copy from here into every portal instead of hunting through emails and file cabinets each time.</p>';

  html += '<p style="margin-bottom:10px"><strong style="color:var(--teal)">Step 2: CAQH.</strong> CAQH Provider Data Portal is a universal credentialing database. Most commercial insurance companies (Aetna, Cigna, UnitedHealthcare, Anthem/BCBS, Humana, and others) pull your credentialing data directly from CAQH instead of making you fill out separate applications. If your CAQH profile is incomplete or expired, payers cannot process your application. Complete CAQH first because everything else depends on it.</p>';

  html += '<p style="margin-bottom:10px"><strong style="color:var(--teal)">Step 3: Medicare.</strong> Medicare enrollment goes through PECOS (not CAQH) and takes 60-120 days. Start this in parallel with CAQH. Many states also require an active Medicare enrollment before you can enroll in Medicaid.</p>';

  html += '<p style="margin-bottom:10px"><strong style="color:var(--teal)">Steps 4-5: Commercial payers.</strong> Once CAQH is complete, apply to your top commercial payers simultaneously. Most pull from CAQH, so the application is often just submitting your NPI and CAQH ID through Availity or the payer portal. Do not wait for one payer to finish before starting the next.</p>';

  html += '<p style="margin-bottom:10px"><strong style="color:var(--teal)">Step 6: Medicaid.</strong> State Medicaid does NOT use CAQH. It has its own portal and process. Most states require Medicare enrollment first, which is why this comes last.</p>';

  html += '<p><strong style="color:var(--teal)">Step 7: Track everything.</strong> Applications get lost. Follow up at 30, 60, and 90 days. The Pulse tab has scripts for each call.</p>';

  html += '</div></details>';

  html += '<div class="checklist-items">';
  CHECKLIST_ITEMS.forEach((item, i) => {
    // Auto-detect completion
    var autoDetected = false;
    var autoStatus = '';
    if (item.autoDetect && item.autoDetect()) {
      autoDetected = true;
      if (item.autoLabel) {
        autoStatus = item.autoLabel.replace('{pct}', getCompletionStats().pct);
      }
      // Auto-check if not manually unchecked
      if (!checks.hasOwnProperty(item.id)) {
        if (!profile._checklist) profile._checklist = {};
        profile._checklist[item.id] = true;
        checks[item.id] = true;
      }
    }

    const done = checks[item.id] ? ' done' : '';
    html += '<div class="checklist-item'+done+'">';
    html += '<span class="check-box" onclick="event.stopPropagation();toggleCheck(\''+item.id+'\')" style="cursor:pointer">'+(checks[item.id]?'&#x2713;':'')+'</span>';
    html += '<span class="checklist-step-num">'+(i+1)+'.</span>';
    if (item.extUrl) {
      html += '<a href="'+item.extUrl+'" target="_blank" style="color:inherit;text-decoration:none;border-bottom:1px dashed var(--teal)" onclick="event.stopPropagation()">'+item.label+' &rarr;</a>';
    } else if (item.tab) {
      html += '<span style="cursor:pointer;border-bottom:1px dashed var(--rule)" onclick="event.stopPropagation();navigateChecklist(\''+item.tab+'\',\''+(item.ghostView||'')+'\')">'+item.label+'</span>';
    } else {
      html += item.label;
    }
    // Auto-detection badge
    if (autoDetected && autoStatus) {
      html += ' <span style="font-size:0.72rem;color:var(--teal);background:rgba(42,171,184,0.12);padding:2px 8px;border-radius:10px;margin-left:6px">'+autoStatus+'</span>';
    }
    html += '</div>';
  });
  html += '</div></div>';
  el.innerHTML = html;

  // Save auto-detections
  saveProfile();
}

function navigateChecklist(tab, ghostView) {
  switchTab(tab);
  if (ghostView && tab === 'ghost') {
    activeGhostView = ghostView;
    renderGhostPilot();
  }
  window.scrollTo({top: document.getElementById('panel-'+tab).offsetTop - 20, behavior:'smooth'});
}

function toggleCheck(id) {
  if (!profile._checklist) profile._checklist = {};
  profile._checklist[id] = !profile._checklist[id];
  saveProfile();
  renderChecklist();
}

function getPayerTip(payerName) {
  var lower = payerName.toLowerCase();
  for (var key in PAYER_TIPS) {
    if (lower.indexOf(key) !== -1) return PAYER_TIPS[key];
  }
  return null;
}

function personalizeScript(text) {
  var name = profile.legalName || '';
  var npi = profile.npi1 || '';
  return text
    .replace(/\[Name\]/g, name || '[Name]')
    .replace(/\[Your Name\]/g, name || '[Your Name]')
    .replace(/\[Your Name, NPI\]/g, (name || '[Name]') + ', NPI ' + (npi || '[NPI]'))
    .replace(/\[NPI\]/g, npi || '[NPI]');
}

function getRecommendedScript(days, entry) {
  var name = entry.user_name || profile.legalName || '[Name]';
  var npi = entry.npi || profile.npi1 || '[NPI]';
  var payer = entry.payer_name;
  var date = entry.submission_date;

  if (days < 30) {
    return { milestone: 'No action needed yet', color: 'var(--teal)', script: null, action: 'Your first follow-up is at 30 days (' + (30 - days) + ' days from now). No call needed yet.' };
  }
  if (days < 60) {
    return {
      milestone: '30-Day Follow-Up',
      color: 'var(--teal)',
      action: 'Time to check in. Call or email the payer.',
      script: 'Hi, I am calling to check on the status of a credentialing application I submitted about ' + days + ' days ago.\n\nMy name is ' + name + ', NPI ' + npi + '. I submitted through CAQH around ' + date + '.\n\nCan you check where it is in the process and whether anything is needed from me to move it forward?',
      followup: 'Is there anything currently missing or pending on my file that I can provide?'
    };
  }
  if (days < 90) {
    return {
      milestone: '60-Day Escalation',
      color: 'var(--amber)',
      action: 'Time to escalate. This application should have progressed by now.',
      script: 'Hi, I am following up on a ' + payer + ' credentialing application submitted on ' + date + ', now ' + days + ' days ago.\n\nMy name is ' + name + ', NPI ' + npi + '.\n\nI have checked in previously and want to understand if there are any delays or issues preventing it from moving forward.\n\nIf possible, can this be escalated or flagged for review?',
      followup: 'Is this currently in Primary Source Verification, or has it moved to the Credentialing Committee?'
    };
  }
  return {
    milestone: '90-Day Urgency',
    color: 'var(--red)',
    action: 'This needs resolution now.',
    script: 'I am calling regarding my ' + payer + ' credentialing application submitted on ' + date + ', now at ' + days + ' days.\n\nMy name is ' + name + ', NPI ' + npi + '. All required information was complete upon submission.\n\nI need to speak with a Credentialing Coordinator or Team Lead.\n\nI am currently unable to bill for your members that I am treating, which is creating a continuity of care issue. I need to know the specific effective date listed in your system, even if the approval letter has not been mailed yet.',
    followup: 'Is there an email address where I can send a formal inquiry to the Provider Relations Manager for this region?'
  };
}

function renderPulse() {
  var container = document.getElementById('panel-pulse');
  var html = '';

  html += '<p class="pulse-intro">Follow-up scripts for every stage of the credentialing process. Scripts are automatically personalized with your name, NPI, and payer information. Your tracked applications show the exact script you need right now based on days elapsed.</p>';

  html += '<div class="pulse-principle"><p><strong>The one question that matters most:</strong> "Is it in review, or still waiting to be assigned?" That question forces a real answer and is the difference between passive waiting and active process management.</p></div>';

  // Tracking form
  html += '<div class="pulse-section" style="border-left:3px solid var(--teal)">';
  html += '<div class="pulse-section-header" style="cursor:default"><h4>Track a Payer Application</h4></div>';
  html += '<div class="pulse-section-body open">';
  html += '<p style="font-size:0.85rem;color:var(--cream-dim);margin-bottom:16px">Log each payer application here. You will receive automated follow-up emails at 30, 60, and 90 days with the exact script to use, pre-filled with your name, NPI, and the payer.</p>';
  html += '<div class="field-group"><label>Your Email</label>';
  html += '<input type="email" id="track-email" value="'+(profile.email||'')+'" placeholder="you@example.com"></div>';
  html += '<div class="field-group"><label>Payer Name</label>';
  html += '<input type="text" id="track-payer" placeholder="e.g., Premera Blue Cross, Medicare, Aetna"></div>';
  html += '<div class="field-group"><label>Submission Date</label>';
  html += '<input type="date" id="track-date"></div>';
  html += '<button class="generate-pdf-btn" onclick="submitTracking()" id="track-submit-btn">Start Tracking</button>';
  html += '<div id="track-status" style="margin-top:12px"></div>';
  html += '</div></div>';

  // Active applications
  html += '<div id="active-applications" style="margin-top:24px"></div>';

  // Reference scripts (personalized)
  html += '<h3 style="font-family:var(--font-display);color:var(--white);margin:32px 0 16px">Reference Scripts</h3>';
  html += '<p style="font-size:0.82rem;color:var(--cream-dim);margin-bottom:16px">Auto-filled with your Vault profile. Your tracked applications above show the specific script you need right now.</p>';

  PULSE_SECTIONS.forEach(function(sec) {
    html += '<div class="pulse-section">';
    html += '<div class="pulse-section-header" onclick="togglePulseSection(\''+sec.id+'\')">';
    html += '<h4>'+sec.title+'</h4>';
    html += '<span class="chevron" id="pchev-'+sec.id+'">&#x25BC;</span>';
    html += '</div>';
    html += '<div class="pulse-section-body" id="pbody-'+sec.id+'">';
    sec.scripts.forEach(function(s, i) {
      var copyId = sec.id+'_'+i;
      var pText = personalizeScript(s.text);
      html += '<div class="pulse-script-block">';
      html += '<div class="script-label">'+s.label+'</div>';
      html += '<p>'+escapeHtml(pText)+'</p>';
      html += '<button class="pulse-copy-all" id="pcopy-'+copyId+'" onclick="copyScript(\''+copyId+'\',this)">Copy</button>';
      html += '<input type="hidden" id="ptext-'+copyId+'" value="'+escapeHtml(pText)+'">';
      html += '</div>';
    });
    if (sec.tip) html += '<p class="pulse-tip">'+sec.tip+'</p>';
    html += '</div></div>';
  });

  container.innerHTML = html;
  loadActiveApplications();
}

var API_BASE = '/.netlify/functions/credentialing-tracking';

async function submitTracking() {
  var email = document.getElementById('track-email').value.trim();
  var payer = document.getElementById('track-payer').value.trim();
  var date = document.getElementById('track-date').value;
  var statusEl = document.getElementById('track-status');
  var btn = document.getElementById('track-submit-btn');
  if (!email || !payer || !date) { statusEl.innerHTML = '<div class="npi-status error">All three fields are required.</div>'; return; }
  btn.disabled = true; btn.textContent = 'Saving...';
  try {
    var res = await fetch(API_BASE, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ email:email, payer_name:payer, submission_date:date, user_name:profile.legalName||'', npi:profile.npi1||'' }) });
    if (res.ok) { statusEl.innerHTML = '<div class="npi-status success">Tracking started for '+escapeHtml(payer)+'. You will receive follow-up emails at 30, 60, and 90 days.</div>'; document.getElementById('track-payer').value=''; document.getElementById('track-date').value=''; loadActiveApplications(); }
    else { var err = await res.json(); statusEl.innerHTML = '<div class="npi-status error">Error: '+(err.error||'Failed to save')+'</div>'; }
  } catch(e) { statusEl.innerHTML = '<div class="npi-status error">Network error. Check your connection.</div>'; }
  btn.disabled = false; btn.textContent = 'Start Tracking';
}

async function loadActiveApplications() {
  var container = document.getElementById('active-applications');
  if (!container) return;
  var email = profile.email || (document.getElementById('track-email') ? document.getElementById('track-email').value.trim() : '');
  if (!email) { container.innerHTML = '<p style="font-size:0.85rem;color:var(--cream-dim);font-style:italic">Enter your email above to see your tracked applications.</p>'; return; }
  try {
    var res = await fetch(API_BASE + '?email=' + encodeURIComponent(email));
    if (!res.ok) throw new Error('Failed to load');
    var entries = await res.json();
    if (!entries || entries.length === 0) { container.innerHTML = '<p style="font-size:0.85rem;color:var(--cream-dim);font-style:italic">No tracked applications yet. Use the form above to start tracking.</p>'; return; }

    var html = '<h3 style="font-family:var(--font-display);color:var(--white);margin-bottom:16px">Your Active Applications</h3>';

    entries.forEach(function(entry) {
      var submitted = new Date(entry.submission_date);
      var now = new Date();
      var days = Math.floor((now - submitted) / (1000 * 60 * 60 * 24));
      var statusColor = 'var(--teal)';
      var statusLabel = entry.status.replace('_', ' ');
      if (days >= 90) statusColor = 'var(--red)';
      else if (days >= 60) statusColor = 'var(--amber)';
      if (entry.status === 'approved') { statusColor = 'var(--green)'; statusLabel = 'Approved'; }
      if (entry.status === 'denied') { statusColor = 'var(--red)'; statusLabel = 'Denied'; }

      var rec = getRecommendedScript(days, entry);

      html += '<div class="mapper-step" style="border-left:3px solid '+statusColor+'">';
      html += '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">';
      html += '<h4 style="margin:0">'+escapeHtml(entry.payer_name)+'</h4>';
      html += '<span style="font-size:0.78rem;font-weight:600;color:'+statusColor+';text-transform:uppercase">'+statusLabel+'</span>';
      html += '</div>';
      html += '<p style="margin-top:8px">Submitted: '+entry.submission_date+' | <strong>'+days+' days elapsed</strong></p>';

      // Contextual script
      if (entry.status !== 'approved' && entry.status !== 'denied' && entry.status !== 'withdrawn') {
        var urgencyRgb = days>=90?'248,113,113':days>=60?'251,191,36':'42,171,184';
        html += '<div style="margin-top:12px;padding:12px 16px;background:rgba('+urgencyRgb+',0.08);border:1px solid rgba('+urgencyRgb+',0.2);border-radius:6px">';
        html += '<div style="font-size:0.78rem;font-weight:700;color:'+rec.color+';text-transform:uppercase;margin-bottom:4px">'+rec.milestone+'</div>';
        html += '<p style="font-size:0.85rem;color:var(--cream-dim);margin-bottom:8px">'+rec.action+'</p>';

        if (rec.script) {
          var scriptId = 'active-script-' + entry.id;
          html += '<div class="pulse-script-block" style="margin:0">';
          html += '<div class="script-label">Ready-to-use script</div>';
          html += '<p>'+escapeHtml(rec.script)+'</p>';
          html += '<button class="pulse-copy-all" onclick="copyActiveScript(\''+scriptId+'\',this)">Copy</button>';
          html += '<input type="hidden" id="'+scriptId+'" value="'+escapeHtml(rec.script)+'">';
          html += '</div>';
          if (rec.followup) html += '<p style="font-size:0.82rem;color:var(--cream);margin-top:8px"><strong>Then ask:</strong> "'+escapeHtml(rec.followup)+'"</p>';
        }

        var payerTip = getPayerTip(entry.payer_name);
        if (payerTip) html += '<p class="pulse-tip" style="margin-top:8px">'+payerTip+'</p>';
        html += '</div>';
      }

      // Reminder history
      var reminders = [];
      if (entry.reminder_30_sent) reminders.push('30-day email sent');
      if (entry.reminder_60_sent) reminders.push('60-day email sent');
      if (entry.reminder_90_sent) reminders.push('90-day email sent');
      if (reminders.length > 0) html += '<p style="font-size:0.78rem;color:var(--cream-dim);margin-top:8px">Email reminders: '+reminders.join(' | ')+'</p>';

      // Status buttons
      if (entry.status !== 'approved' && entry.status !== 'denied' && entry.status !== 'withdrawn') {
        html += '<div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">';
        ['in_review','stalled','approved','denied','withdrawn'].forEach(function(s) {
          if (s !== entry.status) html += '<button style="background:var(--navy-light);border:1px solid var(--rule);color:var(--cream-dim);font-size:0.72rem;padding:4px 10px;border-radius:4px;cursor:pointer;font-family:var(--font-body)" onclick="updateTrackingStatus(\''+entry.id+'\',\''+s+'\')">'+s.replace('_',' ')+'</button>';
        });
        html += '</div>';
      }
      html += '</div>';
    });
    container.innerHTML = html;
  } catch(e) { container.innerHTML = '<p style="font-size:0.85rem;color:var(--cream-dim);font-style:italic">Could not load applications. Make sure you are online.</p>'; }
}

function copyActiveScript(id, btn) {
  var el = document.getElementById(id);
  if (!el) return;
  var temp = document.createElement('textarea');
  temp.innerHTML = el.value;
  navigator.clipboard.writeText(temp.value).then(function() {
    btn.classList.add('copied'); btn.textContent = 'Copied';
    setTimeout(function() { btn.classList.remove('copied'); btn.textContent = 'Copy'; }, 1500);
  });
}

async function updateTrackingStatus(id, newStatus) {
  try {
    var res = await fetch(API_BASE, { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id:id,status:newStatus}) });
    if (res.ok) loadActiveApplications();
  } catch(e) { console.error('Status update failed:', e); }
}
function togglePulseSection(id) {
  const body = document.getElementById('pbody-'+id);
  const chev = document.getElementById('pchev-'+id);
  if (body.classList.contains('open')) {
    body.classList.remove('open');
    chev.classList.remove('open');
  } else {
    body.classList.add('open');
    chev.classList.add('open');
  }
}

function copyScript(id, btn) {
  const el = document.getElementById('ptext-'+id);
  if (!el) return;
  // Decode HTML entities back to plain text
  const temp = document.createElement('textarea');
  temp.innerHTML = el.value;
  navigator.clipboard.writeText(temp.value).then(() => {
    btn.classList.add('copied');
    btn.textContent = 'Copied';
    setTimeout(() => { btn.classList.remove('copied'); btn.textContent = 'Copy'; }, 1500);
  });
}

const US_STATES = Object.keys(STATE_PAYERS).sort();

function renderMapper() {
  const container = document.getElementById('panel-mapper');
  const userState = profile.licenseState || '';

  let html = '<p class="mapper-intro">The Mapper generates a prioritized credentialing plan based on your state. Select your state to see which payers to apply to, in what order, with realistic timelines and direct portal links.</p>';

  html += '<div class="mapper-state-select field-group">';
  html += '<label>Your State</label>';
  html += '<select id="mapper-state" onchange="renderMapperPlan()">';
  html += '<option value="">— Select your state —</option>';
  US_STATES.forEach(s => {
    const sel = (s === userState || s === matchState(userState)) ? ' selected' : '';
    html += '<option value="'+s+'"'+sel+'>'+s+'</option>';
  });
  html += '</select></div>';

  html += '<div id="mapper-plan"></div>';
  container.innerHTML = html;

  if (userState) renderMapperPlan();
}

function matchState(input) {
  if (!input) return '';
  const lower = input.toLowerCase().trim();
  return US_STATES.find(s => s.toLowerCase() === lower) || '';
}

function renderMapperPlan() {
  const sel = document.getElementById('mapper-state');
  const state = sel.value;
  const planEl = document.getElementById('mapper-plan');
  if (!state || !STATE_PAYERS[state]) { planEl.innerHTML = ''; return; }

  const payers = STATE_PAYERS[state];
  let html = '';
  let step = 1;

  // Step 1: CAQH
  const caqh = PAYER_PORTALS['caqh'];
  html += mapperStep(step++, 'Complete CAQH Provider Data Portal Profile', caqh.note, caqh.enrollUrl, 'Register at CAQH Provider Data Portal', '1-2 hours to complete initial profile', 'caqh', caqh.method);

  // Step 2: Medicare
  const med = PAYER_PORTALS['medicare'];
  html += mapperStep(step++, 'Enroll in Medicare via PECOS', med.note + ' You can generate a pre-filled CMS-855I from the Ghost Pilot tab for reference or paper submission.', med.enrollUrl, 'Open PECOS', '60-90 days processing', 'medicare', med.method);

  // Step 3+: Commercial payers
  payers.forEach(p => {
    const portal = PAYER_PORTALS[p.type] || PAYER_PORTALS['other'];
    const shareNote = p.share > 0 ? ' (' + p.share + '% market share in ' + state + ')' : '';
    const linkUrl = portal.enrollUrl || portal.url;
    const linkLabel = portal.enrollUrl ? 'Apply: ' + portal.name : portal.name;
    html += mapperStep(step++, 'Credential with ' + p.name, p.name + shareNote + '. ' + portal.note, linkUrl, linkLabel, '30-90 days processing', p.type, portal.method);
  });

  // Step: Medicaid (conditional)
  html += mapperStep(step++, 'State Medicaid (if applicable)', 'If you plan to see Medicaid patients, apply through your state Medicaid portal. Does NOT use CAQH. Most states require Medicare enrollment first. Timelines vary significantly by state.', '', 'Search: "' + state + ' Medicaid provider enrollment"', '30-120+ days depending on state', 'medicaid', 'State Medicaid portal (not CAQH, not Availity)');

  // Additional national payers
  const existingTypes = payers.map(p => p.type);
  const nationals = [
    {type:'aetna',name:'Aetna/CVS Health'},
    {type:'cigna',name:'Cigna'},
    {type:'united',name:'UnitedHealthcare'},
    {type:'elevance',name:'Elevance Health (Anthem)'}
  ].filter(n => !existingTypes.includes(n.type));

  if (nationals.length > 0) {
    html += '<div class="mapper-step" style="border-left:3px solid var(--cream-dim)">';
    html += '<span class="mapper-step-num" style="background:var(--cream-dim);color:var(--navy)">OPTIONAL</span>';
    html += '<h4>Additional National Payers</h4>';
    html += '<p>These national payers have presence in ' + state + ' but are not the dominant commercial carriers. Consider credentialing with them to expand your panel:</p>';
    nationals.forEach(n => {
      const portal = PAYER_PORTALS[n.type];
      const linkUrl = portal.enrollUrl || portal.url;
      html += '<div style="margin-top:10px;padding:8px 0;border-top:1px solid var(--rule)">';
      html += '<p><strong>' + n.name + '</strong></p>';
      html += '<p style="font-size:0.82rem;color:var(--cream-dim);margin:4px 0"><span style="color:var(--teal);font-weight:500">How to apply:</span> ' + (portal.method || 'Contact provider relations') + '</p>';
      if (linkUrl) html += '<a href="'+linkUrl+'" target="_blank" style="font-size:0.82rem">Apply: ' + n.name + ' &rarr;</a>';
      html += '</div>';
    });
    html += '</div>';
  }

  // Tips
  html += '<div class="mapper-tip">';
  html += '<h4>Sequencing Tips</h4>';
  html += '<p>Complete CAQH first because most commercial payers pull from it. Submit Medicare in parallel since it has the longest processing time. After CAQH is complete, apply to your top 2-3 commercial payers simultaneously. Do not wait for one to finish before starting the next. If an application has no response after 30 days, call provider relations. After 60 days with no response, escalate. Keep your CAQH profile attested every 120 days or it expires.</p>';
  html += '</div>';

  planEl.innerHTML = html;
}
