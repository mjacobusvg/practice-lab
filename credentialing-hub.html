function copyEmailToClipboard(payerType, payerName, btn) {
  var tmpl = getPayerEmail(payerType, payerName);
  var full = 'To: ' + tmpl.to + '\nSubject: ' + tmpl.subject + '\n\n' + tmpl.body;
  navigator.clipboard.writeText(full).then(function() {
    btn.textContent = 'Copied!';
    setTimeout(function(){ btn.textContent = 'Copy Email'; }, 1500);
  });
}

function copyPrepField(el, key) {
  var val = String(profile[key] || '').replace(/\n/g, ', ');
  navigator.clipboard.writeText(val).then(function() {
    var flash = el.querySelector('.copy-flash');
    if (flash) { flash.textContent = 'Copied!'; setTimeout(function(){ flash.textContent = ''; }, 1200); }
  });
}

function mapperStep(num, title, desc, url, urlLabel, timeline, payerType, method) {
  let html = '<div class="mapper-step">';
  html += '<span class="mapper-step-num">STEP ' + num + '</span>';
  html += '<h4>' + title + '</h4>';
  if (method) {
    html += '<div style="background:rgba(42,171,184,0.1);border:1px solid rgba(42,171,184,0.25);border-radius:6px;padding:8px 12px;margin-bottom:10px;font-size:0.82rem">';
    html += '<span style="color:var(--teal);font-weight:600">How to apply: </span>';
    html += '<span style="color:var(--cream)">' + method + '</span>';
    html += '</div>';
  }
  html += '<p>' + desc + '</p>';
  if (url) html += '<a href="' + url + '" target="_blank">' + urlLabel + ' &rarr;</a><br>';
  html += '<span class="timeline-tag">' + timeline + '</span>';

  // Document checklist
  var docs = getPayerDocs(payerType || 'default');
  html += '<details style="margin-top:12px">';
  html += '<summary style="cursor:pointer;color:var(--teal);font-size:0.82rem;font-weight:600;padding:4px 0">Documents needed + Prep Sheet</summary>';
  html += '<div style="padding:10px 0;font-size:0.82rem;line-height:1.6">';

  html += '<p style="color:var(--cream);font-weight:500;margin-bottom:6px">Required:</p>';
  docs.required.forEach(function(d) {
    html += '<div style="color:var(--cream-dim);margin-bottom:3px;padding-left:16px;position:relative"><span style="position:absolute;left:0">&#9744;</span> ' + d + '</div>';
  });
  if (docs.optional && docs.optional.length) {
    html += '<p style="color:var(--cream);font-weight:500;margin:10px 0 6px">If applicable:</p>';
    docs.optional.forEach(function(d) {
      html += '<div style="color:var(--cream-dim);margin-bottom:3px;padding-left:16px;position:relative"><span style="position:absolute;left:0">&#9744;</span> ' + d + '</div>';
    });
  }
  if (docs.tip) {
    html += '<p style="color:var(--teal);margin-top:10px;font-style:italic">' + docs.tip + '</p>';
  }

  // Copy-ready data block
  html += '<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--rule)">';

  // Email template or portal instructions
  if (payerType && payerType !== 'caqh' && payerType !== 'medicare') {
    var emailTmpl = getPayerEmail(payerType, title.replace('Credential with ',''));
    var hasRealEmail = emailTmpl.to && emailTmpl.to.indexOf('@') > -1 && emailTmpl.to.indexOf('[') === -1;

    if (hasRealEmail) {
      // Payer accepts email-based credentialing outreach
      html += '<div style="margin-bottom:14px">';
      html += '<p style="color:var(--cream);font-weight:500;margin-bottom:8px">Ready-to-send email:</p>';
      html += '<p style="font-size:0.78rem;color:var(--cream-dim);margin-bottom:4px"><strong>To:</strong> ' + emailTmpl.to + '</p>';
      html += '<p style="font-size:0.78rem;color:var(--cream-dim);margin-bottom:6px"><strong>Subject:</strong> ' + emailTmpl.subject.replace(/</g,'&lt;') + '</p>';
      html += '<pre style="background:rgba(11,17,32,0.6);border:1px solid var(--rule);border-radius:6px;padding:12px;font-size:0.78rem;color:var(--cream-dim);white-space:pre-wrap;line-height:1.5;max-height:200px;overflow-y:auto">' + emailTmpl.body.replace(/</g,'&lt;') + '</pre>';
      html += '<button onclick="copyEmailToClipboard(\'' + payerType + '\',\'' + title.replace(/'/g,"\\'").replace('Credential with ','') + '\',this)" style="margin-top:8px;padding:6px 16px;background:var(--teal);color:var(--navy);border:none;border-radius:6px;font-size:0.8rem;font-weight:600;cursor:pointer">Copy Email</button>';

      // Premera gets two emails (credentialing + contract request)
      if (payerType === 'premera') {
        var credEmail = getPayerEmail('premera_cred', 'Premera Blue Cross');
        html += '<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--rule)">';
        html += '<p style="font-size:0.78rem;color:var(--cream-dim);margin-bottom:4px"><strong>Credentialing inquiry (send first):</strong> ' + credEmail.to + '</p>';
        html += '<pre style="background:rgba(11,17,32,0.6);border:1px solid var(--rule);border-radius:6px;padding:12px;font-size:0.78rem;color:var(--cream-dim);white-space:pre-wrap;line-height:1.5;max-height:160px;overflow-y:auto">' + credEmail.body.replace(/</g,'&lt;') + '</pre>';
        html += '<button onclick="copyEmailToClipboard(\'premera_cred\',\'Premera Blue Cross\',this)" style="margin-top:8px;padding:6px 16px;background:var(--teal);color:var(--navy);border:none;border-radius:6px;font-size:0.8rem;font-weight:600;cursor:pointer">Copy Credentialing Email</button>';
        html += '</div>';
      }

      html += '</div>';
    } else {
      // Payer does NOT accept email — must apply through portal, Availity, or phone
      var portal = PAYER_PORTALS[payerType] || PAYER_PORTALS['other'] || {};
      html += '<div style="margin-bottom:14px;padding:12px;background:rgba(42,171,184,0.06);border:1px solid rgba(42,171,184,0.15);border-radius:6px">';
      html += '<p style="color:var(--cream);font-weight:500;margin-bottom:6px">How to apply to this payer:</p>';
      html += '<p style="font-size:0.82rem;color:var(--cream-dim);line-height:1.5">' + (portal.method || 'Contact Provider Relations') + '</p>';
      if (portal.enrollUrl) {
        html += '<p style="margin-top:6px"><a href="' + portal.enrollUrl + '" target="_blank" style="color:var(--teal);font-size:0.82rem">Open enrollment page &rarr;</a></p>';
      }
      html += '<p style="font-size:0.78rem;color:var(--cream-dim);margin-top:8px;font-style:italic">This payer does not accept email-based credentialing applications. Use the portal or Availity path described above. Your CAQH profile must be complete and this payer must be authorized in your CAQH Plan Authorization section.</p>';
      html += '</div>';
    }
  }

  html += '<p style="color:var(--cream);font-weight:500;margin-bottom:8px">Your data (click any field to copy):</p>';
  var prepFields = [
    {label:'Legal Name', key:'legalName'},
    {label:'NPI', key:'npi1'},
    {label:'NPI Type 2', key:'npi2'},
    {label:'Tax ID/EIN', key:'ein'},
    {label:'DOB', key:'dob'},
    {label:'CAQH ID', key:'caqhId'},
    {label:'License #', key:'licenseNum'},
    {label:'License State', key:'licenseState'},
    {label:'License Exp', key:'licenseExp'},
    {label:'DEA #', key:'dea'},
    {label:'DEA Exp', key:'deaExp'},
    {label:'Taxonomy', key:'taxonomy'},
    {label:'Board Cert', key:'boardCert'},
    {label:'Board Cert Entity', key:'boardCertEntity'},
    {label:'Cert Date', key:'boardCertDate'},
    {label:'Practice Name', key:'practiceName'},
    {label:'Address', key:'practiceAddress'},
    {label:'Phone', key:'practicePhone'},
    {label:'Fax', key:'practiceFax'},
    {label:'Email', key:'practiceEmail'},
    {label:'Mal Carrier', key:'malCarrier'},
    {label:'Mal Policy #', key:'malPolicy'},
    {label:'Mal Coverage', key:'malStart'},
    {label:'Mal Per Occurrence', key:'malPerOccurrence'},
    {label:'Mal Aggregate', key:'malAggregate'}
  ];

  prepFields.forEach(function(pf) {
    var val = profile[pf.key] || '';
    if (!val) return;
    var displayVal = String(val).replace(/\n/g, ', ').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    var copyId = 'copy-' + payerType + '-' + pf.key;
    html += '<div style="display:flex;gap:8px;margin-bottom:4px;align-items:baseline;cursor:pointer" onclick="copyPrepField(this,\'' + pf.key + '\')" title="Click to copy">';
    html += '<span style="color:var(--cream-dim);min-width:110px;font-size:0.78rem">' + pf.label + ':</span>';
    html += '<span style="color:var(--cream);font-family:monospace;font-size:0.82rem">' + displayVal + '</span>';
    html += '<span class="copy-flash" style="color:var(--teal);font-size:0.72rem;margin-left:auto"></span>';
    html += '</div>';
  });

  html += '</div>';  // end copy-ready data
  html += '</div></details>';  // end details
  html += '</div>';
  return html;
}

// ── PDF GENERATION (Fill actual CMS-855I form) ──────────────────────
async function generateMedicarePDF() {
  const ssnInput = document.getElementById('ssn-input');
  const ssn = ssnInput ? ssnInput.value.trim() : '';
  const btn = document.querySelector('.generate-pdf-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Loading PDF...'; }

  try {
    // Load pdf-lib from CDN
    if (!window.PDFLib) {
      const script = document.createElement('script');
      script.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js';
      document.head.appendChild(script);
      await new Promise((resolve, reject) => {
        script.onload = resolve;
        script.onerror = () => reject(new Error('Failed to load pdf-lib'));
      });
    }

    if (btn) btn.textContent = 'Fetching CMS-855I form...';

    // Fetch the official CMS-855I PDF from CMS.gov
    const pdfUrl = 'https://www.cms.gov/medicare/cms-forms/cms-forms/downloads/cms855i.pdf';
    let pdfBytes;
    try {
      const resp = await fetch(pdfUrl);
      if (!resp.ok) throw new Error('CMS.gov fetch failed');
      pdfBytes = await resp.arrayBuffer();
    } catch(e) {
      // Fallback: try loading from local repo
      try {
        const resp2 = await fetch('/CMS-855I.pdf');
        if (!resp2.ok) throw new Error('Local fetch failed');
        pdfBytes = await resp2.arrayBuffer();
      } catch(e2) {
        throw new Error('Could not load CMS-855I PDF. Host the file at /CMS-855I.pdf in your repo, or check your connection to CMS.gov.');
      }
    }

    if (btn) btn.textContent = 'Filling form fields...';

    const { PDFDocument } = PDFLib;
    const pdfDoc = await PDFDocument.load(pdfBytes);
    const form = pdfDoc.getForm();

    // Helper: safely set text field
    function setField(name, value) {
      if (!value) return;
      try {
        const field = form.getTextField(name);
        field.setText(String(value));
      } catch(e) { console.warn('Field not found:', name, e.message); }
    }

    // Helper: safely check checkbox
    function checkBox(name) {
      try {
        const field = form.getCheckBox(name);
        field.check();
      } catch(e) { console.warn('Checkbox not found:', name, e.message); }
    }

    // Parse name parts from legalName
    const nameParts = (profile.legalName || '').split(/\s+/);
    const suffixes = ['Jr.','Sr.','II','III','IV','M.D.','D.O.','PMHNP-BC','APRN','NP','FNP-BC','DNP','PhD','MSN'];
    let firstName = '', middleInit = '', lastName = '', suffix = '';
    if (nameParts.length >= 2) {
      firstName = nameParts[0];
      // Check if last part is a suffix
      const lastPart = nameParts[nameParts.length - 1];
      if (suffixes.some(s => lastPart.replace(/,/g,'').toUpperCase() === s.toUpperCase()) && nameParts.length >= 3) {
        suffix = lastPart.replace(/,/g,'');
        lastName = nameParts[nameParts.length - 2].replace(/,/g,'');
        if (nameParts.length > 3) middleInit = nameParts[1].charAt(0);
      } else {
        lastName = lastPart;
        if (nameParts.length > 2) middleInit = nameParts[1].charAt(0);
      }
    }

    // Parse address parts
    const addrLines = (profile.practiceAddress || '').split('\n').map(l => l.trim()).filter(Boolean);
    let addrLine1 = '', addrLine2 = '', addrCity = '', addrState = '', addrZip = '';
    if (addrLines.length >= 2) {
      addrLine1 = addrLines[0];
      // Last line should be "City, State ZIP"
      const lastLine = addrLines[addrLines.length - 1];
      const cityStateZip = lastLine.match(/^([^,]+),\s*([A-Z]{2})\s*(\d{5}[-\d]*)?/i);
      if (cityStateZip) {
        addrCity = cityStateZip[1].trim();
        addrState = cityStateZip[2].trim();
        addrZip = (cityStateZip[3] || '').trim();
      } else {
        addrCity = lastLine;
      }
      if (addrLines.length > 2) addrLine2 = addrLines[1];
    } else if (addrLines.length === 1) {
      addrLine1 = addrLines[0];
    }

    // ── Section 2A: Individual Information (page 6) ──
    setField('5-1', firstName);
    setField('5-2', middleInit);
    setField('5-3', lastName);
    setField('5-4', suffix);
    if (ssn) setField('5-10', ssn);
    setField('5-11', profile.dob || '');
    setField('5-12', profile.medicarePtan || '');  // PTAN
    setField('5-13', profile.npi1 || '');  // NPI Type 1
    setField('5-14', profile.degree1School || '');  // Medical/Professional School
    setField('5-15', (profile.degree1Date || '').replace(/.*(\d{4}).*/, '$1'));  // Year of Graduation

    // ── Section 2B: License/Certification (page 6) ──
    setField('5-16', profile.licenseNum || '');
    setField('5-17', profile.licenseExp || '');  // License effective date
    setField('5-18', profile.licenseState || '');
    setField('5-23', profile.dea || '');  // DEA Number
    setField('5-24', profile.deaExp || '');  // DEA Effective Date

    // Certification
    setField('5-19', profile.boardCert || '');  // Certification Number / name
    setField('5-20', profile.boardCertDate || '');  // Certification Effective Date
    setField('5-21', profile.boardCertEntity || '');  // Certifying Entity
    setField('5-22', 'All');  // State Where Issued (national cert — most are national)

    // ── Section 2D: Correspondence Address (page 7) ──
    setField('6-3', addrLine1);
    setField('6-4', addrLine2);
    setField('6-5', addrCity);
    setField('6-6', addrState);
    setField('6-7', addrZip);
    setField('6-8', profile.practicePhone || '');
    setField('6-9', profile.practiceFax || '');
    setField('6-10', profile.practiceEmail || profile.email || '');

    // ── Section 2G or 2H: Specialty (pages 8-9) ──
    const ptype = profile.providerType || '';
    const isPhysician = ptype === 'Physician (MD/DO)';

    if (isPhysician && profile.physicianSpecialty) {
      // Section 2G: Physician Specialty — these are text fields where you write P or S
      // Map common specialties to their field IDs
      const specialtyFieldMap = {
        'Addiction Medicine':'7-1', 'Allergy/Immunology':'7-4', 'Anesthesiology':'7-5',
        'Cardiovascular Disease':'7-8', 'Critical Care':'7-11', 'Dermatology':'7-13',
        'Emergency Medicine':'7-15', 'Endocrinology':'7-16', 'Family Medicine':'7-17',
        'Gastroenterology':'7-18', 'General Practice':'7-19', 'General Surgery':'7-20',
        'Geriatric Medicine':'7-21', 'Geriatric Psychiatry':'7-22',
        'Hematology/Oncology':'7-26', 'Hospice/Palliative Care':'7-28',
        'Hospitalist':'7-29', 'Infectious Disease':'7-30', 'Internal Medicine':'7-31',
        'Interventional Cardiology':'7-32', 'Interventional Pain Management':'7-33',
        'Medical Oncology':'7-37', 'Nephrology':'7-40', 'Neurology':'7-41',
        'Neuropsychiatry':'7-42', 'Neurosurgery':'7-43',
        'Obstetrics/Gynecology':'7-45', 'Ophthalmology':'7-46', 'Optometry':'7-47',
        'Orthopedic Surgery':'7-49', 'Otolaryngology':'7-51',
        'Pain Management':'7-52', 'Pathology':'7-53', 'Pediatric Medicine':'7-54',
        'Physical Medicine and Rehabilitation':'7-56', 'Plastic and Reconstructive Surgery':'7-57',
        'Podiatry':'7-58', 'Preventive Medicine':'7-59', 'Psychiatry':'7-60',
        'Pulmonary Disease':'7-61', 'Radiation Oncology':'7-62',
        'Rheumatology':'7-63', 'Sleep Medicine':'7-64', 'Sports Medicine':'7-65',
        'Thoracic Surgery':'7-68', 'Urology':'7-70', 'Vascular Surgery':'7-71'
      };
      const specField = specialtyFieldMap[profile.physicianSpecialty];
      if (specField) {
        setField(specField, 'P');  // P = Primary
      } else {
        // If not in map, use Undefined Physician Specialty
        setField('7-72', 'P');
        setField('7-72-1', profile.physicianSpecialty);
      }
    } else if (!isPhysician) {
      // Section 2H: Non-Physician Specialty Type
      const npSpecialtyMap = {
        'Nurse Practitioner': 'CheckBox34',
        'Clinical Nurse Specialist': 'CheckBox31',
        'Physician Assistant': 'CheckBox37',
        'Certified Registered Nurse Anesthetist': 'CheckBox30',
        'Certified Nurse Midwife': 'CheckBox29',
        'Clinical Social Worker': 'CheckBox32',
        'Psychologist, Clinical': 'CheckBox38',
        'Psychologist Billing Independently': 'CheckBox39',
        'Qualified Audiologist': 'CheckBox40',
        'Qualified Speech Language Pathologist': 'CheckBox41',
        'Occupational Therapist': 'CheckBox35',
        'Physical Therapist': 'CheckBox36',
        'Registered Dietitian or Nutrition Professional': 'CheckBox42',
        'Anesthesiology Assistant': 'CheckBox28',
        'Mass Immunization Roster Biller': 'CheckBox33'
      };
      if (npSpecialtyMap[ptype]) {
        checkBox(npSpecialtyMap[ptype]);
      } else if (ptype === 'Other') {
        checkBox('CheckBox43');  // Undefined Non-Physician
      }
    }

    // ── Section 2C: Accepting New Medicare Patients (page 6) ──
    if (profile.acceptingMedicare === 'Yes') checkBox('CheckBox5-11');
    if (profile.acceptingMedicare === 'No') checkBox('CheckBox5-12');

    // ── Section 3C: Final Adverse Legal Action History (page 11) ──
    const hasAdverse = ['discLicense','discCriminal','discPrivileges','discDea'].some(k => profile[k] === 'Yes — see details');
    if (hasAdverse) {
      checkBox('CheckBox10-1');  // Yes
    } else {
      checkBox('CheckBox10-2');  // No
    }

    // ── Section 4: Business Information routing (page 12) ──
    // "I DO have a private practice and ONLY render services in my own private practice"
    checkBox('CheckBox11-3');

    // ── Section 4A: IRS Registration Type (page 12) ──
    if (profile.bizIrsType === 'Proprietary') checkBox('CheckBox11-4');
    if (profile.bizIrsType === 'Non-Profit') checkBox('CheckBox11-5');
    if (profile.bizIrsType === 'Disregarded Entity') checkBox('CheckBox11-6');

    // ── Section 4A2: Business Adverse Legal Action (page 12) ──
    if (!hasAdverse) checkBox('CheckBox11-8');  // No

    // ── Section 4A: Business Information (page 12) ──
    setField('11-1', profile.practiceName || '');  // Legal Business Name
    setField('11-2', profile.ein || '');  // TIN
    setField('11-3', profile.medicarePtan || '');  // PTAN
    setField('11-4', profile.npi2 || '');  // NPI Type 2

    // ── Section 4B: Practice Location (page 13) ──
    setField('12-3', profile.practiceName || '');  // DBA Name
    setField('12-4', addrLine1);  // Address Line 1
    setField('12-5', addrLine2);  // Address Line 2
    setField('12-6', addrCity);
    setField('12-7', addrState);
    setField('12-8', addrZip);
    setField('12-9', profile.practicePhone || '');
    setField('12-10', profile.practiceFax || '');
    setField('12-11', profile.practiceEmail || profile.email || '');

    // ── Section 4B: Primary Practice Location (page 14) ──
    if (profile.primaryLocation === 'Yes') checkBox('CheckBox13-12');
    if (profile.primaryLocation === 'No') checkBox('CheckBox13-13');

    // ── Section 4B: Practice Location Type checkboxes (page 14) ──
    const locTypeMap = {
      'Ambulatory Surgical Center': 'CheckBox13-1',
      'Business Office for Administrative/Telehealth Use Only': 'CheckBox13-2',
      'Home Office for Administrative/Telehealth Use Only': 'CheckBox13-2-2',
      'Hospital/Hospital Department': 'CheckBox13-3',
      'Indian Health Services (IHS) or Tribal Facility': 'CheckBox13-4',
      'Private Office Setting': 'CheckBox13-5',
      'Retirement or Assisted Living Community': 'CheckBox13-6',
      'Skilled Nursing Facility or Other Nursing Facility': 'CheckBox13-7',
      'Other Health Care Facility': 'CheckBox13-8'
    };
    if (profile.practiceLocationType && locTypeMap[profile.practiceLocationType]) {
      checkBox(locTypeMap[profile.practiceLocationType]);
    }

    // ── Section 4C: Remittance — send to practice location ──
    checkBox('CheckBox13-9');  // Default: remittance to practice location

    // ── Section 4D: Medical Records Storage (page 15) ──
    if (profile.recordsAtPractice === 'Yes') {
      checkBox('CheckBox72');  // Records stored at practice location
    }
    if (profile.electronicRecords === 'Yes') {
      checkBox('CheckBox14-6');  // Yes electronic storage
      setField('14-8', profile.electronicRecordsSite || '');
    }
    if (profile.electronicRecords === 'No') {
      checkBox('CheckBox14-7');  // No electronic storage
    }

    // ── Section 6: Managing Employee — I am the managing employee (page 19) ──
    checkBox('CheckBox18-1');

    // ── Section 1A: Reason for submitting — New enrollee (page 5) ──
    checkBox('CheckBox1');  // "You are a new enrollee in Medicare"

    // ── Section 2B: Active License/Cert/DEA status checkboxes (page 6) ──
    if (profile.licenseNum) checkBox('CheckBox5-4');  // Active License checked
    if (profile.boardCert) checkBox('CheckBox5-6');   // Active Certification checked
    if (profile.dea) checkBox('CheckBox5-8-1');       // Active DEA Registration checked
    // Compact license
    if (profile.compactLicense === 'Yes') checkBox('CheckBox5-9');
    else checkBox('CheckBox5-10');  // No (default)
    setField('5-25', profile.licenseState || '');  // DEA State Where Issued

    // ── Section 2E: Medical Record Correspondence = same as 2D (page 7) ──
    checkBox('CheckBox6-2');  // "Check here if Medical Record Correspondence should be mailed to Correspondence Address in 2D"

    // ── Section 2K: NP/CNS — Not employed by SNF (page 10) ──
    // Only applies to Nurse Practitioners and Clinical Nurse Specialists
    if (ptype === 'Nurse Practitioner' || ptype === 'Clinical Nurse Specialist') {
      checkBox('CheckBox9-20');  // "Are you an employee of a SNF?" No
    }

    // ── Section 4B: Location PTAN (page 13) ──
    setField('12-12', profile.medicarePtan || '');

    // ── Section 8: Billing Agency — check N/A if self-billing (page 20) ──
    if (!profile.billingMethod || profile.billingMethod === 'Self-billing' || profile.billingMethod === 'Not yet decided') {
      checkBox('CheckBox19-1');  // "Check here if this section does not apply"
    }

    // ── Section 13: Contact Person — assign self (page 22) ──
    checkBox('CheckBox21-1');  // "Assign the individual listed in section 2A as the designated contact person"
    setField('21-2', firstName);
    setField('21-3', middleInit);
    setField('21-4', lastName);
    setField('21-5', suffix);
    setField('21-6', addrLine1);
    setField('21-7', addrLine2);
    setField('21-8', addrCity);
    setField('21-9', addrState);
    setField('21-10', addrZip);
    setField('21-11', profile.practicePhone || '');
    setField('21-12', profile.practiceFax || '');
    setField('21-13', profile.practiceEmail || profile.email || '');
    setField('21-14', 'Self');

    // ── Section 15B: Signature block — printed name (page 25) ──
    setField('24-1', firstName);
    setField('24-2', middleInit);
    setField('24-3', lastName);
    setField('24-5', suffix);

    // ── Section 12: Supporting Documentation checklist (page 21) ──
    // Check docs that a typical new PMHNP enrollee needs to submit
    checkBox('CheckBox20-3');  // CMS-460 (Participating Physician Agreement)
    checkBox('CheckBox20-4');  // CMS-588 (EFT Authorization)
    if (profile.bizStructure && profile.bizStructure !== 'Sole Proprietor') {
      checkBox('CheckBox20-6');  // IRS confirmation of TIN/LBN (for LLC/PLLC/PC/S-Corp)
    }
    if (profile.bizStructure === 'LLC' || profile.bizStructure === 'PLLC') {
      checkBox('CheckBox20-7');  // LLC Disregarded Entity confirmation
    }

    // Flatten form so fields appear as static text
    form.flatten();

    // Download
    const filledBytes = await pdfDoc.save();
    const blob = new Blob([filledBytes], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'CMS-855I-Filled-' + (profile.legalName || 'Provider').replace(/\s+/g, '_') + '.pdf';
    a.click();
    URL.revokeObjectURL(url);

    // Clear SSN
    if (ssnInput) ssnInput.value = '';
    if (btn) { btn.disabled = false; btn.textContent = 'Generate CMS-855I PDF'; }

    // Show post-generation summary
    showPdfSummary();

  } catch(err) {
    console.error('PDF generation failed:', err);
    alert('PDF generation failed: ' + err.message);
    if (btn) { btn.disabled = false; btn.textContent = 'Generate CMS-855I PDF'; }
  }
}

function buildManualStepsList() {
  const steps = [];
  const ptype = profile.providerType || '';
  const isPhysician = ptype === 'Physician (MD/DO)';

  // Always required manual steps
  steps.push({section:'Section 15B', task:'Sign and date the certification statement (page 24). This must be an original signature.'});

  // Conditional: Section 1A — we default to "new enrollee" but they may be revalidating
  steps.push({section:'Section 1A', task:'Verify the reason for submitting (page 4). We checked "New enrollee" — change if you are revalidating, reactivating, or reporting a change.'});

  // Provider type not set
  if (!ptype) {
    steps.push({section:'Section 2G/2H', task:'Set your Provider Type in the Vault so we can check the correct specialty box (Section 2G for physicians, Section 2H for non-physicians).'});
  }

  // Physician specialty not set
  if (isPhysician && !profile.physicianSpecialty) {
    steps.push({section:'Section 2G', task:'Enter your Physician Specialty in the Vault so we can mark it in Section 2G on the form.'});
  }

  // Conditional: Section 4 routing
  steps.push({section:'Section 4', task:'Verify the business routing checkbox (page 11). We checked "I have a private practice and ONLY render services in my own practice." Change if you also reassign benefits to a group.'});

  // Conditional: first Medicare patient date
  if (!profile.medicarePtan) {
    steps.push({section:'Section 4B', task:'Enter the date you saw or will see your first Medicare patient at your practice location (page 12, field 12-13).'});
  }

  // Conditional: sole proprietor vs LLC
  if (profile.bizStructure === 'Sole Proprietor') {
    steps.push({section:'Section 4A3', task:'You are a sole proprietor. Choose whether Medicare payments go to your SSN or EIN (page 12), and check the correct box.'});
  }

  // Billing company info
  if (profile.billingMethod === 'Billing Company') {
    steps.push({section:'Section 8', task:'Fill in your billing agency/agent information (page 19). We left this blank because you use a billing company.'});
  }

  // Supporting docs
  steps.push({section:'Section 12', task:'Gather and submit supporting documents with the application: CMS-460 (participating agreement), CMS-588 (EFT authorization with voided check), IRS CP-575 (if LLC/PLLC/PC), and copies of license and certification.'});

  // EFT
  steps.push({section:'Separate form', task:'Complete CMS-588 (Electronic Funds Transfer Authorization) as a separate attachment with a voided check or bank letter.'});

  // Participating provider
  steps.push({section:'Separate form', task:'Complete CMS-460 (Participating Physician or Supplier Agreement) if you want to be a participating provider.'});

  // Mail to MAC
  steps.push({section:'Submission', task:'Print, sign, and mail the completed application with all supporting documents to your designated MAC. Find your MAC at cms.gov/Medicare/Provider-Enrollment-and-Certification.'});

  return steps;
}

function buildSkippableSections() {
  const skips = [];
  const ptype = profile.providerType || '';
  const isPhysician = ptype === 'Physician (MD/DO)';
  const isNPorCNS = ptype === 'Nurse Practitioner' || ptype === 'Clinical Nurse Specialist';
  const isPTOT = ptype === 'Physical Therapist' || ptype === 'Occupational Therapist';
  const isPsych = ptype === 'Psychologist, Clinical' || ptype === 'Psychologist Billing Independently';

  // Section 2F — Resident Information
  skips.push({section:'Section 2F', reason:'Resident Information. Only for individuals currently in an approved medical residency program.', pages:'pages 6-7'});

  // Section 2G vs 2H — one or the other
  if (!isPhysician) {
    skips.push({section:'Section 2G', reason:'Physician Specialty. Only for physicians (MD/DO). Your provider type uses Section 2H instead, which we already checked.', pages:'pages 7-8'});
  }
  if (isPhysician) {
    skips.push({section:'Section 2H', reason:'Non-Physician Specialty Type. Only for non-physician practitioners. Your provider type uses Section 2G instead.', pages:'page 8'});
  }

  // Section 2I — Psychologist
  if (!isPsych) {
    skips.push({section:'Section 2I', reason:'Psychologist Information. Only applies to clinical psychologists and psychologists billing independently.', pages:'page 8'});
  }

  // Section 2J — PT/OT
  if (!isPTOT) {
    skips.push({section:'Section 2J', reason:'Physical/Occupational Therapist Information. Only applies to PTs and OTs in private practice.', pages:'page 9'});
  }

  // Section 2K — NP/CNS SNF details
  if (isNPorCNS) {
    skips.push({section:'Section 2K details', reason:'SNF employment details. We checked "No" for SNF employment. Leave the SNF name/address fields blank unless you work at a skilled nursing facility.', pages:'page 10'});
  } else if (!isNPorCNS) {
    skips.push({section:'Section 2K', reason:'Clinical Nurse Specialist/Nurse Practitioner SNF Information. Only applies to NPs and CNSs.', pages:'page 10'});
  }

  // Intentionally blank sections
  skips.push({section:'Sections 5, 7, 9, 10, 11', reason:'Intentionally left blank by CMS. Nothing to fill out.', pages:'pages 17-19'});

  // Section 14
  skips.push({section:'Section 14', reason:'Penalties for Falsifying Information. Read-only reference section, nothing to fill out.', pages:'page 22'});

  // Section 2E — Medical Record Correspondence
  skips.push({section:'Section 2E', reason:'Medical Record Correspondence Address. We checked the box to use your correspondence address from Section 2D. Leave this blank.', pages:'page 7'});

  // Section 4F — Reassignment
  skips.push({section:'Section 4F', reason:'Reassignment of Benefits. Skip if you are a solo practitioner who does not reassign benefits to a group or organization. Complete manually if you DO reassign.', pages:'pages 16-17'});

  // Section 4C — Remittance
  skips.push({section:'Section 4C', reason:'Remittance Notices/Special Payments Mailing Address. We checked the box to send remittance to your practice location. Leave blank unless you want them sent elsewhere.', pages:'page 13'});

  // Section 4D — Records storage
  skips.push({section:'Section 4D details', reason:'Medical Records Storage Address. We checked that records are stored at your practice location. Leave the storage facility fields blank unless you use a separate location.', pages:'page 14'});

  // Section 4E — Home visits
  skips.push({section:'Section 4E', reason:'Rendering Services in Patients\' Homes. Skip unless you make house calls. Most telehealth-only and office-based providers skip this.', pages:'page 15'});

  // Section 6 — Managing employee
  skips.push({section:'Section 6 details', reason:'Managing Employee detail fields. We checked "I am the managing employee." Leave the employee information fields blank.', pages:'page 18'});

  // Section 8 — Billing agency
  if (!profile.billingMethod || profile.billingMethod === 'Self-billing' || profile.billingMethod === 'Not yet decided') {
    skips.push({section:'Section 8', reason:'Billing Agency/Agent Information. We checked "does not apply" because you self-bill. Update if you start using a billing company.', pages:'page 19'});
  }

  // Section 15C — Delegated official
  skips.push({section:'Section 15C', reason:'Delegated/Authorized Official Signature. Only needed for reassignment of benefits in Section 4F. Solo practitioners signing their own application skip this.', pages:'page 24'});

  return skips;
}

function showPdfSummary() {
  const container = document.getElementById('panel-ghost');
  // Remove any existing summary
  const existing = document.getElementById('pdf-post-summary');
  if (existing) existing.remove();

  const steps = buildManualStepsList();

  let html = '<div id="pdf-post-summary" style="margin-top:24px;padding:20px;background:rgba(42,171,184,0.06);border:1px solid rgba(42,171,184,0.2);border-radius:var(--radius)">';
  html += '<h4 style="font-family:var(--font-display);color:var(--teal);margin-bottom:12px">PDF Downloaded — What You Still Need to Do</h4>';
  html += '<p style="font-size:0.85rem;color:var(--cream-dim);margin-bottom:16px;line-height:1.6">We auto-filled 93 fields across the CMS-855I. The following items require your manual attention:</p>';

  steps.forEach((s, i) => {
    html += '<div style="display:flex;gap:10px;margin-bottom:10px;align-items:flex-start">';
    html += '<span style="flex-shrink:0;width:22px;height:22px;border-radius:50%;background:var(--navy-light);color:var(--teal);font-size:0.75rem;display:flex;align-items:center;justify-content:center;font-weight:600;margin-top:1px">' + (i+1) + '</span>';
    html += '<div style="font-size:0.85rem;line-height:1.5">';
    html += '<span style="color:var(--teal);font-weight:600">' + s.section + ':</span> ';
    html += '<span style="color:var(--cream)">' + s.task + '</span>';
    html += '</div></div>';
  });

  html += '</div>';

  // Skippable sections
  html += '<div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--rule)">';
  html += '<details>';
  html += '<summary style="cursor:pointer;color:var(--cream);font-size:0.85rem;font-weight:600;padding:6px 0">Sections you can skip entirely (' ;
  var skipList = buildSkippableSections();
  html += skipList.length + ' sections)</summary>';
  html += '<div style="padding:12px 0">';
  skipList.forEach(function(s) {
    html += '<div style="margin-bottom:10px;font-size:0.82rem;line-height:1.5">';
    html += '<span style="color:var(--cream);font-weight:500">' + s.section + '</span> <span style="color:var(--cream-dim);font-size:0.78rem">(' + s.pages + ')</span>';
    html += '<br><span style="color:var(--cream-dim)">' + s.reason + '</span>';
    html += '</div>';
  });
  html += '</div></details>';
  html += '</div>';

  html += '</div>';
  container.insertAdjacentHTML('beforeend', html);

  // Scroll to it
  document.getElementById('pdf-post-summary').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ── Update Ghost Pilot to include PDF button ──────────────────────────
const origRenderGhostPilot = renderGhostPilot;
renderGhostPilot = function() {
  origRenderGhostPilot();
  if (activeGhostView === 'medicare') {
    const container = document.getElementById('panel-ghost');
    let pdfHtml = '<div style="margin-top:28px;padding-top:24px;border-top:1px solid var(--rule)">';
    pdfHtml += '<h4 style="font-family:var(--font-display);color:var(--white);margin-bottom:8px">Generate Pre-Filled CMS-855I PDF</h4>';
    pdfHtml += '<p style="font-size:0.85rem;color:var(--cream-dim);margin-bottom:16px;line-height:1.6">Downloads the official CMS-855I form with your Vault data auto-filled into the real form fields. Your SSN is entered below, injected directly into the PDF in your browser, and never sent to any server.</p>';

    // What gets filled vs what doesn't
    pdfHtml += '<details style="margin-bottom:18px">';
    pdfHtml += '<summary style="cursor:pointer;color:var(--teal);font-size:0.85rem;font-weight:600;padding:8px 0">What the PDF auto-fills vs. what you will still need to complete</summary>';
    pdfHtml += '<div style="padding:12px 0;font-size:0.82rem;line-height:1.6;color:var(--cream)">';

    pdfHtml += '<p style="color:var(--teal);font-weight:600;margin-bottom:6px">Auto-filled from your Vault (93 fields):</p>';
    pdfHtml += '<p style="color:var(--cream-dim);margin-bottom:14px">';
    pdfHtml += 'Section 1A (enrollment reason) · Section 2A (name, DOB, SSN, NPI, PTAN, school, graduation year) · ';
    pdfHtml += 'Section 2B (license, certification, DEA, compact license status) · Section 2C (accepting new patients) · ';
    pdfHtml += 'Section 2D (correspondence address, phone, fax, email) · Section 2E (medical records address = same as 2D) · ';
    pdfHtml += 'Section 2H (Nurse Practitioner checked) · Section 2K (not employed by SNF) · ';
    pdfHtml += 'Section 3C (adverse legal action history) · Section 4A (business name, TIN, PTAN, NPI Type 2, IRS type) · ';
    pdfHtml += 'Section 4B (practice location, address, phone, fax, email, location type, primary location) · ';
    pdfHtml += 'Section 4C (remittance to practice location) · Section 4D (records storage, electronic records) · ';
    pdfHtml += 'Section 6 (managing employee = self) · Section 8 (billing agency N/A if self-billing) · ';
    pdfHtml += 'Section 12 (supporting docs checklist) · Section 13 (contact person = self) · Section 15B (printed name)';
    pdfHtml += '</p>';

    pdfHtml += '<p style="color:var(--teal);font-weight:600;margin-bottom:6px">You will still need to complete manually:</p>';
    var manualSteps = buildManualStepsList();
    manualSteps.forEach(function(s) {
      pdfHtml += '<p style="color:var(--cream-dim);margin-bottom:6px"><span style="color:var(--cream);font-weight:500">' + s.section + ':</span> ' + s.task + '</p>';
    });

    pdfHtml += '</div></details>';

    // Skippable sections preview
    pdfHtml += '<details style="margin-bottom:18px">';
    pdfHtml += '<summary style="cursor:pointer;color:var(--teal);font-size:0.85rem;font-weight:600;padding:8px 0">Sections you can skip entirely</summary>';
    pdfHtml += '<div style="padding:12px 0;font-size:0.82rem;line-height:1.6;color:var(--cream)">';
    var skipSections = buildSkippableSections();
    skipSections.forEach(function(s) {
      pdfHtml += '<div style="margin-bottom:10px">';
      pdfHtml += '<span style="color:var(--cream);font-weight:500">' + s.section + '</span> <span style="color:var(--cream-dim);font-size:0.78rem">(' + s.pages + ')</span>';
      pdfHtml += '<br><span style="color:var(--cream-dim)">' + s.reason + '</span>';
      pdfHtml += '</div>';
    });
    pdfHtml += '</div></details>';

    pdfHtml += '<div class="ssn-prompt field-group">';
    pdfHtml += '<label>Social Security Number (for PDF only)</label>';
    pdfHtml += '<input type="password" id="ssn-input" placeholder="XXX-XX-XXXX" maxlength="11">';
    pdfHtml += '<div class="ssn-note">Your SSN is processed locally in your browser and is never stored or transmitted.</div>';
    pdfHtml += '</div>';
    pdfHtml += '<button class="generate-pdf-btn" onclick="generateMedicarePDF()">Generate CMS-855I PDF</button>';
    pdfHtml += '</div>';
    container.insertAdjacentHTML('beforeend', pdfHtml);
  }
};

const origSwitchTab = switchTab;
switchTab = function(tabId) {
  origSwitchTab(tabId);
  if (tabId === 'mapper') renderMapper();
  if (tabId === 'pulse') renderPulse();
};

loadProfile();

// Deep link support: /credentialing-hub?tab=pulse
(function() {
  var params = new URLSearchParams(window.location.search);
  var tab = params.get('tab');
  if (tab && ['vault','ghost','mapper','pulse'].indexOf(tab) !== -1) {
    switchTab(tab);
  }
})();
