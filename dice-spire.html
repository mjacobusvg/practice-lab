<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Dice Spire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e18; --panel:#121a2b; --card:#1a2338; --card-hi:#222d47;
  --ink:#e9eef8; --ink-dim:#9aa5bd; --ink-faint:#6b7791;
  --line:rgba(255,255,255,0.08); --line-hi:rgba(255,255,255,0.20);
  --gold:#f0b429; --red:#ef5350; --blue:#5aa9f5; --green:#3ddc97;
  --violet:#a78bfa; --lime:#a3e635; --orange:#fb923c; --pink:#f472b6; --cyan:#38bdf8;
  --r:10px; --r-lg:16px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:
    radial-gradient(1100px 700px at 50% -10%, #1b2440 0%, transparent 60%),
    radial-gradient(800px 500px at 90% 110%, #201a34 0%, transparent 60%),
    var(--bg);
  color:var(--ink);
  font-family:'DM Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  font-size:15px; line-height:1.45;
  overflow-x:hidden;
}
h1,h2,h3,.serif{font-family:'DM Serif Display',Georgia,serif;font-weight:400;letter-spacing:.2px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:16px 16px 40px}
.hidden{display:none !important}

/* ---------- generic ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 18px;border-radius:var(--r);border:1px solid var(--line-hi);
  background:linear-gradient(180deg,#232e4a,#182135);
  font-weight:600;font-size:14px;letter-spacing:.3px;
  transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
}
.btn:hover:not(:disabled){background:linear-gradient(180deg,#2c3a5d,#1d2743);transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(0)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:linear-gradient(180deg,#f0b429,#c98d12);color:#1a1205;border-color:#f7cf6b}
.btn.primary:hover:not(:disabled){background:linear-gradient(180deg,#ffc94a,#d89a17)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.danger{border-color:rgba(239,83,80,.5);color:#ffb3b1}
.btn.sm{padding:6px 12px;font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px}
.muted{color:var(--ink-dim)}
.faint{color:var(--ink-faint)}
.tiny{font-size:12px}
.center{text-align:center}
.row{display:flex;gap:10px;align-items:center}
.row.wrap-r{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sep{height:1px;background:var(--line);margin:14px 0}

/* ---------- top bar ---------- */
#topbar{
  position:sticky;top:0;z-index:40;backdrop-filter:blur(10px);
  background:rgba(10,14,24,.82);border-bottom:1px solid var(--line);
}
#topbar .inner{max-width:1080px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:'DM Serif Display',serif;font-size:19px;letter-spacing:.5px}
.brand .d{color:var(--gold)}
.stat{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-dim)}
.stat b{color:var(--ink);font-weight:700}
.relic-bar{display:flex;gap:5px;flex-wrap:wrap;margin-left:auto}
.relic{
  width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:15px;
  background:var(--card);border:1px solid var(--line-hi);cursor:help;position:relative;
}
.relic:hover{background:var(--card-hi);border-color:var(--gold)}

/* ---------- tooltip ---------- */
#tip{
  position:fixed;z-index:200;max-width:260px;pointer-events:none;opacity:0;
  background:#0d1322;border:1px solid var(--line-hi);border-radius:10px;padding:9px 11px;
  font-size:12.5px;line-height:1.4;box-shadow:0 12px 34px rgba(0,0,0,.6);transition:opacity .1s
}
#tip.on{opacity:1}
#tip b{display:block;margin-bottom:3px;font-size:13px}

/* ---------- title ---------- */
.title-hero{text-align:center;padding:40px 0 22px}
.title-hero h1{font-size:clamp(40px,9vw,70px);line-height:1;letter-spacing:1px}
.title-hero h1 span{color:var(--gold)}
.title-hero p{color:var(--ink-dim);margin-top:12px;font-size:15px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;border:1px solid var(--line-hi);font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-dim)}

.hero-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:12px}
.hero-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;
  cursor:pointer;transition:.14s;position:relative;
}
.hero-card:hover{border-color:var(--line-hi);background:var(--card-hi)}
.hero-card.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold), 0 8px 26px rgba(240,180,41,.13)}
.hero-card .hd{display:flex;gap:11px;align-items:center}
.hero-card .av{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:#0f1729;border:1px solid var(--line-hi);flex:none}
.hero-card .nm{font-family:'DM Serif Display',serif;font-size:19px}
.hero-card .hp{font-size:12px;color:var(--ink-dim)}
.hero-card .desc{font-size:12.5px;color:var(--ink-dim);margin:9px 0 10px;min-height:34px}

/* ---------- die faces ---------- */
.faces{display:flex;gap:5px;flex-wrap:wrap}
.face{
  width:38px;height:38px;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#0f1729;border:1px solid var(--line-hi);line-height:1;flex:none;position:relative;
}
.face .ic{font-size:14px}
.face .v{font-size:12px;font-weight:700;margin-top:1px}
.face.blank{opacity:.42}
.face.big{width:52px;height:52px;border-radius:11px}
.face.big .ic{font-size:19px}
.face.big .v{font-size:15px}
.face.pickable{cursor:pointer}
.face.pickable:hover{border-color:var(--gold);background:#151f36}
.face.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}

/* ---------- map ---------- */
.map-shell{position:relative;background:linear-gradient(180deg,#0e1424,#0b1020);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.map-scroll{overflow-y:auto;max-height:min(70vh,660px);position:relative}
.map-inner{position:relative;width:100%}
.map-inner svg{position:absolute;inset:0;width:100%;height:100%}
.node{
  position:absolute;width:46px;height:46px;transform:translate(-50%,-50%);border-radius:50%;
  display:grid;place-items:center;font-size:20px;background:#141d31;
  border:2px solid rgba(255,255,255,.14);transition:.15s;z-index:2;
}
.node.done{opacity:.4;filter:grayscale(.7)}
.node.avail{border-color:var(--gold);box-shadow:0 0 0 4px rgba(240,180,41,.14),0 0 18px rgba(240,180,41,.25);cursor:pointer;animation:pulse 2.1s ease-in-out infinite}
.node.avail:hover{transform:translate(-50%,-50%) scale(1.13)}
.node.here{border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.14)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(240,180,41,.13),0 0 16px rgba(240,180,41,.2)}50%{box-shadow:0 0 0 7px rgba(240,180,41,.05),0 0 26px rgba(240,180,41,.35)}}
.floor-label{position:absolute;left:6px;transform:translateY(-50%);font-size:10.5px;color:var(--ink-faint);z-index:1}

/* ---------- combat ---------- */
.field{display:flex;flex-direction:column;gap:14px}
.enemy-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;min-height:150px;align-items:flex-end}
.unit{
  width:150px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:10px;position:relative;transition:.14s;
}
.unit.targetable{cursor:pointer;border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 20px rgba(240,180,41,.16)}
.unit.targetable:hover{transform:translateY(-3px);background:var(--card-hi)}
.unit.dead{opacity:.28;filter:grayscale(1)}
.unit.hit{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}22%{transform:translateX(-6px)}55%{transform:translateX(5px)}80%{transform:translateX(-2px)}}
.unit .av{font-size:30px;text-align:center;line-height:1.1}
.unit .nm{font-size:13px;font-weight:700;text-align:center;margin-top:2px}
.hpbar{height:9px;border-radius:5px;background:#0b1120;border:1px solid var(--line);overflow:hidden;margin-top:6px;position:relative}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#e0433f,#ef5350);transition:width .28s ease}
.unit.ally .hpbar i{background:linear-gradient(90deg,#28a06c,#3ddc97)}
.hptext{font-size:11px;color:var(--ink-dim);text-align:center;margin-top:3px;font-variant-numeric:tabular-nums}
.badges{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:5px;min-height:19px}
.badge{font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:6px;background:#0d1524;border:1px solid var(--line-hi);display:inline-flex;gap:3px;align-items:center}
.intent{
  display:flex;align-items:center;justify-content:center;gap:5px;font-size:12px;font-weight:700;
  background:#0d1524;border:1px solid var(--line-hi);border-radius:8px;padding:4px 7px;margin-bottom:7px;
}
.intent .tgt{font-size:10px;color:var(--ink-faint);font-weight:600}

.tray{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px}
.dice-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start;justify-content:center}
.die{
  width:70px;border-radius:12px;background:linear-gradient(180deg,#232e4a,#151d30);
  border:1px solid var(--line-hi);padding:7px 5px;text-align:center;cursor:pointer;transition:.13s;position:relative;
}
.die:hover:not(.used){transform:translateY(-3px);border-color:var(--line-hi)}
.die.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 6px 22px rgba(240,180,41,.22);transform:translateY(-4px)}
.die.marked{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(56,189,248,.6)}
.die.used{opacity:.3;cursor:default}
.die .who{font-size:10px;color:var(--ink-faint);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.die .glyph{font-size:24px;line-height:1.05}
.die .val{font-size:15px;font-weight:700;margin-top:1px}
.die .lab{font-size:10px;color:var(--ink-dim);margin-top:2px}
.die.roll{animation:tumble .34s ease}
@keyframes tumble{0%{transform:rotate(-16deg) scale(.82);opacity:.35}60%{transform:rotate(7deg) scale(1.05)}100%{transform:rotate(0) scale(1)}}

.log{height:96px;overflow-y:auto;font-size:12.5px;color:var(--ink-dim);background:#0c1220;border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
.log div{padding:1px 0}
.log .hl{color:var(--ink)}

.float{position:fixed;z-index:120;pointer-events:none;font-weight:800;font-size:20px;text-shadow:0 2px 8px rgba(0,0,0,.8);animation:floaty .9s ease-out forwards}
@keyframes floaty{0%{opacity:0;transform:translate(-50%,0) scale(.7)}18%{opacity:1;transform:translate(-50%,-10px) scale(1.14)}100%{opacity:0;transform:translate(-50%,-52px) scale(1)}}

/* ---------- modal ---------- */
.veil{position:fixed;inset:0;z-index:100;background:rgba(5,8,15,.78);backdrop-filter:blur(5px);display:grid;place-items:center;padding:18px;overflow-y:auto}
.modal{width:min(660px,100%);background:var(--panel);border:1px solid var(--line-hi);border-radius:20px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.6);max-height:92vh;overflow-y:auto}
.modal h2{font-size:26px;margin-bottom:6px}
.opt{
  width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 14px;transition:.13s;display:block;
}
.opt:hover:not(:disabled){background:var(--card-hi);border-color:var(--gold);transform:translateX(3px)}
.opt:disabled{opacity:.42;cursor:not-allowed}
.opt .t{font-weight:700;font-size:14.5px}
.opt .s{font-size:12.5px;color:var(--ink-dim);margin-top:2px}
.reward-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.reward{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px;cursor:pointer;transition:.13s;text-align:center}
.reward:hover{border-color:var(--gold);background:var(--card-hi);transform:translateY(-2px)}
.reward .nm{font-weight:700;margin-top:7px;font-size:14px}
.reward .ds{font-size:12px;color:var(--ink-dim);margin-top:3px}

.spell-row{display:flex;gap:8px;flex-wrap:wrap}
.spell{
  border:1px solid var(--line-hi);border-radius:10px;padding:7px 11px;background:var(--card);
  font-size:12.5px;font-weight:600;transition:.13s;text-align:left;min-width:120px;
}
.spell:hover:not(:disabled){border-color:var(--violet);background:var(--card-hi)}
.spell:disabled{opacity:.36;cursor:not-allowed}
.spell.sel{border-color:var(--violet);box-shadow:0 0 0 1px var(--violet)}
.spell .c{color:var(--violet);font-weight:700}
.spell .d{display:block;font-size:11px;color:var(--ink-dim);font-weight:500}

@media(max-width:640px){
  .wrap{padding:12px 12px 32px}
  .unit{width:132px}
  .die{width:64px}
  .enemy-row{gap:8px}
}
</style>
</head>
<body>
<div id="topbar" class="hidden"><div class="inner" id="topbar-inner"></div></div>
<div class="wrap" id="app"></div>
<div id="tip"></div>
<div id="fx"></div>
<script>
"use strict";
/* ============================================================================
   DICE SPIRE
   A dice-tactics roguelike: Slice & Dice's roll-and-assign combat inside a
   Slay the Spire branching run. The "deck" is the party's dice -- a die has
   exactly six sides, so every face you gain is also a face you lose.
   ========================================================================== */

/* ---------------------------------------------------------------- utilities */
const rnd  = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const el = id => document.getElementById(id);
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];} return a; }
function sample(a, n){ return shuffle(a).slice(0, n); }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
let _uid = 0; const uid = () => ++_uid;

/* ------------------------------------------------------------- face library */
/* target: enemy | allEnemies | ally | allAllies | self | none                */
const KIND = {
  dmg:      {name:'Strike',  ic:'⚔️', col:'var(--red)',    target:'enemy',      desc:v=>`Deal ${v} damage.`},
  dmgAll:   {name:'Cleave',  ic:'🔥', col:'var(--orange)', target:'allEnemies', desc:v=>`Deal ${v} damage to every enemy and set them all burning for 1.`},
  burn:     {name:'Ignite',  ic:'🕯️', col:'var(--orange)', target:'enemy',      desc:v=>`Set an enemy burning for ${v}. Fire grows by 1 each round and spreads.`},
  shield:   {name:'Shield',  ic:'🛡️', col:'var(--blue)', target:'ally',   desc:v=>`Give an ally ${v} shield.`},
  shieldAll:{name:'Aegis',   ic:'✨',       col:'var(--cyan)',   target:'allAllies',  desc:v=>`Give every hero ${v} shield.`},
  heal:     {name:'Mend',    ic:'❤️', col:'var(--green)',  target:'ally',       desc:v=>`Heal an ally for ${v} and clear 1 poison.`},
  poison:   {name:'Venom',   ic:'☠️', col:'var(--lime)',   target:'enemy',      desc:v=>`Apply ${v} poison.`},
  stun:     {name:'Stun',    ic:'⚡',       col:'var(--gold)',   target:'enemy',      desc:v=>`Stun for ${v} turn${v>1?'s':''}.`},
  mana:     {name:'Focus',   ic:'🔮', col:'var(--violet)', target:'self',       desc:v=>`Gain ${v} mana.`},
  power:    {name:'Empower', ic:'💢', col:'var(--pink)',   target:'ally',       desc:v=>`Give an ally +${v} power for this fight.`},
  blank:    {name:'Blank',   ic:'·',       col:'var(--ink-faint)', target:'none',    desc:()=>`Nothing happens.`}
};
const F = (k, v = 0) => ({ k, v });
const faceLabel = f => f.k === 'blank' ? 'Blank' : `${KIND[f.k].name}${f.v ? ' ' + f.v : ''}`;

/* ------------------------------------------------------------------- heroes */
const HEROES = [
  { key:'vanguard', name:'Vanguard', av:'🛡️', hp:24,
    blurb:'A wall with a sword arm. Soaks the hits nobody else survives.',
    faces:[F('shield',3),F('shield',2),F('shieldAll',1),F('dmg',3),F('mana',1),F('blank')], spell:'bulwark' },
  { key:'duelist', name:'Duelist', av:'🗡️', hp:15,
    blurb:'Enormous damage, zero defence, and two sides of pure regret.',
    faces:[F('dmg',5),F('dmg',4),F('dmg',3),F('mana',1),F('blank'),F('blank')], spell:'finisher' },
  { key:'warden', name:'Warden', av:'🌿', hp:18,
    blurb:'Keeps the party upright long enough for the maths to work.',
    faces:[F('heal',3),F('heal',2),F('shield',2),F('dmg',2),F('mana',1),F('blank')], spell:'mend' },
  { key:'pyromancer', name:'Pyromancer', av:'🔥', hp:14,
    blurb:'Answers crowds. Her fire does little on impact and a great deal afterwards.',
    faces:[F('dmgAll',2),F('burn',2),F('dmg',3),F('mana',2),F('mana',1),F('blank')], spell:'conflag' },
  { key:'venomist', name:'Venomist', av:'⚗️', hp:16,
    blurb:'Patient. Poison ignores shields and does not care how big you are.',
    faces:[F('poison',3),F('poison',2),F('dmg',3),F('mana',1),F('stun',1),F('blank')], spell:'miasma' },
  { key:'herald', name:'Herald', av:'📯', hp:17,
    blurb:'Makes everyone else better. Terrifying once the fight runs long.',
    faces:[F('power',1),F('power',1),F('shield',3),F('heal',2),F('mana',1),F('blank')], spell:'rally' }
];

/* ------------------------------------------------------------------ enemies */
/* moves: attack | attackAll | block | buff | heal | poison  (v scales by act) */
const BESTIARY = [
  { key:'rat',     name:'Gutter Rat',   av:'🐀', hp:7,  acts:[1],     dmgW:0.85,
    moves:[{k:'attack',v:4},{k:'attack',v:3},{k:'block',v:3}] },
  { key:'bat',     name:'Cave Bat',     av:'🦇', hp:7,  acts:[1,2],   dmgW:0.8,
    moves:[{k:'attackAll',v:2},{k:'attack',v:4},{k:'attack',v:3}] },
  { key:'slime',   name:'Acid Slime',   av:'🧪', hp:11, acts:[1,2],   dmgW:1,
    moves:[{k:'attack',v:4},{k:'poison',v:2},{k:'attack',v:4}] },
  { key:'bandit',  name:'Cutpurse',     av:'🗡️', hp:10, acts:[1,2], dmgW:1.1,
    moves:[{k:'attack',v:5},{k:'block',v:4},{k:'attack',v:4}] },
  { key:'cultist', name:'Cultist',      av:'🕯️', hp:9,  acts:[1,2], dmgW:1,
    moves:[{k:'buff',v:2},{k:'attack',v:4},{k:'attack',v:4}] },
  { key:'shieldman',name:'Shieldbearer',av:'🪖', hp:12, acts:[1,2],   dmgW:0.95,
    moves:[{k:'block',v:5},{k:'attack',v:5},{k:'attack',v:4}] },
  { key:'houndm',  name:'Howling Hound',av:'🐺', hp:14, acts:[2,3],   dmgW:1.2,
    moves:[{k:'attack',v:7},{k:'attack',v:7},{k:'buff',v:2}] },
  { key:'spider',  name:'Web Spinner',  av:'🕷️', hp:16, acts:[2,3], dmgW:0.9,
    moves:[{k:'poison',v:3},{k:'attackAll',v:3},{k:'attack',v:6}] },
  { key:'golem',   name:'Rubble Golem', av:'🗿', hp:24, acts:[2,3],   dmgW:1,
    moves:[{k:'block',v:8},{k:'attack',v:9},{k:'attack',v:6}] },
  { key:'priest',  name:'Bone Priest',  av:'💀', hp:18, acts:[2,3],   dmgW:1,
    moves:[{k:'heal',v:7},{k:'attack',v:7},{k:'buff',v:2}] },
  { key:'knight',  name:'Ashen Knight', av:'⚔️', hp:22, acts:[3],     dmgW:1.25,
    moves:[{k:'attack',v:10},{k:'block',v:9},{k:'attack',v:8}] },
  { key:'wraith',  name:'Wraith',       av:'👻', hp:19, acts:[3],     dmgW:1.15,
    moves:[{k:'attackAll',v:5},{k:'attack',v:9},{k:'poison',v:4}] }
];
const ELITES = [
  { key:'ogre',   name:'Bridge Ogre',   av:'👹', hp:30, elite:true, dmgW:1.25,
    moves:[{k:'attack',v:9},{k:'attackAll',v:4},{k:'block',v:7}] },

/* -------------------------------------------------------- map generation ---
   Slay the Spire's approach: walk several independent paths from the bottom
   floor to the top, each drifting at most one slot per step. The union of the
   paths is the map, which guarantees every node is reachable and every node
   leads somewhere.                                                          */
const FLOORS = 17;         /* index 0..16; the top floor is always the boss   */
const SLOTS  = 5;
const PATHS  = 4;
/* landmarks, placed proportionally so they stay sensible if FLOORS changes */
const TREASURE_FLOOR = Math.round((FLOORS - 1) * 0.30);
const MID_REST       = Math.round((FLOORS - 1) * 0.50);
const SHOP_FLOOR     = Math.round((FLOORS - 1) * 0.70);

function buildMap(){
  const nodes = {};                       /* "floor,slot" -> node            */
  const key = (f,s) => f + ',' + s;
  const edges = new Set();

  for(let p = 0; p < PATHS; p++){
    let slot = rnd(SLOTS);
    for(let f = 0; f < FLOORS - 1; f++){
      if(!nodes[key(f,slot)]) nodes[key(f,slot)] = { floor:f, slot, type:null, seen:false, done:false };
      let next = f === FLOORS - 2 ? 2 : clamp(slot + (rnd(3) - 1), 0, SLOTS - 1);
      if(!nodes[key(f+1,next)]) nodes[key(f+1,next)] = { floor:f+1, slot:next, type:null, seen:false, done:false };
      edges.add(key(f,slot) + '>' + key(f+1,next));
      slot = next;
    }
  }
  /* the boss sits alone on the top floor */
  Object.keys(nodes).forEach(k => { if(nodes[k].floor === FLOORS - 1) delete nodes[k]; });
  nodes[key(FLOORS-1,2)] = { floor:FLOORS-1, slot:2, type:'boss', seen:false, done:false };
  [...edges].forEach(e => {
    const [,to] = e.split('>');
    if(!nodes[to]) edges.delete(e);
  });

  /* type assignment */
  const list = Object.values(nodes).sort((a,b) => a.floor - b.floor || a.slot - b.slot);
  for(const n of list){
    if(n.type) continue;
    if(n.floor === 0)            { n.type = 'combat'; continue; }
    if(n.floor === FLOORS - 2)   { n.type = 'rest';   continue; }
    if(n.floor === TREASURE_FLOOR){ n.type = 'treasure'; continue; }
    if(n.floor === SHOP_FLOOR)   { n.type = 'shop';   continue; }
    if(n.floor === MID_REST)     { n.type = 'rest';   continue; }
    const r = Math.random();
    if(n.floor >= 3 && r < 0.14)      n.type = 'elite';
    else if(r < 0.32)                 n.type = 'event';
    else if(r < 0.38)                 n.type = 'rest';
    else if(r < 0.43)                 n.type = 'shop';
    else if(r < 0.46)                 n.type = 'treasure';
    else                              n.type = 'combat';
  }
  S.map = { nodes, edges:[...edges] };
  S.pos = null;
  S.visited = [];
}

function availableNodes(){
  if(!S.pos) return Object.values(S.map.nodes).filter(n => n.floor === 0);
  const from = S.pos.floor + ',' + S.pos.slot;
  return S.map.edges
    .filter(e => e.startsWith(from + '>'))
    .map(e => S.map.nodes[e.split('>')[1]])
    .filter(Boolean);
}

/* ------------------------------------------------------------ relic helpers */
const has = k => S.relics.includes(k);
function grantRelic(k){
  if(has(k)) return false;
  S.relics.push(k);
  if(k === 'ancestral') UI.pendingAncestral = true;
  return true;
}
function relicPool(tier){
  const owned = new Set(S.relics);
  let pool = RELICS.filter(r => !owned.has(r.key) && r.tier === tier);
  if(!pool.length) pool = RELICS.filter(r => !owned.has(r.key) && r.tier !== 'boss');
  if(!pool.length) pool = RELICS.filter(r => !owned.has(r.key));
  return pool;
}
function randomRelic(tier){
  const pool = relicPool(tier || (Math.random() < 0.22 ? 'rare' : Math.random() < 0.5 ? 'uncommon' : 'common'));
  return pool.length ? pick(pool).key : null;
}

/* --------------------------------------------------------- face value maths */
function faceValue(hero, f){
  let v = f.v;
  if(f.k === 'dmg' || f.k === 'dmgAll'){ v += hero.power || 0; if(has('whetstone')) v += 1; }
  if(f.k === 'shield' || f.k === 'shieldAll'){ if(has('towershield')) v += 1; }
  if(f.k === 'heal'   && has('verdant'))  v += 1;
  if(f.k === 'poison' && has('venomsac')) v += 1;
  if(f.k === 'burn'   && has('emberbrand')) v += 1;
  return Math.max(0, v);
}
const livingHeroes  = () => S.party.filter(h => !h.downed);
const livingEnemies = () => C ? C.enemies.filter(e => e.hp > 0) : [];

/* ============================================================================
   COMBAT
   ========================================================================== */
function scaleMoves(def, act, depth){
  const d = depth === undefined ? 1 : depth;
  const dm = ACT_DMG[act] * (def.dmgW || 1) * d;
  return def.moves.map(m => {
    let v;
    if(m.k === 'block' || m.k === 'heal') v = m.v * ACT_HP[act] * d; /* defence tracks the HP curve */
    else if(m.k === 'buff' || m.k === 'poison') v = m.v;           /* stacking effects never scale */
    else v = m.v * dm;
    return { k:m.k, v:Math.max(1, Math.round(v)) };
  });
}
function depthMul(){
  if(!S.pos) return 1;
  return 1 + 0.35 * (S.pos.floor / (FLOORS - 2));
}
function makeEnemy(def, act, depth){
  const d = depth === undefined ? depthMul() : depth;
  const hp = Math.max(4, Math.round(def.hp * ACT_HP[act] * d));
  return {
    uid: uid(), key:def.key, name:def.name, av:def.av,
    maxHp:hp, hp, shield:0, poison:0, burn:0, stun:0, power:0,
    moves: scaleMoves(def, act, d), mi: 0, intent:null,
    elite: !!def.elite, boss: !!def.boss
  };
}
function buildEncounter(type){
  const act = S.act;
  if(type === 'boss')  return [ makeEnemy(BOSSES[clamp(act,1,3) - 1], act, 1) ];
  if(type === 'elite') return [ makeEnemy(pick(ELITES), act) ];
  let pool = BESTIARY.filter(b => b.acts.includes(act));
  /* the opening room of each act is a soft landing: weakest archetypes only */
  const opening = S.pos && S.pos.floor === 0;
  if(opening){
    const soft = pool.filter(b => b.hp <= 9);
    if(soft.length) pool = soft;
  }
  const n = opening ? pick([1,2]) : pick({1:[1,2,2], 2:[2,2,3], 3:[2,2,3]}[act] || [2,2,3]);
  const out = [];
  for(let i = 0; i < n; i++) out.push(makeEnemy(pick(pool), act));
  /* a lone normal enemy would be a pushover: give it a boost */
  if(n === 1 && !opening){ out[0].maxHp = Math.round(out[0].maxHp * 1.45); out[0].hp = out[0].maxHp; }
  return out;
}

function startCombat(type){
  C = {
    type,
    enemies: buildEncounter(type),
    dice: [],
    turn: 0,
    mana: has('clover') ? 2 : 0,
    rerolls: 0,
    rerollMode: false,
    pending: null,
    spellsUsed: [],
    log: [],
    over: null
  };
  S.party.forEach(h => {
    h.shield = 0; h.poison = 0;
    h.power = has('warhorn') ? 1 : 0;
    if(h.hp <= 0){ h.hp = 1; }
    h.downed = h.hp <= 0;
  });
  logc(type === 'boss' ? 'A boss blocks the stair.' : type === 'elite' ? 'Something big is waiting.' : 'Enemies close in.');
  beginPlayerTurn();
}

function logc(t){ if(!C) return; C.log.push(t); if(C.log.length > 60) C.log.shift(); }

function maxRerolls(){ return 2 + (has('loadeddice') ? 1 : 0); }

function beginPlayerTurn(){
  C.turn++;
  S.turnsPlayed++;
  /* shields fade between turns */
  S.party.forEach(h => { h.shield = has('bulwark') ? Math.floor(h.shield / 2) : 0; });
  if(has('wellspring')) C.mana += 1;
  if(has('sundial') && C.turn % 3 === 0){
    livingHeroes().forEach(h => h.shield += 4);
    logc('The Sundial turns. Every hero gains 4 shield.');
  }
  C.rerolls = maxRerolls();
  C.rerollMode = false;
  C.pending = null;
  rollAll();
  setIntents();
  save();
}

function rollAll(){
  C.dice = livingHeroes().map(h => {
    const f = h.faces[rnd(h.faces.length)];
    return { id:uid(), heroUid:h.uid, k:f.k, v:f.v, used:false, mark:false, fresh:true };
  });
}
function rerollMarked(){
  const marked = C.dice.filter(d => d.mark && !d.used);
  if(!marked.length || C.rerolls <= 0) return;
  C.rerolls--;
  marked.forEach(d => {
    const h = heroByUid(d.heroUid);
    const f = h.faces[rnd(h.faces.length)];
    d.k = f.k; d.v = f.v; d.mark = false; d.fresh = true;
  });
  logc(`Rerolled ${marked.length} ${marked.length === 1 ? 'die' : 'dice'}.`);
  C.rerollMode = C.rerolls > 0;
  render();
}
const heroByUid  = u => S.party.find(h => h.uid === u);
const enemyByUid = u => C.enemies.find(e => e.uid === u);

function setIntents(){
  livingEnemies().forEach(e => {
    const m = e.moves[e.mi % e.moves.length];
    e.mi++;
    let tgt = null;
    if(m.k === 'attack' || m.k === 'poison'){
      const opts = livingHeroes();
      tgt = opts.length ? pick(opts).uid : null;
    }
    e.intent = { k:m.k, v:m.v, tgt };
  });
}

/* ------------------------------------------------------------------ damage */
function heroDamageToEnemy(e, n){
  if(has('seal') && e.hp <= e.maxHp * 0.3) n += 4;
  return hurtEnemy(e, n);
}
function hurtEnemy(e, n, ignoreShield){
  if(e.hp <= 0 || n <= 0) return 0;
  let left = n;
  if(!ignoreShield && e.shield > 0){
    const a = Math.min(e.shield, left);
    e.shield -= a; left -= a;
  }
  e.hp = Math.max(0, e.hp - left);
  floatOn(e.uid, '-' + n, 'var(--red)');
  if(e.hp === 0){ logc(`${e.name} falls.`); S.kills++; if(e.elite) S.elitesKilled++; }
  return n;
}
function hurtHero(h, n, opts){
  opts = opts || {};
  if(h.downed || n <= 0) return;
  let left = n;
  if(!opts.ignoreShield && h.shield > 0){
    const a = Math.min(h.shield, left);
    h.shield -= a; left -= a;
  }
  h.hp = Math.max(0, h.hp - left);
  floatOn(h.uid, '-' + n, 'var(--red)');
  if(h.hp === 0){
    h.downed = true;
    logc(`${h.name} goes down.`);
    C.dice = C.dice.filter(d => d.heroUid !== h.uid || d.used);
  }
}
function healHero(h, n){
  if(h.downed || n <= 0) return;
  const before = h.hp;
  h.hp = Math.min(h.maxHp, h.hp + n);
  if(h.hp > before) floatOn(h.uid, '+' + (h.hp - before), 'var(--green)');
}

/* ------------------------------------------------------- player actions --- */
function clickDie(i){
  const d = C.dice[i];
  if(!d || d.used || C.over) return;
  if(C.rerollMode){ d.mark = !d.mark; render(); return; }
  if(C.pending && C.pending.type === 'die' && C.pending.i === i){ C.pending = null; render(); return; }
  const t = KIND[d.k].target;
  C.pending = { type:'die', i };
  if(t === 'none' || t === 'self' || t === 'allEnemies' || t === 'allAllies') resolvePending(null);
  else render();
}
function clickSpell(key){
  if(C.over) return;
  const sp = spellDef(key);
  if(!sp || C.mana < sp.cost) return;
  if(C.pending && C.pending.type === 'spell' && C.pending.key === key){ C.pending = null; render(); return; }
  C.pending = { type:'spell', key };
  if(sp.target === 'self' || sp.target === 'allEnemies' || sp.target === 'allAllies') resolvePending(null);
  else render();
}
function clickTarget(kind, uidv){
  if(!C.pending) return;
  resolvePending({ kind, uid:uidv });
}
function pendingTargetType(){
  if(!C.pending) return null;
  if(C.pending.type === 'die'){ const d = C.dice[C.pending.i]; return d ? KIND[d.k].target : null; }
  return spellDef(C.pending.key).target;
}

function resolvePending(target){
  const p = C.pending;
  if(!p) return;
  C.pending = null;
  if(p.type === 'die') applyDie(p.i, target);
  else applySpell(p.key, target);
  afterAction();
}

function applyDie(i, target){
  const d = C.dice[i];
  if(!d || d.used) return;
  const h = heroByUid(d.heroUid);
  const v = faceValue(h, d);
  d.used = true;
  switch(d.k){
    case 'dmg': {
      const e = enemyByUid(target.uid); if(!e) break;
      heroDamageToEnemy(e, v);
      logc(`${h.name} strikes ${e.name} for ${v}.`);
      break;
    }
    case 'dmgAll': {
      livingEnemies().forEach(e => { heroDamageToEnemy(e, v); if(e.hp > 0) e.burn += 1; });
      logc(`${h.name} cleaves everything for ${v}, and the room catches fire.`);
      break;
    }
    case 'burn': {
      const e = enemyByUid(target.uid); if(!e) break;
      e.burn += v; floatOn(e.uid, '🔥' + v, 'var(--orange)');
      logc(`${h.name} sets ${e.name} alight.`);
      break;
    }
    case 'shield': {
      const a = heroByUid(target.uid); if(!a) break;
      a.shield += v; floatOn(a.uid, '+' + v, 'var(--blue)');
      logc(`${h.name} shields ${a.name} for ${v}.`);
      break;
    }
    case 'shieldAll': {
      livingHeroes().forEach(a => { a.shield += v; floatOn(a.uid, '+' + v, 'var(--blue)'); });
      logc(`${h.name} raises an aegis for ${v}.`);
      break;
    }
    case 'heal': {
      const a = heroByUid(target.uid); if(!a) break;
      healHero(a, v);
      if(a.poison > 0) a.poison--;
      logc(`${h.name} mends ${a.name} for ${v}.`);
      break;
    }
    case 'poison': {
      const e = enemyByUid(target.uid); if(!e) break;
      e.poison += v; floatOn(e.uid, '☠' + v, 'var(--lime)');
      logc(`${h.name} poisons ${e.name} for ${v}.`);
      break;
    }
    case 'stun': {
      const e = enemyByUid(target.uid); if(!e) break;
      e.stun += v; floatOn(e.uid, 'STUN', 'var(--gold)');
      logc(`${e.name} is stunned.`);
      break;
    }
    case 'mana': {
      C.mana += v;
      logc(`${h.name} focuses. +${v} mana.`);
      break;
    }
    case 'power': {
      const a = heroByUid(target.uid); if(!a) break;
      a.power += v; floatOn(a.uid, '+' + v + ' POW', 'var(--pink)');
      logc(`${h.name} empowers ${a.name}.`);
      break;
    }
    default: logc(`${h.name} rolls a blank.`);
  }
}

function applySpell(key, target){
  const sp = spellDef(key);
  if(C.mana < sp.cost) return;
  C.mana -= sp.cost;
  switch(key){
    case 'firebolt': { const e = enemyByUid(target.uid); if(e) heroDamageToEnemy(e, 7); logc(`Firebolt hits ${e ? e.name : 'nothing'} for 7.`); break; }
    case 'mend':     { const a = heroByUid(target.uid); if(a){ healHero(a, 8); a.poison = Math.max(0, a.poison - 2); } logc('Greater Mend restores 8.'); break; }
    case 'bulwark':  { const a = heroByUid(target.uid); if(a){ a.shield += 9; floatOn(a.uid,'+9','var(--blue)'); } logc('Bulwark grants 9 shield.'); break; }
    case 'chain':    { livingEnemies().forEach(e => heroDamageToEnemy(e, 5)); logc('Chain Lightning arcs for 5.'); break; }
    case 'frost':    { const e = enemyByUid(target.uid); if(e){ e.stun += 1; floatOn(e.uid,'STUN','var(--gold)'); } logc('Frost Nail freezes an enemy.'); break; }
    case 'siphon':   {
      const e = enemyByUid(target.uid); if(e) heroDamageToEnemy(e, 5);
      const hurt = livingHeroes().slice().sort((a,b) => (a.hp/a.maxHp) - (b.hp/b.maxHp))[0];
      if(hurt) healHero(hurt, 5);
      logc('Siphon drains 5.'); break;
    }
    case 'quicken':  { C.rerolls += 1; logc('Quicken grants a reroll.'); break; }
    case 'wildfire': { livingEnemies().forEach(e => heroDamageToEnemy(e, 10)); logc('Wildfire scours the room for 10.'); break; }
    case 'finisher': {
      const e = enemyByUid(target.uid); if(!e) break;
      const big = e.hp <= e.maxHp / 2;
      heroDamageToEnemy(e, big ? 14 : 6);
      logc(big ? 'Finisher lands clean for 14.' : 'Finisher glances off for 6.');
      break;
    }
    case 'conflag':  { livingEnemies().forEach(e => { e.burn += 3; floatOn(e.uid, '🔥' + '3', 'var(--orange)'); }); logc('Conflagration sets the room alight.'); break; }
    case 'miasma':   { livingEnemies().forEach(e => { e.poison += 4; floatOn(e.uid, '☠4', 'var(--lime)'); }); logc('Miasma settles over everything.'); break; }
    case 'rally':    { livingHeroes().forEach(h => { h.power += 1; floatOn(h.uid, '+1 POW', 'var(--pink)'); }); logc('Rally lifts the whole party.'); break; }
  }
}

function afterAction(){
  if(!livingEnemies().length){ endCombat(true); return; }
  if(!livingHeroes().length){ endCombat(false); return; }
  save(); render();
}

/* --------------------------------------------------------------- enemy turn */
function endTurn(){
  if(C.over) return;
  C.pending = null; C.rerollMode = false;
  C.dice = [];
  render();
  setTimeout(enemyPhase, 160);
}

function enemyPhase(){
  const order = livingEnemies();
  let idx = 0;
  const step = () => {
    if(C.over) return;
    if(idx >= order.length){ endOfRound(); return; }
    const e = order[idx++];
    if(e.hp <= 0){ step(); return; }
    e.shield = 0;
    if(e.stun > 0){
      e.stun--;
      logc(`${e.name} is stunned and loses its turn.`);
      floatOn(e.uid, 'stunned', 'var(--gold)');
      render(); setTimeout(step, 240); return;
    }
    const it = e.intent || { k:'attack', v:3, tgt:null };
    let tgt = it.tgt ? heroByUid(it.tgt) : null;
    if(!tgt || tgt.downed) tgt = livingHeroes()[0] ? pick(livingHeroes()) : null;
    switch(it.k){
      case 'attack':
        if(tgt){
          const dmg = it.v + (e.power || 0);
          hurtHero(tgt, dmg);
          logc(`${e.name} hits ${tgt.name} for ${dmg}.`);
          if(has('thorned')) hurtEnemy(e, 3);
        }
        break;
      case 'attackAll': {
        const dmg = it.v + (e.power || 0);
        livingHeroes().forEach(h => hurtHero(h, dmg));
        logc(`${e.name} sweeps the party for ${dmg}.`);
        if(has('thorned')) hurtEnemy(e, 3);
        break;
      }
      case 'block':
        e.shield += it.v;
        floatOn(e.uid, '+' + it.v, 'var(--blue)');
        logc(`${e.name} braces for ${it.v}.`);
        break;
      case 'buff':
        e.power += it.v;
        floatOn(e.uid, '+' + it.v + ' POW', 'var(--pink)');
        logc(`${e.name} grows stronger.`);
        break;
      case 'heal': {
        const before = e.hp;
        e.hp = Math.min(e.maxHp, e.hp + it.v);
        floatOn(e.uid, '+' + (e.hp - before), 'var(--green)');
        logc(`${e.name} heals ${e.hp - before}.`);
        break;
      }
      case 'poison':
        if(tgt){
          tgt.poison += it.v;
          floatOn(tgt.uid, '☠' + it.v, 'var(--lime)');
          logc(`${e.name} poisons ${tgt.name}.`);
        }
        break;
    }
    if(!livingHeroes().length){ endCombat(false); return; }
    render();
    setTimeout(step, 240);
  };
  step();
}

function endOfRound(){
  /* Fire resolves first: it burns, then grows, then jumps to something new.
     Unlike poison it does not decay, so an early Ignite compounds over a long
     fight -- and in a crowd it turns one lit enemy into a spreading problem. */
  const burning = livingEnemies().filter(e => e.burn > 0);
  burning.forEach(e => {
    hurtEnemy(e, e.burn, true);
    logc(`${e.name} burns for ${e.burn}.`);
  });
  const stillBurning = burning.filter(e => e.hp > 0);
  stillBurning.forEach(e => { e.burn += 1; });
  const unlit = livingEnemies().filter(e => e.burn === 0);
  stillBurning.slice(0, unlit.length).forEach((src, i) => {
    unlit[i].burn = 1;
    floatOn(unlit[i].uid, '🔥', 'var(--orange)');
    logc(`The fire spreads from ${src.name} to ${unlit[i].name}.`);
  });
  if(!livingEnemies().length){ endCombat(true); return; }

  /* poison ticks after everyone has acted */
  livingEnemies().forEach(e => {
    if(e.poison > 0){
      hurtEnemy(e, e.poison, true);
      logc(`${e.name} takes ${e.poison} poison.`);
      e.poison--;
    }
  });
  livingHeroes().forEach(h => {
    if(h.poison > 0){
      hurtHero(h, h.poison, {ignoreShield:true});
      logc(`${h.name} takes ${h.poison} poison.`);
      h.poison--;
    }
  });
  if(!livingEnemies().length){ endCombat(true); return; }
  if(!livingHeroes().length){ endCombat(false); return; }
  beginPlayerTurn();
  render();
}

function endCombat(won){
  C.over = won ? 'win' : 'lose';
  render();
  if(!won){ setTimeout(() => { S.screen = 'gameover'; clearSave(); render(); }, 500); return; }
  setTimeout(() => {
    const type = C.type;
    S.party.forEach(h => {
      if(h.downed){
        h.downed = false;
        h.hp = has('secondwind') ? h.maxHp : Math.max(1, Math.round(h.maxHp * 0.35));
      }
      h.shield = 0; h.power = 0; h.poison = 0;
    });
    S.party.forEach(h => healHero(h, Math.round(h.maxHp * 0.15)));
    if(has('bloodstone')) S.party.forEach(h => healHero(h, 3));
    C = null;
    postCombatRewards(type);
  }, 650);
}

/* ============================================================================
   RUN FLOW: nodes, rewards, shop, camp fire, events
   ========================================================================== */
function enterNode(n){
  if(!n) return;
  S.pos = { floor:n.floor, slot:n.slot };
  n.done = true;
  S.visited.push(n.floor + ',' + n.slot);
  save();
  switch(n.type){
    case 'combat': case 'elite': case 'boss':
      S.screen = 'combat'; startCombat(n.type); render(); break;
    case 'shop':     openShop(); break;
    case 'rest':     openCamp(); break;
    case 'treasure': openTreasure(); break;
    case 'event':    openEvent(); break;
  }
}

function goldGain(base){
  const g = Math.round(base * (has('coinpurse') ? 1.3 : 1));
  S.gold += g;
  return g;
}

function postCombatRewards(type){
  const act = S.act;
  const bonus = !!UI.bonusReward; UI.bonusReward = false;
  const gold = goldGain(Math.round((type === 'boss' ? 90 + act * 25 : type === 'elite' ? 55 + act * 15 : 22 + act * 9 + rnd(12)) * (bonus ? 1.7 : 1)));
  const relic = (type === 'elite' || type === 'boss')
    ? randomRelic(type === 'boss' ? 'boss' : 'rare')
    : null;
  if(relic) grantRelic(relic);
  if(type === 'boss'){
    S.party.forEach(h => healHero(h, Math.round(h.maxHp * 0.3)));
  }
  UI.modal = {
    type: 'reward',
    kind: type,
    gold,
    relic,
    faces: faceRewards(bonus ? 4 : 3),
    taken: false
  };
  S.screen = 'map';
  save(); render();
}

function finishReward(){
  UI.modal = null;
  if(UI.pendingAncestral){ UI.pendingAncestral = false; UI.modal = { type:'ancestral', after: finishReward }; render(); return; }
  const wasBoss = S.pos && nodeAt(S.pos.floor, S.pos.slot) && nodeAt(S.pos.floor, S.pos.slot).type === 'boss';
  if(wasBoss){
    S.act++;
    if(S.act > 3){ S.screen = 'victory'; clearSave(); render(); return; }
    buildMap();
    UI.modal = { type:'act', act:S.act };
  }
  S.screen = 'map';
  save(); render();
}

/* ------------------------------------------------------------- face surgery */
function installFace(face, mode, after){
  UI.modal = { type:'install', face, mode: mode || 'replace', after: after || null };
  render();
}
function doInstall(heroUid, faceIdx){
  const m = UI.modal;
  const h = heroByUid(heroUid);
  if(!h) return;
  if(m.mode === 'add') h.faces.push({...m.face});
  else h.faces[faceIdx] = {...m.face};
  const after = m.after;
  UI.modal = null;
  save();
  if(after) after(); else render();
}

/* -------------------------------------------------------------------- shop */
const priceMod = () => has('token') ? 0.7 : 1;
function openShop(){
  const faces = faceRewards(3).map(f => ({ face:f, price: Math.round(facePrice(f) * priceMod()) }));
  const rk = randomRelic(Math.random() < 0.3 ? 'rare' : 'uncommon');
  const unowned = SPELLS.filter(s => !S.spells.includes(s.key));
  const stock = sample(unowned, 2).map(sp => ({ key:sp.key, price: Math.round((60 + sp.cost * 22) * priceMod()) }));
  UI.modal = {
    type:'shop',
    faces,
    relic: rk ? { key:rk, price: Math.round((rk && relicDef(rk).tier === 'rare' ? 210 : 150) * priceMod()) } : null,
    spells: stock,
    rations: { price: Math.round(50 * priceMod()), used:false },
    sold: {}
  };
  S.screen = 'map';
  render();
}
function shopModal(){ return UI.modal && UI.modal.type === 'shop' ? UI.modal : null; }
function buyFace(i){
  const m = shopModal(); if(!m) return;
  const item = m.faces[i];
  if(!item || m.sold['f' + i] || S.gold < item.price) return;
  S.gold -= item.price;
  m.sold['f' + i] = true;
  const shopState = m;
  installFace(item.face, 'replace', () => { UI.modal = shopState; render(); });
}
function buyRelic(){
  const m = shopModal(); if(!m) return;
  if(!m.relic || m.sold.relic || S.gold < m.relic.price) return;
  S.gold -= m.relic.price; m.sold.relic = true;
  grantRelic(m.relic.key);
  if(UI.pendingAncestral){ UI.pendingAncestral = false; const back = m; UI.modal = { type:'ancestral', after: () => { UI.modal = back; render(); } }; render(); return; }
  save(); render();
}
function buySpell(i){
  const m = shopModal(); if(!m) return;
  const it = m.spells[i];
  if(!it || m.sold['s' + i] || S.gold < it.price) return;
  S.gold -= it.price; m.sold['s' + i] = true;
  S.spells.push(it.key);
  save(); render();
}
function buyRations(){
  const m = shopModal(); if(!m) return;
  if(m.rations.used || S.gold < m.rations.price) return;
  S.gold -= m.rations.price; m.rations.used = true;
  S.party.forEach(h => healHero(h, Math.round(h.maxHp * 0.3)));
  save(); render();
}

/* --------------------------------------------------------------- camp fire */
function openCamp(){ UI.modal = { type:'camp' }; S.screen = 'map'; render(); }
function campRest(){
  const pct = has('chirurgeon') ? 0.6 : 0.3;
  S.party.forEach(h => healHero(h, Math.round(h.maxHp * pct)));
  UI.modal = null; save(); render();
}
function campForge(){ UI.modal = { type:'forge' }; render(); }
function forgeFace(heroUid, idx){
  const h = heroByUid(heroUid);
  const f = h.faces[idx];
  if(!f || f.k === 'blank') return;
  f.v += (f.k === 'stun' ? 1 : f.k === 'dmgAll' || f.k === 'shieldAll' || f.k === 'power' || f.k === 'mana' || f.k === 'burn' ? 1 : 2);
  UI.modal = null; save(); render();
}
function campDrill(){
  S.party.forEach(h => { h.maxHp += 4; h.hp += 4; });
  UI.modal = null; save(); render();
}

/* ---------------------------------------------------------------- treasure */
function openTreasure(){
  const k = randomRelic();
  if(k) grantRelic(k);
  const g = goldGain(25 + rnd(30));
  UI.modal = { type:'treasure', relic:k, gold:g };
  S.screen = 'map'; save(); render();
}

/* ============================================================================
   RENDER
   ========================================================================== */
function render(){
  renderTopbar();
  const app = el('app');
  const screen = S ? S.screen : 'title';
  if(screen === 'title')          app.innerHTML = viewTitle();
  else if(screen === 'map')       app.innerHTML = viewMap();
  else if(screen === 'combat')    app.innerHTML = viewCombat();
  else if(screen === 'gameover')  app.innerHTML = viewGameOver();
  else if(screen === 'victory')   app.innerHTML = viewVictory();
  renderModal();
  flushFloats();
  if(screen === 'map') requestAnimationFrame(scrollMapToPlayer);
}

/* ------------------------------------------------------------------ topbar */
function renderTopbar(){
  const bar = el('topbar');
  if(!S || S.screen === 'title'){ bar.classList.add('hidden'); return; }
  bar.classList.remove('hidden');
  const relics = S.relics.map(k => {
    const r = relicDef(k);
    return `<div class="relic" data-tip="${esc(r.name)}|${esc(r.desc)}">${r.ic}</div>`;
  }).join('');
  el('topbar-inner').innerHTML = `
    <div class="brand">Dice<span class="d">Spire</span></div>
    <div class="stat" data-tip="Act|Three acts, each ending in a boss.">🗺️ Act <b>${S.act}</b></div>
    <div class="stat" data-tip="Gold|Spent at merchants.">💰 <b>${S.gold}</b></div>
    ${S.spells.length ? `<div class="stat" data-tip="Spells|Cast in combat with mana from Focus faces.">📜 <b>${S.spells.length}</b></div>` : ''}
    <div class="relic-bar">${relics}<button class="btn sm ghost" onclick="abandonRun()">Abandon</button></div>`;
}
function abandonRun(){
  if(!confirm('Abandon this run and return to the title screen?')) return;
  clearSave(); S = null; C = null; UI.modal = null; render();
}

/* ------------------------------------------------------------------- title */
let titlePick = [];
function viewTitle(){
  const resumable = !!localStorage.getItem(SAVE_KEY);
  const cards = HEROES.map(h => {
    const on = titlePick.includes(h.key);
    return `<div class="hero-card ${on ? 'on' : ''}" onclick="togglePick('${h.key}')">
      <div class="hd">
        <div class="av">${h.av}</div>
        <div><div class="nm">${h.name}</div><div class="hp">${h.hp} HP</div></div>
      </div>
      <div class="desc">${esc(h.blurb)}</div>
      <div class="faces">${h.faces.map(f => faceHTML(f)).join('')}</div>
      <div class="tiny" style="margin-top:9px;color:var(--violet)" data-tip="${esc(spellDef(h.spell).name)}|${esc(spellDef(h.spell).desc)}">
        📜 ${esc(spellDef(h.spell).name)} <span class="faint">◆${spellDef(h.spell).cost}</span> — joins the run with this hero</div>
    </div>`;
  }).join('');
  return `
  <div class="title-hero">
    <span class="pill">A dice tactics roguelike</span>
    <h1>Dice <span>Spire</span></h1>
    <p>Every hero is a six-sided die. Roll them, spend them, climb.<br>
       Every face you gain is a face you must give up.</p>
  </div>
  <div class="panel">
    <div class="spread" style="margin-bottom:12px">
      <div><h2 style="font-size:22px">Choose three</h2>
      <div class="muted tiny">Picked ${titlePick.length} of 3</div></div>
      <div class="row">
        ${resumable ? `<button class="btn ghost" onclick="resumeRun()">Resume run</button>` : ''}
        <button class="btn primary" ${titlePick.length === 3 ? '' : 'disabled'} onclick="newRun(titlePick)">Descend →</button>
      </div>
    </div>
    <div class="hero-grid">${cards}</div>
  </div>
  <div class="panel" style="margin-top:14px">
    <h3 style="font-size:18px;margin-bottom:8px">How it works</h3>
    <div class="muted" style="font-size:13.5px;line-height:1.65">
      <b style="color:var(--ink)">Each turn</b> every standing hero rolls their die. Click a rolled face, then click a target.
      Unused faces are wasted, so the puzzle is spending all three well.<br>
      <b style="color:var(--ink)">Rerolls</b> let you re-roll any dice you have not spent yet, twice per turn.<br>
      <b style="color:var(--ink)">Shields</b> fade at the start of your next turn. <b style="color:var(--ink)">Poison</b> ignores shields and ticks at the end of the round, then fades.<br>
      <b style="color:var(--ink)">Fire</b> also ignores shields, but it never fades: each round it burns, then grows by 1, then spreads to an enemy that is not yet alight.<br>
      <b style="color:var(--ink)">Rewards are faces.</b> A die has six sides, so taking a new face means replacing one you have.<br>
      <b style="color:var(--ink)">A downed hero</b> returns after the fight. Losing all three ends the run.<br>
      <b style="color:var(--ink)">Winning a fight</b> restores 15% of every hero’s max HP. The rest you heal at camp fires.
    </div>
  </div>`;
}
function togglePick(k){
  const i = titlePick.indexOf(k);
  if(i >= 0) titlePick.splice(i, 1);
  else if(titlePick.length < 3) titlePick.push(k);
  render();
}
function resumeRun(){
  if(loadSave()){
    if(S.screen === 'combat' && !C) S.screen = 'map';
    UI.modal = null;
    render();
  }
}

function faceHTML(f, cls, click){
  const K = KIND[f.k];
  return `<div class="face ${f.k === 'blank' ? 'blank' : ''} ${cls || ''}" ${click ? `onclick="${click}"` : ''}
    data-tip="${esc(faceLabel(f))}|${esc(K.desc(f.v))}" style="border-color:${f.k === 'blank' ? '' : 'rgba(255,255,255,.18)'}">
    <span class="ic">${K.ic}</span>${f.k === 'blank' ? '' : `<span class="v" style="color:${K.col}">${f.v}</span>`}</div>`;
}

/* --------------------------------------------------------------------- map */
function viewMap(){
  const H = 74, top = 40;
  const height = FLOORS * H + top;
  const nodes = Object.values(S.map.nodes);
  const xFor = s => 10 + s * 20;
  const yFor = f => height - top / 2 - f * H - 28;
  const avail = availableNodes();
  const availSet = new Set(avail.map(n => n.floor + ',' + n.slot));

  const lines = S.map.edges.map(e => {
    const [a, b] = e.split('>');
    const A = S.map.nodes[a], B = S.map.nodes[b];
    if(!A || !B) return '';
    const live = S.pos && A.floor === S.pos.floor && A.slot === S.pos.slot;
    const used = A.done && B.done;
    return `<line x1="${xFor(A.slot)}%" y1="${yFor(A.floor)}" x2="${xFor(B.slot)}%" y2="${yFor(B.floor)}"
      stroke="${live ? 'rgba(240,180,41,.75)' : used ? 'rgba(255,255,255,.22)' : 'rgba(255,255,255,.10)'}"
      stroke-width="${live ? 2.5 : 1.6}" stroke-dasharray="${live ? '' : '4 5'}"/>`;
  }).join('');

  const dots = nodes.map(n => {
    const k = n.floor + ',' + n.slot;
    const art = NODE_ART[n.type];
    const isHere = S.pos && S.pos.floor === n.floor && S.pos.slot === n.slot;
    const cls = isHere ? 'here' : availSet.has(k) ? 'avail' : n.done ? 'done' : '';
    return `<div class="node ${cls}" data-node="${k}" data-tip="${esc(art.label)}|${esc(nodeTip(n))}"
      style="left:${xFor(n.slot)}%;top:${yFor(n.floor)}px"
      ${availSet.has(k) ? `onclick="clickNode('${k}')"` : ''}>${art.ic}</div>`;
  }).join('');

  const floorLabels = Array.from({length:FLOORS}, (_, f) =>
    `<div class="floor-label" style="top:${yFor(f)}px">${f === FLOORS - 1 ? 'BOSS' : f + 1}</div>`).join('');

  return `
  ${viewParty()}
  <div class="spread" style="margin:16px 0 10px">
    <div><h2 style="font-size:22px">Act ${S.act}</h2>
      <div class="muted tiny">${S.pos ? 'Choose where to go next.' : 'Choose your first room.'}</div></div>
    <div class="row tiny muted wrap-r" style="justify-content:flex-end">
      ${Object.entries(NODE_ART).map(([k, a]) => `<span>${a.ic} ${a.label}</span>`).join('')}
    </div>
  </div>
  <div class="map-shell"><div class="map-scroll" id="mapScroll"><div class="map-inner" style="height:${height}px">
    <svg viewBox="0 0 100 ${height}" preserveAspectRatio="none" style="height:${height}px">${lines}</svg>
    ${floorLabels}${dots}
  </div></div></div>`;
}
function nodeTip(n){
  switch(n.type){
    case 'combat':   return 'A normal fight. Gold and a new die face.';
    case 'elite':    return 'A hard fight. Gold, a face, and a relic.';
    case 'event':    return 'Something happens. It is usually a choice.';
    case 'shop':     return 'Buy faces, a relic, a spell, or a meal.';
    case 'rest':     return 'Heal, sharpen a face, or drill for max HP.';
    case 'treasure': return 'A free relic.';
    case 'boss':     return 'The act boss. Beating it ends the act.';
  }
  return '';
}
function clickNode(k){
  const n = S.map.nodes[k];
  if(!n) return;
  if(!availableNodes().some(x => x === n)) return;
  enterNode(n);
}
function scrollMapToPlayer(){
  const sc = el('mapScroll');
  if(!sc) return;
  const here = sc.querySelector('.node.here') || sc.querySelector('.node.avail');
  if(here) sc.scrollTop = Math.max(0, here.offsetTop - sc.clientHeight * 0.62);
}

/* ------------------------------------------------------------- party strip */
function viewParty(){
  return `<div class="panel" style="padding:12px">
    <div class="row wrap-r" style="gap:14px">
    ${S.party.map(h => {
      const pct = Math.round(h.hp / h.maxHp * 100);
      return `<div class="row" style="gap:9px;min-width:190px;flex:1">
        <div class="av" style="width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:20px;background:#0f1729;border:1px solid var(--line-hi)">${h.av}</div>
        <div style="flex:1">
          <div class="spread"><b style="font-size:13.5px">${h.name}</b><span class="tiny muted">${h.hp}/${h.maxHp}</span></div>
          <div class="hpbar" style="margin-top:4px"><i style="width:${pct}%;background:linear-gradient(90deg,#28a06c,#3ddc97)"></i></div>
          <div class="faces" style="margin-top:6px;gap:3px">${h.faces.map(f => faceHTML(f)).join('')}</div>
        </div>
      </div>`;
    }).join('')}
    </div></div>`;
}

/* ------------------------------------------------------------------ combat */
function viewCombat(){
  const tt = pendingTargetType();
  const enemyTargetable = tt === 'enemy';
  const allyTargetable  = tt === 'ally';

  const enemies = C.enemies.map(e => {
    const pct = Math.max(0, Math.round(e.hp / e.maxHp * 100));
    const badges = [];
    if(e.shield) badges.push(`<span class="badge" style="color:var(--blue)" data-tip="Shield|Absorbs damage. Clears when this enemy next acts.">🛡️ ${e.shield}</span>`);
    if(e.poison) badges.push(`<span class="badge" style="color:var(--lime)" data-tip="Poison|Loses this much HP at the end of the round, ignoring shield, then the stack drops by 1.">☠️ ${e.poison}</span>`);
    if(e.burn)   badges.push(`<span class="badge" style="color:var(--orange)" data-tip="Burning|Loses this much HP at the end of the round, ignoring shield. Then the fire GROWS by 1, and spreads to an enemy that is not yet alight.">🔥 ${e.burn}</span>`);
    if(e.stun)   badges.push(`<span class="badge" style="color:var(--gold)" data-tip="Stunned|Loses its next turn.">⚡ ${e.stun}</span>`);
    if(e.power)  badges.push(`<span class="badge" style="color:var(--pink)" data-tip="Power|Added to every attack.">💢 ${e.power}</span>`);
    return `<div class="unit ${e.hp <= 0 ? 'dead' : ''} ${enemyTargetable && e.hp > 0 ? 'targetable' : ''}" data-uid="${e.uid}"
        ${enemyTargetable && e.hp > 0 ? `onclick="clickTarget('enemy',${e.uid})"` : ''}>
      ${e.hp > 0 ? intentHTML(e) : '<div class="intent" style="opacity:.3">—</div>'}
      <div class="av">${e.av}</div>
      <div class="nm">${e.name}${e.elite ? ' ★' : ''}${e.boss ? ' 👑' : ''}</div>
      <div class="hpbar"><i style="width:${pct}%"></i></div>
      <div class="hptext">${e.hp} / ${e.maxHp}</div>
      <div class="badges">${badges.join('')}</div>
    </div>`;
  }).join('');

  const heroes = S.party.map(h => {
    const pct = Math.max(0, Math.round(h.hp / h.maxHp * 100));
    const badges = [];
    if(h.shield) badges.push(`<span class="badge" style="color:var(--blue)" data-tip="Shield|Absorbs damage. Fades at the start of your next turn.">🛡️ ${h.shield}</span>`);
    if(h.poison) badges.push(`<span class="badge" style="color:var(--lime)" data-tip="Poison|Loses this much HP at the end of the round, ignoring shield.">☠️ ${h.poison}</span>`);
    if(h.power)  badges.push(`<span class="badge" style="color:var(--pink)" data-tip="Power|Added to every Strike and Cleave this hero rolls.">💢 ${h.power}</span>`);
    return `<div class="unit ally ${h.downed ? 'dead' : ''} ${allyTargetable && !h.downed ? 'targetable' : ''}" data-uid="${h.uid}"
        ${allyTargetable && !h.downed ? `onclick="clickTarget('ally',${h.uid})"` : ''}>
      <div class="av">${h.av}</div>
      <div class="nm">${h.name}${h.downed ? ' — down' : ''}</div>
      <div class="hpbar"><i style="width:${pct}%;background:linear-gradient(90deg,#28a06c,#3ddc97)"></i></div>
      <div class="hptext">${h.hp} / ${h.maxHp}</div>
      <div class="badges">${badges.join('')}</div>
    </div>`;
  }).join('');

  const dice = C.dice.map((d, i) => {
    const h = heroByUid(d.heroUid);
    const K = KIND[d.k];
    const v = faceValue(h, d);
    const sel = C.pending && C.pending.type === 'die' && C.pending.i === i;
    return `<div class="die ${d.used ? 'used' : ''} ${sel ? 'sel' : ''} ${d.mark ? 'marked' : ''} ${d.fresh ? 'roll' : ''}"
        onclick="clickDie(${i})" data-tip="${esc(K.name)}|${esc(K.desc(v))}">
      <div class="who">${h ? h.name : ''}</div>
      <div class="glyph">${K.ic}</div>
      ${d.k === 'blank' ? '<div class="val" style="color:var(--ink-faint)">—</div>' : `<div class="val" style="color:${K.col}">${v}</div>`}
      <div class="lab">${K.name}</div>
    </div>`;
  }).join('');
  C.dice.forEach(d => d.fresh = false);

  const spells = S.spells.map(k => {
    const sp = spellDef(k);
    const sel = C.pending && C.pending.type === 'spell' && C.pending.key === k;
    return `<button class="spell ${sel ? 'sel' : ''}" ${C.mana < sp.cost || C.over ? 'disabled' : ''} onclick="clickSpell('${k}')">
      ${esc(sp.name)} <span class="c">◆${sp.cost}</span><span class="d">${esc(sp.desc)}</span></button>`;
  }).join('');

  const unspent = C.dice.filter(d => !d.used).length;
  const hint = C.over === 'win' ? 'Victory.'
    : C.over === 'lose' ? 'The party falls.'
    : C.pending ? 'Choose a target.'
    : C.rerollMode ? 'Pick the dice to reroll, then confirm.'
    : unspent ? `${unspent} ${unspent === 1 ? 'die' : 'dice'} still unspent.`
    : 'Everything is spent. End the turn.';

  return `
  <div class="field">
    <div class="spread">
      <div><h2 style="font-size:20px">${C.type === 'boss' ? 'Boss' : C.type === 'elite' ? 'Elite' : 'Combat'} — turn ${C.turn}</h2>
        <div class="muted tiny">${esc(hint)}</div></div>
      <div class="row">
        <div class="stat" data-tip="Mana|Gained from Focus faces. Spent on spells.">🔮 <b>${C.mana}</b></div>
        ${C.pending ? `<button class="btn sm ghost" onclick="cancelPending()">Cancel</button>` : ''}
      </div>
    </div>
    <div class="enemy-row">${enemies}</div>
    <div class="row" style="justify-content:center;gap:12px;flex-wrap:wrap">${heroes}</div>
    <div class="tray">
      <div class="dice-row">${dice || '<div class="muted tiny" style="padding:12px 4px">The enemy is acting…</div>'}</div>
      <div class="sep"></div>
      <div class="spread wrap-r">
        <div class="row wrap-r">
          <button class="btn sm ${C.rerollMode ? 'primary' : ''}" ${C.rerolls <= 0 || C.over || !C.dice.length ? 'disabled' : ''} onclick="toggleReroll()">
            ↻ Reroll ×${C.rerolls}</button>
          ${C.rerollMode ? `<button class="btn sm primary" ${C.dice.some(d => d.mark && !d.used) ? '' : 'disabled'} onclick="rerollMarked()">Reroll ${C.dice.filter(d => d.mark && !d.used).length} selected</button>` : ''}
        </div>
        <button class="btn primary" ${C.over ? 'disabled' : ''} onclick="endTurn()">End turn →</button>
      </div>
      ${spells ? `<div class="sep"></div><div class="spell-row">${spells}</div>` : ''}
    </div>
    <div class="row" style="align-items:stretch;gap:12px;flex-wrap:wrap">
      <div style="flex:1;min-width:280px"><div class="log" id="log">${C.log.slice(-40).map((l, i, a) => `<div class="${i === a.length - 1 ? 'hl' : ''}">${esc(l)}</div>`).join('')}</div></div>
    </div>
  </div>`;
}
function intentHTML(e){
  const it = e.intent;
  if(!it) return '<div class="intent">—</div>';
  const tgt = it.tgt ? heroByUid(it.tgt) : null;
  const map = {
    attack:    {ic:'⚔️', col:'var(--red)',   v: it.v + (e.power || 0)},
    attackAll: {ic:'🌪️', col:'var(--orange)', v: it.v + (e.power || 0)},
    block:     {ic:'🛡️', col:'var(--blue)',  v: it.v},
    buff:      {ic:'💢', col:'var(--pink)',  v: it.v},
    heal:      {ic:'❤️', col:'var(--green)', v: it.v},
    poison:    {ic:'☠️', col:'var(--lime)',  v: it.v}
  }[it.k] || {ic:'?', col:'', v:''};
  const label = it.k === 'attackAll' ? 'all heroes' : tgt ? tgt.name : '';
  const tips = {
    attack:'It will attack this hero.', attackAll:'It will hit every hero.',
    block:'It will shield itself.', buff:'It will raise its own power.',
    heal:'It will heal itself.', poison:'It will poison this hero.'
  };
  return `<div class="intent" style="color:${map.col}" data-tip="Intent|${esc(tips[it.k] || '')}">
    ${map.ic} ${map.v}${label ? `<span class="tgt">→ ${esc(label)}</span>` : ''}</div>`;
}
function toggleReroll(){ C.rerollMode = !C.rerollMode; C.pending = null; if(!C.rerollMode) C.dice.forEach(d => d.mark = false); render(); }
function cancelPending(){ C.pending = null; render(); }

/* ------------------------------------------------------------- end screens */
function viewGameOver(){
  return `<div class="title-hero"><h1 style="font-size:54px">The spire keeps<br><span>what it takes</span></h1></div>
  <div class="panel center">
    <p class="muted">Act ${S.act} — ${S.kills} enemies killed, ${S.elitesKilled} elites, ${S.relics.length} relics, ${S.turnsPlayed} turns.</p>
    <div class="sep"></div>
    <button class="btn primary" onclick="restart()">Try again</button>
  </div>`;
}
function viewVictory(){
  return `<div class="title-hero"><span class="pill">Run complete</span><h1>You reach the <span>top</span></h1></div>
  <div class="panel center">
    <p class="muted">Three acts, three bosses. ${S.kills} enemies killed, ${S.elitesKilled} elites, ${S.relics.length} relics, ${S.turnsPlayed} turns.</p>
    <div class="sep"></div>
    <div class="row" style="justify-content:center">${S.party.map(h => `<div class="col" style="align-items:center"><div style="font-size:30px">${h.av}</div><b>${h.name}</b><div class="faces">${h.faces.map(f => faceHTML(f)).join('')}</div></div>`).join('')}</div>
    <div class="sep"></div>
    <button class="btn primary" onclick="restart()">Descend again</button>
  </div>`;
}
function restart(){ clearSave(); S = null; C = null; UI.modal = null; titlePick = []; render(); }

/* ============================================================================
   MODALS
   ========================================================================== */
function renderModal(){
  const old = document.querySelector('.veil');
  if(old) old.remove();
  if(!UI.modal || !S) return;
  const m = UI.modal;
  let html = '';
  switch(m.type){
    case 'reward':   html = mReward(m); break;
    case 'install':  html = mInstall(m); break;
    case 'pickface': html = mPickFace(m); break;
    case 'ancestral':html = mAncestral(m); break;
    case 'shop':     html = mShop(m); break;
    case 'camp':     html = mCamp(); break;
    case 'forge':    html = mForge(); break;
    case 'drill':    html = mDrill(); break;
    case 'treasure': html = mTreasure(m); break;
    case 'event':    html = mEvent(m); break;
    case 'result':   html = mResult(m); break;
    case 'act':      html = mAct(m); break;
  }
  const v = document.createElement('div');
  v.className = 'veil';
  v.innerHTML = `<div class="modal">${html}</div>`;
  document.body.appendChild(v);
}

function mReward(m){
  const title = m.kind === 'boss' ? 'The act is yours' : m.kind === 'elite' ? 'The elite falls' : 'Victory';
  return `
    <h2>${title}</h2>
    <p class="muted">You take <b style="color:var(--gold)">${m.gold} gold</b>${m.kind === 'boss' ? ', and the party catches its breath' : ''}.</p>
    ${m.relic ? `<div class="panel" style="margin-top:12px;display:flex;gap:12px;align-items:center;background:var(--card)">
        <div style="font-size:28px">${relicDef(m.relic).ic}</div>
        <div><b>${esc(relicDef(m.relic).name)}</b><div class="tiny muted">${esc(relicDef(m.relic).desc)}</div></div></div>` : ''}
    <div class="sep"></div>
    <h3 style="font-size:17px;margin-bottom:4px">Take a face</h3>
    <p class="tiny muted" style="margin-bottom:10px">A die has six sides. Taking one of these means giving one up.</p>
    <div class="reward-grid">
      ${m.faces.map((f, i) => `<div class="reward" onclick="takeRewardFace(${i})">
        <div style="font-size:26px">${KIND[f.k].ic}</div>
        <div class="nm" style="color:${KIND[f.k].col}">${esc(faceLabel(f))}</div>
        <div class="ds">${esc(KIND[f.k].desc(f.v))}</div></div>`).join('')}
    </div>
    <div class="sep"></div>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" onclick="finishReward()">Take none →</button></div>`;
}
function takeRewardFace(i){
  const f = UI.modal.faces[i];
  installFace(f, 'replace', finishReward);
}

function mInstall(m){
  const add = m.mode === 'add';
  return `
    <h2>${add ? 'Add a seventh face' : 'Replace a face'}</h2>
    <div class="row" style="margin:10px 0 4px">
      ${faceHTML(m.face, 'big')}
      <div><b style="color:${KIND[m.face.k].col}">${esc(faceLabel(m.face))}</b>
        <div class="tiny muted">${esc(KIND[m.face.k].desc(m.face.v))}</div></div>
    </div>
    <p class="tiny muted">${add ? 'Choose the hero whose die grows.' : 'Click the face you are willing to lose.'}</p>
    <div class="sep"></div>
    <div class="col">
      ${S.party.map(h => `<div class="panel" style="background:var(--card);padding:12px">
        <div class="spread" style="margin-bottom:8px">
          <b>${h.av} ${esc(h.name)}</b>
          ${add ? `<button class="btn sm primary" onclick="doInstall(${h.uid},0)">Add here</button>` : `<span class="tiny muted">${h.faces.length} faces</span>`}
        </div>
        <div class="faces">${h.faces.map((f, i) => faceHTML(f, 'big ' + (add ? '' : 'pickable'), add ? '' : `doInstall(${h.uid},${i})`)).join('')}</div>
      </div>`).join('')}
    </div>
    <div class="sep"></div>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" onclick="cancelInstall()">Keep my dice as they are</button></div>`;
}
function cancelInstall(){
  const after = UI.modal.after;
  UI.modal = null;
  if(after) after(); else { S.screen = 'map'; render(); }
}

function mPickFace(m){
  return `<h2>Reach through</h2>
    <p class="muted tiny">Choose one, then choose what it replaces.</p>
    <div class="sep"></div>
    <div class="reward-grid">
      ${m.faces.map((f, i) => `<div class="reward" onclick="pickFaceChoice(${i})">
        <div style="font-size:26px">${KIND[f.k].ic}</div>
        <div class="nm" style="color:${KIND[f.k].col}">${esc(faceLabel(f))}</div>
        <div class="ds">${esc(KIND[f.k].desc(f.v))}</div></div>`).join('')}
    </div>
    <div class="sep"></div>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" onclick="closeEvent()">Step back</button></div>`;
}
function pickFaceChoice(i){
  const m = UI.modal;
  installFace(m.faces[i], 'replace', m.after || closeEvent);
}

function mAncestral(m){
  if(!m.faces) m.faces = faceRewards(3);
  return `<h2>Ancestral Die</h2>
    <p class="muted">One hero’s die gains a seventh side. Choose what goes on it.</p>
    <div class="sep"></div>
    <div class="reward-grid">
      ${m.faces.map((f, i) => `<div class="reward" onclick="ancestralPick(${i})">
        <div style="font-size:26px">${KIND[f.k].ic}</div>
        <div class="nm" style="color:${KIND[f.k].col}">${esc(faceLabel(f))}</div>
        <div class="ds">${esc(KIND[f.k].desc(f.v))}</div></div>`).join('')}
    </div>`;
}
function ancestralPick(i){
  const m = UI.modal;
  installFace(m.faces[i], 'add', m.after || (() => { S.screen = 'map'; UI.modal = null; save(); render(); }));
}

function mShop(m){
  const row = (inner) => `<div class="panel" style="background:var(--card);padding:12px;margin-bottom:8px">${inner}</div>`;
  const faceRows = m.faces.map((it, i) => row(`<div class="spread">
      <div class="row">${faceHTML(it.face, 'big')}
        <div><b style="color:${KIND[it.face.k].col}">${esc(faceLabel(it.face))}</b>
        <div class="tiny muted">${esc(KIND[it.face.k].desc(it.face.v))}</div></div></div>
      <button class="btn sm ${S.gold >= it.price && !m.sold['f' + i] ? 'primary' : ''}" ${m.sold['f' + i] || S.gold < it.price ? 'disabled' : ''} onclick="buyFace(${i})">
        ${m.sold['f' + i] ? 'Sold' : it.price + 'g'}</button></div>`)).join('');
  const relicRow = m.relic ? row(`<div class="spread">
      <div class="row"><div style="font-size:26px">${relicDef(m.relic.key).ic}</div>
        <div><b>${esc(relicDef(m.relic.key).name)}</b><div class="tiny muted">${esc(relicDef(m.relic.key).desc)}</div></div></div>
      <button class="btn sm ${S.gold >= m.relic.price && !m.sold.relic ? 'primary' : ''}" ${m.sold.relic || S.gold < m.relic.price ? 'disabled' : ''} onclick="buyRelic()">
        ${m.sold.relic ? 'Sold' : m.relic.price + 'g'}</button></div>`) : '';
  const spellRow = (m.spells || []).map((it, i) => row(`<div class="spread">
      <div class="row"><div style="font-size:26px">📜</div>
        <div><b>${esc(spellDef(it.key).name)} <span style="color:var(--violet)">◆${spellDef(it.key).cost}</span></b>
        <div class="tiny muted">${esc(spellDef(it.key).desc)}</div></div></div>
      <button class="btn sm ${S.gold >= it.price && !m.sold['s' + i] ? 'primary' : ''}" ${m.sold['s' + i] || S.gold < it.price ? 'disabled' : ''} onclick="buySpell(${i})">
        ${m.sold['s' + i] ? 'Sold' : it.price + 'g'}</button></div>`)).join('');
  const rationRow = row(`<div class="spread">
      <div class="row"><div style="font-size:26px">🍖</div>
        <div><b>Hot meal</b><div class="tiny muted">Heal every hero 30% of max HP.</div></div></div>
      <button class="btn sm ${S.gold >= m.rations.price && !m.rations.used ? 'primary' : ''}" ${m.rations.used || S.gold < m.rations.price ? 'disabled' : ''} onclick="buyRations()">
        ${m.rations.used ? 'Eaten' : m.rations.price + 'g'}</button></div>`);
  return `<div class="spread"><h2>🏪 Merchant</h2><div class="stat">💰 <b>${S.gold}</b></div></div>
    <p class="muted tiny" style="margin-bottom:12px">${has('token') ? 'The Merchant’s Token has already knocked the prices down.' : 'He does not haggle.'}</p>
    ${faceRows}${relicRow}${spellRow}${rationRow}
    <div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeEvent()">Leave →</button></div>`;
}

function mCamp(){
  const pct = has('chirurgeon') ? 60 : 30;
  return `<h2>🔥 Camp fire</h2>
    <p class="muted tiny" style="margin-bottom:12px">One thing only.</p>
    <div class="col">
      <button class="opt" onclick="campRest()"><div class="t">Rest</div><div class="s">Heal every hero ${pct}% of their max HP.</div></button>
      <button class="opt" onclick="campForge()"><div class="t">Sharpen</div><div class="s">Permanently improve one die face.</div></button>
      <button class="opt" onclick="campDrill()"><div class="t">Drill</div><div class="s">+4 max HP to every hero, healed immediately.</div></button>
    </div>`;
}
function mForge(){
  return `<h2>Sharpen a face</h2>
    <p class="muted tiny" style="margin-bottom:10px">Click the face to improve. Blanks cannot be sharpened.</p>
    <div class="col">
      ${S.party.map(h => `<div class="panel" style="background:var(--card);padding:12px">
        <b>${h.av} ${esc(h.name)}</b>
        <div class="faces" style="margin-top:8px">${h.faces.map((f, i) =>
          faceHTML(f, 'big ' + (f.k === 'blank' ? '' : 'pickable'), f.k === 'blank' ? '' : `forgeFace(${h.uid},${i})`)).join('')}</div>
      </div>`).join('')}
    </div>
    <div class="sep"></div>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" onclick="closeEvent()">Never mind</button></div>`;
}
function mDrill(){
  return `<h2>Take the lesson</h2>
    <p class="muted tiny" style="margin-bottom:10px">+1 to every Strike face. That hero loses 4 max HP.</p>
    <div class="col">
      ${S.party.map(h => `<button class="opt" onclick="drillHero(${h.uid})">
        <div class="t">${h.av} ${esc(h.name)}</div>
        <div class="s">${h.faces.filter(f => f.k === 'dmg').length} Strike face(s) — ${h.maxHp} max HP</div></button>`).join('')}
    </div>
    <div class="sep"></div>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" onclick="closeEvent()">Never mind</button></div>`;
}
function mTreasure(m){
  return `<h2>📦 Treasure</h2>
    ${m.relic ? `<div class="panel" style="margin:12px 0;display:flex;gap:12px;align-items:center;background:var(--card)">
      <div style="font-size:28px">${relicDef(m.relic).ic}</div>
      <div><b>${esc(relicDef(m.relic).name)}</b><div class="tiny muted">${esc(relicDef(m.relic).desc)}</div></div></div>`
      : '<p class="muted">The chest has already been emptied.</p>'}
    <p class="muted">And <b style="color:var(--gold)">${m.gold} gold</b> in loose coin.</p>
    <div class="sep"></div>
    <div class="row" style="justify-content:flex-end"><button class="btn primary" onclick="afterTreasure()">Continue →</button></div>`;
}
function afterTreasure(){
  UI.modal = null;
  if(UI.pendingAncestral){ UI.pendingAncestral = false; UI.modal = { type:'ancestral', after: afterTreasure }; render(); return; }
  S.screen = 'map'; save(); render();
}
function mEvent(m){
  const ev = m.ev;
  return `<h2>${ev.ic} ${esc(ev.name)}</h2>
    <p class="muted" style="margin:8px 0 14px">${esc(ev.text)}</p>
    <div class="col">
      ${ev.choices.map((c, i) => {
        const ok = !c.req || c.req();
        return `<button class="opt" ${ok ? '' : 'disabled'} onclick="eventChoice(${i})">
          <div class="t">${esc(c.t)}</div><div class="s">${esc(c.s)}${ok ? '' : ' — you cannot afford this'}</div></button>`;
      }).join('')}
    </div>`;
}
function eventChoice(i){
  const c = UI.modal.ev.choices[i];
  if(c.req && !c.req()) return;
  UI.modal = null;
  c.go();
}
function mResult(m){
  return `<h2>Well then</h2><p class="muted" style="margin:10px 0 14px">${esc(m.text)}</p>
    <div class="row" style="justify-content:flex-end"><button class="btn primary" onclick="closeEvent()">Continue →</button></div>`;
}
function mAct(m){
  return `<h2>Act ${m.act}</h2>
    <p class="muted" style="margin:10px 0 14px">The stair keeps going. Everything here hits harder.</p>
    <div class="row" style="justify-content:flex-end"><button class="btn primary" onclick="closeEvent()">Climb →</button></div>`;
}

/* ============================================================================
   EFFECTS, TOOLTIPS, INPUT, BOOT
   ========================================================================== */
UI.floats = [];
function floatOn(uidv, text, color){ UI.floats.push({ uid:uidv, text, color }); }
function flushFloats(){
  if(!UI.floats.length) return;
  const q = UI.floats; UI.floats = [];
  q.forEach((f, i) => {
    const node = document.querySelector(`[data-uid="${f.uid}"]`);
    if(!node) return;
    node.classList.remove('hit'); void node.offsetWidth; node.classList.add('hit');
    const r = node.getBoundingClientRect();
    const d = document.createElement('div');
    d.className = 'float';
    d.textContent = f.text;
    d.style.color = f.color;
    d.style.left = (r.left + r.width / 2) + 'px';
    d.style.top = (r.top + 26 + (i % 3) * 14) + 'px';
    el('fx').appendChild(d);
    setTimeout(() => d.remove(), 950);
  });
}

const tip = () => el('tip');
document.addEventListener('mousemove', e => {
  const t = e.target.closest ? e.target.closest('[data-tip]') : null;
  if(!t){ tip().classList.remove('on'); return; }
  const [title, body] = t.getAttribute('data-tip').split('|');
  tip().innerHTML = `<b>${esc(title)}</b>${body ? esc(body) : ''}`;
  tip().classList.add('on');
  const w = 260;
  let x = e.clientX + 16, y = e.clientY + 16;
  if(x + w > window.innerWidth - 10) x = window.innerWidth - w - 10;
  if(y + 110 > window.innerHeight) y = e.clientY - 110;
  tip().style.left = x + 'px';
  tip().style.top = Math.max(8, y) + 'px';
}, {passive:true});
document.addEventListener('mouseleave', () => tip().classList.remove('on'));

document.addEventListener('keydown', e => {
  if(!S || S.screen !== 'combat' || !C || C.over) return;
  if(e.key === 'Escape'){ C.pending = null; C.rerollMode = false; C.dice.forEach(d => d.mark = false); render(); return; }
  if(UI.modal) return;
  if(e.key === 'r' || e.key === 'R'){ if(C.rerolls > 0 && C.dice.length) toggleReroll(); return; }
  if(e.key === 'Enter'){ endTurn(); return; }
  const n = parseInt(e.key, 10);
  if(n >= 1 && n <= C.dice.length){ clickDie(n - 1); }
});

/* boot */
(function boot(){
  if(localStorage.getItem(SAVE_KEY)) { /* offer resume from the title screen */ }
  render();
})();
</script>
