/* A reward pool with fixed numbers goes dead: by act three a forged die beats
   everything on offer and every reward screen is a "Take none". What is
   offered now grows with how far up the spire it is found. Flat effects --
   Stun, Dominate, Summon, Empower, Focus -- never scale, because a turn is a
   turn however deep you are. */
const FULL_SCALE = ['dmg','shield','heal','guard','regen','leech'];
const HALF_SCALE = ['dmgAll','shieldAll','poison','burn'];
function rewardStep(){
  const tier = (S ? S.act : 1) - 1;
  const deep = (S && S.pos) ? S.pos.floor / (FLOORS - 2) : 0;
  return Math.round(tier * 2 + deep * 2);
}
function scaleFace(f){
  const st = rewardStep();
  if(!st) return f;
  if(FULL_SCALE.includes(f.k)) return { k:f.k, v:f.v + st };
  if(HALF_SCALE.includes(f.k)) return { k:f.k, v:f.v + Math.ceil(st / 2) };
  return f;
}
function rollFaceReward(){
  /* a Dominate face is worthless to a party with no Sorcerer, so it is never
     offered to one; likewise a second control face for a hero already holding
     one has nowhere to go */
  const pool = FACE_POOL.filter(o => {
    const owners = ownersOf(o.f.k);
    if(owners && S && !S.party.some(h => owners.includes(h.key))) return false;
    if(isControl(o.f.k) && S && !S.party.some(h => canTakeFace(h, o.f.k) && controlFaces(h) === 0)) return false;
    if(o.minAct && S && S.act < o.minAct) return false;
    if(o.need && S && !o.need()) return false;    /* a rite nobody can use is not a reward */
    return true;
  });
  const use = pool.length ? pool : FACE_POOL.filter(o => !signatureOwner(o.f.k));
  const total = use.reduce((s,o)=>s+o.w,0);
  let n = rnd(total);
  for(const o of use){ n -= o.w; if(n < 0) return scaleFace(o.f); }
  return scaleFace(F('dmg',4));
}
function faceRewards(n){
  const out = [];
  let guard = 0;
  while(out.length < n && guard++ < 200){
    const f = rollFaceReward();
    if(!out.some(o => o.k === f.k && o.v === f.v)) out.push(f);
  }
  return out;
}
const facePrice = f => {
  if(isSigil(f.k)) return SIGILS[f.k].price;
  const base = {dmg:11, dmgAll:17, burn:22, shield:10, shieldAll:18, heal:11, poison:13, stun:34, charm:44, daze:30, summon:38, guard:20, regen:14, leech:16, echo:40, mana:16, power:26, blank:0}[f.k];
  return Math.round(20 + base * Math.max(1, f.v) * 0.9);
};

/* ============================================================================
   RUN STATE
   ========================================================================== */
const SAVE_KEY = 'dicespire.run.v1';
const MIN_FACES = 4;        /* a die may never be ground below four sides     */
let S = null;   /* run state  */
let C = null;   /* combat state, null outside combat */
let UI = { modal:null, anim:true };

function newRun(heroKeys){
  S = {
    act: 1,
    banner: heroKeys[0],        /* the first hero picked carries it */
    party: heroKeys.map(k => {
      const h = HEROES.find(x => x.key === k);
      return { uid:uid(), key:h.key, name:h.name, av:h.av, maxHp:h.hp, hp:h.hp,
               faces:h.faces.map(f => ({...f})), shield:0, power:0, poison:0, burn:0, regen:0, charmed:0, steeled:0, guarding:false, charge:0, downed:false,
               level:1, xp:0, perks:[],
               gear:{weapon:null, armour:null, trinket:null} };
    }),
    gold: 60,
    relics: [],
    /* each hero brings their signature spell, so a run opens with three */
    spells: [...new Set(heroKeys.map(k => HEROES.find(h => h.key === k).spell))],
    map: null,
    pos: null,          /* {floor, slot} of the node we are standing on */
    visited: [],
    screen: 'map',
    removals: 0,
    bag: [],
    nextFight: null,
    fate: 3,
    talisman: false,
    kills: 0,
    elitesKilled: 0,
    turnsPlayed: 0,
    started: Date.now()
  };
  buildMap();
  save();
  render();
}

/* -------------------------------------------------------- map generation ---
   Slay the Spire's approach: walk several independent paths from the bottom
   floor to the top, each drifting at most one slot per step. The union of the
   paths is the map, which guarantees every node is reachable and every node
   leads somewhere.                                                          */
const FLOORS = 17;         /* index 0..16; the top floor is always the boss   */
const SLOTS  = 5;
const PATHS  = 4;
/* landmarks, placed proportionally so they stay sensible if FLOORS changes */
const TREASURE_FLOOR = Math.round((FLOORS - 1) * 0.30);
const MID_REST       = Math.round((FLOORS - 1) * 0.50);
const SHOP_FLOOR     = Math.round((FLOORS - 1) * 0.70);

function buildMap(){
  const nodes = {};                       /* "floor,slot" -> node            */
  const key = (f,s) => f + ',' + s;
  const edges = new Set();

  for(let p = 0; p < PATHS; p++){
    let slot = rnd(SLOTS);
    for(let f = 0; f < FLOORS - 1; f++){
      if(!nodes[key(f,slot)]) nodes[key(f,slot)] = { floor:f, slot, type:null, seen:false, done:false };
      let next = f === FLOORS - 2 ? 2 : clamp(slot + (rnd(3) - 1), 0, SLOTS - 1);
      if(!nodes[key(f+1,next)]) nodes[key(f+1,next)] = { floor:f+1, slot:next, type:null, seen:false, done:false };
      edges.add(key(f,slot) + '>' + key(f+1,next));
      slot = next;
    }
  }
  /* the boss sits alone on the top floor */
  Object.keys(nodes).forEach(k => { if(nodes[k].floor === FLOORS - 1) delete nodes[k]; });
  nodes[key(FLOORS-1,2)] = { floor:FLOORS-1, slot:2, type:'boss', seen:false, done:false };
  [...edges].forEach(e => {
    const [,to] = e.split('>');
    if(!nodes[to]) edges.delete(e);
  });

  /* type assignment */
  const list = Object.values(nodes).sort((a,b) => a.floor - b.floor || a.slot - b.slot);
  for(const n of list){
    if(n.type) continue;
    if(n.floor === 0)            { n.type = 'combat'; continue; }
    if(n.floor === FLOORS - 2)   { n.type = 'rest';   continue; }
    if(n.floor === TREASURE_FLOOR){ n.type = 'treasure'; continue; }
    if(n.floor === SHOP_FLOOR)   { n.type = 'shop';   continue; }
    if(n.floor === MID_REST)     { n.type = 'rest';   continue; }
    const r = Math.random();
    /* The deck only matters if you see it. At the old weight a whole run drew
       about 2.6 cards, so rebalancing its odds moved nothing. Adventure is now
       roughly a fifth of all rooms, which is where its risk starts to bite. */
    if(n.floor >= 3 && r < 0.14)      n.type = 'elite';
    else if(r < 0.38)                 n.type = 'adventure';
    else if(r < 0.44)                 n.type = 'event';
    else if(r < 0.47)                 n.type = 'rest';
    else if(r < 0.51)                 n.type = 'shop';
    else if(r < 0.53)                 n.type = 'treasure';
    else                              n.type = 'combat';
  }
  S.map = { nodes, edges:[...edges] };
  S.pos = null;
  S.visited = [];
}

const NODE_ART = {
  combat:  {ic:'⚔️', label:'Combat'},
  elite:   {ic:'👹', label:'Elite'},
  event:   {ic:'❓',       label:'Unknown'},
  adventure:{ic:'🃏',      label:'Adventure'},
  shop:    {ic:'🏪', label:'Merchant'},
  rest:    {ic:'🔥', label:'Camp fire'},
  treasure:{ic:'📦', label:'Treasure'},
  boss:    {ic:'👑', label:'Boss'}
};

function nodeAt(f,s){ return S.map.nodes[f + ',' + s]; }
function availableNodes(){
  if(!S.pos) return Object.values(S.map.nodes).filter(n => n.floor === 0);
  const from = S.pos.floor + ',' + S.pos.slot;
  return S.map.edges
    .filter(e => e.startsWith(from + '>'))
    .map(e => S.map.nodes[e.split('>')[1]])
    .filter(Boolean);
}

/* ------------------------------------------------------------- persistence */
function save(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify({S, C})); }catch(e){}
}
function loadSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    const d = JSON.parse(raw);
    if(!d || !d.S || !d.S.party) return false;
    S = d.S; C = d.C || null;
    if(S.map && S.map.nodes) return true;
    return false;
  }catch(e){ return false; }
}
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }

/* ------------------------------------------------------------ relic helpers */
const has = k => S.relics.includes(k);
function grantRelic(k){
  if(has(k)) return false;
  S.relics.push(k);
  if(k === 'ancestral') UI.pendingAncestral = true;
  return true;
}
function relicPool(tier){
  const owned = new Set(S.relics);
  let pool = RELICS.filter(r => !owned.has(r.key) && r.tier === tier);
  if(!pool.length) pool = RELICS.filter(r => !owned.has(r.key) && r.tier !== 'boss');
  if(!pool.length) pool = RELICS.filter(r => !owned.has(r.key));
  return pool;
}
function randomRelic(tier){
  const pool = relicPool(tier || (Math.random() < 0.22 ? 'rare' : Math.random() < 0.5 ? 'uncommon' : 'common'));
  return pool.length ? pick(pool).key : null;
}

/* --------------------------------------------------------- face value maths */
function faceValue(hero, f){
  let v = f.v;
  if(f.k === 'dmg' || f.k === 'dmgAll'){
    v += hero.power || 0;
    if(has('whetstone')) v += 1;
    v += gearMod(hero, 'dmg');
    if(f.k === 'dmgAll') v += gearMod(hero, 'cleave');
    if(setActive('drake') && GEAR_SLOTS.some(sl => hero.gear && hero.gear[sl] === 'dragontooth')) v += 2;
  }
  if(f.k === 'shield' || f.k === 'shieldAll'){ if(has('towershield')) v += 1; v += gearMod(hero, 'shield'); }
  if(f.k === 'heal'){   if(has('verdant'))   v += 1; v += gearMod(hero, 'heal'); }
  if(f.k === 'poison'){ if(has('venomsac'))  v += 1; v += gearMod(hero, 'poison'); }
  if(f.k === 'burn'){   if(has('emberbrand'))v += 1; v += gearMod(hero, 'burn'); }
  if(f.k === 'dmg'  && hasPerk(hero, 'd3')) v += 1;          /* Footwork    */
  if(f.k === 'heal' && hasPerk(hero, 'w3')) v += 2;          /* Greenwood   */
  if(f.k === 'burn' && hasPerk(hero, 'p3')) v += 1;          /* Ashes       */
  if(f.k === 'poison' && hasPerk(hero, 'n1')) v += 2;        /* Potent      */
  if(f.k === 'mana' && hasPerk(hero, 's3')) v += 1;          /* Deep Well   */
  if(f.k === 'power' && hasPerk(hero, 'h2')) v += 1;         /* Fanfare     */
  if(f.k === 'daze')  v += gearMod(hero, 'daze');
  if(f.k === 'charm') v += gearMod(hero, 'charm');
  if(f.k !== 'blank' && !isSigil(f.k)) v += glob('allFaces');
  return Math.max(0, v);
}
const frontRank = () => livingEnemies().filter(e => !e.rank);
/* with the front rank gone there is nothing left to hide behind */
const inReach = (e, k) => !e.rank || reaches(k) || !frontRank().length;
function advanceRanks(){
  if(!C || frontRank().length) return;
  const rear = livingEnemies().filter(e => e.rank);
  if(!rear.length) return;
  rear.forEach(e => { e.rank = 0; floatOn(e.uid, 'FORWARD', 'var(--gold)'); });
  logc(rear.length === 1 ? `${rear[0].name} steps up into the gap.`
                         : 'What was hiding behind the line steps up into the gap.');
}
const livingHeroes  = () => S.party.filter(h => !h.downed);
const livingEnemies = () => C ? C.enemies.filter(e => e.hp > 0) : [];

/* ============================================================================
   COMBAT
   ========================================================================== */
function scaleMoves(def, act, depth){
  const d = depth === undefined ? 1 : depth;
  const dm = ACT_DMG[act] * (def.dmgW || 1) * d;
  return def.moves.map(m => {
    let v;
    if(m.k === 'block' || m.k === 'heal') v = m.v * ACT_HP[act] * d; /* defence tracks the HP curve */
    else if(m.k === 'buff' || m.k === 'poison' || m.k === 'burn' ||
            m.k === 'charm' || m.k === 'summon') v = m.v;          /* stacking effects never scale */
    else v = m.v * dm;
    return { k:m.k, v:Math.max(1, Math.round(v)) };
  });
}
function depthMul(){
  if(!S.pos) return 1;
  return 1 + 0.55 * (S.pos.floor / (FLOORS - 2));
}
function makeEnemy(def, act, depth, opts){
  opts = opts || {};
  const d = depth === undefined ? depthMul() : depth;
  let hp = Math.max(4, Math.round(def.hp * ACT_HP[act] * d));
  const e = {
    uid: uid(), key:def.key, name:def.name, av:def.av,
    maxHp:hp, hp, shield:0, poison:0, burn:0, stun:0, charm:0, steeled:0, weak:0, power:0, trait:null,
    moves: scaleMoves(def, act, d), mi: 0, intent:null,
    elite: !!def.elite, boss: !!def.boss, item:null, champion:false, phase:0,
    rank: 0, back: !!def.back
  };
  /* a champion is an ordinary monster that got lucky: bigger, meaner, armed */
  if(opts.champion){
    e.champion = true;
    e.name = pick(['Scarred','Hulking','Ancient','Dread','Gilded']) + ' ' + e.name;
    e.maxHp = Math.round(e.maxHp * 1.3); e.hp = e.maxHp;
    e.moves = e.moves.map(m => (m.k === 'attack' || m.k === 'attackAll')
      ? { k:m.k, v: Math.max(1, Math.round(m.v * 1.12)) } : m);
  }
  /* traits arrive as the spire deepens, and never in the opening room */
  const tierIdx = clamp(act - 1, 0, 2);
  const traitChance = opts.trait === false ? 0
    : e.boss ? 1 : e.elite ? 0.55 : (act === 1 ? 0.12 : act === 2 ? 0.26 : 0.34);
  if(Math.random() < traitChance){
    const keys = Object.keys(TRAITS).filter(k => {
      if(k === 'linked') return false;                 /* placed in pairs, below */
      if(k === 'shelled' && !def.moves.some(m => m.k === 'block')) return false;
      return true;
    });
    const k = pick(keys);
    e.trait = { k, v: TRAITS[k].v[tierIdx] || TRAITS[k].v[0] };
    if(k === 'shelled') e.shield += Math.round(8 * ACT_HP[act]);
    if(k === 'armoured') e.maxHp = Math.round(e.maxHp * 0.85), e.hp = e.maxHp;  /* it is tough enough already */
  }
  const wants = opts.item !== undefined ? opts.item
              : (e.boss || e.elite || e.champion) ? true : Math.random() < 0.08;
  if(wants){
    const tier = e.boss ? 3 : (e.elite || e.champion) ? (Math.random() < 0.25 ? 3 : 2) : 1;
    const pool = ENEMY_GEAR.filter(k => itemDef(k).tier === tier);
    e.item = pick(pool.length ? pool : ENEMY_GEAR);
    const bonusHp = enemyItemMod(e, 'maxHp');
    if(bonusHp > 0){ e.maxHp += bonusHp * 2; e.hp = e.maxHp; }
  }
  return e;
}
function buildEncounter(type){
  const act = S.act;
  if(type === 'boss')  return [ makeEnemy(BOSSES[clamp(act,1,3) - 1], act, 1) ];
  if(type === 'elite') return [ makeEnemy(pick(ELITES), act) ];
  let pool = BESTIARY.filter(b => b.acts.includes(act));
  /* the opening room of each act is a soft landing: weakest archetypes only */
  const opening = S.pos && S.pos.floor === 0;
  if(opening){
    const soft = pool.filter(b => b.hp <= 9);
    if(soft.length) pool = soft;
  }
  const n = opening ? pick([1,2]) : pick({1:[1,2,2], 2:[2,2,3], 3:[2,2,3]}[act] || [2,2,3]);
  const out = [];
  /* deeper in an act, one of them is likely to be something that grew */
  const champChance = opening ? 0 : 0.06 + 0.15 * ((S.pos ? S.pos.floor : 0) / (FLOORS - 2));
  for(let i = 0; i < n; i++) out.push(makeEnemy(pick(pool), act, undefined,
    { champion: Math.random() < champChance, trait: opening ? false : undefined }));
  /* Linked only means anything in a pair, so it is placed rather than rolled */
  if(!opening && out.length >= 2 && !out.some(e => e.trait) && Math.random() < (act === 1 ? 0.06 : 0.14)){
    out[0].trait = { k:'linked', v:0, anchor: out[1].uid };   /* only the protected one */
  }
  /* a lone normal enemy would be a pushover: give it a boost */
  if(n === 1 && !opening){ out[0].maxHp = Math.round(out[0].maxHp * 1.45); out[0].hp = out[0].maxHp; }
  layOutRanks(out);
  /* A Linked anchor standing in the back rank would be unreachable to a party
     with nothing but Strikes, and the thing it protects takes nothing while it
     lives: that is an unwinnable fight. The anchor always holds the line. */
  const prot = out.find(e => e.trait && e.trait.k === 'linked');
  if(prot){ const anchor = out.find(e => e.uid === prot.trait.anchor); if(anchor) anchor.rank = 0; }
  return out;
}
/* Supports fall back behind whatever can hold a line. Somebody always holds
   the line, so a party that can only reach the front is never left with
   nothing to hit. */
function layOutRanks(list){
  /* act one is the act you learn in: no ranks there, the same rule that keeps
     sieges out of it */
  if(list.length < 2 || (S && S.act < 2)){ list.forEach(e => e.rank = 0); return list; }
  const holders = list.filter(e => !e.back);
  list.forEach(e => { e.rank = (e.back && holders.length) ? 1 : 0; });
  return list;
}

/* ------------------------------------------------------------------- waves */
/* A big fight is a siege, not one exchange. Kill what is in front of you and
   more comes up the stair; stall, and it comes anyway, on top of what is
   already there. That is what the clock is for -- a long fight has to be a
   dangerous fight, or every standing rule you laid down would just be free. */
const WAVE_CLOCK = 6;
function buildWaves(type){
  const act = S.act;
  /* what comes up the stair is a reinforcement, not a second encounter: it
     arrives weaker than what you are already fighting */
  const mk = n => {
    const pool = BESTIARY.filter(b => b.acts.includes(act));
    const list = [];
    for(let i = 0; i < n; i++) list.push(makeEnemy(pick(pool), act, depthMul() * 0.8, { item:false, trait:false }));
    return list;
  };
  /* act one is where the run is still being learned: no sieges there */
  if(act === 1) return [];
  if(type === 'boss')  return act === 3 ? [mk(2)] : [];
  if(type === 'elite') return [mk(act === 3 ? 2 : 1)];
  return [];
}
/* the next wave arrives: behind the line if there is still a line, in front of
   you if there is not */
function sendWave(early){
  if(!C.waves || !C.waves.length) return false;
  const wave = C.waves.shift();
  /* while a line is still holding, what arrives queues up behind it */
  const holding = !!frontRank().length;
  if(holding) wave.forEach(e => { e.rank = 1; });
  else layOutRanks(wave);
  C.enemies = C.enemies.concat(wave);
  C.press = WAVE_CLOCK;
  C.waveNo = (C.waveNo || 1) + 1;
  C.phaseBanner = early ? 'The stair fills' : 'More comes up the stair';
  logc(early ? `The stair fills behind them. ${wave.length === 1 ? 'Something else' : 'More'} arrives before you are done.`
             : `${wave.length === 1 ? 'Something else' : 'More'} comes up the stair.`);
  wave.forEach(e => floatOn(e.uid, 'ARRIVES', 'var(--gold)'));
  setIntents(wave);
  return true;
}
/* true only when the field is clear AND nothing is left to come */
function fieldCleared(){
  if(livingEnemies().length) return false;
  if(C.waves && C.waves.length) return !sendWave(false);
  return true;
}
/* the clock: stalling is not free */
function tickPress(){
  if(!C.press) return;
  C.press--;
  if(C.press > 0) return;
  if(C.waves && C.waves.length){ sendWave(true); return; }
  /* twice only -- the clock is there to stop you stalling, not to run the
     fight up until it kills you on its own */
  if((C.pressed || 0) >= 2){ C.press = 0; return; }
  C.pressed = (C.pressed || 0) + 1;
  C.press = WAVE_CLOCK;
  livingEnemies().forEach(e => { e.power += 2; floatOn(e.uid, '+2 POW', 'var(--pink)'); });
  logc('The spire presses. Everything still standing grows stronger.');
}

function makeThrall(v){
  const bond = partyPerk('s2') ? 1 : 0;
  const hp = 5 + 3 * v + glob('thrallHp') + bond * 5;
  return { uid:uid(), name:'Thrall', av:'🌀', isSummon:true, turns:2 + v + glob('thrallTurns') + bond * 2,
           maxHp:hp, hp, shield:0, power:0, poison:0, downed:false,
           faces:[F('dmg',2+v),F('dmg',1+v),F('dmg',2+v),F('shield',1+v),F('blank'),F('blank')] };
}

function startCombat(type){
  C = {
    type,
    enemies: buildEncounter(type),
    dice: [],
    turn: 0,
    mana: (has('clover') ? 2 : 0) + glob('manaCombat') + (banner('sorcerer') ? 2 : 0),
    summons: [],
    rerolls: 0,
    rerollMode: false,
    pending: null,
    spellsUsed: [],
    sigils: {},                        /* rites laid down in THIS fight only */
    echoUsed: 0,
    waves: [],
    waveNo: 1,
    press: 0,
    pressed: 0,
    drops: [],
    phaseBanner: null,
    log: [],
    over: null
  };
  S.party.forEach(h => {
    h.shield = 0; h.poison = 0; h.burn = 0; h.charmed = 0; h.regen = 0; h.steeled = 0; h.guarding = false;
    h.charge = 0;                      /* momentum is built inside a fight, not hoarded between them */
    h.struck = false;                  /* for Opening, the Duelist's first blow */
    h.bannerHit = false;               /* Banner of the Edge, once per hero per fight */
    /* Standing Order keeps what the Herald built; everyone else starts clean */
    h.power = (partyPerk('h1') ? (h.power || 0) : 0) + (has('warhorn') ? 1 : 0) + (banner('herald') ? 1 : 0);
    if(h.hp <= 0){ h.hp = 1; }
    h.downed = h.hp <= 0;
  });
  C.waves = buildWaves(type);
  C.press = C.waves.length ? WAVE_CLOCK : 0;
  logc(type === 'boss' ? 'A boss blocks the stair.' : type === 'elite' ? 'Something big is waiting.' : 'Enemies close in.');
  if(C.waves.length) logc(`This is a siege. ${C.waves.length === 1 ? 'Another wave is' : C.waves.length + ' more waves are'} behind them.`);
  if(S.nextFight && S.nextFight.poison){
    S.party.forEach(h => { h.poison += S.nextFight.poison; });
    logc(`Whatever you picked up back there is still in your blood. ${S.nextFight.poison} poison on everyone.`);
    S.nextFight = null;
  }
  beginPlayerTurn();
}

function logc(t){ if(!C) return; C.log.push(t); if(C.log.length > 60) C.log.shift(); }

function maxRerolls(){ return 2 + (has('loadeddice') ? 1 : 0) + glob('rerolls') + sigil('sigTempo'); }

function beginPlayerTurn(){
  C.turn++;
  S.turnsPlayed++;
  /* shields fade between turns */
  allies().forEach(h => {
    const keepHalf = has('bulwark') || hasPerk(h, 'v4');       /* Second Shield */
    h.shield = keepHalf ? Math.floor(h.shield / 2) : 0;
    h.guarding = false;
    /* Opening shield belongs HERE, not in startCombat: that runs before the
       first turn begins, and the fade above then wiped it before anyone saw
       it. Quartermaster had silently done nothing since it was written. */
    if(C.turn === 1 && (hasPerk(h, 'h3') || partyPerk('h3') || banner('vanguard')))
      h.shield = Math.max(h.shield, 3);
  });
  C.mana += (has('wellspring') ? 1 : 0) + glob('manaTurn') + (partyPerk('p4') ? 1 : 0) + (setActive('mind') ? 1 : 0)
          + sigil('sigWell');
  const aegisRite = sigil('sigAegis');
  if(aegisRite){
    livingAllies().forEach(h => { h.shield += 2 * aegisRite; });
    logc(`The Rite of Aegis holds. Every hero gains ${2 * aegisRite} shield.`);
  }
  if(has('sundial') && C.turn % 3 === 0){
    livingAllies().forEach(h => h.shield += 4);
    logc('The Sundial turns. Every hero gains 4 shield.');
  }
  if(C.summons.length){
    C.summons.forEach(t => { t.turns--; });
    const spent = C.summons.filter(t => t.turns <= 0);
    spent.forEach(t => logc(`${t.name} fades.`));
    C.summons = C.summons.filter(t => t.turns > 0);
  }
  C.phaseBanner = null;
  advanceRanks();
  C.rerolls = maxRerolls();
  C.echoUsed = 0;
  C.rerollMode = false;
  C.pending = null;
  rollAll();
  /* the roll has now passed them by, so their hold ends here */
  S.party.forEach(h => { if(h.charmed > 0) h.charmed--; });
  setIntents();
  save();
}

function rollAll(){
  C.dice = rollingAllies().map(h => {
    const f = h.faces[rnd(h.faces.length)];
    return { id:uid(), ownerUid:h.uid, k:f.k, v:f.v, r:f.r || null, used:false, mark:false, fresh:true };
  });
}
function rerollMarked(){
  const marked = C.dice.filter(d => d.mark && !d.used);
  if(!marked.length || C.rerolls <= 0) return;
  C.rerolls--;
  marked.forEach(d => {
    const h = unitByUid(d.ownerUid);
    if(!h) return;
    const f = h.faces[rnd(h.faces.length)];
    d.k = f.k; d.v = f.v; d.r = f.r || null; d.mark = false; d.fresh = true;
  });
  logc(`Rerolled ${marked.length} ${marked.length === 1 ? 'die' : 'dice'}.`);
  C.rerollMode = C.rerolls > 0;
  render();
}
const heroByUid  = u => S.party.find(h => h.uid === u);
/* An "ally" is anything that fights on your side: the party, plus any Thralls
   the Sorcerer has called up. Summons roll their own die, can be shielded and
   healed, and soak enemy attacks -- but only the PARTY dying ends a run, so
   livingHeroes stays party-only and is what every defeat check reads. */
const summons     = () => (C && C.summons) ? C.summons : [];
const allies      = () => S.party.concat(summons());
const livingAllies= () => allies().filter(a => !a.downed && a.hp > 0);
/* dominated heroes are still alive and still targetable, they just are not
   yours this turn, so they are excluded from the roll and nothing else */
const rollingAllies = () => livingAllies().filter(a => !a.charmed);
const unitByUid   = u => allies().find(a => a.uid === u);
const enemyByUid = u => C.enemies.find(e => e.uid === u);

/* `only` sets intents for a subset -- a wave arriving mid-turn must not
   re-roll what the enemies already on the field have telegraphed */
function setIntents(only){
  (only || livingEnemies()).forEach(e => {
    if(e.charm > 0){
      /* Under control it ignores its own script and swings at its own side,
         using the best attack it knows. Alone in the room there is nothing to
         turn on, which is why domination is a crowd tool and not a boss tool. */
      const atks = e.moves.filter(m => m.k === 'attack' || m.k === 'attackAll').map(m => m.v);
      const best = atks.length ? Math.max(...atks) : Math.max(1, Math.round(e.maxHp * 0.15));
      const others = livingEnemies().filter(x => x !== e);
      e.intent = { k:'charmed', v: best + (e.power || 0), tgt: others.length ? pick(others).uid : null };
      return;
    }
    const m = e.moves[e.mi % e.moves.length];
    e.mi++;
    let tgt = null;
    if(m.k === 'attack' || m.k === 'poison' || m.k === 'burn' || m.k === 'drain'){
      const opts = livingAllies();
      tgt = opts.length ? pick(opts).uid : null;
    }
    if(m.k === 'charm'){
      const opts = livingAllies().filter(a => !a.isSummon && !a.charmed);
      tgt = opts.length ? pick(opts).uid : null;
      if(!tgt){ e.intent = { k:'attack', v:m.v * 4, tgt:(livingAllies()[0]||{}).uid || null }; return; }
    }
    e.intent = { k:m.k, v:m.v, tgt };
  });
}

/* Restricting who may carry control faces limits how MANY you can throw, but
   one hero with rerolls can still find a Stun most turns. This is what stops
   a lock outright: after an enemy comes round it braces, and for as long as it
   is braced nothing can take its turn away again. Control becomes a way to
   buy a turn at the moment you need it, not a way to end the fight. */
function tryControl(e, kind, v, byName){
  if(e.steeled > 0){
    floatOn(e.uid, 'RESISTS', 'var(--ink-dim)');
    logc(`${e.name} shakes it off. It is still braced.`);
    return false;
  }
  if(kind === 'stun') e.stun += v; else e.charm += v;
  e.steeled = v + 1;                       /* the effect, then a turn of grace */
  floatOn(e.uid, kind === 'stun' ? 'STUN' : 'MINE', kind === 'stun' ? 'var(--gold)' : 'var(--violet)');
  logc(`${byName} ${kind === 'stun' ? 'stuns' : 'seizes'} ${e.name}.`);
  return true;
}

/* ------------------------------------------------------------------ damage */
const enemyAtk = (e, base) => e.weak > 0 ? Math.max(1, Math.ceil(base / 2)) : base;
/* Struck damage: what a Strike, Cleave, spell or thrown flask does. Venom and
   Ignite go straight to hurtEnemy and are deliberately untouched by armour and
   by Ethereal, which is what makes a status build the answer to those two. */
function heroDamageToEnemy(e, n, pierce){
  if(has('seal') && e.hp <= e.maxHp * 0.3) n += 4;
  if(hasTrait(e, 'ethereal') && !setActive('drake')) n = Math.ceil(n / 2);
  if(hasTrait(e, 'armoured') && !pierce) n = Math.max(0, n - e.trait.v);
  if(n <= 0){
    floatOn(e.uid, 'NO', 'var(--ink-dim)');
    return 0;
  }
  return hurtEnemy(e, n);
}
function hurtEnemy(e, n, ignoreShield){
  if(e.hp <= 0 || n <= 0) return 0;
  if(hasTrait(e, 'linked')){
    const anchor = C.enemies.find(x => x.uid === e.trait.anchor);
    if(anchor && anchor.hp > 0){
      floatOn(e.uid, 'LINKED', 'var(--violet)');
      logc(`The link holds while ${anchor.name} stands. ${e.name} takes nothing.`);
      return 0;
    }
  }
  let left = n;
  /* capped at 2: a monster in full Dragonscale was eating most of a turn */
  const armour = Math.min(2, enemyItemMod(e, 'armour'));
  if(armour > 0 && !ignoreShield) left = Math.max(0, left - armour);
  const shellHeld = hasTrait(e, 'shelled') && e.shield > 0;
  if(!ignoreShield && e.shield > 0){
    const a = Math.min(e.shield, left);
    e.shield -= a; left -= a;
  }
  if(shellHeld){
    floatOn(e.uid, 'SHELL', 'var(--cyan)');
    return n;                                /* the shell eats the overflow too */
  }
  e.hp = Math.max(0, e.hp - left);
  e.tookThisRound = (e.tookThisRound || 0) + left;
  floatOn(e.uid, '-' + n, 'var(--red)');
  if(e.boss && e.hp > 0) checkBossPhase(e);
  if(e.hp === 0){
    logc(`${e.name} falls.`); S.kills++; if(e.elite) S.elitesKilled++;
    advanceRanks();
    if(e.item){ C.drops.push(e.item); logc(`It drops its ${itemDef(e.item).name}.`); e.item = null; }
    if(hasTrait(e, 'volatile')){
      const blast = e.trait.v;
      logc(`${e.name} bursts for ${blast}.`);
      livingAllies().slice().forEach(h => hurtHero(h, blast, {ignoreShield:false}));
    }
  }
  return n;
}
function hurtHero(h, n, opts){
  opts = opts || {};
  if(h.downed || n <= 0) return;
  let left = n;
  if(!opts.ignoreArmour){
    const armour = gearMod(h, 'armour') + (setActive('warden') ? 1 : 0);
    if(armour > 0) left = Math.max(0, left - armour);   /* worn plate soaks before shields */
  }
  if(!opts.ignoreShield && h.shield > 0){
    const a = Math.min(h.shield, left);
    h.shield -= a; left -= a;
  }
  const dealt = left;
  h.hp = Math.max(0, h.hp - left);
  if(dealt > 0 || n > 0) floatOn(h.uid, '-' + Math.max(dealt, 0), 'var(--red)');
  if(h.hp === 0){
    if(h.isSummon){
      logc(`${h.name} unravels.`);
      C.summons = C.summons.filter(x => x !== h);
    } else {
      h.downed = true;
      logc(`${h.name} goes down.`);
    }
    C.dice = C.dice.filter(d => d.ownerUid !== h.uid || d.used);
  }
}
function healHero(h, n){
  if(glob('greedfrail')) n = Math.floor(n * 0.6);      /* Ring of Greed */
  if(h.downed || n <= 0) return;
  const before = h.hp;
  h.hp = Math.min(h.maxHp, h.hp + n);
  if(h.hp > before) floatOn(h.uid, '+' + (h.hp - before), 'var(--green)');
}

/* ------------------------------------------------------- player actions --- */
function clickDie(i){
  const d = C.dice[i];
  if(!d || d.used || C.over) return;
  if(C.rerollMode){ d.mark = !d.mark; render(); return; }
  if(C.pending && C.pending.type === 'die' && C.pending.i === i){ C.pending = null; render(); return; }
  const t = KIND[d.k].target;
  C.pending = { type:'die', i };
  if(t === 'none' || t === 'self' || t === 'allEnemies' || t === 'allAllies') resolvePending(null);
  else render();
}
function clickSpell(key){
  if(C.over) return;
  const sp = spellDef(key);
  if(!sp || !spellReady(sp)) return;
  if(C.pending && C.pending.type === 'spell' && C.pending.key === key){ C.pending = null; render(); return; }
  C.pending = { type:'spell', key };
  if(sp.target === 'self' || sp.target === 'allEnemies' || sp.target === 'allAllies') resolvePending(null);
  else render();
}
function clickTarget(kind, uidv){
  if(!C.pending) return;
  if(kind === 'enemy'){
    const e = enemyByUid(uidv);
    if(!e || !canTargetEnemy(e)) return;      /* the front rank is in the way */
  }
  resolvePending({ kind, uid:uidv });
}
/* can whatever is waiting on a target reach past the front rank? */
function pendingReaches(){
  const p = C.pending;
  if(!p) return true;
  if(p.type === 'die'){ const d = C.dice[p.i]; return d ? faceReaches(d) : true; }
  if(p.type === 'spell'){ const sp = spellDef(p.key); return sp.reach !== false; }
  return true;                       /* anything you throw goes over the line */
}
const canTargetEnemy = e => e.hp > 0 && (!e.rank || pendingReaches() || !frontRank().length);
function pendingTargetType(){
  if(!C.pending) return null;
  if(C.pending.type === 'die'){ const d = C.dice[C.pending.i]; return d ? KIND[d.k].target : null; }
  if(C.pending.type === 'item'){ const it = itemDef(S.bag[C.pending.i]); return it ? USE_TARGET[it.use] : null; }
  return spellDef(C.pending.key).target;
}

function resolvePending(target){
  const p = C.pending;
  if(!p) return;
  C.pending = null;
  if(p.type === 'die') applyDie(p.i, target);
  else if(p.type === 'item') applyItem(p.i, target);
  else applySpell(p.key, target);
  afterAction();
}

function applyDie(i, target){
  const d = C.dice[i];
  if(!d || d.used) return;
  const h = unitByUid(d.ownerUid);
  if(!h){ d.used = true; return; }      /* owner left the field: the die just fizzles */
  d.used = true;
  resolveFace(h, d, target);
  /* The Rite of Echo runs the face a second time. A rite itself never echoes,
     or laying one down would deepen it for free. */
  const echoRite = sigil('sigEcho');
  if(echoRite && (C.echoUsed || 0) < echoRite && d.k !== 'blank' && !isSigil(d.k) && !C.over){
    C.echoUsed = (C.echoUsed || 0) + 1;
    logc('The Rite of Echo says it again.');
    resolveFace(h, d, target);
  }
  chargeFor(h, d);
}

/* one face resolving once -- separate from applyDie so the Rite of Echo can
   ask for it twice */
function resolveFace(h, d, target){
  const v = faceValue(h, d);
  if(KIND[d.k] && KIND[d.k].target === 'enemy' && target && !faceReaches(d)){
    const e = enemyByUid(target.uid);
    if(e && e.rank && frontRank().length) return;     /* it cannot be reached */
  }
  switch(d.k){
    case 'dmg': {
      const e = enemyByUid(target.uid); if(!e) break;
      heroDamageToEnemy(e, v + (d.r === 'cruel' && e.hp <= e.maxHp / 2 ? 5 : 0), d.r === 'piercing');
      if(banner('duelist') && !h.bannerHit){ h.bannerHit = true; heroDamageToEnemy(e, 4); }  /* Banner of the Edge */
      if(hasPerk(h, 'd4') && !h.struck){ h.struck = true; heroDamageToEnemy(e, v); }  /* Opening */
      const ls = glob('lifesteal');
      if(ls > 0 && !h.isSummon) healHero(h, ls);
      logc(`${h.name} strikes ${e.name} for ${v}.`);
      break;
    }
    case 'dmgAll': {
      livingEnemies().forEach(e => { heroDamageToEnemy(e, v); if(e.hp > 0) e.burn += hasPerk(h, 'p2') ? 2 : 1; });
      logc(`${h.name} cleaves everything for ${v}, and the room catches fire.`);
      break;
    }
    case 'burn': {
      const e = enemyByUid(target.uid); if(!e) break;
      e.burn += v; floatOn(e.uid, '🔥' + v, 'var(--orange)');
      logc(`${h.name} sets ${e.name} alight.`);
      break;
    }
    case 'shield': {
      const a = unitByUid(target.uid); if(!a) break;
      a.shield += v; floatOn(a.uid, '+' + v, 'var(--blue)');
      logc(`${h.name} shields ${a.name} for ${v}.`);
      break;
    }
    case 'shieldAll': {
      livingAllies().forEach(a => { a.shield += v; floatOn(a.uid, '+' + v, 'var(--blue)'); });
      logc(`${h.name} raises an aegis for ${v}.`);
      break;
    }
    case 'heal': {
      const a = unitByUid(target.uid); if(!a) break;
      healHero(a, v);
      if(a.poison > 0) a.poison--;
      if(a.burn > 0) a.burn--;
      if(hasPerk(h, 'w2')) livingAllies().forEach(x => {        /* Field Surgeon */
        if(x.poison > 0) x.poison--; if(x.burn > 0) x.burn--; });
      logc(`${h.name} mends ${a.name} for ${v}.`);
      break;
    }
    case 'poison': {
      const e = enemyByUid(target.uid); if(!e) break;
      e.poison += v; floatOn(e.uid, '☠' + v, 'var(--lime)');
      if(hasPerk(h, 'n3') && e.trait && e.trait.k === 'armoured')  /* Corrosive */
        e.trait.v = Math.max(0, e.trait.v - 2);
      logc(`${h.name} poisons ${e.name} for ${v}.`);
      break;
    }
    case 'stun': {
      const e = enemyByUid(target.uid); if(!e) break;
      tryControl(e, 'stun', v, h.name);
      if(hasPerk(h, 'd2')) heroDamageToEnemy(e, 4);           /* Off Hand */
      break;
    }
    case 'daze': {
      const e = enemyByUid(target.uid); if(!e) break;
      const lost = e.power;
      e.power = 0; e.weak += v;
      if(hasPerk(h, 's4')) e.shield = Math.max(0, e.shield - 6);   /* Unravel */            /* no longer a stun, so no lock to build */
      floatOn(e.uid, 'REELING', 'var(--gold)');
      logc(lost ? `${e.name} reels, and forgets ${lost} power.` : `${e.name} reels.`);
      break;
    }
    case 'charm': {
      const e = enemyByUid(target.uid); if(!e) break;
      tryControl(e, 'charm', v + (hasPerk(h, 's1') ? 1 : 0), h.name);
      break;
    }
    case 'summon': {
      if(C.summons.length >= 2){
        C.summons.forEach(t => { healHero(t, t.maxHp); t.turns = Math.max(t.turns, 2 + v); });
        logc(`${h.name} has no room for another Thrall, and renews the ones already here.`);
        break;
      }
      const t = makeThrall(v);
      C.summons.push(t);
      logc(`${h.name} calls up a Thrall.`);
      break;
    }
    case 'guard': {
      h.guarding = true; h.shield += v;
      if(hasPerk(h, 'v1')) livingAllies().forEach(a => { if(a !== h) a.shield += 3; });
      floatOn(h.uid, 'GUARD', 'var(--blue)');
      logc(`${h.name} steps in front of the party.`);
      break;
    }
    case 'regen': {
      const a = unitByUid(target.uid); if(!a) break;
      a.regen = (a.regen || 0) + v + (hasPerk(h, 'w1') ? 1 : 0);   /* Deep Roots */
      floatOn(a.uid, '🌱' + v, 'var(--green)');
      logc(`${h.name} sets ${a.name} mending.`);
      break;
    }
    case 'leech': {
      const e = enemyByUid(target.uid); if(!e) break;
      heroDamageToEnemy(e, v + (d.r === 'cruel' && e.hp <= e.maxHp / 2 ? 5 : 0), d.r === 'piercing');
      const back = Math.ceil(v / 2);
      healHero(h, back);
      logc(`${h.name} draws ${v} out of ${e.name} and keeps ${back}.`);
      break;
    }
    case 'echo': {
      C.rerolls += v;
      logc(`${h.name} sees another angle. +${v} reroll${v > 1 ? 's' : ''}.`);
      break;
    }
    case 'mana': {
      C.mana += v;
      logc(`${h.name} focuses. +${v} mana.`);
      break;
    }
    case 'power': {
      const a = unitByUid(target.uid); if(!a) break;
      a.power += v; floatOn(a.uid, '+' + v + ' POW', 'var(--pink)');
      logc(`${h.name} empowers ${a.name}.`);
      break;
    }
    default: {
      if(isSigil(d.k)){
        if(!C.sigils) C.sigils = {};
        C.sigils[d.k] = (C.sigils[d.k] || 0) + 1;
        const sg = SIGILS[d.k];
        floatOn(h.uid, sigilShort(d.k).toUpperCase(), sg.col);
        logc(`${h.name} lays down the ${sg.name}. ${sg.line(C.sigils[d.k])}`);
        break;
      }
      logc(`${h.name} rolls a blank.`);
    }
  }
  if(d.r) resolveRider(h, d, target);
}

/* the rider fires after the face itself, so it reads as "and also" */
function resolveRider(h, d, target){
  const rd = riderDef(d.r);
  if(!rd) return;
  const e = target && target.uid !== undefined ? enemyByUid(target.uid) : null;
  switch(d.r){
    case 'searing':
      if(d.k === 'dmgAll') livingEnemies().forEach(x => { x.burn += 1; });
      else if(e && e.hp > 0){ e.burn += 1; floatOn(e.uid, '\u{1F525}1', 'var(--orange)'); }
      break;
    case 'tainted':
      if(e && e.hp > 0){ e.poison += 2; floatOn(e.uid, '\u26202', 'var(--lime)'); }
      break;
    case 'bracing':
      h.shield += 2; floatOn(h.uid, '+2', 'var(--blue)');
      break;
    case 'quick':
      C.rerolls += 1;
      break;
    case 'cleansing':
      livingAllies().forEach(a => { if(a.poison > 0) a.poison--; if(a.burn > 0) a.burn--; });
      break;
    case 'rallying':
      h.power += 1; floatOn(h.uid, '+1 POW', 'var(--pink)');
      break;
    /* cruel and piercing change the blow itself, so they are handled where the
       damage is worked out rather than after the fact */
    case 'arcing':
      livingEnemies().forEach(x => { if(!e || x.uid !== e.uid) heroDamageToEnemy(x, 2); });
      break;
  }
}

function chargeFor(h, d){
  const cs = chargeSpellOf(h);
  const needOf = sp => sp.charge.need - (((sp.key === 'finisher' && hasPerk(h, 'd1')) ||
                                           (sp.key === 'miasma'   && hasPerk(h, 'n4')) ||
                                           (sp.key === 'rally'    && hasPerk(h, 'h4'))) ? 1 : 0);
  if(cs && cs.charge.on.includes(d.k) && (h.charge || 0) < needOf(cs)){
    h.charge = (h.charge || 0) + 1;
    if(h.charge >= needOf(cs)){
      floatOn(h.uid, cs.name.toUpperCase(), 'var(--gold)');
      logc(`${h.name} is ready to use ${cs.name}.`);
    }
  }
}

function applySpell(key, target){
  const sp = spellDef(key);
  if(!spellReady(sp)) return;
  if(sp.charge){ const h = chargeHero(sp); if(h) h.charge = Math.max(0, (h.charge || 0) - sp.charge.need); }
  else C.mana -= sp.cost;
  switch(key){
    case 'firebolt': { const e = enemyByUid(target.uid); if(e) heroDamageToEnemy(e, 7); logc(`Firebolt hits ${e ? e.name : 'nothing'} for 7.`); break; }
    case 'mend':     { const a = unitByUid(target.uid); if(a){ healHero(a, 8); a.poison = Math.max(0, a.poison - 2); a.burn = Math.max(0, a.burn - 2); } logc('Greater Mend restores 8.'); break; }
    case 'bulwark':  { const a = unitByUid(target.uid); if(a){ a.shield += 9; floatOn(a.uid,'+9','var(--blue)'); } logc('Bulwark grants 9 shield.'); break; }
    case 'chain':    { livingEnemies().forEach(e => heroDamageToEnemy(e, 5)); logc('Chain Lightning arcs for 5.'); break; }
    case 'frost':    { const e = enemyByUid(target.uid); if(e) tryControl(e, 'stun', 1, 'Frost Nail'); break; }
    case 'siphon':   {
      const e = enemyByUid(target.uid); if(e) heroDamageToEnemy(e, 5);
      const hurt = livingAllies().slice().sort((a,b) => (a.hp/a.maxHp) - (b.hp/b.maxHp))[0];
      if(hurt) healHero(hurt, 5);
      logc('Siphon drains 5.'); break;
    }
    case 'quicken':  { C.rerolls += 1; logc('Quicken grants a reroll.'); break; }
    case 'wildfire': { livingEnemies().forEach(e => heroDamageToEnemy(e, 10)); logc('Wildfire scours the room for 10.'); break; }
    case 'finisher': {
      const e = enemyByUid(target.uid); if(!e) break;
      const big = e.hp <= e.maxHp / 2;
      heroDamageToEnemy(e, big ? 14 : 6);
      logc(big ? 'Finisher lands clean for 14.' : 'Finisher glances off for 6.');
      break;
    }
    case 'conflag':  { livingEnemies().forEach(e => { e.burn += 3; floatOn(e.uid, '🔥' + '3', 'var(--orange)'); }); logc('Conflagration sets the room alight.'); break; }
    case 'miasma':   { livingEnemies().forEach(e => { e.poison += 4; floatOn(e.uid, '☠4', 'var(--lime)'); }); logc('Miasma settles over everything.'); break; }
    case 'rally':    { livingAllies().forEach(h => { h.power += 1; floatOn(h.uid, '+1 POW', 'var(--pink)'); }); logc('Rally lifts the whole party.'); break; }
    case 'dominate': {
      const e = enemyByUid(target.uid); if(!e) break;
      tryControl(e, 'charm', 2, 'Dominate');
      break;
    }
    case 'legion': {
      while(C.summons.length < 2) C.summons.push(makeThrall(1));
      C.summons.forEach(t => { healHero(t, t.maxHp); t.turns = Math.max(t.turns, 3); });
      logc('Two Thralls answer the call.');
      break;
    }
  }
}

function afterAction(){
  if(fieldCleared()){ endCombat(true); return; }
  if(!livingHeroes().length){ endCombat(false); return; }
  save(); render();
}

/* --------------------------------------------------------------- enemy turn */
function endTurn(){
  if(C.over) return;
  C.pending = null; C.rerollMode = false;
  C.dice = [];
  render();
  setTimeout(enemyPhase, 160);
}

function enemyPhase(){
  const order = livingEnemies();
  let idx = 0;
  const step = () => {
    if(C.over) return;
    if(idx >= order.length){ endOfRound(); return; }
    const e = order[idx++];
    if(e.hp <= 0){ step(); return; }
    e.shield = 0;
    if(e.stun > 0){
      e.stun--;
      logc(`${e.name} is stunned and loses its turn.`);
      floatOn(e.uid, 'stunned', 'var(--gold)');
      render(); setTimeout(step, 240); return;
    }
    const it = e.intent || { k:'attack', v:3, tgt:null };
    let tgt = it.tgt ? unitByUid(it.tgt) : null;
    if(!tgt || tgt.downed || tgt.hp <= 0) tgt = livingAllies().length ? pick(livingAllies()) : null;
    const guardian = livingAllies().find(a => a.guarding);
    if(guardian && tgt && tgt !== guardian && it.k === 'attack'){
      logc(`${guardian.name} takes the blow meant for ${tgt.name}.`);
      tgt = guardian;
    }
    switch(it.k){
      case 'attack':
        if(tgt){
          const dmg = enemyAtk(e, it.v + (e.power || 0) + enemyItemMod(e, 'dmg'));
          hurtHero(tgt, dmg);
          logc(`${e.name} hits ${tgt.name} for ${dmg}.`);
          const back = (has('thorned') ? 3 : 0) + glob('thorns') + sigil('sigSpite') * 3
                     + (tgt && tgt.guarding && hasPerk(tgt, 'v3') ? 4 : 0);
          if(back > 0) hurtEnemy(e, back);
        }
        break;
      case 'attackAll': {
        const dmg = enemyAtk(e, it.v + (e.power || 0) + enemyItemMod(e, 'dmg') + enemyItemMod(e, 'cleave'));
        livingAllies().slice().forEach(h => hurtHero(h, dmg));
        logc(`${e.name} sweeps the party for ${dmg}.`);
        const backAll = (has('thorned') ? 3 : 0) + glob('thorns') + sigil('sigSpite') * 3;
        if(backAll > 0) hurtEnemy(e, backAll);
        break;
      }
      case 'block':
        e.shield += it.v;
        floatOn(e.uid, '+' + it.v, 'var(--blue)');
        logc(`${e.name} braces for ${it.v}.`);
        break;
      case 'buff':
        e.power += it.v;
        floatOn(e.uid, '+' + it.v + ' POW', 'var(--pink)');
        logc(`${e.name} grows stronger.`);
        break;
      case 'heal': {
        const before = e.hp;
        e.hp = Math.min(e.maxHp, e.hp + it.v);
        floatOn(e.uid, '+' + (e.hp - before), 'var(--green)');
        logc(`${e.name} heals ${e.hp - before}.`);
        break;
      }
      case 'charmed': {
        e.charm--;
        const named = it.tgt ? enemyByUid(it.tgt) : null;
        const others = livingEnemies().filter(x => x !== e);
        const victim = (named && named.hp > 0) ? named : (others.length ? pick(others) : null);
        if(victim){
          hurtEnemy(victim, it.v);
          logc(`${e.name} turns on ${victim.name} for ${it.v}.`);
        } else {
          logc(`${e.name} claws at nothing.`);
        }
        break;
      }
      case 'poison':
        if(tgt){
          tgt.poison += it.v;
          floatOn(tgt.uid, '☠' + it.v, 'var(--lime)');
          logc(`${e.name} poisons ${tgt.name}.`);
        }
        break;
      case 'burn':
        if(tgt){
          tgt.burn += it.v;
          floatOn(tgt.uid, '🔥' + it.v, 'var(--orange)');
          logc(`${e.name} sets ${tgt.name} alight.`);
        }
        break;
      case 'drain':
        if(tgt){
          const dd = enemyAtk(e, it.v + (e.power || 0) + enemyItemMod(e, 'dmg'));
          hurtHero(tgt, dd);
          const before = e.hp;
          e.hp = Math.min(e.maxHp, e.hp + dd);
          floatOn(e.uid, '+' + (e.hp - before), 'var(--green)');
          logc(`${e.name} drains ${dd} out of ${tgt.name}.`);
        }
        break;
      case 'charm':
        if(tgt && !tgt.isSummon){
          if(tgt.steeled > 0){
            floatOn(tgt.uid, 'RESISTS', 'var(--ink-dim)');
            logc(`${tgt.name} is braced, and shrugs ${e.name} off.`);
            break;
          }
          tgt.charmed += it.v;
          tgt.steeled = it.v + 1;
          C.dice = C.dice.filter(d => d.ownerUid !== tgt.uid || d.used);
          floatOn(tgt.uid, 'THEIRS', 'var(--violet)');
          logc(`${e.name} takes ${tgt.name}. They strike the party at the end of this turn and roll for nobody on the next.`);
        }
        break;
      case 'summon': {
        if(livingEnemies().length >= 4){ e.shield += 6; logc(`${e.name} calls, and nothing comes.`); break; }
        const weak = BESTIARY.filter(bb => bb.acts.includes(S.act) && bb.hp <= 12);
        const pool = weak.length ? weak : BESTIARY.filter(bb => bb.acts.includes(S.act));
        const spawn = makeEnemy(pick(pool), S.act, undefined, { item:false });
        C.enemies.push(spawn);
        logc(`${e.name} calls up ${spawn.name}.`);
        break;
      }
    }
    if(!livingHeroes().length){ endCombat(false); return; }
    if(fieldCleared()){ endCombat(true); return; }
    render();
    setTimeout(step, 240);
  };
  step();
}

/* Heroes the enemy has taken act at the END of the enemy phase, swinging at
   their own side with the best Strike their die carries. Exactly what our own
   Dominate does to an enemy, pointed the other way. */
function charmedAllies(){
  const acting = S.party.filter(h => h.charmed > 0 && !h.downed && h.hp > 0);
  acting.forEach(h => {
    const strikes = h.faces.filter(f => f.k === 'dmg').map(f => faceValue(h, f));
    /* losing the roll is most of the cost already, so they pull the blow */
    const dmg = Math.max(1, Math.ceil((strikes.length ? Math.max(...strikes) : 3) / 2));
    const others = livingAllies().filter(a => a !== h);
    if(others.length){
      const victim = pick(others);
      hurtHero(victim, dmg);
      logc(`${h.name}, not their own, strikes ${victim.name} for ${dmg}.`);
    } else {
      logc(`${h.name} swings at nothing.`);
    }
  });
}

/* A boss turns when it drops past a threshold: new moves, sometimes a trait,
   and its intent is re-read at once so the change is visible the same turn. */
function checkBossPhase(e){
  const phases = BOSS_PHASES[e.key];
  if(!phases) return;
  const frac = e.hp / e.maxHp;
  while(e.phase < phases.length && frac <= phases[e.phase].at){
    const ph = phases[e.phase];
    e.phase++;
    e.moves = scaleMoves({ moves:ph.moves, dmgW:1 }, S.act, 1);
    e.mi = 0;
    e.trait = ph.trait ? { ...ph.trait } : null;
    e.shield = 0; e.stun = 0; e.charm = 0;      /* it shrugs off whatever was holding it */
    C.phaseBanner = ph.name;
    floatOn(e.uid, ph.name.toUpperCase(), 'var(--gold)');
    logc(`${ph.name}. ${ph.line}`);
    const m = e.moves[e.mi % e.moves.length]; e.mi++;
    let tgt = null;
    if(['attack','poison','burn','drain','charm'].includes(m.k)){
      const opts = livingAllies();
      tgt = opts.length ? pick(opts).uid : null;
    }
    e.intent = { k:m.k, v:m.v, tgt };
  }
}

function endOfRound(){
  charmedAllies();
  if(!livingHeroes().length){ endCombat(false); return; }
  /* Fire resolves first: it burns, then grows, then jumps to something new.
     Unlike poison it does not decay, so an early Ignite compounds over a long
     fight -- and in a crowd it turns one lit enemy into a spreading problem. */
  const kindleRite = sigil('sigKindle');
  const burning = livingEnemies().filter(e => e.burn > 0);
  burning.forEach(e => {
    hurtEnemy(e, e.burn + kindleRite, true);
    logc(`${e.name} burns for ${e.burn + kindleRite}.`);
  });
  const stillBurning = burning.filter(e => e.hp > 0);
  stillBurning.forEach(e => { e.burn += banner('pyromancer') ? 2 : 1; });
  const unlit = livingEnemies().filter(e => e.burn === 0);
  stillBurning.slice(0, unlit.length).forEach((src, i) => {
    unlit[i].burn = 1;
    floatOn(unlit[i].uid, '🔥', 'var(--orange)');
    logc(`The fire spreads from ${src.name} to ${unlit[i].name}.`);
  });
  if(fieldCleared()){ endCombat(true); return; }

  /* poison ticks after everyone has acted */
  livingEnemies().forEach(e => {
    if(e.steeled > 0) e.steeled--;
    if(e.weak > 0) e.weak--;
    /* It knits back only what was actually taken off it this round. Without
       that cap a weak party met a boss that healed faster than it could chip,
       and the fight simply never ended. Chip damage still loses to it; it can
       just never put back more than you removed. */
    if(hasTrait(e, 'regrowing') && e.hp > 0 && e.hp < e.maxHp){
      const back = Math.min(e.trait.v, e.tookThisRound || 0);
      if(back > 0){
        const before = e.hp;
        e.hp = Math.min(e.maxHp, e.hp + back);
        floatOn(e.uid, '+' + (e.hp - before), 'var(--green)');
        logc(`${e.name} knits itself back together.`);
      }
    }
    e.tookThisRound = 0;
  });
  livingEnemies().forEach(e => {
    if(e.poison > 0){
      hurtEnemy(e, e.poison, true);
      logc(`${e.name} takes ${e.poison} poison.`);
      /* Lingering: the stack only thins every other round */
      if((!partyPerk('n2') && !setActive('venom') && !banner('venomist')) || C.turn % 2 === 0) e.poison--;
    }
  });
  livingAllies().slice().forEach(h => {
    if(h.poison > 0){
      hurtHero(h, h.poison, {ignoreShield:true, ignoreArmour:true});
      logc(`${h.name} takes ${h.poison} poison.`);
      h.poison--;
    }
    if(h.burn > 0){
      hurtHero(h, h.burn, {ignoreShield:true, ignoreArmour:true});
      logc(`${h.name} burns for ${h.burn}.`);
      h.burn--;                        /* you beat it out; it does not compound */
    }
    if(hasPerk(h, 'w4')){                                      /* Vigil */
      const hurt = livingAllies().slice().sort((a,b) => (a.hp/a.maxHp) - (b.hp/b.maxHp))[0];
      if(hurt) healHero(hurt, 3);
    }
    if(h.regen > 0){
      healHero(h, h.regen);
      logc(`${h.name} mends ${h.regen}.`);
      h.regen--;
    }
    if(h.steeled > 0) h.steeled--;
    if(glob('hungerbite') && !h.isSummon && GEAR_SLOTS.some(sl => h.gear && h.gear[sl] === 'hungerblade')){
      hurtHero(h, 2, {ignoreShield:true, ignoreArmour:true});
      logc(`The Hungering Blade takes its due from ${h.name}.`);
    }
  });
  const furyRite = sigil('sigFury'), growthRite = sigil('sigGrowth');
  if(furyRite) livingAllies().forEach(h => { h.power += furyRite; floatOn(h.uid, '+' + furyRite + ' POW', 'var(--pink)'); });
  if(growthRite) livingAllies().forEach(h => healHero(h, 2 * growthRite));
  if(furyRite || growthRite)
    logc(`The rites hold.${furyRite ? ' The party grows angrier.' : ''}${growthRite ? ' The party knits itself back together.' : ''}`);
  tickPress();
  if(fieldCleared()){ endCombat(true); return; }
  if(!livingHeroes().length){ endCombat(false); return; }
  beginPlayerTurn();
  render();
}

function endCombat(won){
  C.over = won ? 'win' : 'lose';
  render();
  if(!won){ setTimeout(() => { S.screen = 'gameover'; clearSave(); render(); }, 500); return; }
  setTimeout(() => {
    const type = C.type;
    S.party.forEach(h => {
      if(h.downed){
        h.downed = false;
        h.hp = has('secondwind') ? h.maxHp : Math.max(1, Math.round(h.maxHp * 0.35));
      }
      h.shield = 0; h.power = 0; h.poison = 0;
    });
    S.party.forEach(h => healHero(h, Math.round(h.maxHp * 0.15)));
    if(banner('warden')) S.party.forEach(h => healHero(h, 5));
    if(has('bloodstone')) S.party.forEach(h => healHero(h, 3));
    if(glob('postHeal')) S.party.forEach(h => healHero(h, glob('postHeal')));
    (C.drops || []).forEach(queueItem);          /* what they carried is now yours */
    C = null;
    postCombatRewards(type);
  }, 650);
}

/* ============================================================================
   RUN FLOW: nodes, rewards, shop, camp fire, events
   ========================================================================== */
function enterNode(n){
  if(!n) return;
  if(n.type === 'boss' && S.act >= 3 && !S.talisman && availableNodes().some(x => x !== n)){
    UI.modal = { type:'result', text:'The doors will not open. Whatever waits at the top of this spire does not face anyone who is not carrying the Talisman, and you are not. There is still another road.' };
    render(); return;
  }
  S.pos = { floor:n.floor, slot:n.slot };
  n.done = true;
  S.visited.push(n.floor + ',' + n.slot);
  save();
  switch(n.type){
    case 'combat': case 'elite': case 'boss':
      S.screen = 'combat'; startCombat(n.type); render(); break;
    case 'shop':     openShop(); break;
    case 'rest':     openCamp(); break;
    case 'treasure': openTreasure(); break;
    case 'event':    openEvent(); break;
    case 'adventure':openAdventure(); break;
  }
}

function goldGain(base){
  const g = Math.round(base * (has('coinpurse') ? 1.3 : 1) * (1 + glob('gold')));
  S.gold += g;
  return g;
}

function postCombatRewards(type){
  const act = S.act;
  const bonus = !!UI.bonusReward; UI.bonusReward = false;
  const gold = goldGain(Math.round((type === 'boss' ? 90 + act * 25 : type === 'elite' ? 55 + act * 15 : 22 + act * 9 + rnd(12)) * (bonus ? 1.7 : 1)));
  const relic = (type === 'elite' || type === 'boss')
    ? randomRelic(type === 'boss' ? 'boss' : 'rare')
    : null;
  /* something to carry falls out of most fights, and always off the big ones */
  if(Math.random() < (bonus ? 0.5 : 0.2)) queueItem(rollItem(act));
  if(relic) grantRelic(relic);
  if(type === 'boss'){
    S.party.forEach(h => healHero(h, Math.round(h.maxHp * 0.3)));
  }
  const gained = awardXp(type === 'boss' || type === 'elite' ? 2 : 1);
  UI.modal = {
    type: 'reward',
    kind: type,
    gold,
    relic,
    faces: faceRewards(bonus ? 4 : 3),
    taken: false
  };
  S.screen = 'map';
  if(gained.length){
    const rewardModal = UI.modal;
    UI.afterLevels = () => { UI.modal = rewardModal; render(); };
    openLevelUp(gained);
    return;
  }
  save(); render();
}

function finishReward(){
  UI.modal = null;
  if(UI.pendingItems && UI.pendingItems.length){ grantItem(UI.pendingItems.shift(), finishReward); return; }
  if(UI.pendingAncestral){ UI.pendingAncestral = false; UI.modal = { type:'ancestral', after: finishReward }; render(); return; }
  const wasBoss = S.pos && nodeAt(S.pos.floor, S.pos.slot) && nodeAt(S.pos.floor, S.pos.slot).type === 'boss';
  if(wasBoss){
    S.act++;
    if(S.act > 3){ S.screen = 'victory'; clearSave(); render(); return; }
    buildMap();
    UI.modal = { type:'act', act:S.act };
  }
  S.screen = 'map';
  save(); render();
}

/* ------------------------------------------------------------- face surgery */
function installFace(face, mode, after){
  UI.modal = { type:'install', face, mode: mode || 'replace', after: after || null };
  render();
}
function doInstall(heroUid, faceIdx){
  const m = UI.modal;
  const h = heroByUid(heroUid);
  if(!h) return;
  if(m.mode === 'add' ? !canTakeFace(h, m.face.k) : !mayInstall(h, m.face.k, faceIdx)) return;
  if(m.mode === 'add') h.faces.push({...m.face});
  else h.faces[faceIdx] = {...m.face};
  const after = m.after;
  UI.modal = null;
  save();
  if(after) after(); else render();
}

/* ============================================================================
   LEVELS
   Dice and gear made the party stronger; nothing made a hero better at being
   THEMSELVES. A level is a choice out of two, drawn from that hero's own list,
   so a Duelist ends a run built rather than merely equipped.
   ========================================================================== */
const XP_PER_LEVEL = 3;        /* fights won, elites and bosses count double  */
const PERKS = {

    {key:'v2', name:'Immovable',      desc:'+8 max HP, healed at once.'},

    {key:'v4', name:'Second Shield',  desc:'Keep half your shield between turns.'}
  ],
  duelist: [
    {key:'d1', name:'Killing Blow',   desc:'Finisher charges in 3 Strikes instead of 4.'},
    {key:'d2', name:'Off Hand',       desc:'Stun also deals 4 damage.'},
    {key:'d3', name:'Footwork',       desc:'+1 to every Strike face you roll.'},
    {key:'d4', name:'Opening',        desc:'Your first Strike each fight lands for double.'}
  ],
  warden: [
    {key:'w1', name:'Deep Roots',     desc:'Regrowth lasts a round longer.'},
    {key:'w2', name:'Field Surgeon',  desc:'Mend also clears a point of burning and poison from everyone.'},
    {key:'w3', name:'Greenwood',      desc:'+2 to every Mend face you roll.'},
    {key:'w4', name:'Vigil',          desc:'Heal the most wounded hero 3 at the end of each round.'}
  ],
  pyromancer: [
    {key:'p1', name:'Backdraft',      desc:'Your fire grows by 2 each round instead of 1.'},
    {key:'p2', name:'Wildfire',       desc:'Cleave sets 2 burning instead of 1.'},
    {key:'p3', name:'Ashes',          desc:'+1 to every Ignite face you roll.'},
    {key:'p4', name:'Inner Furnace',  desc:'Gain 1 mana at the start of every turn.'}
  ],
  venomist: [
    {key:'n1', name:'Potent',         desc:'+2 to every Venom face you roll.'},
    {key:'n2', name:'Lingering',      desc:'Poison loses 1 stack every other round instead of every round.'},
    {key:'n3', name:'Corrosive',      desc:'Your poison strips 2 armour from what it eats.'},
    {key:'n4', name:'Distiller',      desc:'Miasma charges in 2 Venoms instead of 3.'}
  ],
  herald: [
    {key:'h1', name:'Standing Order', desc:'Power you grant lasts through the whole fight and stacks past 3.'},
    {key:'h2', name:'Fanfare',        desc:'Empower gives 1 more.'},
    {key:'h3', name:'Quartermaster',  desc:'The whole party starts each fight with 3 shield.'},
    {key:'h4', name:'Drillmaster',    desc:'Rally charges in 2 Empowers instead of 3.'}
  ],
  sorcerer: [
    {key:'s1', name:'Lasting Hold',   desc:'Dominate lasts a turn longer.'},
    {key:'s2', name:'Bound Servant',  desc:'Thralls last 2 turns longer and carry 5 more HP.'},
    {key:'s3', name:'Deep Well',      desc:'+1 to every Focus face you roll.'},
    {key:'s4', name:'Unravel',        desc:'Mindlock also strips 6 shield.'}
  ]
};
const hasPerk = (h, k) => !!(h && h.perks && h.perks.includes(k));
const partyPerk = k => S && S.party.some(h => hasPerk(h, k));
function awardXp(amount){
  let levelled = [];
  S.party.forEach(h => {
    h.xp = (h.xp || 0) + amount;
    while(h.xp >= XP_PER_LEVEL){
      h.xp -= XP_PER_LEVEL;
      h.level = (h.level || 1) + 1;
      levelled.push(h);
    }
  });
  return levelled;
}
/* two picks from what this hero has not taken yet */
function perkChoices(h){
  const pool = (PERKS[h.key] || []).filter(pk => !hasPerk(h, pk.key));
  return sample(pool, 2);
}
function openLevelUp(queue){
  const h = queue[0];
  const choices = perkChoices(h);
  if(!choices.length){ queue.shift(); return queue.length ? openLevelUp(queue) : finishLevels(); }
  UI.modal = { type:'levelup', hero:h, choices, queue };
  render();
}
function takePerk(key){
  const m = UI.modal;
  const h = m.hero;
  h.perks = h.perks || [];
  h.perks.push(key);
  if(key === 'v2'){ h.maxHp += 8; h.hp += 8; }
  const queue = m.queue; queue.shift();
  UI.modal = null; save();
  if(queue.length) openLevelUp(queue); else finishLevels();
}
function finishLevels(){
  UI.modal = null;
  if(UI.afterLevels){ const f = UI.afterLevels; UI.afterLevels = null; f(); return; }
  S.screen = 'map'; save(); render();
}

/* ------------------------------------------------------------ item handling */
const USE_TARGET = {healOne:'ally', healAll:'allAllies', burnAll:'allEnemies', boltOne:'enemy',
                    shieldAll:'allAllies', powerOne:'ally', gainFate:'self', stunAll:'allEnemies',
                    poisonOne:'enemy', revive:'self'};
/* strip a worn piece off somebody, unwinding whatever max HP it lent */
function unequipRandom(){
  const worn = [];
  S.party.forEach(h => GEAR_SLOTS.forEach(sl => { if(h.gear && h.gear[sl]) worn.push({h, sl}); }));
  if(!worn.length) return null;
  const { h, sl } = pick(worn);
  const it = itemDef(h.gear[sl]);
  if(it && it.mod && it.mod.maxHp){
    h.maxHp -= it.mod.maxHp;
    h.maxHp = Math.max(5, h.maxHp);
    h.hp = Math.max(1, Math.min(h.hp, h.maxHp));
  }
  h.gear[sl] = null;
  clampFate();
  return { hero:h, item:it };
}
/* blank a face, taking the FIRST non-blank -- which on most dice is the best */
function blankBestFace(h){
  const i = h.faces.findIndex(f => f.k !== 'blank');
  if(i < 0) return null;
  const lost = h.faces[i];
  h.faces[i] = F('blank');
  return lost;
}
function grantItem(key, after){
  const it = itemDef(key);
  const done = () => { save(); if(after) after(); else { S.screen = 'map'; render(); } };
  if(!it){ done(); return; }
  if(it.slot === 'quest'){ S.talisman = true; done(); return; }
  if(it.slot === 'use'){
    if(S.bag.length < BAG_MAX){ S.bag.push(key); done(); return; }
    UI.modal = { type:'bagfull', key, after }; render(); return;
  }
  UI.modal = { type:'equip', key, after }; render();
}
function equipItem(heroUid, key){
  const m = UI.modal;
  const h = heroByUid(heroUid), it = itemDef(key);
  if(!h || !it || !h.gear) return;
  const old = h.gear[it.slot] ? itemDef(h.gear[it.slot]) : null;
  if(old && old.mod && old.mod.maxHp) h.maxHp -= old.mod.maxHp;      /* give back what the old piece lent */
  h.gear[it.slot] = key;
  if(it.mod && it.mod.maxHp){ h.maxHp += it.mod.maxHp; if(it.mod.maxHp > 0) h.hp += it.mod.maxHp; }
  h.maxHp = Math.max(5, h.maxHp);
  h.hp = Math.max(1, Math.min(h.hp, h.maxHp));
  clampFate();
  const after = m && m.after; UI.modal = null; save();
  if(after) after(); else { S.screen = 'map'; render(); }
}
function declineItem(){
  const after = UI.modal && UI.modal.after; UI.modal = null;
  if(after) after(); else { S.screen = 'map'; render(); }
}
function swapBag(i){
  const m = UI.modal; if(!m || m.type !== 'bagfull') return;
  S.bag[i] = m.key;
  const after = m.after; UI.modal = null; save();
  if(after) after(); else { S.screen = 'map'; render(); }
}

/* consumables, used from the shared bag during a fight */
function clickItem(i){
  if(!C || C.over) return;
  const it = itemDef(S.bag[i]); if(!it) return;
  if(it.use === 'revive' && !S.party.some(h => h.downed)) return;
  if(C.pending && C.pending.type === 'item' && C.pending.i === i){ C.pending = null; render(); return; }
  C.pending = { type:'item', i };
  const t = USE_TARGET[it.use];
  if(t === 'self' || t === 'allEnemies' || t === 'allAllies') resolvePending(null);
  else render();
}
function applyItem(i, target){
  const key = S.bag[i], it = itemDef(key);
  if(!it) return;
  S.bag.splice(i, 1);
  switch(it.use){
    case 'healOne':  { const a = unitByUid(target.uid); if(a) healHero(a, 14); logc(`${it.name}: 14 healed.`); break; }
    case 'healAll':  { livingAllies().forEach(a => healHero(a, 9)); logc(`${it.name}: the party recovers.`); break; }
    case 'burnAll':  { livingEnemies().forEach(e => { heroDamageToEnemy(e, 8); if(e.hp > 0) e.burn += 2; }); logc(`${it.name} bursts.`); break; }
    case 'boltOne':  { const e = enemyByUid(target.uid); if(e) heroDamageToEnemy(e, 16); logc(`${it.name}: 16 damage.`); break; }
    case 'shieldAll':{ livingAllies().forEach(a => { a.shield += 9; floatOn(a.uid, '+9', 'var(--blue)'); }); logc(`${it.name}: cover for everyone.`); break; }
    case 'powerOne': { const a = unitByUid(target.uid); if(a){ a.power += 3; floatOn(a.uid, '+3 POW', 'var(--pink)'); } logc(`${it.name} takes hold.`); break; }
    case 'gainFate': { S.fate = Math.min(fateMax(), S.fate + 2); logc(`${it.name}: fate gathers.`); break; }
    case 'stunAll':  { livingEnemies().forEach(e => tryControl(e, 'stun', 1, it.name)); break; }
    case 'poisonOne':{ const e = enemyByUid(target.uid); if(e){ e.poison += 7; floatOn(e.uid, '☠7', 'var(--lime)'); } logc(`${it.name} splashes.`); break; }
    case 'revive':   {
      const d = S.party.find(x => x.downed);
      if(d){ d.downed = false; d.hp = Math.max(1, Math.round(d.maxHp * 0.5)); floatOn(d.uid, 'UP', 'var(--green)'); logc(`${d.name} is back on their feet.`); }
      break;
    }
  }
}

/* --------------------------------------------------------------------- fate */
const fateMax = () => 3 + glob('fate');
/* Owl Feather and the Shroud raise the cap, so losing one -- sold, swapped,
   or corroded off by Rust and Ruin -- can leave Fate stranded above it. */
function clampFate(){ if(S) S.fate = Math.max(0, Math.min(S.fate, fateMax())); }

/* ----------------------------------------------------------------- scouring */
const canScour   = () => S.party.some(h => h.faces.length > MIN_FACES);
const scourPrice = () => Math.round((80 + (S.removals || 0) * 45) * priceMod());
function openScour(cost, after){
  UI.modal = { type:'scour', cost: cost || 0, after: after || null };
  render();
}
function doScour(heroUid, idx){
  const m = UI.modal;
  if(!m || m.type !== 'scour') return;
  const h = heroByUid(heroUid);
  if(!h || h.faces.length <= MIN_FACES) return;
  if(m.cost && S.gold < m.cost) return;
  const gone = h.faces[idx];
  if(!gone) return;
  h.faces.splice(idx, 1);
  S.removals = (S.removals || 0) + 1;
  if(m.cost) S.gold -= m.cost;          /* charged on completion, not on open */
  const after = m.after;
  UI.modal = null;
  save();
  if(after) after(); else { S.screen = 'map'; render(); }
}
function cancelScour(){
  if(!UI.modal || UI.modal.type !== 'scour') return;
  const after = UI.modal.after;         /* nothing was charged, so nothing to refund */
  UI.modal = null;
  if(after) after(); else { S.screen = 'map'; render(); }
}

/* -------------------------------------------------------------------- shop */
const priceMod = () => has('token') ? 0.7 : 1;
function openShop(){
  const faces = faceRewards(3).map(f => ({ face:f, price: Math.round(facePrice(f) * priceMod()) }));
  const rk = randomRelic(Math.random() < 0.3 ? 'rare' : 'uncommon');
  /* a charged spell belongs to its hero and is never for sale; a mana spell is
     useless to a party with no way to make mana, so it is not offered either */
  const canMana = S.party.some(h => h.faces.some(f => f.k === 'mana'))
    || glob('manaTurn') > 0 || glob('manaCombat') > 0 || has('wellspring') || has('clover');
  const unowned = SPELLS.filter(s => !S.spells.includes(s.key) && !s.charge && canMana);
  const stock = sample(unowned, 2).map(sp => ({ key:sp.key, price: Math.round((60 + sp.cost * 22) * priceMod()) }));
  const wares = [];
  for(let i = 0; i < 2; i++){
    const k = rollItem(S.act);
    if(!wares.some(w => w.key === k)) wares.push({ key:k, price: Math.round(itemDef(k).price * priceMod()) });
  }
  if(S.act >= 3 && !S.talisman) wares.push({ key:'talisman', price: Math.round(itemDef('talisman').price * priceMod()) });
  UI.modal = {
    type:'shop',
    wares,
    faces,
    relic: rk ? { key:rk, price: Math.round((rk && relicDef(rk).tier === 'rare' ? 210 : 150) * priceMod()) } : null,
    spells: stock,
    rations: { price: Math.round(50 * priceMod()), used:false },
    sold: {}
  };
  S.screen = 'map';
  render();
}
function shopModal(){ return UI.modal && UI.modal.type === 'shop' ? UI.modal : null; }
function buyFace(i){
  const m = shopModal(); if(!m) return;
  const item = m.faces[i];
  if(!item || m.sold['f' + i] || S.gold < item.price) return;
  S.gold -= item.price;
  m.sold['f' + i] = true;
  const shopState = m;
  installFace(item.face, 'replace', () => { UI.modal = shopState; render(); });
}
function buyRelic(){
  const m = shopModal(); if(!m) return;
  if(!m.relic || m.sold.relic || S.gold < m.relic.price) return;
  S.gold -= m.relic.price; m.sold.relic = true;
  grantRelic(m.relic.key);
  if(UI.pendingAncestral){ UI.pendingAncestral = false; const back = m; UI.modal = { type:'ancestral', after: () => { UI.modal = back; render(); } }; render(); return; }
  save(); render();
}
function buySpell(i){
  const m = shopModal(); if(!m) return;
  const it = m.spells[i];
  if(!it || m.sold['s' + i] || S.gold < it.price) return;
  S.gold -= it.price; m.sold['s' + i] = true;
  S.spells.push(it.key);
  save(); render();
}
function buyItem(i){
  const m = shopModal(); if(!m) return;
  const it = m.wares[i];
  if(!it || m.sold['w' + i] || S.gold < it.price) return;
  S.gold -= it.price; m.sold['w' + i] = true;
  const back = m;
  grantItem(it.key, () => { UI.modal = back; render(); });
}
function buyScour(){
  const m = shopModal(); if(!m) return;
  if(!canScour() || S.gold < scourPrice()) return;
  const back = m;
  openScour(scourPrice(), () => { UI.modal = back; render(); });
}
const inscribePrice = () => Math.round(110 * priceMod());
function buyInscribe(){
  const m = shopModal(); if(!m) return;
  if(m.inscribed || S.gold < inscribePrice()) return;
  const back = m;
  UI.modal = { type:'inscribe', cost:inscribePrice(), shop:back,
               after:() => { UI.modal = back; render(); } };
  render();
}
function buyRations(){
  const m = shopModal(); if(!m) return;
  if(m.rations.used || S.gold < m.rations.price) return;
  S.gold -= m.rations.price; m.rations.used = true;
  S.party.forEach(h => healHero(h, Math.round(h.maxHp * 0.3)));
  save(); render();
}

/* --------------------------------------------------------------- camp fire */
function openCamp(){ UI.modal = { type:'camp' }; S.screen = 'map'; render(); }
function campRest(){
  const pct = has('chirurgeon') ? 0.6 : 0.3;
  S.party.forEach(h => healHero(h, Math.round(h.maxHp * pct)));
  S.fate = Math.min(fateMax(), S.fate + 1);
  UI.modal = null; save(); render();
}
function campForge(){ UI.modal = { type:'forge' }; render(); }
function campTemper(){ UI.modal = { type:'temper' }; render(); }
/* one worn piece gets a permanent +1 on every number it carries */
function temperItem(heroUid, slot){
  const h = heroByUid(heroUid);
  if(!h || !h.gear || !h.gear[slot]) return;
  const base = itemDef(h.gear[slot]);
  if(!base || base.tempered) return;
  const key = base.key + '+';
  if(!itemDef(key)){
    const up = JSON.parse(JSON.stringify(base));
    up.key = key; up.name = base.name + ' +1'; up.tempered = true;
    ['mod','glob'].forEach(g => { if(up[g]) Object.keys(up[g]).forEach(k => {
      if(k === 'maxHp' && up[g][k] < 0) return;                 /* do not deepen a curse */
      up[g][k] = up[g][k] > 0 ? up[g][k] + (k === 'gold' ? 0.1 : 1) : up[g][k];
    }); });
    up.desc = base.desc + ' (tempered)';
    ITEMS.push(up);
  }
  if(base.mod && base.mod.maxHp) h.maxHp -= base.mod.maxHp;
  h.gear[slot] = key;
  const up = itemDef(key);
  if(up.mod && up.mod.maxHp){ h.maxHp += up.mod.maxHp; if(up.mod.maxHp > 0) h.hp += up.mod.maxHp; }
  h.maxHp = Math.max(5, h.maxHp); h.hp = Math.max(1, Math.min(h.hp, h.maxHp));
  clampFate();
  UI.modal = null; save(); render();
}
function forgeFace(heroUid, idx){
  const h = heroByUid(heroUid);
  const f = h.faces[idx];
  if(!f || f.k === 'blank' || isSigil(f.k)) return;    /* a rite has no number to sharpen */
  f.v += (['stun','charm','daze','summon','guard','echo','dmgAll','shieldAll','power','mana','burn'].includes(f.k) ? 1 : 2);
  UI.modal = null; save(); render();
}
function campInscribe(){ UI.modal = { type:'inscribe' }; render(); }
/* an inscription bought at the counter goes back to the counter, one taken at
   a camp fire just ends */
function reInscribe(){ const m = UI.modal || {}; UI.modal = { type:'inscribe', after:m.after, cost:m.cost, shop:m.shop }; render(); }
function leaveInscribe(){ const a = UI.modal && UI.modal.after; UI.modal = null; if(a) a(); else closeEvent(); }
/* pick the face first, then what to write on it -- three of the riders that
   fit that kind, so an inscription is a choice and not a shopping list */
function pickInscribe(heroUid, idx){
  const h = heroByUid(heroUid);
  const f = h && h.faces[idx];
  if(!canInscribe(f)) return;
  const offer = sample(ridersFor(f.k).filter(r => r !== f.r), 3);
  if(!offer.length){ const pv = UI.modal || {}; UI.modal = { type:'inscribe', after:pv.after, cost:pv.cost, shop:pv.shop }; render(); return; }
  const prev = UI.modal || {};
  UI.modal = { type:'inscribe', heroUid, idx, offer, after:prev.after, cost:prev.cost, shop:prev.shop };
  render();
}
function applyRider(r){
  const m = UI.modal;
  if(!m || m.type !== 'inscribe' || m.heroUid === undefined) return;
  const h = heroByUid(m.heroUid);
  const f = h && h.faces[m.idx];
  if(!f || !RIDERS[r] || !RIDERS[r].on.includes(f.k)) return;
  if(m.cost){                       /* the merchant is paid on delivery */
    if(S.gold < m.cost) return;
    S.gold -= m.cost;
    if(m.shop) m.shop.inscribed = true;
  }
  f.r = r;
  const back = m.after;
  UI.modal = null; save();
  if(back) back(); else render();
}
function campScour(){ openScour(0, null); }
function campDrill(){
  S.party.forEach(h => { h.maxHp += 4; h.hp += 4; });
  UI.modal = null; save(); render();
}

/* ---------------------------------------------------------------- treasure */
function openTreasure(){
  const k = randomRelic();
  if(k) grantRelic(k);
  const g = goldGain(25 + rnd(30));
  /* the act-three hoard is where the Talisman is, so no run can be locked out */
  const item = (S.act >= 3 && !S.talisman) ? 'talisman' : rollItem(S.act);
  queueItem(item);
  UI.modal = { type:'treasure', relic:k, gold:g, item };
  S.screen = 'map'; save(); render();
}

function drawAdventure(){
  const total = ADVENTURE.reduce((t, a) => t + a.w, 0);
  let r = rnd(total);
  for(const a of ADVENTURE){ r -= a.w; if(r < 0) return a; }
  return ADVENTURE[0];
}
function openAdventure(){
  UI.modal = { type:'adventure', card: drawAdventure() };
  S.screen = 'map'; render();
}
function advChoose(i){
  const c = UI.modal.card.choices[i];
  if(c.req && !c.req()) return;
  UI.modal = null; c.go();
}
function advTake(){
  const card = UI.modal.card;
  UI.modal = null;
  if(card.choices) return;
  card.go();
}
/* a result screen that can also hand over the thing you just found */
function advResult(text, itemKey){
  if(itemKey) queueItem(itemKey);
  UI.modal = { type:'advresult', text, item:itemKey || null };
  save(); render();
}
function advDone(){
  UI.modal = null;
  if(UI.pendingItems && UI.pendingItems.length){ grantItem(UI.pendingItems.shift(), advDone); return; }
  closeEvent();
}

function openEvent(){
  const ev = pick(EVENTS);
  UI.modal = { type:'event', ev };
  S.screen = 'map'; render();
}
function eventResult(text){ UI.modal = { type:'result', text }; save(); render(); }
function closeEvent(){
  UI.modal = null;
  if(UI.pendingAncestral){ UI.pendingAncestral = false; UI.modal = { type:'ancestral', after: closeEvent }; render(); return; }
  S.screen = 'map'; save(); render();
}
function drillHero(heroUid){
  const h = heroByUid(heroUid);
  h.faces.forEach(f => { if(f.k === 'dmg') f.v += 1; });
  h.maxHp = Math.max(5, h.maxHp - 4);
  h.hp = Math.min(h.hp, h.maxHp);
  closeEvent();
}

/* ============================================================================
   RENDER
   ========================================================================== */
function render(){
  renderTopbar();
  const app = el('app');
  const screen = S ? S.screen : 'title';
  if(screen === 'title')          app.innerHTML = viewTitle();
  else if(screen === 'map')       app.innerHTML = viewMap();
  else if(screen === 'combat')    app.innerHTML = viewCombat();
  else if(screen === 'gameover')  app.innerHTML = viewGameOver();
  else if(screen === 'victory')   app.innerHTML = viewVictory();
  renderModal();
  flushBars();
  flushFloats();
  if(S) document.body.dataset.act = S.act;
  if(screen === 'map') requestAnimationFrame(scrollMapToPlayer);
}

function togglePick(k){

  else if(titlePick.length < 3) titlePick.push(k);

function resumeRun(){
