    UI.modal = null;
    render();
  }
}

function faceHTML(f, cls, click){
  const K = KIND[f.k];
  const rd = riderDef(f.r);
  return `<div class="face ${f.k === 'blank' ? 'blank' : ''} ${cls || ''}" ${click ? `onclick="${click}"` : ''}
    data-tip="${esc(faceLabel(f))}|${esc(faceTip(f))}" style="border-color:${f.k === 'blank' ? '' : rd ? rd.col : 'rgba(255,255,255,.18)'}">
    <span class="ic">${K.ic}</span>${f.k === 'blank' || isSigil(f.k) ? '' : `<span class="v" style="color:${K.col}">${f.v}</span>`}
    ${rd ? `<span class="rider" style="color:${rd.col}">${rd.ic}</span>` : ''}</div>`;
}

/* --------------------------------------------------------------------- map */
function viewMap(){
  const H = 74, top = 40;
  const height = FLOORS * H + top;
  const nodes = Object.values(S.map.nodes);
  const xFor = s => 10 + s * 20;
  const yFor = f => height - top / 2 - f * H - 28;
  const avail = availableNodes();
  const availSet = new Set(avail.map(n => n.floor + ',' + n.slot));

  const lines = S.map.edges.map(e => {
    const [a, b] = e.split('>');
    const A = S.map.nodes[a], B = S.map.nodes[b];
    if(!A || !B) return '';
    const live = S.pos && A.floor === S.pos.floor && A.slot === S.pos.slot;
    const used = A.done && B.done;
    return `<line x1="${xFor(A.slot)}%" y1="${yFor(A.floor)}" x2="${xFor(B.slot)}%" y2="${yFor(B.floor)}"
      stroke="${live ? 'rgba(240,180,41,.75)' : used ? 'rgba(255,255,255,.22)' : 'rgba(255,255,255,.10)'}"
      stroke-width="${live ? 2.5 : 1.6}" stroke-dasharray="${live ? '' : '4 5'}"/>`;
  }).join('');

  const dots = nodes.map(n => {
    const k = n.floor + ',' + n.slot;
    const art = NODE_ART[n.type];
    const isHere = S.pos && S.pos.floor === n.floor && S.pos.slot === n.slot;
    const cls = isHere ? 'here' : availSet.has(k) ? 'avail' : n.done ? 'done' : '';
    return `<div class="node ${cls}" data-node="${k}" data-tip="${esc(art.label)}|${esc(nodeTip(n))}"
      style="left:${xFor(n.slot)}%;top:${yFor(n.floor)}px"
      ${availSet.has(k) ? `onclick="clickNode('${k}')"` : ''}>${art.ic}</div>`;
  }).join('');

  const floorLabels = Array.from({length:FLOORS}, (_, f) =>
    `<div class="floor-label" style="top:${yFor(f)}px">${f === FLOORS - 1 ? 'BOSS' : f + 1}</div>`).join('');

  return `
  ${viewParty()}
  <div class="spread" style="margin:16px 0 10px">
    <div><h2 style="font-size:22px">Act ${S.act}</h2>
      <div class="muted tiny">${S.pos ? 'Choose where to go next.' : 'Choose your first room.'}</div></div>
    <div class="row tiny muted wrap-r" style="justify-content:flex-end">
      ${Object.entries(NODE_ART).map(([k, a]) => `<span>${a.ic} ${a.label}</span>`).join('')}
    </div>
  </div>
  <div class="map-shell"><div class="map-scroll" id="mapScroll"><div class="map-inner" style="height:${height}px">
    <svg viewBox="0 0 100 ${height}" preserveAspectRatio="none" style="height:${height}px">${lines}</svg>
    ${floorLabels}${dots}
  </div></div></div>`;
}
function nodeTip(n){
  switch(n.type){
    case 'combat':   return 'A normal fight. Gold and a new die face.';
    case 'elite':    return 'A hard fight. Gold, a face, and a relic.';
    case 'event':    return 'Something happens. It is usually a choice.';
    case 'adventure':return 'Turn a card from the adventure deck. It may arm you or rob you.';
    case 'shop':     return 'Buy faces, a relic, a spell, or a meal.';
    case 'rest':     return 'Heal, sharpen a face, or drill for max HP.';
    case 'treasure': return 'A free relic.';
    case 'boss':     return S.act >= 3 && !S.talisman
      ? 'The act boss. It will not face you without the Talisman.'
      : 'The act boss. Beating it ends the act.';
  }
  return '';
}
function clickNode(k){
  const n = S.map.nodes[k];
  if(!n) return;
  if(!availableNodes().some(x => x === n)) return;
  enterNode(n);
}
function scrollMapToPlayer(){
  const sc = el('mapScroll');
  if(!sc) return;
  const here = sc.querySelector('.node.here') || sc.querySelector('.node.avail');
  if(here) sc.scrollTop = Math.max(0, here.offsetTop - sc.clientHeight * 0.62);
}

/* ------------------------------------------------------------------ combat */
function viewCombat(){
  const tt = pendingTargetType();
  const enemyTargetable = tt === 'enemy';
  const allyTargetable  = tt === 'ally';

  const blockedNow = !!frontRank().length && !pendingReaches();
  const drawEnemy = e => {
    const pct = Math.max(0, Math.round(e.hp / e.maxHp * 100));
    const badges = [];
    if(e.shield) badges.push(`<span class="badge" style="color:var(--blue)" data-tip="Shield|Absorbs damage. Clears when this enemy next acts.">🛡️ ${e.shield}</span>`);
    if(e.poison) badges.push(`<span class="badge" style="color:var(--lime)" data-tip="Poison|Loses this much HP at the end of the round, ignoring shield, then the stack drops by 1.">☠️ ${e.poison}</span>`);
    if(e.burn)   badges.push(`<span class="badge" style="color:var(--orange)" data-tip="Burning|Loses this much HP at the end of the round, ignoring shield. Then the fire GROWS by 1, and spreads to an enemy that is not yet alight.">🔥 ${e.burn}</span>`);
    if(e.stun)   badges.push(`<span class="badge" style="color:var(--gold)" data-tip="Stunned|Loses its next turn.">⚡ ${e.stun}</span>`);
    if(e.steeled) badges.push(`<span class="badge" style="color:var(--ink-dim)" data-tip="Braced|Nothing can stun or dominate it while this lasts. Every hold leaves it braced afterwards, so it cannot be kept under indefinitely.">⛓️ ${e.steeled}</span>`);
    if(e.weak)   badges.push(`<span class="badge" style="color:var(--gold)" data-tip="Reeling|Its attacks land for half.">💫 ${e.weak}</span>`);
    if(e.charm)  badges.push(`<span class="badge" style="color:var(--violet)" data-tip="Dominated|Fights for you for this many turns, attacking its own side. With nothing else alive it simply flails.">🧠 ${e.charm}</span>`);
    if(e.power)  badges.push(`<span class="badge" style="color:var(--pink)" data-tip="Power|Added to every attack.">💢 ${e.power}</span>`);
    if(e.trait){ const td = traitDef(e.trait);
      badges.push(`<span class="badge" style="color:var(--violet);border-color:var(--violet)"
        data-tip="${esc(td.name)}|${esc(td.desc(e.trait.v))}">${td.ic} ${esc(td.name)}${e.trait.v ? ' ' + e.trait.v : ''}</span>`); }
    if(e.item){ const gi = itemDef(e.item);
      badges.push(`<span class="badge" style="color:var(--gold)" data-tip="Carrying ${esc(gi.name)}|${esc(gi.desc)} It is using this against you, and you take it when it falls.">${gi.ic}</span>`); }
    const aura = [e.burn && 's-burn', e.poison && 's-poison', e.stun && 's-stun',
                  e.charm && 's-charm', e.steeled && 's-braced'].filter(Boolean).join(' ');
    const reachable = canTargetEnemy(e);
    const hidden = e.rank && e.hp > 0 && !!frontRank().length;
    if(hidden) badges.push(`<span class="badge" style="color:var(--ink-dim)"
      data-tip="Behind the line|Nothing you have to swing can reach it. Fire, venom and anything cast goes over the front rank; Strikes, Leech and Stun do not.">back rank</span>`);
    return `<div class="unit ${e.hp <= 0 ? 'dead' : ''} ${aura} ${hidden && blockedNow ? 'blocked' : ''} ${enemyTargetable && reachable ? 'targetable' : ''}" data-uid="${e.uid}"
        ${enemyTargetable && reachable ? `onclick="clickTarget('enemy',${e.uid})"` : ''}>
      ${e.hp > 0 ? intentHTML(e) : '<div class="intent" style="opacity:.3">—</div>'}
      <div class="av">${e.av}</div>
      <div class="nm">${e.name}${e.elite ? ' ★' : ''}${e.boss ? ' 👑' : ''}</div>
      ${hpBar(e.uid, pct)}
      <div class="hptext">${e.hp} / ${e.maxHp}</div>
      <div class="badges">${badges.join('')}</div>
    </div>`;
  };
  const rear  = C.enemies.filter(e => e.rank && e.hp > 0);
  const front = C.enemies.filter(e => !(e.rank && e.hp > 0));
  const enemies = `${rear.length ? `<div class="rank-label">behind the line</div><div class="enemy-row rear">${rear.map(drawEnemy).join('')}</div>` : ''}
    <div class="enemy-row">${front.map(drawEnemy).join('')}</div>`;

  const heroes = allies().map(h => {
    const pct = Math.max(0, Math.round(h.hp / h.maxHp * 100));
    const badges = [];
    if(h.shield) badges.push(`<span class="badge" style="color:var(--blue)" data-tip="Shield|Absorbs damage. Fades at the start of your next turn.">🛡️ ${h.shield}</span>`);
    if(h.poison) badges.push(`<span class="badge" style="color:var(--lime)" data-tip="Poison|Loses this much HP at the end of the round, ignoring shield.">☠️ ${h.poison}</span>`);
    if(h.power)  badges.push(`<span class="badge" style="color:var(--pink)" data-tip="Power|Added to every Strike and Cleave this hero rolls.">💢 ${h.power}</span>`);
    if(h.burn)   badges.push(`<span class="badge" style="color:var(--orange)" data-tip="Burning|Loses this much at the end of the round, ignoring shields and armour, then dies down by one. A Mend smothers it faster.">🔥 ${h.burn}</span>`);
    if(h.steeled) badges.push(`<span class="badge" style="color:var(--ink-dim)" data-tip="Braced|Cannot be taken again while this lasts, so no enemy can hold them turn after turn.">⛓️ ${h.steeled}</span>`);
    if(h.guarding) badges.push(`<span class="badge" style="color:var(--blue)" data-tip="Guarding|Every single-target attack this round lands on them instead of whoever it was aimed at.">🪖 guard</span>`);
    if(h.regen)  badges.push(`<span class="badge" style="color:var(--green)" data-tip="Regrowth|Mends this much at the end of the round, then one less each round after.">🌱 ${h.regen}</span>`);
    const csp = chargeSpellOf(h);
    if(csp) badges.push(`<span class="badge" style="color:${(h.charge || 0) >= csp.charge.need ? 'var(--gold)' : 'var(--ink-faint)'}"
      data-tip="${esc(csp.name)}|${esc(csp.desc)} Builds one charge per ${esc(csp.charge.verb)} face ${esc(h.name)} spends, and resets each fight.">⚡ ${h.charge || 0}/${csp.charge.need}</span>`);
    if(h.charmed) badges.push(`<span class="badge" style="color:var(--violet)" data-tip="Taken|Not yours for this many turns. They will not roll for you, and at the end of the enemy turn they swing at the party.">🧠 ${h.charmed}</span>`);
    if(h.isSummon) badges.push(`<span class="badge" style="color:var(--cyan)" data-tip="Fading|This Thrall unravels after this many more turns. Summon again to renew it.">🌀 ${h.turns}</span>`);
    const haura = [h.burn && 's-burn', h.poison && 's-poison', h.charmed && 's-charm',
                   h.guarding && 's-guard', h.steeled && 's-braced'].filter(Boolean).join(' ');
    return `<div class="unit ally ${h.downed ? 'dead' : ''} ${haura} ${allyTargetable && !h.downed ? 'targetable' : ''}" data-uid="${h.uid}"
        ${allyTargetable && !h.downed ? `onclick="clickTarget('ally',${h.uid})"` : ''}>
      <div class="av">${h.av}</div>
      <div class="nm">${h.name}${h.downed ? ' — down' : ''}</div>
      ${hpBar(h.uid, pct)}
      <div class="hptext">${h.hp} / ${h.maxHp}</div>
      <div class="badges">${badges.join('')}</div>
      ${h.isSummon ? '' : `<div class="badges" style="margin-top:2px">${gearStrip(h)}</div>`}
    </div>`;
  }).join('');

  const dice = C.dice.map((d, i) => {
    const h = unitByUid(d.ownerUid);
    const K = KIND[d.k];
    const v = faceValue(h, d);
    const sel = C.pending && C.pending.type === 'die' && C.pending.i === i;
    const rd = riderDef(d.r);
    return `<div class="die ${d.used ? 'used' : ''} ${sel ? 'sel' : ''} ${d.mark ? 'marked' : ''} ${d.fresh ? 'roll' : ''}"
        onclick="clickDie(${i})" data-tip="${esc(faceLabel(d))}|${esc(faceTip({k:d.k, v, r:d.r}))}"
        ${rd ? `style="border-color:${rd.col}"` : ''}>
      ${rd ? `<span class="rider" style="color:${rd.col}">${rd.ic}</span>` : ''}
      <div class="who">${h ? h.name : ''}</div>
      <div class="glyph">${K.ic}</div>
      ${d.k === 'blank' ? '<div class="val" style="color:var(--ink-faint)">—</div>'
        : isSigil(d.k) ? `<div class="val" style="color:${K.col};font-size:19px">\u25C8</div>`
        : `<div class="val" style="color:${K.col}">${v}</div>`}
      <div class="lab">${isSigil(d.k) ? esc(sigilShort(d.k)) : K.name}</div>
    </div>`;
  }).join('');
  C.dice.forEach(d => d.fresh = false);

  const spells = S.spells.map(k => {
    const sp = spellDef(k);
    const sel = C.pending && C.pending.type === 'spell' && C.pending.key === k;
    const ready = spellReady(sp);
    let meter, tip;
    if(sp.charge){
      const owner = chargeHero(sp);
      const have = owner ? (owner.charge || 0) : 0;
      meter = `<span class="c" style="color:${ready ? 'var(--gold)' : 'var(--ink-faint)'}">${ready ? 'READY' : have + '/' + sp.charge.need}</span>`;
      tip = `${sp.name}|${sp.desc} Paid for by the ${(owner || {}).name || sp.charge.owner}: one charge for every ${sp.charge.verb} face they spend, and it resets each fight.`;
    } else {
      meter = `<span class="c">◆${sp.cost}</span>`;
      tip = `${sp.name}|${sp.desc} Costs ${sp.cost} mana, which only the casters make.`;
    }
    return `<button class="spell ${sel ? 'sel' : ''}" ${!ready || C.over ? 'disabled' : ''} onclick="clickSpell('${k}')"
      data-tip="${esc(tip)}">${esc(sp.name)} ${meter}<span class="d">${esc(sp.desc)}</span></button>`;
  }).join('');

  const bagRow = S.bag.map((k, i) => {
    const it = itemDef(k);
    const dead = it.use === 'revive' && !S.party.some(h => h.downed);
    const sel = C.pending && C.pending.type === 'item' && C.pending.i === i;
    return `<button class="spell ${sel ? 'sel' : ''}" ${C.over || dead ? 'disabled' : ''} onclick="clickItem(${i})"
      data-tip="${esc(it.name)}|${esc(it.desc)}">${it.ic} ${esc(it.name)}<span class="d">${esc(it.desc)}</span></button>`;
  }).join('');
  const unspent = C.dice.filter(d => !d.used).length;
  const hint = C.over === 'win' ? 'Victory.'
    : C.over === 'lose' ? 'The party falls.'
    : C.pending ? (blockedNow ? 'Choose a target. This one has to be swung, so only the front rank can be hit.' : 'Choose a target.')
    : C.rerollMode ? 'Pick the dice to reroll, then confirm.'
    : unspent ? `${unspent} ${unspent === 1 ? 'die' : 'dice'} still unspent.`
    : 'Everything is spent. End the turn.';

  return `
  <div class="field">
    <div class="spread">
      <div><h2 style="font-size:20px">${C.type === 'boss' ? 'Boss' : C.type === 'elite' ? 'Elite' : 'Combat'} — turn ${C.turn}${(C.waveNo || 1) > 1 ? ` · wave ${C.waveNo}` : ''}</h2>
        <div class="muted tiny">${esc(hint)}</div></div>
      <div class="row">
        ${C.press ? `<div class="stat" data-tip="The stair|${C.waves.length
            ? 'More is on its way up. When this reaches zero it arrives early, on top of whatever is still standing.'
            : 'Nothing is left to come, but the spire still presses: at zero, everything still standing gains 2 power.'}">⏱️ <b>${C.press}</b></div>` : ''}
        ${C.waves && C.waves.length ? `<div class="stat" data-tip="Waves|Still to come after what is in front of you.">▲ <b>${C.waves.length}</b></div>` : ''}
        <div class="stat" data-tip="Mana|Gained from Focus faces. Spent on spells.">🔮 <b>${C.mana}</b></div>
        ${C.pending ? `<button class="btn sm ghost" onclick="cancelPending()">Cancel</button>` : ''}
      </div>
    </div>
    ${C.phaseBanner ? `<div class="panel" style="padding:10px 14px;border-color:var(--gold);background:linear-gradient(90deg,rgba(240,180,41,.14),transparent)">
      <b style="color:var(--gold)">${esc(C.phaseBanner)}</b></div>` : ''}
    ${riteBar()}
    ${enemies}
    <div class="row" style="justify-content:center;gap:12px;flex-wrap:wrap">${heroes}</div>
    <div class="tray">
      <div class="dice-row">${dice || '<div class="muted tiny" style="padding:12px 4px">The enemy is acting…</div>'}</div>
      <div class="sep"></div>
      <div class="spread wrap-r">
        <div class="row wrap-r">
          <button class="btn sm ${C.rerollMode ? 'primary' : ''}" ${C.rerolls <= 0 || C.over || !C.dice.length ? 'disabled' : ''} onclick="toggleReroll()">
            ↻ Reroll ×${C.rerolls}</button>
          ${C.rerolls <= 0 && S.fate > 0 && !C.over && C.dice.length ? `<button class="btn sm" onclick="spendFate()"
            data-tip="Spend Fate|Buys one more reroll this turn out of your run-long reserve.">✨ Spend Fate (${S.fate})</button>` : ''}
          ${C.rerollMode ? `<button class="btn sm primary" ${C.dice.some(d => d.mark && !d.used) ? '' : 'disabled'} onclick="rerollMarked()">Reroll ${C.dice.filter(d => d.mark && !d.used).length} selected</button>` : ''}
        </div>
        <button class="btn primary" ${C.over ? 'disabled' : ''} onclick="endTurn()">End turn →</button>
      </div>
      ${spells ? `<div class="sep"></div><div class="spell-row">${spells}</div>` : ''}
      ${bagRow ? `<div class="sep"></div><div class="spell-row">${bagRow}</div>` : ''}
    </div>
    <div class="row" style="align-items:stretch;gap:12px;flex-wrap:wrap">
      <div style="flex:1;min-width:280px"><div class="log" id="log">${C.log.slice(-40).map((l, i, a) => `<div class="${i === a.length - 1 ? 'hl' : ''}">${esc(l)}</div>`).join('')}</div></div>
    </div>
  </div>`;
}
/* the rules currently standing over this fight */
function riteBar(){
  const on = Object.keys(C.sigils || {}).filter(k => C.sigils[k] > 0 && SIGILS[k]);
  if(!on.length) return '';
  return `<div class="row wrap-r" style="gap:6px;justify-content:center">` + on.map(k => {
    const sg = SIGILS[k], n = C.sigils[k];
    return `<span class="badge" style="color:${sg.col};border-color:${sg.col}"
      data-tip="${esc(sg.name)}|${esc(sg.line(n))} It holds until this fight ends.">${sg.ic} ${esc(sigilShort(k))}${n > 1 ? ' \u00D7' + n : ''}</span>`;
  }).join('') + `</div>`;
}
function intentHTML(e){
  const it = e.intent;
  if(!it) return '<div class="intent">—</div>';
  const tgt = it.tgt ? (it.k === 'charmed' ? enemyByUid(it.tgt) : unitByUid(it.tgt)) : null;
  const map = {
    attack:    {ic:'⚔️', col:'var(--red)',   v: enemyAtk(e, it.v + (e.power || 0) + enemyItemMod(e, 'dmg'))},
    attackAll: {ic:'🌪️', col:'var(--orange)', v: enemyAtk(e, it.v + (e.power || 0) + enemyItemMod(e, 'dmg') + enemyItemMod(e, 'cleave'))},
    block:     {ic:'🛡️', col:'var(--blue)',  v: it.v},
    buff:      {ic:'💢', col:'var(--pink)',  v: it.v},
    heal:      {ic:'❤️', col:'var(--green)', v: it.v},
    poison:    {ic:'☠️', col:'var(--lime)',  v: it.v},
    burn:      {ic:'🔥', col:'var(--orange)', v: it.v},
    drain:     {ic:'🩸', col:'var(--red)',    v: it.v + (e.power || 0) + enemyItemMod(e, 'dmg')},
    charm:     {ic:'🧠', col:'var(--violet)', v: ''},
    summon:    {ic:'👁️', col:'var(--cyan)',  v: ''},
    charmed:   {ic:'🧠', col:'var(--violet)', v: it.v}
  }[it.k] || {ic:'?', col:'', v:''};
  const label = it.k === 'attackAll' ? 'all allies'
              : it.k === 'summon' ? 'reinforcements'
              : it.k === 'charmed' && !tgt ? 'nothing' : tgt ? tgt.name : '';
  const tips = {
    attack:'It will attack this hero.', attackAll:'It will hit every hero.',
    block:'It will shield itself.', buff:'It will raise its own power.',
    heal:'It will heal itself.', poison:'It will poison this hero.',
    burn:'It will set this hero alight.', drain:'It will take this much and heal itself for it.',
    charm:'It will take this hero from you for a turn.', summon:'It will call something else in.',
    charmed:'You control it. It will attack its own side.'
  };
  return `<div class="intent" style="color:${map.col}" data-tip="Intent|${esc(tips[it.k] || '')}">
    ${map.ic} ${map.v}${label ? `<span class="tgt">→ ${esc(label)}</span>` : ''}</div>`;
}
function spendFate(){
  if(!C || C.over || S.fate <= 0) return;
  S.fate--; C.rerolls++;
  C.rerollMode = true; C.pending = null;
  logc('You spend a point of Fate.');
  save(); render();
}
function toggleReroll(){ C.rerollMode = !C.rerollMode; C.pending = null; if(!C.rerollMode) C.dice.forEach(d => d.mark = false); render(); }
function cancelPending(){ C.pending = null; render(); }

  if(old) old.remove();
  if(!UI.modal || !S) return;
  const m = UI.modal;
  let html = '';
  switch(m.type){

/* Judging an offered face means knowing what the party already rolls. Compare
   in EFFECTIVE values, not printed ones: a Strike 5 offered to a Duelist in a
   Silver Sword really lands as 7, and his current best is boosted too. */
function faceVerdict(f){
  /* a rite is not a number, so there is nothing to compare it against */
  if(isSigil(f.k)){
    const who = S.party.find(h => h.faces.some(x => x.k === f.k));
    return who
      ? `<span style="color:var(--gold)">${esc(who.name)} already carries it</span> <span class="faint">(a second copy deepens the rite)</span>`
      : `<span style="color:var(--cyan)">A standing rule, not a number</span> <span class="faint">(nothing in a short fight, everything in a long one)</span>`;
  }
  const eligible = S.party.filter(h => canTakeFace(h, f.k));
  if(!eligible.length)
    return `<span style="color:var(--ink-faint)">Nobody here can carry it</span>`;
  /* The useful question is not "who gains most" -- that is always whoever
     rolls the kind worst, and you would never put your best Strike on the
     Warden. It is whether this beats what the party already rolls. */
  let curBest = null, curWho = null;
  eligible.forEach(h => h.faces.forEach(x => {
    if(x.k !== f.k) return;
    const v = faceValue(h, x);
    if(curBest === null || v > curBest){ curBest = v; curWho = h; }
  }));
  let offBest = -Infinity, offWho = null, offAff = -1;
  eligible.forEach(h => {
    const v = faceValue(h, f);
    /* when several would roll it the same, name the one who actually trades in
       this kind rather than whoever happens to be first in the party */
    const affinity = h.faces.filter(x => x.k === f.k).length;
    if(v > offBest || (v === offBest && affinity > offAff)){ offBest = v; offWho = h; offAff = affinity; }
  });
  if(curBest === null)
    return `<span style="color:var(--cyan)">New to your party</span> \u00B7 <span class="faint">${esc(offWho.name)} would roll ${offBest}</span>`;
  if(offBest > curBest)
    return `<span style="color:var(--green)">Beats your best: ${esc(offWho.name)} would roll ${offBest}</span> <span class="faint">(best now ${curBest})</span>`;
  return `<span style="color:var(--gold)">You already roll ${curBest}</span> <span class="faint">(${esc(curWho.name)})</span>`;
}
/* the party's dice, so the offer can be judged against them */
function partyDiceBlock(){
  return `<div class="panel" style="background:var(--card);padding:11px;margin-bottom:12px">
    <div class="tiny faint" style="margin-bottom:5px">What your party rolls right now</div>

}

}

function mInstall(m){
  const add = m.mode === 'add';
  return `
    <h2>${add ? 'Add a seventh face' : 'Replace a face'}</h2>
    <div class="row" style="margin:10px 0 4px">
      ${faceHTML(m.face, 'big')}
      <div><b style="color:${KIND[m.face.k].col}">${esc(faceLabel(m.face))}</b>
        <div class="tiny muted">${esc(KIND[m.face.k].desc(m.face.v))}</div></div>
    </div>

/* Tooltips are mousemove-driven, so on a touch screen they never fire at all.
   Anything a player needs in order to choose has to be on the page itself. */
const MOD_LABEL = {
  dmg:'Strike & Cleave', cleave:'Cleave', shield:'Shield & Aegis', heal:'Mend',
  poison:'Venom', burn:'Ignite', daze:'Mindlock', charm:'Dominate',
  armour:'Damage soaked', maxHp:'Max HP'
};
const GLOB_LABEL = {
  gold:'Gold found', manaCombat:'Mana at combat start', manaTurn:'Mana each turn',
  rerolls:'Rerolls each turn', fate:'Fate cap', postHeal:'Heal after combat',
  thorns:'Damage returned', lifesteal:'Heal per Strike',
  thrallTurns:'Thrall turns', thrallHp:'Thrall HP', allFaces:'Every numbered face'
};
function fmtDelta(v){
  if(Math.abs(v) < 1 && v !== 0) return (v > 0 ? '+' : '') + Math.round(v * 100) + '%';
  return (v > 0 ? '+' : '') + v;
}
/* every stat an item touches, as [label, amount] */
function itemStats(it){
  if(!it) return [];
  return Object.entries(it.mod || {}).map(([k, v]) => [MOD_LABEL[k] || k, v])
    .concat(Object.entries(it.glob || {}).map(([k, v]) => [GLOB_LABEL[k] || k, v]));
}
/* what actually changes if newIt goes in where oldIt is */
function statDelta(oldIt, newIt){
  const map = {};
  const add = (it, sign) => itemStats(it).forEach(([L, v]) => { map[L] = (map[L] || 0) + v * sign; });
  add(newIt, 1); add(oldIt, -1);
  return Object.entries(map).filter(([, v]) => v !== 0);
}
function deltaHTML(oldIt, newIt){
  const d = statDelta(oldIt, newIt);
  if(!d.length) return '<span class="faint">no change to any stat</span>';
  return d.map(([L, v]) =>
    `<span style="color:${v > 0 ? 'var(--green)' : 'var(--red)'}">${esc(L)} ${fmtDelta(v)}</span>`).join(' &nbsp;·&nbsp; ');
}
function statLine(it){
  const st = itemStats(it);
  if(!st.length) return '';
  return st.map(([L, v]) => `${esc(L)} ${fmtDelta(v)}`).join(' · ');
}
function itemCard(it, extra){
  /* a curse is named on the card, never discovered afterwards */
  const tierCol = it.tier === 3 ? 'var(--gold)' : it.tier === 2 ? 'var(--violet)' : 'var(--ink-dim)';
  return `<div class="row" style="gap:11px">
    <div style="font-size:26px">${it.ic}</div>
    <div><b style="color:${it.cursed ? 'var(--red)' : tierCol}">${esc(it.name)}</b>${it.cursed ? ' <span class="tiny" style="color:var(--red)">cursed</span>' : ''}
      <span class="tiny faint"> ${'★'.repeat(it.tier)}</span>
      <div class="tiny muted">${esc(it.desc)}</div>${extra || ''}</div></div>`;
}
/* Which FACE KINDS a piece of gear actually touches. "+3 Shield and Aegis"
   is worth nothing to a hero with no Shield faces, and that is the whole
   decision, so the faces have to be on the screen where it is made. */
function itemFaceBonus(it){
  const out = {};
  if(!it) return out;
  const m = it.mod || {}, g = it.glob || {};
  const add = (k, v) => { if(v) out[k] = (out[k] || 0) + v; };
  add('dmg', m.dmg);      add('dmgAll', m.dmg);   add('dmgAll', m.cleave);
  add('shield', m.shield); add('shieldAll', m.shield);
  add('heal', m.heal);    add('poison', m.poison); add('burn', m.burn);
  add('daze', m.daze);    add('charm', m.charm);
  if(g.allFaces) Object.keys(KIND).forEach(k => { if(k !== 'blank' && !isSigil(k)) add(k, g.allFaces); });
  return out;
}

function faceChips(h, oldIt, newIt){
  const before = itemFaceBonus(oldIt), after = itemFaceBonus(newIt);
  return `<div class="row wrap-r" style="gap:4px;margin-top:6px">` + h.faces.map(f => {
    const K = KIND[f.k];
    if(f.k === 'blank') return `<span class="badge faint">${K.ic}</span>`;
    if(isSigil(f.k)) return `<span class="badge" style="border-color:${K.col};color:${K.col}"
      data-tip="${esc(K.name)}|${esc(K.desc(0))}">${K.ic} rite</span>`;
    const rdc = riderDef(f.r);
    const d = (after[f.k] || 0) - (before[f.k] || 0);
    const now = faceValue(h, f);
    return `<span class="badge" ${rdc ? `data-tip="${esc(faceLabel(f))}|${esc(faceTip(f))}"` : ''}
      style="border-color:${d ? (d > 0 ? 'var(--green)' : 'var(--red)') : rdc ? rdc.col : 'var(--line)'}">
      ${K.ic}${rdc ? `<span style="color:${rdc.col}">${rdc.ic}</span>` : ''} <b style="color:${K.col}">${now}</b>${d ? `<span style="color:${d > 0 ? 'var(--green)' : 'var(--red)'}">→${Math.max(0, now + d)}</span>` : ''}</span>`;
  }).join('') + `</div>`;
}

              <div style="font-weight:700;font-size:13.5px">${r.ic} ${esc(r.name)}</div>
              <div class="tiny muted">${esc(r.desc)}</div></div>`; }).join('')
          : '<div class="tiny faint" style="padding-top:7px">None yet.</div>'}
      </div>

      ${S.spells.length ? `<div class="panel" style="background:var(--card);padding:12px">
        <b>📜 Spells <span class="tiny muted">${S.spells.length}</span></b>
        ${S.spells.map(k => { const sp = spellDef(k); return `<div style="padding:7px 0;border-top:1px solid var(--line)">
          <div style="font-weight:700;font-size:13.5px">${esc(sp.name)} ${sp.charge
            ? `<span style="color:var(--gold)">⚡${sp.charge.need} ${esc(sp.charge.verb)}s</span>`
            : `<span style="color:var(--violet)">◆${sp.cost} mana</span>`}</div>
          <div class="tiny muted">${esc(sp.desc)}</div></div>`; }).join('')}
      </div>` : ''}
    </div>
    <div class="sep"></div>
    <div class="row" style="justify-content:flex-end"><button class="btn primary" onclick="closeInventory()">${
      UI.modal && UI.modal.back ? 'Back' : 'Close'}</button></div>`;
}
function mEquip(m){
  const it = itemDef(m.key);
  return `<h2>${it.ic} ${esc(it.name)}</h2>
    <p class="muted tiny" style="margin:6px 0 4px">${esc(it.desc)}</p>
    <p class="tiny" style="margin-bottom:12px;color:var(--ink-dim)">
      Goes in the <b style="color:var(--ink)">${it.slot}</b> slot. Whatever is there now is thrown away.
      Each hero's die is shown below with the change marked on the faces it touches.</p>
    <div class="col">
      ${S.party.map(h => {
        const cur = h.gear && h.gear[it.slot] ? itemDef(h.gear[it.slot]) : null;
        return `<button class="opt" onclick="equipItem(${h.uid},'${it.key}')">
          <div class="t">${h.av} ${esc(h.name)}</div>
          ${cur
            ? `<div class="s" style="margin-top:4px">Replaces ${cur.ic} <b style="color:var(--ink)">${esc(cur.name)}</b><br>
                 <span class="faint">${esc(cur.desc)}</span></div>`
            : `<div class="s" style="margin-top:4px">Their ${it.slot} slot is empty.</div>`}
          <div class="tiny" style="margin-top:7px;line-height:1.7">${deltaHTML(cur, it)}</div>
          ${faceChips(h, cur, it)}
          ${(() => {
            const bon = itemFaceBonus(it);
            const uses = h.faces.some(f => bon[f.k]);
            const offDie = (it.mod && (it.mod.armour || it.mod.maxHp)) || it.glob;
            if(uses || offDie) return '';
            return `<div class="tiny" style="margin-top:5px;color:var(--gold)">⚠️ Nothing on this die uses it.</div>`;
          })()}
          ${(() => {
            const worn = GEAR_SLOTS.filter(sl => sl !== it.slot)
              .map(sl => h.gear && h.gear[sl] ? itemDef(h.gear[sl]) : null).filter(Boolean);
            return `<div class="tiny faint" style="margin-top:5px">${worn.length
              ? 'Also wearing ' + worn.map(w => `${w.ic} ${esc(w.name)}`).join(' · ')
              : 'Wearing nothing else'}</div>`;
          })()}
        </button>`;
      }).join('')}
    </div>
    <div class="sep"></div>
    <div class="spread">${invButton()}<button class="btn ghost" onclick="declineItem()">Leave it behind</button></div>`;
}
function mBagFull(m){
  const it = itemDef(m.key);
  return `<h2>Your bag is full</h2>
    <div class="panel" style="background:var(--card);padding:12px;margin:10px 0">${itemCard(it)}</div>
    <p class="muted tiny" style="margin-bottom:10px">Choose what to throw out for it, or walk on.</p>
    <div class="col">
      ${S.bag.map((k, i) => { const b = itemDef(k);
        return `<button class="opt" onclick="swapBag(${i})"><div class="t">${b.ic} ${esc(b.name)}</div>
          <div class="s">${esc(b.desc)}</div></button>`; }).join('')}
    </div>
    <div class="sep"></div>
    <div class="spread">${invButton()}<button class="btn ghost" onclick="declineItem()">Keep what I have</button></div>`;
}
function mTemper(){
  return `<h2>Temper a piece</h2>
    <p class="muted tiny" style="margin-bottom:10px">One worn item gains a permanent +1 on every number it carries. A curse is not deepened.</p>
    <div class="col">
      ${S.party.map(h => GEAR_SLOTS.map(sl => {
        const it = h.gear && h.gear[sl] ? itemDef(h.gear[sl]) : null;
        if(!it) return '';
        return `<button class="opt" ${it.tempered ? 'disabled' : ''} onclick="temperItem(${h.uid},'${sl}')">
          <div class="t">${it.ic} ${esc(it.name)} <span class="faint">· ${h.av} ${esc(h.name)}</span></div>
          <div class="s">${esc(it.desc)}${it.tempered ? ' — already tempered' : ''}</div></button>`;
      }).join('')).join('')}
    </div>
    <div class="sep"></div>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" onclick="closeEvent()">Never mind</button></div>`;
}
function mScour(m){
  return `<h2>Grind down a die</h2>
    <p class="muted tiny" style="margin-bottom:10px">
      Click the side to remove. It is gone for the rest of the run, and every side left on that die comes up more often.
      No die may go below ${MIN_FACES} sides.${m.cost ? ` This costs <b style="color:var(--gold)">${m.cost} gold</b>, charged only if you go through with it.` : ''}</p>
    <div class="col">
      ${S.party.map(h => {
        const locked = h.faces.length <= MIN_FACES;
        return `<div class="panel" style="background:var(--card);padding:12px;${locked ? 'opacity:.45' : ''}">
          <div class="spread" style="margin-bottom:8px">
            <b>${h.av} ${esc(h.name)}</b>
            <span class="tiny ${locked ? '' : 'muted'}">${h.faces.length} sides${locked ? ' — cannot go lower' : ''}</span>
          </div>
          <div class="faces">${h.faces.map((f, i) =>
            faceHTML(f, 'big ' + (locked ? '' : 'pickable'), locked ? '' : `doScour(${h.uid},${i})`)).join('')}</div>
        </div>`;
      }).join('')}
    </div>
    <div class="sep"></div>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" onclick="cancelScour()">Leave the dice alone</button></div>`;
}
function mDrill(){
  return `<h2>Take the lesson</h2>
    <p class="muted tiny" style="margin-bottom:10px">+1 to every Strike face. That hero loses 4 max HP.</p>
    <div class="col">
      ${S.party.map(h => `<button class="opt" onclick="drillHero(${h.uid})">
        <div class="t">${h.av} ${esc(h.name)}</div>
        <div class="s">${h.faces.filter(f => f.k === 'dmg').length} Strike face(s) — ${h.maxHp} max HP</div></button>`).join('')}
    </div>
    <div class="sep"></div>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" onclick="closeEvent()">Never mind</button></div>`;
}
function mTreasure(m){
  return `<h2>📦 Treasure</h2>
    ${m.relic ? `<div class="panel" style="margin:12px 0;display:flex;gap:12px;align-items:center;background:var(--card)">
      <div style="font-size:28px">${relicDef(m.relic).ic}</div>
      <div><b>${esc(relicDef(m.relic).name)}</b><div class="tiny muted">${esc(relicDef(m.relic).desc)}</div></div></div>`
      : '<p class="muted">The chest has already been emptied.</p>'}
    ${m.item ? `<div class="panel" style="margin:12px 0;background:var(--card)">${itemCard(itemDef(m.item))}</div>` : ''}
    <p class="muted">And <b style="color:var(--gold)">${m.gold} gold</b> in loose coin.</p>
    <div class="sep"></div>
    <div class="row" style="justify-content:flex-end"><button class="btn primary" onclick="afterTreasure()">Continue →</button></div>`;
}
function afterTreasure(){
  UI.modal = null;
  if(UI.pendingItems && UI.pendingItems.length){ grantItem(UI.pendingItems.shift(), afterTreasure); return; }
  if(UI.pendingAncestral){ UI.pendingAncestral = false; UI.modal = { type:'ancestral', after: afterTreasure }; render(); return; }
  S.screen = 'map'; save(); render();
}
function mEvent(m){
  const ev = m.ev;
  return `<h2>${ev.ic} ${esc(ev.name)}</h2>
    <p class="muted" style="margin:8px 0 14px">${esc(ev.text)}</p>
    <div class="col">
      ${ev.choices.map((c, i) => {
        const ok = !c.req || c.req();
        return `<button class="opt" ${ok ? '' : 'disabled'} onclick="eventChoice(${i})">
          <div class="t">${esc(c.t)}</div><div class="s">${esc(c.s)}${ok ? '' : ' — you cannot afford this'}</div></button>`;
      }).join('')}
    </div>`;
}
function eventChoice(i){
  const c = UI.modal.ev.choices[i];
  if(c.req && !c.req()) return;
  UI.modal = null;
  c.go();
}
function mAdventure(m){
  const c = m.card;
  const tone = c.good === true ? 'var(--green)' : c.good === false ? 'var(--red)' : 'var(--gold)';
  return `<div class="row" style="gap:12px;align-items:flex-start">
      <div style="font-size:38px">${c.ic}</div>
      <div><span class="pill" style="border-color:${tone};color:${tone}">${esc(c.kind)}</span>
        <h2 style="margin-top:6px">${esc(c.name)}</h2></div>
    </div>
    <p class="muted" style="margin:10px 0 14px">${esc(c.text)}</p>
    ${c.choices
      ? `<div class="col">${c.choices.map((ch, i) => {
          const ok = !ch.req || ch.req();
          return `<button class="opt" ${ok ? '' : 'disabled'} onclick="advChoose(${i})">
            <div class="t">${esc(ch.t)}</div><div class="s">${esc(ch.s)}${ok ? '' : ' — you cannot afford this'}</div></button>`;
        }).join('')}</div>`
      : `<div class="row" style="justify-content:flex-end"><button class="btn primary" onclick="advTake()">See what it is →</button></div>`}`;
}
function mAdvResult(m){
  return `<h2>${m.item ? 'You found something' : 'And so'}</h2>
    <p class="muted" style="margin:10px 0 12px">${esc(m.text)}</p>
    ${m.item ? `<div class="panel" style="background:var(--card);margin-bottom:12px">${itemCard(itemDef(m.item))}</div>` : ''}
    <div class="row" style="justify-content:flex-end"><button class="btn primary" onclick="advDone()">Continue →</button></div>`;
}
function mResult(m){
  return `<h2>Well then</h2><p class="muted" style="margin:10px 0 14px">${esc(m.text)}</p>
    <div class="row" style="justify-content:flex-end"><button class="btn primary" onclick="closeEvent()">Continue →</button></div>`;
}
function mAct(m){
  return `<h2>Act ${m.act}</h2>
    <p class="muted" style="margin:10px 0 14px">The stair keeps going. Everything here hits harder.</p>
    <div class="row" style="justify-content:flex-end"><button class="btn primary" onclick="closeEvent()">Climb →</button></div>`;
}

/* ============================================================================
   EFFECTS, TOOLTIPS, INPUT, BOOT
   ========================================================================== */
UI.floats = [];
UI.hpSeen = {};
function hpBar(uid, pct, extra){
  return `<div class="hpbar" data-uid="${uid}" data-pct="${pct}"${extra || ''}>
    <i class="ghost"></i><i class="fill"></i></div>`;
}
function flushBars(){
  document.querySelectorAll('.hpbar[data-uid]').forEach(bar => {
    const id = bar.dataset.uid, pct = +bar.dataset.pct;
    const prev = UI.hpSeen[id] === undefined ? pct : UI.hpSeen[id];
    const fill = bar.querySelector('.fill'), ghost = bar.querySelector('.ghost');
    if(!fill || !ghost) return;
    fill.style.width = prev + '%'; ghost.style.width = prev + '%';
    void bar.offsetWidth;          /* commit the old width, or there is nothing to animate from */
    fill.style.width = pct + '%'; ghost.style.width = pct + '%';
    UI.hpSeen[id] = pct;
  });
}
UI.pendingItems = [];
function queueItem(k){ if(k){ UI.pendingItems = UI.pendingItems || []; UI.pendingItems.push(k); } }
function floatOn(uidv, text, color){ UI.floats.push({ uid:uidv, text, color }); }
function flushFloats(){
  if(!UI.floats.length) return;
  const q = UI.floats; UI.floats = [];
  q.forEach((f, i) => {
    const node = document.querySelector(`[data-uid="${f.uid}"]`);
    if(!node) return;
    node.classList.remove('hit'); void node.offsetWidth; node.classList.add('hit');
    if(/^-\d+$/.test(f.text) && parseInt(f.text.slice(1), 10) >= 12){
      const app = el('app');
      app.classList.remove('quake'); void app.offsetWidth; app.classList.add('quake');
      setTimeout(() => app.classList.remove('quake'), 340);
    }
    const r = node.getBoundingClientRect();
    const d = document.createElement('div');
    d.className = 'float';
    d.textContent = f.text;
    d.style.color = f.color;
    d.style.left = (r.left + r.width / 2) + 'px';
    d.style.top = (r.top + 26 + (i % 3) * 14) + 'px';
    el('fx').appendChild(d);
    setTimeout(() => d.remove(), 950);
  });
}

const tip = () => el('tip');
document.addEventListener('mousemove', e => {
  const t = e.target.closest ? e.target.closest('[data-tip]') : null;
  if(!t){ tip().classList.remove('on'); return; }
  const [title, body] = t.getAttribute('data-tip').split('|');
  tip().innerHTML = `<b>${esc(title)}</b>${body ? esc(body) : ''}`;
  tip().classList.add('on');
  const w = 260;
  let x = e.clientX + 16, y = e.clientY + 16;
  if(x + w > window.innerWidth - 10) x = window.innerWidth - w - 10;
  if(y + 110 > window.innerHeight) y = e.clientY - 110;
  tip().style.left = x + 'px';
  tip().style.top = Math.max(8, y) + 'px';
}, {passive:true});
document.addEventListener('mouseleave', () => tip().classList.remove('on'));

document.addEventListener('keydown', e => {
  if(!S || S.screen !== 'combat' || !C || C.over) return;
  if(e.key === 'Escape'){ C.pending = null; C.rerollMode = false; C.dice.forEach(d => d.mark = false); render(); return; }
  if(UI.modal) return;
  if(e.key === 'r' || e.key === 'R'){ if(C.rerolls > 0 && C.dice.length) toggleReroll(); return; }
  if(e.key === 'Enter'){ endTurn(); return; }
  const n = parseInt(e.key, 10);
  if(n >= 1 && n <= C.dice.length){ clickDie(n - 1); }
});

/* boot */
(function boot(){
  if(localStorage.getItem(SAVE_KEY)) { /* offer resume from the title screen */ }
  render();
})();
</script>
</body>
</html>
