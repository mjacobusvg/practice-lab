<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Dice Spire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e18; --panel:#121a2b; --card:#1a2338; --card-hi:#222d47;
  --ink:#e9eef8; --ink-dim:#9aa5bd; --ink-faint:#6b7791;
  --line:rgba(255,255,255,0.08); --line-hi:rgba(255,255,255,0.20);
  --gold:#f0b429; --red:#ef5350; --blue:#5aa9f5; --green:#3ddc97;
  --violet:#a78bfa; --lime:#a3e635; --orange:#fb923c; --pink:#f472b6; --cyan:#38bdf8;
  --r:10px; --r-lg:16px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:
    radial-gradient(1100px 700px at 50% -10%, #1b2440 0%, transparent 60%),
    radial-gradient(800px 500px at 90% 110%, #201a34 0%, transparent 60%),
    var(--bg);
  color:var(--ink);
  font-family:'DM Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  font-size:15px; line-height:1.45;
  overflow-x:hidden;
}
h1,h2,h3,.serif{font-family:'DM Serif Display',Georgia,serif;font-weight:400;letter-spacing:.2px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:16px 16px 40px}
.hidden{display:none !important}

/* ---------- generic ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 18px;border-radius:var(--r);border:1px solid var(--line-hi);
  background:linear-gradient(180deg,#232e4a,#182135);
  font-weight:600;font-size:14px;letter-spacing:.3px;
  transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
}
.btn:hover:not(:disabled){background:linear-gradient(180deg,#2c3a5d,#1d2743);transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(0)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:linear-gradient(180deg,#f0b429,#c98d12);color:#1a1205;border-color:#f7cf6b}
.btn.primary:hover:not(:disabled){background:linear-gradient(180deg,#ffc94a,#d89a17)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.danger{border-color:rgba(239,83,80,.5);color:#ffb3b1}
.btn.sm{padding:6px 12px;font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px}
.muted{color:var(--ink-dim)}
.faint{color:var(--ink-faint)}
.tiny{font-size:12px}
.center{text-align:center}
.row{display:flex;gap:10px;align-items:center}
.row.wrap-r{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sep{height:1px;background:var(--line);margin:14px 0}

/* ---------- top bar ---------- */
#topbar{
  position:sticky;top:0;z-index:40;backdrop-filter:blur(10px);
  background:rgba(10,14,24,.82);border-bottom:1px solid var(--line);
}
#topbar .inner{max-width:1080px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:'DM Serif Display',serif;font-size:19px;letter-spacing:.5px}
.brand .d{color:var(--gold)}
.stat{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-dim)}
.stat b{color:var(--ink);font-weight:700}
.relic-bar{display:flex;gap:5px;flex-wrap:wrap;margin-left:auto}
.relic{
  width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:15px;
  background:var(--card);border:1px solid var(--line-hi);cursor:help;position:relative;
}
.relic:hover{background:var(--card-hi);border-color:var(--gold)}

/* ---------- tooltip ---------- */
#tip{
  position:fixed;z-index:200;max-width:260px;pointer-events:none;opacity:0;
  background:#0d1322;border:1px solid var(--line-hi);border-radius:10px;padding:9px 11px;
  font-size:12.5px;line-height:1.4;box-shadow:0 12px 34px rgba(0,0,0,.6);transition:opacity .1s
}
#tip.on{opacity:1}
#tip b{display:block;margin-bottom:3px;font-size:13px}

/* ---------- title ---------- */
.title-hero{text-align:center;padding:40px 0 22px}
.title-hero h1{font-size:clamp(40px,9vw,70px);line-height:1;letter-spacing:1px}
.title-hero h1 span{color:var(--gold)}
.title-hero p{color:var(--ink-dim);margin-top:12px;font-size:15px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;border:1px solid var(--line-hi);font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-dim)}

.hero-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:12px}
.hero-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;
  cursor:pointer;transition:.14s;position:relative;
}
.hero-card:hover{border-color:var(--line-hi);background:var(--card-hi)}
.hero-card.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold), 0 8px 26px rgba(240,180,41,.13)}
.hero-card .hd{display:flex;gap:11px;align-items:center}
.hero-card .av{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:#0f1729;border:1px solid var(--line-hi);flex:none}
.hero-card .nm{font-family:'DM Serif Display',serif;font-size:19px}
.hero-card .hp{font-size:12px;color:var(--ink-dim)}
.hero-card .desc{font-size:12.5px;color:var(--ink-dim);margin:9px 0 10px;min-height:34px}

/* ---------- die faces ---------- */
.faces{display:flex;gap:5px;flex-wrap:wrap}
.face{
  width:38px;height:38px;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#0f1729;border:1px solid var(--line-hi);line-height:1;flex:none;position:relative;
}
.face .ic{font-size:14px}
.face .v{font-size:12px;font-weight:700;margin-top:1px}
.face.blank{opacity:.42}
.face.big{width:52px;height:52px;border-radius:11px}
.face.big .ic{font-size:19px}
.face.big .v{font-size:15px}
.face.pickable{cursor:pointer}
.face.pickable:hover{border-color:var(--gold);background:#151f36}
.face.locked{opacity:.3;cursor:not-allowed}
.face.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}

/* ---------- map ---------- */
.map-shell{position:relative;background:linear-gradient(180deg,#0e1424,#0b1020);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.map-scroll{overflow-y:auto;max-height:min(70vh,660px);position:relative}
.map-inner{position:relative;width:100%}
.map-inner svg{position:absolute;inset:0;width:100%;height:100%}
.node{
  position:absolute;width:46px;height:46px;transform:translate(-50%,-50%);border-radius:50%;
  display:grid;place-items:center;font-size:20px;background:#141d31;
  border:2px solid rgba(255,255,255,.14);transition:.15s;z-index:2;
}
.node.done{opacity:.4;filter:grayscale(.7)}
.node.avail{border-color:var(--gold);box-shadow:0 0 0 4px rgba(240,180,41,.14),0 0 18px rgba(240,180,41,.25);cursor:pointer;animation:pulse 2.1s ease-in-out infinite}
.node.avail:hover{transform:translate(-50%,-50%) scale(1.13)}
.node.here{border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.14)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(240,180,41,.13),0 0 16px rgba(240,180,41,.2)}50%{box-shadow:0 0 0 7px rgba(240,180,41,.05),0 0 26px rgba(240,180,41,.35)}}
.floor-label{position:absolute;left:6px;transform:translateY(-50%);font-size:10.5px;color:var(--ink-faint);z-index:1}

/* ---------- combat ---------- */
.field{display:flex;flex-direction:column;gap:14px}
.enemy-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;min-height:150px;align-items:flex-end}
.enemy-row.rear{min-height:0;transform:scale(.88);transform-origin:bottom center;margin-bottom:-10px}
.rank-label{text-align:center;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin:2px 0 -2px}
.rider{position:absolute;top:-5px;right:-5px;font-size:10px;line-height:1;padding:2px 3px;border-radius:5px;
  background:var(--bg);border:1px solid var(--line)}
.face{position:relative}
.die{position:relative}
.unit.blocked{opacity:.72}
.unit.blocked::before{content:'';position:absolute;inset:0;border-radius:var(--r-lg);
  border:1px dashed rgba(255,255,255,.18);pointer-events:none}
.unit{
  width:150px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:10px;position:relative;transition:.14s;
}
.unit.targetable{cursor:pointer;border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 20px rgba(240,180,41,.16)}
.unit.targetable:hover{transform:translateY(-3px);background:var(--card-hi)}
.unit.dead{opacity:.28;filter:grayscale(1)}
.unit.hit{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}22%{transform:translateX(-6px)}55%{transform:translateX(5px)}80%{transform:translateX(-2px)}}
.unit .av{font-size:30px;text-align:center;line-height:1.1}
.unit .nm{font-size:13px;font-weight:700;text-align:center;margin-top:2px}
.hpbar{height:9px;border-radius:5px;background:#0b1120;border:1px solid var(--line);overflow:hidden;margin-top:6px;position:relative}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#e0433f,#ef5350);transition:width .28s ease}
.unit.ally .hpbar i{background:linear-gradient(90deg,#28a06c,#3ddc97)}
.hptext{font-size:11px;color:var(--ink-dim);text-align:center;margin-top:3px;font-variant-numeric:tabular-nums}
.badges{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:5px;min-height:19px}
.badge{font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:6px;background:#0d1524;border:1px solid var(--line-hi);display:inline-flex;gap:3px;align-items:center}
.intent{
  display:flex;align-items:center;justify-content:center;gap:5px;font-size:12px;font-weight:700;
  background:#0d1524;border:1px solid var(--line-hi);border-radius:8px;padding:4px 7px;margin-bottom:7px;
}
.intent .tgt{font-size:10px;color:var(--ink-faint);font-weight:600}

.tray{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px}
.dice-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start;justify-content:center}
.die{
  width:70px;border-radius:12px;background:linear-gradient(180deg,#232e4a,#151d30);
  border:1px solid var(--line-hi);padding:7px 5px;text-align:center;cursor:pointer;transition:.13s;position:relative;
}
.die:hover:not(.used){transform:translateY(-3px);border-color:var(--line-hi)}
.die.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 6px 22px rgba(240,180,41,.22);transform:translateY(-4px)}
.die.marked{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(56,189,248,.6)}
.die.used{opacity:.3;cursor:default}
.die .who{font-size:10px;color:var(--ink-faint);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.die .glyph{font-size:24px;line-height:1.05}
.die .val{font-size:15px;font-weight:700;margin-top:1px}
.die .lab{font-size:10px;color:var(--ink-dim);margin-top:2px}
.die.roll{animation:tumble .34s ease}
@keyframes tumble{0%{transform:rotate(-16deg) scale(.82);opacity:.35}60%{transform:rotate(7deg) scale(1.05)}100%{transform:rotate(0) scale(1)}}

.log{height:96px;overflow-y:auto;font-size:12.5px;color:var(--ink-dim);background:#0c1220;border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
.log div{padding:1px 0}
.log .hl{color:var(--ink)}

.float{position:fixed;z-index:120;pointer-events:none;font-weight:800;font-size:20px;text-shadow:0 2px 8px rgba(0,0,0,.8);animation:floaty .9s ease-out forwards}
@keyframes floaty{0%{opacity:0;transform:translate(-50%,0) scale(.7)}18%{opacity:1;transform:translate(-50%,-10px) scale(1.14)}100%{opacity:0;transform:translate(-50%,-52px) scale(1)}}

/* ---------- modal ---------- */
.veil{position:fixed;inset:0;z-index:100;background:rgba(5,8,15,.78);backdrop-filter:blur(5px);display:grid;place-items:center;padding:18px;overflow-y:auto}
.modal{width:min(660px,100%);background:var(--panel);border:1px solid var(--line-hi);border-radius:20px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.6);max-height:92vh;overflow-y:auto}
.modal h2{font-size:26px;margin-bottom:6px}
.opt{
  width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 14px;transition:.13s;display:block;
}
.opt:hover:not(:disabled){background:var(--card-hi);border-color:var(--gold);transform:translateX(3px)}
.opt:disabled{opacity:.42;cursor:not-allowed}
.opt .t{font-weight:700;font-size:14.5px}
.opt .s{font-size:12.5px;color:var(--ink-dim);margin-top:2px}
.reward-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.reward{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px;cursor:pointer;transition:.13s;text-align:center}
.reward:hover{border-color:var(--gold);background:var(--card-hi);transform:translateY(-2px)}
.reward .nm{font-weight:700;margin-top:7px;font-size:14px}
.reward .ds{font-size:12px;color:var(--ink-dim);margin-top:3px}

.spell-row{display:flex;gap:8px;flex-wrap:wrap}
.spell{
  border:1px solid var(--line-hi);border-radius:10px;padding:7px 11px;background:var(--card);
  font-size:12.5px;font-weight:600;transition:.13s;text-align:left;min-width:120px;
}
.spell:hover:not(:disabled){border-color:var(--violet);background:var(--card-hi)}
.spell:disabled{opacity:.36;cursor:not-allowed}
.spell.sel{border-color:var(--violet);box-shadow:0 0 0 1px var(--violet)}
.spell .c{color:var(--violet);font-weight:700}
.spell .d{display:block;font-size:11px;color:var(--ink-dim);font-weight:500}

/* ============================================================================
   PRESENTATION
   Everything here is CSS: no art assets, no extra requests, still one file.
   The aim is weight and reaction -- units that stand on a floor and flinch,
   dice that feel like objects, bars that drain -- rather than new imagery.
   ========================================================================== */

/* drifting depth behind everything */
#fog{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#fog i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.30}
#fog i:nth-child(1){width:52vw;height:52vw;left:-12vw;top:-10vw;background:radial-gradient(circle,#2b3a6b,transparent 70%);animation:drift1 34s ease-in-out infinite}
#fog i:nth-child(2){width:44vw;height:44vw;right:-10vw;top:22vh;background:radial-gradient(circle,#4a2c5e,transparent 70%);animation:drift2 41s ease-in-out infinite}
#fog i:nth-child(3){width:60vw;height:60vw;left:14vw;bottom:-24vw;background:radial-gradient(circle,#123244,transparent 70%);animation:drift3 47s ease-in-out infinite}
@keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(7vw,5vh)}}
@keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-6vw,7vh)}}
@keyframes drift3{0%,100%{transform:translate(0,0)}50%{transform:translate(5vw,-6vh)}}
body::after{content:'';position:fixed;inset:0;z-index:60;pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.45) 100%)}

/* the act tints the whole run */
body[data-act="2"]{--accent:var(--orange)}
body[data-act="3"]{--accent:var(--red)}
body{--accent:var(--teal,#5aa9f5)}

/* ---- units stand on a floor and react ---- */
.enemy-row{perspective:900px}
.unit{
  background:linear-gradient(170deg,#1d273e,#151d30 60%,#121829);
  box-shadow:0 10px 24px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.05);
  position:relative;
}
.unit::after{   /* ground shadow */
  content:'';position:absolute;left:50%;bottom:-7px;width:62%;height:10px;
  transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(ellipse,rgba(0,0,0,.55),transparent 70%);
  transition:opacity .2s;
}
.unit .av{
  font-size:34px;line-height:1.05;filter:drop-shadow(0 4px 8px rgba(0,0,0,.6));
  animation:idle 3.4s ease-in-out infinite;transform-origin:50% 90%;
}
.unit.ally .av{animation-duration:4.1s}
@keyframes idle{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.02)}}
.unit.dead::after{opacity:0}
.unit.dead .av{animation:none;transform:rotate(14deg) translateY(6px)}
.unit.hit{animation:recoil .32s cubic-bezier(.36,.07,.19,.97)}
@keyframes recoil{0%{transform:translate(0,0)}15%{transform:translate(-8px,-3px) rotate(-2deg)}
  40%{transform:translate(6px,1px) rotate(1.5deg)}70%{transform:translate(-3px,0)}100%{transform:translate(0,0)}}
.unit.hit::before{content:'';position:absolute;inset:0;border-radius:var(--r-lg);
  background:rgba(255,120,110,.30);animation:flash .32s ease-out;pointer-events:none}
@keyframes flash{from{opacity:1}to{opacity:0}}

/* status reads at a glance, on the unit itself */
.unit.s-burn{box-shadow:0 10px 24px rgba(0,0,0,.45),0 0 26px rgba(251,146,60,.35),inset 0 0 22px rgba(251,146,60,.16)}
.unit.s-burn .av{animation:idle 3.4s ease-in-out infinite,ember 1.1s ease-in-out infinite}
@keyframes ember{0%,100%{filter:drop-shadow(0 4px 8px rgba(0,0,0,.6))}50%{filter:drop-shadow(0 0 10px rgba(251,146,60,.9))}}
.unit.s-poison{box-shadow:0 10px 24px rgba(0,0,0,.45),0 0 24px rgba(163,230,53,.28),inset 0 0 20px rgba(163,230,53,.12)}
.unit.s-stun .av{animation:wobble .7s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.unit.s-charm{box-shadow:0 10px 24px rgba(0,0,0,.45),0 0 26px rgba(167,139,250,.45);border-color:var(--violet)}
.unit.s-guard{box-shadow:0 10px 24px rgba(0,0,0,.45),0 0 0 2px rgba(90,169,245,.55),0 0 26px rgba(90,169,245,.35)}
.unit.s-braced{opacity:.92;filter:saturate(.75)}

/* ---- bars that drain ---- */
.hpbar{height:11px;border-radius:6px;background:#080d18;border:1px solid rgba(0,0,0,.6);
  box-shadow:inset 0 2px 5px rgba(0,0,0,.7);overflow:hidden;position:relative;margin-top:7px}
.hpbar i{position:absolute;inset:0 auto 0 0;height:100%;display:block;border-radius:5px}
.hpbar .ghost{background:rgba(255,255,255,.34);transition:width .85s cubic-bezier(.4,0,.2,1) .22s}
.hpbar .fill{background:linear-gradient(180deg,#f0605c,#c9302c);transition:width .28s cubic-bezier(.4,0,.2,1);
  box-shadow:0 0 10px rgba(239,83,80,.45)}
.unit.ally .hpbar .fill,.ally-bar .fill{background:linear-gradient(180deg,#4ae3a6,#1f9c6b);box-shadow:0 0 10px rgba(61,220,151,.4)}
.hpbar::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0 13px,rgba(0,0,0,.35) 13px 14px)}

/* ---- dice as objects ---- */
.die{
  background:linear-gradient(160deg,#2c3a5c,#1a2338 55%,#141b2c);
  box-shadow:0 6px 14px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.12), inset 0 -3px 8px rgba(0,0,0,.4);
  border-radius:14px;border:1px solid rgba(255,255,255,.10);
}
.die .glyph{filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
.die .val{font-size:17px;text-shadow:0 2px 4px rgba(0,0,0,.6)}
.die:hover:not(.used){box-shadow:0 12px 22px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.18)}
.die.sel{background:linear-gradient(160deg,#3b4a70,#212c47)}
.die.used{filter:grayscale(.85) brightness(.6)}
.die.roll{animation:tumble3d .42s cubic-bezier(.2,.8,.3,1)}
@keyframes tumble3d{
  0%{transform:rotateX(-70deg) rotateZ(-22deg) scale(.7);opacity:0;filter:blur(3px)}
  55%{transform:rotateX(12deg) rotateZ(6deg) scale(1.07);opacity:1;filter:blur(0)}
  100%{transform:none}}

/* ---- map medallions ---- */
.node{background:radial-gradient(circle at 35% 30%,#22304c,#131c2e);
  box-shadow:0 5px 12px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.10)}
.node.avail{animation:pulse 2.1s ease-in-out infinite}
.node.here::before{content:'';position:absolute;inset:-9px;border-radius:50%;
  border:2px dashed rgba(255,255,255,.35);animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---- screens arrive rather than appear ---- */
#app{animation:rise .22s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.reward{animation:deal .3s cubic-bezier(.2,.8,.3,1) backwards}
.reward:nth-child(2){animation-delay:.06s}
.reward:nth-child(3){animation-delay:.12s}
.reward:nth-child(4){animation-delay:.18s}
@keyframes deal{from{opacity:0;transform:translateY(14px) rotate(-2deg)}to{opacity:1;transform:none}}
.modal{animation:pop .2s cubic-bezier(.2,.8,.3,1)}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}

.quake{animation:quake .3s ease-out}
@keyframes quake{0%,100%{transform:translate(0,0)}20%{transform:translate(-4px,2px)}
  45%{transform:translate(4px,-2px)}70%{transform:translate(-2px,1px)}}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition-duration:.01ms !important}
}

@media(max-width:640px){
  .wrap{padding:12px 10px 32px}
  .unit{width:112px;padding:8px 6px}
  .unit .av{font-size:29px}
  .unit .nm{font-size:12px}
  .hptext{font-size:10.5px}
  .die{width:64px}
  .enemy-row,.field > .row{gap:6px}
  .badge{font-size:10px;padding:2px 5px}
}
@media(max-width:380px){
  .unit{width:100px}
  .unit .av{font-size:25px}
}

<body>
<div id="topbar" class="hidden"><div class="inner" id="topbar-inner"></div></div>
<div class="wrap" id="app"></div>
<div id="tip"></div>
<div id="fog"><i></i><i></i><i></i></div>
<div id="fx"></div>
<script>
"use strict";
/* ============================================================================
   DICE SPIRE
   A dice-tactics roguelike: Slice & Dice's roll-and-assign combat inside a
   Slay the Spire branching run. The "deck" is the party's dice -- a die has
   exactly six sides, so every face you gain is also a face you lose.
   ========================================================================== */

/* ---------------------------------------------------------------- utilities */
const rnd  = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const el = id => document.getElementById(id);
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];} return a; }
function sample(a, n){ return shuffle(a).slice(0, n); }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
let _uid = 0; const uid = () => ++_uid;

/* ------------------------------------------------------------- face library */
/* target: enemy | allEnemies | ally | allAllies | self | none                */
const KIND = {
  dmg:      {name:'Strike',  ic:'⚔️', col:'var(--red)',    target:'enemy',      desc:v=>`Deal ${v} damage.`},
  dmgAll:   {name:'Cleave',  ic:'🔥', col:'var(--orange)', target:'allEnemies', desc:v=>`Deal ${v} damage to every enemy and set them all burning for 1.`},
  burn:     {name:'Ignite',  ic:'🕯️', col:'var(--orange)', target:'enemy',      desc:v=>`Set an enemy burning for ${v}. Fire grows by 1 each round and spreads.`},
  shield:   {name:'Shield',  ic:'🛡️', col:'var(--blue)', target:'ally',   desc:v=>`Give an ally ${v} shield.`},
  shieldAll:{name:'Aegis',   ic:'✨',       col:'var(--cyan)',   target:'allAllies',  desc:v=>`Give every hero ${v} shield.`},
  heal:     {name:'Mend',    ic:'❤️', col:'var(--green)',  target:'ally',       desc:v=>`Heal an ally for ${v} and clear a point of poison and of burning.`},
  poison:   {name:'Venom',   ic:'☠️', col:'var(--lime)',   target:'enemy',      desc:v=>`Apply ${v} poison.`},
  stun:     {name:'Stun',    ic:'⚡',       col:'var(--gold)',   target:'enemy',      desc:v=>`Stun for ${v} turn${v>1?'s':''}.`},
  mana:     {name:'Focus',   ic:'🔮', col:'var(--violet)', target:'self',       desc:v=>`Gain ${v} mana.`},
  power:    {name:'Empower', ic:'💢', col:'var(--pink)',   target:'ally',       desc:v=>`Give an ally +${v} power for this fight.`},
  charm:    {name:'Dominate',ic:'🧠', col:'var(--violet)', target:'enemy',      desc:v=>`Seize an enemy's mind for ${v} turn${v>1?'s':''}. It turns on its own side.`},
  daze:     {name:'Mindlock',ic:'💫', col:'var(--gold)',   target:'enemy',      desc:v=>`Strip every point of the enemy's power, and its attacks land for half for ${v} turn${v>1?'s':''}.`},
  leech:    {name:'Leech',   ic:'🩸', col:'var(--red)',    target:'enemy',      desc:v=>`Deal ${v} damage and heal whoever rolled it for ${Math.ceil(v/2)}.`},
  echo:     {name:'Momentum',ic:'⏩', col:'var(--cyan)',   target:'self',       desc:v=>`Gain ${v} more reroll${v>1?'s':''} this turn.`},
  guard:    {name:'Guard',   ic:'🪖', col:'var(--blue)',   target:'self',       desc:v=>`Take every attack aimed at the rest of the party this round, and gain ${v} shield.`},
  regen:    {name:'Regrowth',ic:'🌱', col:'var(--green)',  target:'ally',       desc:v=>`An ally mends ${v} at the end of the round, then ${v-1}, and so on.`},
  summon:   {name:'Summon',  ic:'🌀', col:'var(--cyan)',   target:'self',       desc:v=>`Call up a Thrall with ${5+3*v} HP that rolls its own die for ${2+v} turns. Two at a time.`},
  blank:    {name:'Blank',   ic:'·',       col:'var(--ink-faint)', target:'none',    desc:()=>`Nothing happens.`}
};
/* ------------------------------------------------------------------ sigils */
/* A Sigil pays nothing on the turn you spend it. It lays down a rule that
   holds for the rest of the fight: a terrible trade in a short one, and the
   whole fight in a long one. Spend the same Sigil again and the rule deepens. */
const SIGILS = {
  sigFury:   {name:'Rite of Fury',     ic:'\u{1F47A}', col:'var(--pink)',   price:170, line:n=>`Every hero gains ${n} power at the end of each round.`},
  sigAegis:  {name:'Rite of Aegis',    ic:'\u{1F3F0}', col:'var(--blue)',   price:150, line:n=>`Every hero gains ${2*n} shield at the start of your turn.`},
  sigWell:   {name:'Rite of the Well', ic:'\u26F2',    col:'var(--violet)', price:190, line:n=>`Gain ${n} mana at the start of your turn.`},
  sigTempo:  {name:'Rite of Tempo',    ic:'\u231B',    col:'var(--cyan)',   price:200, line:n=>`${n} more reroll${n>1?'s':''} every turn.`},
  sigKindle: {name:'Rite of Kindling', ic:'\u{1F506}', col:'var(--orange)', price:160, line:n=>`Anything already burning takes ${n} more fire each round.`},
  sigGrowth: {name:'Rite of Growth',   ic:'\u{1F33E}', col:'var(--green)',  price:150, line:n=>`Every hero mends ${2*n} at the end of each round.`},
  sigSpite:  {name:'Rite of Spite',    ic:'\u{1FA9E}', col:'var(--red)',    price:160, line:n=>`Anything that strikes a hero takes ${3*n} back.`},
  sigEcho:   {name:'Rite of Echo',     ic:'\u267E\uFE0F', col:'var(--cyan)', price:230, line:n=>`The first ${n===1?'face':n+' faces'} you spend each turn resolve${n===1?'s':''} twice.`}
};
const isSigil = k => !!SIGILS[k];
const sigilShort = k => SIGILS[k].name.replace('Rite of the ', '').replace('Rite of ', '');
/* a Sigil is a face like any other, so it renders, installs, scours, prices
   and drops through every path the ordinary kinds already use */
Object.keys(SIGILS).forEach(k => {
  const sg = SIGILS[k];
  KIND[k] = { name:sg.name, ic:sg.ic, col:sg.col, target:'none',
              desc:()=>`${sg.line(1)} It holds for the rest of the fight, and spending it again deepens it.` };
});
/* how deep a rite is running right now */
const sigil = k => (C && C.sigils && C.sigils[k]) || 0;
/* ----------------------------------------------------------------- banners */
/* The hero you pick FIRST carries the banner, and the banner is a rule that
   holds for the whole run. Picking three heroes used to be picking three sets
   of faces; now the order is a decision too. */
const BANNERS = {
  vanguard:  {name:'Banner of the Wall',  ic:'\u{1F6E1}\uFE0F', desc:'Every hero begins each fight with 3 shield.'},
  duelist:   {name:'Banner of the Edge',  ic:'\u{1F5E1}\uFE0F', desc:'The first Strike each hero lands in a fight deals 4 more.'},
  warden:    {name:'Banner of the Grove', ic:'\u{1F33F}', desc:'The party mends 5 more at the end of every fight.'},
  pyromancer:{name:'Banner of the Ember', ic:'\u{1F525}', desc:'Fire grows by 2 each round instead of 1.'},
  venomist:  {name:'Banner of the Fang',  ic:'\u2620\uFE0F', desc:'Poison on an enemy only thins every other round.'},
  herald:    {name:'Banner of the Horn',  ic:'\u{1F4A2}', desc:'Every hero begins each fight with 1 power.'},
  sorcerer:  {name:'Banner of the Eye',   ic:'\u{1F52E}', desc:'Every fight begins with 2 mana.'}
};
const bannerDef = () => (S && BANNERS[S.banner]) || null;
const banner = k => !!S && S.banner === k;

/* ------------------------------------------------------------------ riders */
/* Sharpening only ever added a number, which is why a reward stopped mattering
   the moment your own die outgrew it. A rider changes what a face DOES, and a
   rider on your best Strike is worth something at every point in a run. One
   face carries one rider; inscribing over an old one replaces it. */
const RIDERS = {
  searing:  {name:'Searing',  ic:'\u{1F525}', col:'var(--orange)', on:['dmg','dmgAll','leech','poison'],
             desc:'Also sets whatever it hits burning for 1.'},
  tainted:  {name:'Tainted',  ic:'\u2620\uFE0F', col:'var(--lime)', on:['dmg','leech','burn'],
             desc:'Also applies 2 poison.'},
  bracing:  {name:'Bracing',  ic:'\u{1F6E1}\uFE0F', col:'var(--blue)',
             on:['dmg','leech','burn','poison','stun','dmgAll','mana','power','guard','regen'],
             desc:'Whoever rolled it gains 2 shield.'},
  quick:    {name:'Quick',    ic:'\u21BB', col:'var(--cyan)',
             on:['shield','shieldAll','heal','regen','mana','power','guard','dmg','dmgAll','burn','poison','stun','leech'],
             desc:'Grants a reroll when it is spent.'},
  rallying: {name:'Rallying', ic:'\u{1F4EF}', col:'var(--pink)', on:['shield','shieldAll','heal','regen','mana','power','guard'],
             desc:'Whoever rolled it gains 1 power.'},
  cleansing:{name:'Cleansing',ic:'\u2728', col:'var(--green)', on:['heal','shield','shieldAll','regen'],
             desc:'Also clears a point of poison and of burning from every hero.'},
  cruel:    {name:'Cruel',    ic:'\u{1F5E1}\uFE0F', col:'var(--red)', on:['dmg','leech'],
             desc:'Lands for 5 more against anything at or below half HP.'},
  arcing:   {name:'Arcing',   ic:'\u26A1', col:'var(--gold)', on:['dmg'],
             desc:'Also hits every other enemy for 2.'},
  piercing: {name:'Piercing', ic:'\u27B3', col:'var(--violet)', on:['dmg','leech','stun'],
             desc:'Ignores the Armoured trait, and reaches the back rank.'}
};
const riderDef = r => RIDERS[r] || null;
const ridersFor = k => Object.keys(RIDERS).filter(r => RIDERS[r].on.includes(k));
const canInscribe = f => !!f && f.k !== 'blank' && !isSigil(f.k)
  && ridersFor(f.k).some(r => r !== f.r);

/* ------------------------------------------------------------------- ranks */
/* Enemies stand in two ranks. Anything you have to swing to land -- Strike,
   Leech, Stun -- can only reach the front, while the things you throw or cast
   go over it. That is what finally makes a Pyromancer different from a bigger
   Duelist, and it gives the healers and summoners somewhere to work from. */
const REACH = ['burn','poison','charm','daze','dmgAll','shieldAll'];
const reaches = k => !KIND[k] || KIND[k].target !== 'enemy' || REACH.includes(k);
/* a whole face, rider included -- Piercing puts a Strike through the line */
const faceReaches = f => !!f && (reaches(f.k) || f.r === 'piercing');
const F = (k, v = 0) => ({ k, v });
/* Every hero owns one kind of face outright. Nobody else can be given it, so a
   party is defined by who is in it rather than by whatever the rewards offered.
   CONTROL is the subset that takes an enemy's turn away: those are capped at
   one face per hero, because stacking them across a party locks a fight out
   entirely, which is how this game was beaten. */
const SIGNATURE = { stun:'duelist', charm:'sorcerer', daze:'sorcerer', summon:'sorcerer',
                    burn:'pyromancer', poison:'venomist', power:'herald',
                    guard:'vanguard', regen:'warden',
                    /* Focus is the casters' alone: with every hero making mana, a party
                       banked enough to fire its best spell almost every turn. */
                    mana:['warden','pyromancer','sorcerer'] };
const CONTROL = ['stun','charm'];
const isControl = k => CONTROL.includes(k);
const signatureOwner = k => SIGNATURE[k] || null;
const ownersOf = k => { const o = SIGNATURE[k]; return o ? (Array.isArray(o) ? o : [o]) : null; };
const canTakeFace = (hero, k) => { const o = ownersOf(k); return !o || o.includes(hero.key); };
const controlFaces = hero => hero.faces.filter(f => isControl(f.k)).length;
/* a hero may take this face, replacing the face at idx */
function mayInstall(hero, k, idx){
  if(!canTakeFace(hero, k)) return false;
  if(!isControl(k)) return true;
  if(controlFaces(hero) === 0) return true;
  return idx !== undefined && isControl(hero.faces[idx].k);   /* swap one for the other */
}
const ownerName = k => {
  const o = ownersOf(k);
  if(!o) return null;
  const names = o.map(key => (HEROES.find(x => x.key === key) || {}).name).filter(Boolean);
  return names.length > 1 ? names.slice(0, -1).join(', ') + ' or ' + names[names.length - 1] : names[0];
};
const faceLabel = f => f.k === 'blank' ? 'Blank'
  : `${f.r && RIDERS[f.r] ? RIDERS[f.r].name + ' ' : ''}${KIND[f.k].name}${f.v ? ' ' + f.v : ''}`;
const faceTip = f => `${KIND[f.k].desc(f.v)}${f.r && RIDERS[f.r] ? ' ' + RIDERS[f.r].desc : ''}`;

/* ------------------------------------------------------------------- heroes */
const HEROES = [
  { key:'vanguard', name:'Vanguard', av:'🛡️', hp:24,
    blurb:'A wall with a sword arm. The only one who can Guard, pulling the whole enemy turn onto himself.',
    faces:[F('shield',3),F('shield',2),F('guard',4),F('dmg',3),F('dmg',2),F('blank')], spell:'bulwark' },
  { key:'duelist', name:'Duelist', av:'🗡️', hp:15,
    blurb:'Enormous damage, no defence at all. The only one who can Stun.',
    faces:[F('dmg',5),F('dmg',4),F('dmg',3),F('dmg',2),F('stun',1),F('blank')], spell:'finisher' },
  { key:'warden', name:'Warden', av:'🌿', hp:18,
    blurb:'Keeps the party upright. The only one with Regrowth, which mends a little every round.',
    faces:[F('heal',3),F('heal',2),F('regen',4),F('dmg',2),F('mana',1),F('blank')], spell:'mend' },
  { key:'pyromancer', name:'Pyromancer', av:'🔥', hp:14,
    blurb:'Answers crowds. The only one who can Ignite, and her fire grows and spreads.',
    faces:[F('dmgAll',2),F('burn',2),F('dmg',3),F('mana',2),F('mana',1),F('blank')], spell:'conflag' },
  { key:'venomist', name:'Venomist', av:'⚗️', hp:16,
    blurb:'Patient. The only one who can apply Venom, which ignores shields entirely.',
    faces:[F('poison',3),F('poison',2),F('dmg',3),F('shield',2),F('dmg',2),F('blank')], spell:'miasma' },
  { key:'herald', name:'Herald', av:'📯', hp:17,
    blurb:'Makes everyone else better. The only one who can Empower.',
    faces:[F('power',1),F('power',1),F('shield',3),F('heal',2),F('dmg',2),F('blank')], spell:'rally' },
  { key:'sorcerer', name:'Sorcerer', av:'🧠', hp:15,
    blurb:'Rearranges who is standing in the room. The only one who can Dominate, Mindlock or Summon.',
    faces:[F('charm',1),F('daze',1),F('summon',1),F('dmg',3),F('mana',2),F('blank')], spell:'dominate' }
];

/* ------------------------------------------------------------------ enemies */
/* moves: attack | attackAll | block | buff | heal | poison  (v scales by act) */
const BESTIARY = [
  { key:'rat',     name:'Gutter Rat',   av:'🐀', hp:7,  acts:[1],     dmgW:0.85,
    moves:[{k:'attack',v:4},{k:'attack',v:3},{k:'block',v:3}] },
  { key:'bat',     name:'Cave Bat',     av:'🦇', hp:7,  acts:[1,2],   dmgW:0.8,
    moves:[{k:'attackAll',v:2},{k:'attack',v:4},{k:'attack',v:3}] },
  { key:'slime',   name:'Acid Slime',   av:'🧪', hp:11, acts:[1,2],   dmgW:1,
    moves:[{k:'attack',v:4},{k:'poison',v:2},{k:'attack',v:4}] },
  { key:'bandit',  name:'Cutpurse',     av:'🗡️', hp:10, acts:[1,2], dmgW:1.1,
    moves:[{k:'attack',v:5},{k:'block',v:4},{k:'attack',v:4}] },
  { key:'cultist', name:'Cultist',      av:'🕯️', hp:9,  acts:[1,2], dmgW:1, back:true,
    moves:[{k:'buff',v:2},{k:'attack',v:4},{k:'attack',v:4}] },
  { key:'shieldman',name:'Shieldbearer',av:'🪖', hp:12, acts:[1,2],   dmgW:0.95,
    moves:[{k:'block',v:5},{k:'attack',v:5},{k:'attack',v:4}] },
  { key:'houndm',  name:'Howling Hound',av:'🐺', hp:14, acts:[2,3],   dmgW:1.2,
    moves:[{k:'attack',v:7},{k:'attack',v:7},{k:'buff',v:2}] },
  { key:'spider',  name:'Web Spinner',  av:'🕷️', hp:16, acts:[2,3], dmgW:0.9,
    moves:[{k:'poison',v:3},{k:'attackAll',v:3},{k:'attack',v:6}] },
  { key:'golem',   name:'Rubble Golem', av:'🗿', hp:24, acts:[2,3],   dmgW:1,
    moves:[{k:'block',v:8},{k:'attack',v:9},{k:'attack',v:6}] },
  { key:'priest',  name:'Bone Priest',  av:'💀', hp:18, acts:[2,3],   dmgW:1, back:true,
    moves:[{k:'heal',v:7},{k:'attack',v:7},{k:'buff',v:2}] },
  { key:'knight',  name:'Ashen Knight', av:'⚔️', hp:22, acts:[3],     dmgW:1.25,
    moves:[{k:'attack',v:10},{k:'block',v:9},{k:'attack',v:8}] },
  { key:'mesmer',  name:'Mesmerist',    av:'🪬', hp:16, acts:[2,3],   dmgW:1, back:true,
    moves:[{k:'charm',v:1},{k:'drain',v:6},{k:'attack',v:7}] },
  { key:'necro',   name:'Bone Caller',  av:'🕯️', hp:18, acts:[2,3],   dmgW:0.9, back:true,
    moves:[{k:'summon',v:1},{k:'attack',v:6},{k:'block',v:7},{k:'summon',v:1}] },
  { key:'cinder',  name:'Cinder Fiend', av:'🔥', hp:13, acts:[2,3],   dmgW:0.9,
    moves:[{k:'burn',v:3},{k:'attack',v:5},{k:'attackAll',v:3}] },
  { key:'wraith',  name:'Wraith',       av:'👻', hp:19, acts:[3],     dmgW:1.15,
    moves:[{k:'attackAll',v:5},{k:'attack',v:9},{k:'poison',v:4}] }
];
/* A trait changes HOW a thing must be fought rather than how much of it there
   is. Without these every fight has the same answer -- biggest damage at the
   biggest threat -- which is why act three played like act one with larger
   figures, and why the party's variety never mattered. */
const TRAITS = {
  armoured:  {ic:'🧱', name:'Armoured',     v:[2,3,4],
              desc:v=>`Every blow lands for ${v} less. Four small hits are worth nothing; one big one is worth everything.`},
  shelled:   {ic:'🐚', name:'Shelled',      v:[0],
              desc:()=>`Takes no health damage at all while it still has shield. Strip the shell first.`},
  regrowing: {ic:'🪴', name:'Regrowing',    v:[4,6,8],
              desc:v=>`Puts back up to ${v} of whatever you took off it, at the end of every round. Chip damage loses to it; a burst kills it.`},
  ethereal:  {ic:'🔮', name:'Ethereal',     v:[0],
              desc:()=>`Strikes and Cleaves land for half. Venom, Ignite and anything that ignores armour land in full.`},
  volatile:  {ic:'💣', name:'Volatile',     v:[6,9,12],
              desc:v=>`When it dies it bursts for ${v} on every hero. Choose when it dies.`},
  linked:    {ic:'🔗', name:'Linked',       v:[0],
              desc:()=>`Takes no damage at all while the thing it is bound to still stands. Kill its anchor first.`}
};
const traitDef = t => t ? TRAITS[t.k] : null;
const hasTrait = (e, k) => !!(e && e.trait && e.trait.k === k);

const ELITES = [
  { key:'ogre',   name:'Bridge Ogre',   av:'👹', hp:30, elite:true, dmgW:1.25,
    moves:[{k:'attack',v:9},{k:'attackAll',v:4},{k:'block',v:7}] },
  { key:'warlock',name:'Blood Warlock', av:'🧛', hp:30, elite:true, dmgW:1.1,
    moves:[{k:'attack',v:8},{k:'heal',v:7},{k:'buff',v:2},{k:'attackAll',v:4}] },
  { key:'twins',  name:'Thorn Sentinel',av:'🌵', hp:32, elite:true, dmgW:1.15,
    moves:[{k:'block',v:10},{k:'attack',v:9},{k:'poison',v:3},{k:'attack',v:7}] },
  { key:'puppeteer',name:'The Puppeteer',av:'🎎', hp:30, elite:true, dmgW:1.1,
    moves:[{k:'charm',v:1},{k:'attack',v:9},{k:'summon',v:1},{k:'drain',v:7}] }
];
/* A boss that cycles a move list is just a long enemy. Each one now turns at
   a health threshold: a new move set, a trait it did not have, and a line so
   the turn is legible rather than a number quietly changing. */
const BOSS_PHASES = {
  maw: [{ at:0.55, name:'The Maw splits open',
          line:'Its jaw unhinges past where a jaw should stop.',
          trait:{k:'regrowing', v:6},
          moves:[{k:'attackAll',v:7},{k:'drain',v:9},{k:'attack',v:10},{k:'heal',v:5}] }],
  choir:[{ at:0.6,  name:'The Choir finds its key',
          line:'The voices stop arguing with each other and agree.',
          trait:{k:'ethereal', v:0},
          moves:[{k:'charm',v:1},{k:'attackAll',v:8},{k:'summon',v:1},{k:'attack',v:11}] },
        { at:0.25, name:'The Choir screams',
          line:'Whatever it was keeping back, it is no longer keeping back.',
          trait:null,
          moves:[{k:'attackAll',v:11},{k:'attack',v:15}] }],
  crown:[{ at:0.5,  name:'The Crown sets itself',
          line:'The metal closes. Something underneath it stops pretending.',
