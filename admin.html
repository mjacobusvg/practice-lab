<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Think Beyond — Admin Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f11;
    --surface: #18181c;
    --border: #2a2a30;
    --text: #e8e6e3;
    --muted: #6b6870;
    --accent: #4d8ab5;
    --accent-dim: #1d3447;
    --green: #34d399;
    --green-dim: #0d2e22;
    --amber: #fbbf24;
    --amber-dim: #2d1f05;
    --red: #f87171;
    --red-dim: #2d0f0f;
    --purple: #a78bfa;
    --purple-dim: #1e1535;
    --teal: #2aabb8;
    --teal-dim: #0f3c42;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 32px 24px;
    max-width: 1100px;
    margin: 0 auto;
  }

  .header { margin-bottom: 32px; }
  .header h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.3px;
    color: var(--text);
  }
  .header p { font-size: 13px; color: var(--muted); margin-top: 4px; }

  .auth-row { display: flex; gap: 8px; margin-bottom: 28px; }
  .auth-row input {
    flex: 1;
    padding: 10px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-family: 'DM Mono', monospace;
    color: var(--text);
    outline: none;
  }
  .auth-row input:focus { border-color: var(--accent); }
  .auth-row button {
    padding: 10px 20px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .auth-row button:hover { opacity: 0.85; }
  .auth-row button:disabled { opacity: 0.4; cursor: not-allowed; }

  .error { color: var(--red); font-size: 13px; margin-bottom: 16px; display: none; }
  .loading-msg { color: var(--muted); font-size: 13px; margin-bottom: 16px; display: none; }

  .dashboard { display: none; }

  .section-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
    margin-top: 28px;
  }
  .section-label:first-of-type { margin-top: 0; }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 10px;
    margin-bottom: 20px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .stat-card .num {
    font-size: 28px;
    font-weight: 600;
    font-family: 'DM Mono', monospace;
    line-height: 1;
    margin-bottom: 6px;
  }
  .stat-card .label { font-size: 12px; color: var(--muted); }
  .stat-card.accent .num { color: var(--accent); }
  .stat-card.green .num { color: var(--green); }
  .stat-card.amber .num { color: var(--amber); }
  .stat-card.red .num { color: var(--red); }
  .stat-card.purple .num { color: var(--purple); }
  .stat-card.teal .num { color: var(--teal); }

  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 10px;
  }
  .chart-title { font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 16px; }

  .bar-chart { display: flex; align-items: flex-end; gap: 4px; height: 80px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .bar {
    width: 100%;
    border-radius: 3px 3px 0 0;
    min-height: 2px;
    transition: opacity 0.15s;
  }
  .bar:hover { opacity: 0.7; }
  .bar-label { font-size: 9px; color: var(--muted); font-family: 'DM Mono', monospace; white-space: nowrap; transform: rotate(-45deg); transform-origin: top right; }

  .mode-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 8px;
  }
  .mode-row {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .mode-name { font-size: 13px; color: var(--text); }
  .mode-count {
    font-size: 16px;
    font-weight: 600;
    font-family: 'DM Mono', monospace;
    color: var(--purple);
  }

  .feedback-row {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
  }
  .feedback-bar-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    flex: 1;
  }
  .feedback-bar-label { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .feedback-bar-track { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
  .feedback-bar-fill { height: 100%; border-radius: 4px; transition: width 0.4s ease; }
  .feedback-pct { font-size: 20px; font-weight: 600; font-family: 'DM Mono', monospace; margin-top: 6px; }

  .divider { height: 1px; background: var(--border); margin: 24px 0; }

  .last-updated { font-size: 11px; color: var(--muted); text-align: right; margin-top: 24px; font-family: 'DM Mono', monospace; }

  .refresh-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    padding: 5px 12px;
    font-size: 12px;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    float: right;
    margin-top: -4px;
  }
  .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ── REFERRAL TABLE ── */
  .ref-table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0;
    overflow-x: auto;
    margin-top: 12px;
  }
  .ref-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .ref-table th {
    text-align: left;
    padding: 12px 14px;
    color: var(--muted);
    font-weight: 500;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    background: rgba(0,0,0,0.15);
  }
  .ref-table td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  .ref-table tr:last-child td { border-bottom: none; }
  .ref-table tr:hover td { background: rgba(255,255,255,0.02); }

  .ref-date { font-family: 'DM Mono', monospace; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .ref-email { font-family: 'DM Mono', monospace; color: var(--text); font-size: 12px; }
  .ref-referrer { color: var(--text); font-weight: 500; }
  .ref-notes { color: var(--muted); font-size: 12px; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .ref-select {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 5px 8px;
    font-size: 12px;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    outline: none;
  }
  .ref-select:focus { border-color: var(--accent); }
  .ref-select.status-active { border-color: var(--green); color: var(--green); }
  .ref-select.status-refunded { border-color: var(--red); color: var(--red); }
  .ref-select.status-pending { border-color: var(--amber); color: var(--amber); }
  .ref-select.payout-paid { border-color: var(--teal); color: var(--teal); }
  .ref-select.payout-na { border-color: var(--muted); color: var(--muted); }

  .ref-delete-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 14px;
    padding: 4px 8px;
    border-radius: 4px;
    transition: color 0.15s;
  }
  .ref-delete-btn:hover { color: var(--red); }

  .ref-empty {
    padding: 32px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }

  .ref-saving {
    color: var(--amber);
    font-size: 10px;
    font-family: 'DM Mono', monospace;
  }
  .ref-saved {
    color: var(--green);
    font-size: 10px;
    font-family: 'DM Mono', monospace;
  }
</style>
</head>
<body>

<div class="header">
  <h1>Think Beyond — Admin</h1>
  <p>Usage and activity across all tools</p>
</div>

<div class="auth-row">
  <input type="password" id="secret" placeholder="Enter backfill secret..." onkeydown="if(event.key==='Enter') load()" />
  <button id="load-btn" onclick="load()">Load</button>
</div>
<div class="error" id="error"></div>
<div class="loading-msg" id="loading-msg">Loading dashboard data...</div>

<div class="dashboard" id="dashboard">
  <button class="refresh-btn" onclick="load()">↻ Refresh</button>

  <div class="section-label">Ask the Archive</div>
  <div class="stats-grid" id="archive-stats"></div>

  <div class="feedback-row" id="feedback-row"></div>

  <div class="chart-card">
    <div class="chart-title">Questions asked — last 14 days</div>
    <div class="bar-chart" id="archive-chart"></div>
  </div>

  <div class="divider"></div>

  <div class="section-label">Practice Lab</div>
  <div class="stats-grid" id="pl-stats"></div>

  <div class="chart-card">
    <div class="chart-title">Interactions — last 14 days</div>
    <div class="bar-chart" id="pl-chart"></div>
  </div>

  <div class="section-label" style="margin-top:20px;">Practice Lab — by mode</div>
  <div class="mode-grid" id="pl-modes"></div>

  <div class="divider"></div>

  <div class="section-label">Referrals</div>
  <div class="stats-grid" id="ref-stats"></div>
  <div class="ref-table-wrap" id="ref-table-wrap"></div>

  <div class="last-updated" id="last-updated"></div>
</div>

<script>
  var currentSecret = '';

  async function load() {
    var secret = document.getElementById('secret').value.trim();
    if (!secret) return;
    currentSecret = secret;
    var btn = document.getElementById('load-btn');
    var err = document.getElementById('error');
    var msg = document.getElementById('loading-msg');
    btn.disabled = true;
    err.style.display = 'none';
    msg.style.display = 'block';

    try {
      var resp = await fetch('/.netlify/functions/admin-dashboard', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ secret: secret })
      });
      var data = await resp.json();
      if (!resp.ok || data.error) {
        err.textContent = 'Error ' + resp.status + ': ' + (data.error || resp.statusText);
        err.style.display = 'block';
        msg.style.display = 'none';
        btn.disabled = false;
        return;
      }

      msg.style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      renderDashboard(data);

    } catch(e) {
      err.textContent = 'Network error: ' + e.message;
      err.style.display = 'block';
      msg.style.display = 'none';
    }
    btn.disabled = false;
  }

  function renderDashboard(data) {
    var a = data.archive;
    var pl = data.practiceLab;
    var ref = data.referrals;

    // Archive stats
    document.getElementById('archive-stats').innerHTML =
      statCard(a.total, 'Total Questions', 'accent') +
      statCard(a.thisWeek, 'This Week', 'green') +
      statCard(a.today, 'Today', 'green') +
      statCard(a.unansweredTotal, 'Unanswered (all time)', 'amber') +
      statCard(a.unansweredThisWeek, 'Unanswered This Week', 'amber');

    // Feedback
    var total = a.thumbsUp + a.thumbsDown;
    var upPct = total > 0 ? Math.round(a.thumbsUp / total * 100) : 0;
    var downPct = total > 0 ? Math.round(a.thumbsDown / total * 100) : 0;
    document.getElementById('feedback-row').innerHTML =
      feedbackBar('👍 Helpful', a.thumbsUp, upPct, '#34d399', '#0d2e22') +
      feedbackBar('👎 Not Helpful', a.thumbsDown, downPct, '#f87171', '#2d0f0f') +
      '<div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;min-width:120px;text-align:center;"><div style="font-size:11px;color:var(--muted);margin-bottom:4px;">Total Ratings</div><div style="font-size:24px;font-weight:600;font-family:DM Mono,monospace;color:var(--text);">' + total + '</div></div>';

    // Archive chart
    renderBarChart('archive-chart', a.daily, '#4d8ab5');

    // Practice Lab stats
    document.getElementById('pl-stats').innerHTML =
      statCard(pl.total, 'Total Interactions', 'purple') +
      statCard(pl.thisWeek, 'This Week', 'green') +
      statCard(pl.today, 'Today', 'green');

    // PL chart
    renderBarChart('pl-chart', pl.daily, '#a78bfa');

    // PL by mode
    var modes = Object.entries(pl.byMode).sort(function(a, b) { return b[1] - a[1]; });
    if (modes.length === 0) {
      document.getElementById('pl-modes').innerHTML = '<div style="color:var(--muted);font-size:13px;padding:12px;">No Practice Lab data yet — usage logging will start once the updated proxy is deployed.</div>';
    } else {
      document.getElementById('pl-modes').innerHTML = modes.map(function(m) {
        return '<div class="mode-row"><span class="mode-name">' + m[0] + '</span><span class="mode-count">' + m[1] + '</span></div>';
      }).join('');
    }

    // Referral stats
    renderReferrals(ref);

    document.getElementById('last-updated').textContent = 'Last updated: ' + new Date().toLocaleTimeString();
  }

  function renderReferrals(ref) {
    document.getElementById('ref-stats').innerHTML =
      statCard(ref.total, 'Total Submissions', 'accent') +
      statCard(ref.pending, 'Pending Day 16', 'amber') +
      statCard(ref.active, 'Active / Owed', 'green') +
      statCard(ref.paid, 'Paid Out', 'teal') +
      statCard(ref.refunded, 'Refunded', 'red') +
      statCard('$' + ref.owed, 'Owed ($' + ref.payoutRate + '/ea)', 'amber') +
      statCard('$' + ref.paidTotal, 'Paid Total', 'teal');

    var wrap = document.getElementById('ref-table-wrap');
    if (!ref.rows || ref.rows.length === 0) {
      wrap.innerHTML = '<div class="ref-empty">No referral submissions yet.</div>';
      return;
    }

    var rowsHtml = ref.rows.map(function(r) {
      var date = new Date(r.created_at).toISOString().split('T')[0];
      var notes = r.notes ? escapeHtml(r.notes) : '—';
      return '<tr data-id="' + r.id + '">' +
        '<td class="ref-date">' + date + '</td>' +
        '<td class="ref-referrer">' + escapeHtml(r.referrer_name) + '</td>' +
        '<td class="ref-email">' + escapeHtml(r.new_member_email) + '</td>' +
        '<td>' + dayStatusSelect(r.id, r.day_16_status) + '</td>' +
        '<td>' + payoutStatusSelect(r.id, r.payout_status) + '</td>' +
        '<td class="ref-notes" title="' + notes + '">' + notes + '</td>' +
        '<td><span class="ref-status-indicator" id="status-' + r.id + '"></span></td>' +
        '<td><button class="ref-delete-btn" onclick="deleteReferral(\'' + r.id + '\')" title="Delete">✕</button></td>' +
      '</tr>';
    }).join('');

    wrap.innerHTML =
      '<table class="ref-table">' +
        '<thead><tr>' +
          '<th>Date</th>' +
          '<th>Referrer</th>' +
          '<th>New Member</th>' +
          '<th>Day 16 Status</th>' +
          '<th>Payout</th>' +
          '<th>Notes</th>' +
          '<th></th>' +
          '<th></th>' +
        '</tr></thead>' +
        '<tbody>' + rowsHtml + '</tbody>' +
      '</table>';
  }

  function dayStatusSelect(id, current) {
    var cls = 'ref-select status-' + current;
    return '<select class="' + cls + '" onchange="updateReferral(\'' + id + '\', \'day_16_status\', this.value, this)">' +
      '<option value="pending"' + (current === 'pending' ? ' selected' : '') + '>pending</option>' +
      '<option value="active"' + (current === 'active' ? ' selected' : '') + '>active</option>' +
      '<option value="refunded"' + (current === 'refunded' ? ' selected' : '') + '>refunded</option>' +
    '</select>';
  }

  function payoutStatusSelect(id, current) {
    var cls = 'ref-select payout-' + (current === 'n/a' ? 'na' : current);
    return '<select class="' + cls + '" onchange="updateReferral(\'' + id + '\', \'payout_status\', this.value, this)">' +
      '<option value="pending"' + (current === 'pending' ? ' selected' : '') + '>pending</option>' +
      '<option value="paid"' + (current === 'paid' ? ' selected' : '') + '>paid</option>' +
      '<option value="n/a"' + (current === 'n/a' ? ' selected' : '') + '>n/a</option>' +
    '</select>';
  }

  async function updateReferral(id, field, value, selectEl) {
    var indicator = document.getElementById('status-' + id);
    if (indicator) { indicator.className = 'ref-saving'; indicator.textContent = 'saving...'; }

    // Update select class for color
    selectEl.className = 'ref-select ' + (field === 'day_16_status' ? 'status-' : 'payout-') + (value === 'n/a' ? 'na' : value);

    try {
      var payload = { secret: currentSecret, action: 'update_referral', id: id };
      payload[field] = value;

      var resp = await fetch('/.netlify/functions/admin-dashboard', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      var data = await resp.json();
      if (!resp.ok || data.error) {
        if (indicator) { indicator.className = ''; indicator.textContent = 'error'; indicator.style.color = '#f87171'; }
        alert('Update failed: ' + (data.error || resp.statusText));
        return;
      }
      if (indicator) {
        indicator.className = 'ref-saved';
        indicator.textContent = '✓';
        setTimeout(function() { indicator.textContent = ''; }, 1500);
      }
      // Reload stats to reflect change
      setTimeout(function() { load(); }, 400);
    } catch(e) {
      if (indicator) { indicator.className = ''; indicator.textContent = 'error'; indicator.style.color = '#f87171'; }
      alert('Network error: ' + e.message);
    }
  }

  async function deleteReferral(id) {
    if (!confirm('Delete this referral submission? This cannot be undone.')) return;
    try {
      var resp = await fetch('/.netlify/functions/admin-dashboard', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ secret: currentSecret, action: 'delete_referral', id: id })
      });
      var data = await resp.json();
      if (!resp.ok || data.error) {
        alert('Delete failed: ' + (data.error || resp.statusText));
        return;
      }
      load();
    } catch(e) {
      alert('Network error: ' + e.message);
    }
  }

  function escapeHtml(str) {
    if (str == null) return '';
    return String(str).replace(/[&<>"']/g, function(c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function statCard(num, label, cls) {
    return '<div class="stat-card ' + cls + '"><div class="num">' + (num || 0) + '</div><div class="label">' + label + '</div></div>';
  }

  function feedbackBar(label, count, pct, color, bg) {
    return '<div class="feedback-bar-wrap">' +
      '<div class="feedback-bar-label">' + label + '</div>' +
      '<div class="feedback-bar-track"><div class="feedback-bar-fill" style="width:' + pct + '%;background:' + color + ';"></div></div>' +
      '<div class="feedback-pct" style="color:' + color + ';">' + pct + '%</div>' +
      '<div style="font-size:12px;color:var(--muted);margin-top:2px;">' + count + ' ratings</div>' +
    '</div>';
  }

  function renderBarChart(id, daily, color) {
    if (!daily || daily.length === 0) return;
    var max = Math.max.apply(null, daily.map(function(d) { return d[1]; })) || 1;
    var html = daily.map(function(d) {
      var h = Math.max(2, Math.round(d[1] / max * 72));
      var label = d[0].substring(5);
      return '<div class="bar-col">' +
        '<div class="bar" style="height:' + h + 'px;background:' + color + ';opacity:' + (0.4 + d[1]/max*0.6) + ';" title="' + d[0] + ': ' + d[1] + '"></div>' +
        '<div class="bar-label">' + label + '</div>' +
      '</div>';
    }).join('');
    document.getElementById(id).innerHTML = html;
  }
</script>

</body>
</html>
