<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upload a document — Think Beyond Practice</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--navy:#0b1120;--navy-mid:#111c30;--card:#152238;--rule:rgba(42,171,184,.22);--teal:#2aabb8;--teal2:#33c8d6;--cream:#e8e2d6;--dim:#8fa0b6;--white:#f5f8fc;--red:#f87171;--green:#4ade80}
*{box-sizing:border-box}
body{margin:0;background:var(--navy);color:var(--cream);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:36px 16px}
.wrap{width:100%;max-width:560px}
h1{font-size:1.35rem;color:var(--white);margin:0 0 4px}
.sub{color:var(--dim);font-size:.9rem;margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--rule);border-top:2px solid var(--teal);border-radius:10px;padding:22px 22px 24px;margin-bottom:16px}
label{display:block;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin:0 0 6px}
input,select{width:100%;background:var(--navy);border:1px solid var(--rule);border-radius:8px;color:var(--cream);padding:11px 13px;font-size:.92rem;font-family:inherit;margin-bottom:14px}
input:focus,select:focus{outline:none;border-color:var(--teal)}
.btn{background:var(--teal);color:#08131c;border:none;border-radius:8px;padding:12px 22px;font-size:.92rem;font-weight:700;cursor:pointer}
.btn:hover{background:var(--teal2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{background:transparent;border:1px solid var(--rule);color:var(--teal)}
#drop{border:2px dashed var(--rule);border-radius:10px;padding:26px;text-align:center;color:var(--dim);cursor:pointer;margin-bottom:14px;transition:border-color .15s,background .15s}
#drop:hover,#drop.over{border-color:var(--teal);background:rgba(42,171,184,.06);color:var(--cream)}
#drop b{color:var(--white)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.msg{margin-top:14px;font-size:.88rem;line-height:1.5;padding:10px 14px;border-radius:8px;display:none}
.msg.err{display:block;background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.3);color:var(--red)}
.msg.ok{display:block;background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.3);color:var(--green)}
.hint{font-size:.78rem;color:var(--dim);margin:-8px 0 14px}
code{background:var(--navy);padding:2px 6px;border-radius:5px;color:var(--cream);font-size:.85rem}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>Upload a document</h1>
  <p class="sub">Drops a file straight into storage. Admin only.</p>

  <!-- Step 1: authenticate -->
  <div class="card" id="auth-card">
    <label for="admin-email">Your admin email</label>
    <input type="email" id="admin-email" placeholder="you@example.com" autocomplete="email">
    <button class="btn" id="auth-btn">Continue</button>
    <div class="msg" id="auth-msg"></div>
  </div>

  <!-- Step 2: upload -->
  <div class="card hide" id="up-card">
    <div id="drop"><b>Click to choose a file</b> or drag it here<br><span style="font-size:.8rem">PDF, Word, Excel, Zip, images, anything up to 25 MB</span></div>
    <input type="file" id="file" class="hide">

    <label for="bucket">Where should it go?</label>
    <select id="bucket">
      <option value="templates">Templates (downloads, toolkits, docs)</option>
      <option value="post-files">Post files (attachments in the forum)</option>
      <option value="avatars">Avatars (profile photos)</option>
    </select>
    <div class="hint">Leave this on Templates for toolkits and documents. That's it — no folders to pick.</div>

    <div class="row">
      <button class="btn" id="up-btn" disabled>Upload</button>
      <button class="btn btn-ghost" id="reset-btn" type="button">Choose another</button>
    </div>
    <div class="msg" id="up-msg"></div>
  </div>
</div>

<script>
var TOKEN = '';
try { TOKEN = localStorage.getItem('tbp_auth_token') || ''; } catch(e){}
var authCard = document.getElementById('auth-card');
var upCard = document.getElementById('up-card');
var authMsg = document.getElementById('auth-msg');
var upMsg = document.getElementById('up-msg');
var fileInput = document.getElementById('file');
var drop = document.getElementById('drop');
var upBtn = document.getElementById('up-btn');
var chosen = null;

function showUpload(){ authCard.classList.add('hide'); upCard.classList.remove('hide'); }
function setMsg(el, txt, kind){ el.textContent = txt; el.className = 'msg ' + kind; }

// Single sign-in path: a valid token → straight to upload (validated for real on
// submit); otherwise bounce to the platform's Supabase login, which mints the
// signed token and returns here (?returnTo). The server (admin-doc-upload) is the
// real gate — it re-verifies the token and admin rights on every call.
function goPlatformLogin() {
  var url = 'https://thinkbeyondpractice.com/platform?returnTo=' + encodeURIComponent('/upload.html');
  try { window.location.replace(url); } catch (e) { window.location.href = url; }
}
if (TOKEN) showUpload();
else goPlatformLogin();

document.getElementById('auth-btn').addEventListener('click', goPlatformLogin);

drop.addEventListener('click', function(){ fileInput.click(); });
drop.addEventListener('dragover', function(e){ e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', function(){ drop.classList.remove('over'); });
drop.addEventListener('drop', function(e){ e.preventDefault(); drop.classList.remove('over'); if (e.dataTransfer.files && e.dataTransfer.files[0]) pick(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', function(){ if (fileInput.files && fileInput.files[0]) pick(fileInput.files[0]); });

function pick(f){
  chosen = f;
  drop.innerHTML = '<b>' + f.name + '</b><br><span style="font-size:.8rem">' + Math.round(f.size/1024) + ' KB · ready to upload</span>';
  upBtn.disabled = false;
  upMsg.className = 'msg';
}

document.getElementById('reset-btn').addEventListener('click', function(){
  chosen = null; fileInput.value = ''; upBtn.disabled = true; upMsg.className = 'msg';
  drop.innerHTML = '<b>Click to choose a file</b> or drag it here<br><span style="font-size:.8rem">PDF, Word, Excel, images, anything up to 25 MB</span>';
});

function fmt(e){ return String((e && e.message) || e || 'unknown'); }

// Read a response WITHOUT ever throwing. A non-JSON body (a Netlify 404 page, a 502
// timeout, a function that crashed before it could answer) is the most common cause of
// a silent "connection error", so hand it back verbatim instead of swallowing it.
async function readJson(res){
  var txt = '';
  try { txt = await res.text(); } catch (e) { return { _bad: 'could not read the response body' }; }
  try { return JSON.parse(txt); } catch (e) {
    return { _bad: 'HTTP ' + res.status + ' non-JSON: ' + txt.replace(/\s+/g, ' ').slice(0, 200) };
  }
}

// Backup route: push the bytes through our own function as base64. Netlify caps a
// function body near 6 MB and base64 inflates by a third, so only small files qualify,
// but it lands the file when the browser cannot reach Supabase Storage directly.
var FALLBACK_MAX = 4 * 1024 * 1024;

function toBase64(file){
  return new Promise(function(resolve, reject){
    var r = new FileReader();
    r.onload = function(){ resolve(String(r.result || '')); };
    r.onerror = function(){ reject(new Error('could not read the file')); };
    r.readAsDataURL(file);
  });
}

upBtn.addEventListener('click', async function(){
  if (!chosen) { setMsg(upMsg, 'Choose a file first.', 'err'); return; }
  var path = String(chosen.name || 'upload').trim().replace(/^\/+/, '');
  var bucket = document.getElementById('bucket').value;
  var reset = function(){ upBtn.disabled = false; upBtn.textContent = 'Upload'; };
  upBtn.disabled = true; upBtn.textContent = 'Uploading…';
  upMsg.className = 'msg';

  // 1) Ask our admin function for a short-lived signed upload URL.
  var sd;
  try {
    var signRes = await fetch('/.netlify/functions/admin-doc-upload', {
      method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer ' + TOKEN},
      body: JSON.stringify({ action:'sign', token: TOKEN, bucket: bucket, path: path })
    });
    sd = await readJson(signRes);
  } catch (e) {
    reset(); setMsg(upMsg, 'Step 1 never reached the server (' + fmt(e) + '). Check your connection and retry.', 'err'); return;
  }
  if (sd && sd._bad) {
    reset(); setMsg(upMsg, 'Step 1 — the upload function did not answer properly. ' + sd._bad, 'err'); return;
  }
  if (!sd || !sd.ok || !sd.uploadUrl) {
    if (sd && /sign in|not authorized/i.test(sd.error||'')) { try{ localStorage.removeItem('tbp_auth_token'); }catch(e){} }
    reset(); setMsg(upMsg, 'Step 1 — ' + ((sd && sd.error) || 'could not create an upload URL.'), 'err'); return;
  }

  // 2) Send the file BYTES straight to Supabase Storage (no Netlify size limit).
  //    multipart form matches how Supabase's own client uploads to a signed URL.
  //    Send NO custom headers: overwrite permission is already baked into the signed
  //    URL, and an extra header only adds a CORS preflight that can be refused.
  var directErr = '';
  try {
    var fd = new FormData();
    fd.append('cacheControl', '3600');
    fd.append('', chosen, chosen.name);
    var putRes = await fetch(sd.uploadUrl, { method:'PUT', body: fd });
    if (putRes.ok) {
      reset();
      setMsg(upMsg, 'Uploaded to ' + sd.bucket + ' / ' + sd.path + ' (' + Math.round(chosen.size/1024) + ' KB). Done.', 'ok');
      return;
    }
    var t = ''; try { t = await putRes.text(); } catch(e){}
    directErr = 'HTTP ' + putRes.status + ' ' + String(t).replace(/\s+/g, ' ').slice(0, 200);
  } catch (e) {
    directErr = 'the browser could not reach Supabase Storage (' + fmt(e) + ')';
  }

  // 3) Direct upload failed. Small files can still go through our own function.
  if (chosen.size <= FALLBACK_MAX) {
    upBtn.textContent = 'Retrying…';
    try {
      var dataUrl = await toBase64(chosen);
      var res2 = await fetch('/.netlify/functions/admin-doc-upload', {
        method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer ' + TOKEN},
        body: JSON.stringify({ token: TOKEN, bucket: bucket, path: path, content_type: chosen.type || 'application/octet-stream', data: dataUrl })
      });
      var fb = await readJson(res2);
      reset();
      if (fb && fb.ok) {
        setMsg(upMsg, 'Uploaded to ' + fb.bucket + ' / ' + fb.path + ' (' + Math.round(chosen.size/1024) + ' KB) via the backup route. Done.', 'ok');
        return;
      }
      setMsg(upMsg, 'Direct upload failed (' + directErr + '). Backup route also failed: ' + ((fb && (fb.error || fb._bad)) || 'unknown error') + '.', 'err');
      return;
    } catch (e) {
      reset();
      setMsg(upMsg, 'Direct upload failed (' + directErr + '). Backup route errored: ' + fmt(e) + '.', 'err');
      return;
    }
  }

  reset();
  setMsg(upMsg, 'Step 2 — direct upload failed: ' + directErr + '. At ' + Math.round(chosen.size/1024/1024) + ' MB this file is too big for the backup route, so the direct path has to work.', 'err');
});
</script>
</body>
</html>
