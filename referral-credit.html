<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank Your Referrer — Think Beyond Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300;1,9..40,400&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy:       #0b1120;
    --navy-mid:   #111c30;
    --navy-light: #1a2d47;
    --teal:       #2aabb8;
    --teal-dim:   #1d7d88;
    --teal-glow:  rgba(42,171,184,0.12);
    --cream:      #e8e2d6;
    --cream-dim:  #b0aa9e;
    --white:      #f5f4f2;
    --rule:       rgba(42,171,184,0.2);
    --error-bg:   rgba(163,45,45,0.15);
    --error-text: #f87171;
    --success-bg: rgba(42,171,184,0.12);
    --success-text: #2aabb8;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--navy);
    color: var(--cream);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .site-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 40px;
    background: rgba(11,17,32,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--rule);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-logo {
    font-family: 'DM Serif Display', serif;
    font-size: 1rem;
    color: var(--white);
    text-decoration: none;
    letter-spacing: 0.02em;
  }

  .header-logo span { color: var(--teal); }

  .header-tool {
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--teal);
  }

  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 64px 24px 80px;
  }

  .eyebrow {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--teal);
    margin-bottom: 16px;
  }

  h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 2.25rem;
    font-weight: 400;
    color: var(--white);
    line-height: 1.15;
    margin-bottom: 20px;
  }

  .lede {
    font-size: 1.05rem;
    line-height: 1.6;
    color: var(--cream);
    margin-bottom: 40px;
  }

  form {
    background: var(--navy-mid);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 32px;
  }

  .field {
    margin-bottom: 24px;
  }

  .field:last-of-type {
    margin-bottom: 32px;
  }

  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--white);
    margin-bottom: 8px;
  }

  label .optional {
    color: var(--cream-dim);
    font-weight: 400;
    font-size: 0.78rem;
  }

  input[type="email"],
  input[type="text"],
  textarea {
    width: 100%;
    background: var(--navy);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 12px 14px;
    color: var(--cream);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    transition: border-color 0.15s;
  }

  input:focus,
  textarea:focus {
    outline: none;
    border-color: var(--teal);
  }

  textarea {
    resize: vertical;
    min-height: 80px;
  }

  button {
    width: 100%;
    background: var(--teal);
    color: var(--navy);
    border: none;
    border-radius: 6px;
    padding: 14px 20px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: background 0.15s;
  }

  button:hover:not(:disabled) {
    background: var(--teal-dim);
  }

  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .message {
    margin-top: 20px;
    padding: 14px 16px;
    border-radius: 6px;
    font-size: 0.9rem;
    line-height: 1.5;
  }

  .message.error {
    background: var(--error-bg);
    color: var(--error-text);
    border: 1px solid var(--error-text);
  }

  .message.success {
    background: var(--success-bg);
    color: var(--success-text);
    border: 1px solid var(--teal);
  }

  .hidden { display: none; }
</style>
</head>
<body>

<header class="site-header">
  <a href="https://thinkbeyondpractice.com" class="header-logo">Think Beyond <span>Practice</span></a>
  <span class="header-tool">Referral Credit</span>
</header>

<main>
  <div class="eyebrow">Tell us who referred you</div>
  <h1>Give credit where credit is due.</h1>
  <p class="lede">If someone recommended Think Beyond Practice to you, let us know so we can thank them properly. Takes 20 seconds.</p>

  <form id="referralForm">
    <div class="field">
      <label for="email">Your email <span class="optional">(the one you used to sign up)</span></label>
      <input type="email" id="email" name="email" required autocomplete="email">
    </div>

    <div class="field">
      <label for="referrer">Name of the person who referred you</label>
      <input type="text" id="referrer" name="referrer" required autocomplete="off">
    </div>

    <div class="field">
      <label for="notes">Anything else we should know? <span class="optional">(optional)</span></label>
      <textarea id="notes" name="notes" autocomplete="off"></textarea>
    </div>

    <button type="submit" id="submitBtn">Submit</button>

    <div id="message" class="message hidden"></div>
  </form>
</main>

<script>
  const form = document.getElementById('referralForm');
  const btn = document.getElementById('submitBtn');
  const msg = document.getElementById('message');

  function showMessage(text, type) {
    msg.textContent = text;
    msg.className = 'message ' + type;
    msg.classList.remove('hidden');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.classList.add('hidden');

    const email = document.getElementById('email').value.trim();
    const referrer = document.getElementById('referrer').value.trim();
    const notes = document.getElementById('notes').value.trim();

    if (!email || !referrer) {
      showMessage('Please fill in your email and the referrer\'s name.', 'error');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Submitting...';

    try {
      const res = await fetch('/.netlify/functions/referral-attribution', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          new_member_email: email,
          referrer_name: referrer,
          notes: notes || null
        })
      });

      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || 'Something went wrong. Please try again.');
      }

      form.reset();
      showMessage('Got it — thanks for letting us know. We\'ll take care of them.', 'success');
      btn.textContent = 'Submitted';
    } catch (err) {
      showMessage(err.message, 'error');
      btn.disabled = false;
      btn.textContent = 'Submit';
    }
  });
</script>

</body>
</html>
